name: Implement latest task (opencode)

# One run = ONE task implemented end-to-end: the OLDEST open GitHub `task` issue.
# No inputs on purpose — the agent picks the issue itself (see ai/IMPLEMENT-TASK.md).
# Implements missing features FROM SCRATCH (legacy capability not ported to modern
# screen). Same environment pattern as fix-bug.yml / modernize.yml.

on:
  workflow_dispatch: {}
  schedule:
    # every 1 hour (UTC); GitHub may delay scheduled runs under load
    - cron: "30 * * * *"

concurrency:
  group: implement-task
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  implement-task:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testlink
          MARIADB_USER: testlink
          MARIADB_PASSWORD: testlink
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity (agent commits need it)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Setup Node.js (for opencode CLI + MCP servers)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, gd, intl, mysqli, pdo_mysql

      - name: Install MariaDB client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Wait for MariaDB and import TestLink schema + default data
        run: |
          until mysqladmin ping -h 127.0.0.1 --silent; do
            echo "waiting for mariadb..."; sleep 2;
          done
          sed 's|/\*prefix\*/||g' install/sql/mysql/testlink_create_tables.sql \
            | mysql -h 127.0.0.1 -utestlink -ptestlink testlink
          sed 's|/\*prefix\*/||g' install/sql/mysql/testlink_create_default_data.sql \
            | mysql -h 127.0.0.1 -utestlink -ptestlink testlink
          mysql -h 127.0.0.1 -utestlink -ptestlink testlink -e "SELECT COUNT(*) AS tables_created FROM information_schema.tables WHERE table_schema='testlink';"

      - name: Write config_db.inc.php for CI
        run: |
          cat > config_db.inc.php <<'EOF'
          <?php
          // Automatically Generated by GitHub Actions runner
          define('DB_TYPE', 'mysql');
          define('DB_USER', 'testlink');
          define('DB_PASS', 'testlink');
          define('DB_HOST', '127.0.0.1:3306');
          define('DB_NAME', 'testlink');
          define('DB_TABLE_PREFIX', '');
          EOF
          grep -qx 'config_db.inc.php' .gitignore || echo 'config_db.inc.php' >> .git/info/exclude
          if git ls-files --error-unmatch config_db.inc.php >/dev/null 2>&1; then
            git update-index --skip-worktree config_db.inc.php
          fi

      - name: Prepare writable dirs and start TestLink (PHP built-in server)
        run: |
          mkdir -p tmp gui/templates_c
          nohup php -S 127.0.0.1:8082 -t . > tmp/php_server.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "app http status: %{http_code}\n" http://127.0.0.1:8082/login.php

      - name: Clone GitHub Wiki (for documentation duties)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" \
            tmp/wiki-repo || echo "(wiki not initialized yet — agent will create it)"

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg]" \
            "http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq && sudo apt-get install -y -qq google-chrome-stable

      - name: Start Chrome with remote debugging
        run: |
          google-chrome --remote-debugging-port=9222 --headless --no-sandbox \
            --disable-dev-shm-usage --disable-gpu --remote-allow-origins='*' &
          sleep 3

      - name: Install opencode CLI
        run: npm install -g opencode-ai

      - name: Configure opencode.json
        run: |
          cat > opencode.json << 'OPNCFG'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "opencode/big-pickle",
            "instructions": ["ai/AGENTS.md", "ai/IMPLEMENT-TASK.md", "ai/ISSUES.md"],
            "mcp": {
              "chrome-devtools": {
                "type": "local",
                "command": ["npx", "-y", "chrome-devtools-mcp@latest", "--browser-url=http://127.0.0.1:9222"]
              }
            }
          }
          OPNCFG

      - name: Verify gh auth and triage the target issue (tasks only)
        run: |
          gh auth status
          # TRIAGE: oldest open issue labeled 'task', skipping 'Delete legacy'
          # cleanup issues that are blocked by the gap issues (fixed first).
          TARGET=$(gh issue list --state open --limit 200 --json number,title,labels,createdAt \
            --jq 'map(select(.title | startswith("Delete legacy") | not))
                  | map(select([.labels[].name] | any(. == "task")))
                  | sort_by(.createdAt) | .[0].number // empty')
          echo "$TARGET" > .ci_target_issue || true
          if [ -z "$TARGET" ]; then
            echo "::notice::No open implementable task issues — nothing to do"
            echo "HAS_TARGET=0" >> "$GITHUB_ENV"
          else
            TITLE=$(gh issue view "$TARGET" --json title --jq .title)
            echo "target issue: #$TARGET — $TITLE"
            echo "HAS_TARGET=1" >> "$GITHUB_ENV"
          fi
          # remember run baseline for the auto-close safety net
          git rev-parse HEAD > .ci_before_sha

      - name: Run opencode — implement the oldest open task issue
        if: env.HAS_TARGET == '1'
        timeout-minutes: 60
        run: |
          date -d '+55 minutes' +%s > .ci_deadline_epoch
          PROMPT="You are implementing a missing feature in this TestLink 2.0.1 repository. "
          PROMPT+="Read ai/AGENTS.md, ai/IMPLEMENT-TASK.md and ai/ISSUES.md in the repo root FIRST and follow ALL their rules strictly. "
          PROMPT+="ai/IMPLEMENT-TASK.md is your mission rulebook: pick the OLDEST open GitHub issue labeled 'task' yourself via gh, "
          PROMPT+="skipping any issue whose title starts with 'Delete legacy' (those are cleanup tasks blocked by gap issues "
          PROMPT+="that must be implemented first). You are implementing a FEATURE FROM SCRATCH, not fixing a bug: "
          PROMPT+="the issue body describes a legacy capability that was not ported to the modern screen during modernization. "
          PROMPT+="ISSUES.md IS BINDING — DOCUMENTATION IS THE DELIVERABLE: post an INVESTIGATION comment "
          PROMPT+="(environment + the legacy/modern code compared + measured evidence of the gap) BEFORE touching any code; "
          PROMPT+="then ONE '## 🔧 IMPLEMENTATION checkpoint N/M' comment immediately after EACH implemented step "
          PROMPT+="(template in ISSUES.md §4). Close ONLY with ISSUES.md §6 evidence: commit hashes, diff summary, "
          PROMPT+="VERIFIED vs REMAINING checklist, RESUME block — never a naked close. "
          PROMPT+="Undocumented work counts as NOT DONE even if the code works. "
          PROMPT+="Understand the gap, read the legacy code referenced in the issue to capture the exact behavior, "
          PROMPT+="read the modern BFF API + HTML screen, then PORT THE ENTIRE LEGACY FEATURE: "
          PROMPT+="extend the BFF (api/reports/index.php or other) where the issue needs missing data, extend the "
          PROMPT+="HTML screen (gui/templates/**/*.html) to render the missing UI, and add i18n keys in ALL locale "
          PROMPT+="bundles for any new labels/tooltips. Follow the Dashio patterns of already-modernized screens. "
          PROMPT+="Browser-test the new feature via chrome-devtools MCP, append a numbered test suite to "
          PROMPT+="tmp/TLU_Test_Cases.md and execute it, document in wiki (tmp/wiki-repo/) + docs/ mirror, "
          PROMPT+="commit+push after each phase, then close the issue with a verification comment "
          PROMPT+="(or leave it open with a findings comment if you could not implement it). "
          PROMPT+="BRANCHING RULE: do your work on a local branch named task/issue-<n> and commit+push it "
          PROMPT+="(git push origin HEAD:task/issue-<n> is enough). NEVER create pull requests — the bot token "
          PROMPT+="cannot open PRs, so a PR-based plan dead-ends. You do NOT need to merge anything: the CI "
          PROMPT+="workflow lands your branch onto the default branch automatically after you finish. "
          PROMPT+="CLOSING RULE: once your feature is verified working AND pushed to your task/issue-<n> branch, "
          PROMPT+="you MUST close the issue yourself in the same turn: gh issue close <n> --comment \"<evidence>\". "
          PROMPT+="An implemented-and-pushed issue left open is a FAILURE of your mission. "
          PROMPT+="Environment already prepared on this machine: "
          PROMPT+="TestLink app running at http://localhost:8082 (PHP built-in server, docroot = repo root); "
          PROMPT+="login admin/admin; "
          PROMPT+="MariaDB at 127.0.0.1:3306, database testlink, user testlink, password testlink "
          PROMPT+="(inspect data with: mysql -h 127.0.0.1 -utestlink -ptestlink testlink); "
          PROMPT+="the database is freshly imported on every run — recreate any fixtures you need; "
          PROMPT+="GitHub Wiki clone at tmp/wiki-repo/ (origin authenticated via token in remote URL); "
          PROMPT+="gh CLI authenticated through GH_TOKEN; "
          PROMPT+="headless Chrome available through the chrome-devtools MCP tools "
          PROMPT+="(navigate to http://localhost:8082/index.php, log in admin/admin, "
          PROMPT+="content screens load inside iframes: navBar / asideMenu / mainframe); "
          PROMPT+="config_db.inc.php is gitignored: NEVER commit it. "
          PROMPT+="MCP failure policy: at most one retry per failed MCP call, reset browser first; "
          PROMPT+="if it still fails, skip that step and move on — never loop on a failing call. "
          PROMPT+="TIME BUDGET: hard deadline epoch is in .ci_deadline_epoch; when fewer than 10 minutes remain, "
          PROMPT+="wrap up: commit+push everything done and state clearly whether the issue was implemented "
          PROMPT+="or left open. "
          PROMPT+="STOP after this one task. All steps must be executed autonomously — no user interaction."

          opencode run "$PROMPT" \
            --dangerously-skip-permissions \
            --print-logs

      - name: Fallback commit of any leftover agent changes
        if: always()
        run: |
          set -e
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          BRANCH="${GITHUB_REF_NAME}"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "feat(opencode): leftover changes from task-implementation run"
          fi
          ok=0
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            if git rev-parse "origin/$BRANCH" >/dev/null 2>&1 && \
               ! git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
              echo "::group::rebase onto origin/$BRANCH (attempt $i)"
              git rebase -X theirs "origin/$BRANCH" || { git rebase --abort; continue; }
              echo "::endgroup::"
            fi
            if git push origin "HEAD:$BRANCH"; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::normal push failed, escalating"
            git push --force-with-lease origin "HEAD:$BRANCH" \
              || git push --force origin "HEAD:$BRANCH"
          fi
          echo "push done"

      - name: Auto-close target issue if its implementation landed
        if: always()
        run: |
          ISSUE="$(cat .ci_target_issue 2>/dev/null || true)"
          BEFORE="$(cat .ci_before_sha 2>/dev/null || true)"
          [ -z "$ISSUE" ] && { echo "no target issue recorded — nothing to close"; exit 0; }
          STATE="$(gh issue view "$ISSUE" --json state --jq .state 2>/dev/null || echo UNKNOWN)"
          if [ "$STATE" = "CLOSED" ]; then
            echo "issue #$ISSUE already closed by the agent — good"
            exit 0
          fi
          # did commits referencing this issue land on the default branch during this run?
          REFS=""
          if [ -n "$BEFORE" ]; then
            REFS="$(git log --oneline "$BEFORE"..HEAD 2>/dev/null | grep -i "#$ISSUE" | head -3 || true)"
          fi
          if [ -n "$REFS" ]; then
            gh issue close "$ISSUE" --comment "Auto-closed by CI: implementation commits landed on the default branch during this run — $REFS. The implementing agent verified the feature error-free (see its comments above)."
            echo "auto-closed #$ISSUE"
          else
            echo "::notice::issue #$ISSUE still open and no referencing commits landed — leaving it open"
          fi

      - name: Upload opencode session logs & server log (post-mortem)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-session-logs
          path: |
            /home/runner/.local/share/opencode/
            tmp/php_server.log
            .ci_deadline_epoch
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
