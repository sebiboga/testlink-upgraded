name: Modernize one screen (opencode)

# One run = ONE screen modernized end-to-end, following AGENTS.md.
# Trigger manually from the Actions tab; optionally name the screen,
# otherwise opencode picks the next unmodernized ASIDE screen top-to-bottom.

on:
  workflow_dispatch:
    inputs:
      screen:
        description: 'Screen to modernize (empty = next unmodernized ASIDE screen)'
        required: false
        default: ''
      model:
        description: 'opencode model (provider/model)'
        required: false
        default: 'anthropic/claude-sonnet-4-5'
  # schedule:
  #   - cron: "0 4 * * *"   # optional: one screen per day, uncomment to enable

concurrency:
  group: modernize
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  modernize:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testlink
          MARIADB_USER: testlink
          MARIADB_PASSWORD: testlink
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # keep persisted credentials so opencode can commit & push per AGENTS.md rule 16
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, gd, intl, mysqli, pdo_mysql

      - name: Install MariaDB client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Wait for MariaDB and import TestLink schema + default data
        run: |
          until mysqladmin ping -h 127.0.0.1 --silent; do
            echo "waiting for mariadb..."; sleep 2;
          done
          sed 's|/\*prefix\*/||g' install/sql/mysql/testlink_create_tables.sql \
            | mysql -h 127.0.0.1 -utestlink -ptestlink testlink
          sed 's|/\*prefix\*/||g' install/sql/mysql/testlink_create_default_data.sql \
            | mysql -h 127.0.0.1 -utestlink -ptestlink testlink
          mysql -h 127.0.0.1 -utestlink -ptestlink testlink -e "SELECT COUNT(*) AS tables_created FROM information_schema.tables WHERE table_schema='testlink';"

      - name: Write config_db.inc.php for CI
        run: |
          cat > config_db.inc.php <<'EOF'
          <?php
          // Automatically Generated by GitHub Actions runner
          define('DB_TYPE', 'mysql');
          define('DB_USER', 'testlink');
          define('DB_PASS', 'testlink');
          define('DB_HOST', '127.0.0.1:3306');
          define('DB_NAME', 'testlink');
          define('DB_TABLE_PREFIX', '');
          EOF
          # local CI config must never leak into commits made by the agent
          git update-index --skip-worktree config_db.inc.php

      - name: Prepare writable dirs and start TestLink (PHP built-in server)
        run: |
          mkdir -p tmp gui/templates_c
          nohup php -S 127.0.0.1:8082 -t . > tmp/php_server.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "app http status: %{http_code}\n" http://127.0.0.1:8082/login.php

      - name: Clone GitHub Wiki (for AGENTS.md rules 7 & 10)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" \
            tmp/wiki-repo || echo "(wiki not initialized yet — agent will create it)"

      - name: Generate opencode config (permissions + headless Chrome MCP)
        run: |
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "edit": "allow",
              "bash": "allow",
              "webfetch": "allow"
            },
            "mcp": {
              "chrome-devtools": {
                "type": "local",
                "command": ["npx", "-y", "chrome-devtools-mcp@latest", "--headless=true"],
                "enabled": true
              }
            }
          }
          EOF

      - name: Install opencode CLI
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          opencode --version || true

      - name: Run opencode — modernize exactly ONE screen
        uses: anomalyco/opencode/github@latest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ inputs.model || 'anthropic/claude-sonnet-4-5' }}
          prompt: |
            You are continuing the TestLink 2.0.1 modernization project in this repository.

            FIRST read AGENTS.md in the repo root and follow ALL its rules strictly.

            Environment already prepared on this machine:
            - TestLink app running at http://localhost:8082 (PHP built-in server, docroot = repo root)
            - Login credentials: admin / admin
            - MariaDB at 127.0.0.1:3306, database `testlink`, user `testlink`, password `testlink`
              (inspect data with: mysql -h 127.0.0.1 -utestlink -ptestlink testlink)
            - GitHub Wiki clone at tmp/wiki-repo/ (origin authenticated via the token in the remote URL)
            - gh CLI authenticated through GH_TOKEN (use it for issues)
            - Headless Chrome available through the chrome-devtools MCP tools
              (navigate to http://localhost:8082/index.php, log in admin/admin,
               content screens load inside iframes: navBar / asideMenu / mainframe)
            - config_db.inc.php is skip-worktree'd: NEVER commit it

            Task: modernize exactly ONE screen: ${{ inputs.screen }}
            If the screen name above is empty, choose the NEXT unmodernized screen by walking
            the ASIDE menu top to bottom. Screens already modernized exist as
            gui/templates/**/*.html backed by api/** BFF endpoints; anything still pointing
            to lib/**.php is legacy.

            Execute the full AGENTS.md cycle for that single screen only:
            investigate legacy code -> BFF API -> HTML+JS+CSS screen -> i18n keys in ALL
            locale bundles -> switch aside/common links -> browser-test every button/modal/
            permission path -> append a numbered test suite to tmp/TLU_Test_Cases.md and run it ->
            update wiki page + docs/ mirror WITH screenshots -> check Event Viewer for new
            errors/warnings -> log any bugs as GitHub issues -> code review subagent over the
            changes -> apply fixes -> commit and push to the current branch.

            STOP after that one screen is complete. Do NOT start another screen.
