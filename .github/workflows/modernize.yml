name: Modernize one screen (opencode)

# One run = ONE screen modernized end-to-end, following AGENTS.md.
# Runs AUTOMATICALLY every 3 hours (empty input = next unmodernized ASIDE
# screen top-to-bottom); can also be triggered manually with an explicit
# screen/model. Pattern borrowed from sebiboga/AI-Factory-job-seeker-ro-spider
# (ai-factory.yml): plain opencode CLI + headless Chrome CDP, no App/OIDC.

on:
  workflow_dispatch:
    inputs:
      screen:
        description: 'Screen to modernize (empty = next unmodernized ASIDE screen)'
        required: false
        default: ''
      model:
        description: 'opencode model (provider/model)'
        required: false
        default: 'opencode/big-pickle'
  schedule:
    # every 3 hours; minute offset avoids the fix-bug pair (:00/:30 every 2h)
    - cron: "15 */3 * * *"

concurrency:
  # per-screen group: parallel runs of DIFFERENT screens proceed simultaneously,
  # while re-runs of the SAME screen still queue up (never cancel in-progress)
  group: modernize-${{ inputs.screen || 'auto' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  modernize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SCREEN_INPUT: ${{ inputs.screen }}
      MODEL_INPUT: ${{ inputs.model }}

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testlink
          MARIADB_USER: testlink
          MARIADB_PASSWORD: testlink
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # keep persisted credentials so opencode can commit & push per AGENTS.md rule 16
          persist-credentials: true

      - name: Configure git identity (agent commits need it)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Setup Node.js (for opencode CLI + MCP servers)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, gd, intl, mysqli, pdo_mysql

      - name: Install MariaDB client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Wait for MariaDB and import TestLink schema + default data
        run: |
          until mysqladmin ping -h 127.0.0.1 --silent; do
            echo "waiting for mariadb..."; sleep 2;
          done
          sed 's|/\*prefix\*/||g' install/sql/mysql/testlink_create_tables.sql \
            | mysql -h 127.0.0.1 -utestlink -ptestlink testlink
          sed 's|/\*prefix\*/||g' install/sql/mysql/testlink_create_default_data.sql \
            | mysql -h 127.0.0.1 -utestlink -ptestlink testlink
          mysql -h 127.0.0.1 -utestlink -ptestlink testlink -e "SELECT COUNT(*) AS tables_created FROM information_schema.tables WHERE table_schema='testlink';"

      - name: Write config_db.inc.php for CI
        run: |
          cat > config_db.inc.php <<'EOF'
          <?php
          // Automatically Generated by GitHub Actions runner
          define('DB_TYPE', 'mysql');
          define('DB_USER', 'testlink');
          define('DB_PASS', 'testlink');
          define('DB_HOST', '127.0.0.1:3306');
          define('DB_NAME', 'testlink');
          define('DB_TABLE_PREFIX', '');
          EOF
          # config_db.inc.php is already in .gitignore; belt & suspenders so the
          # agent can never stage it even if .gitignore changes mid-run
          grep -qx 'config_db.inc.php' .gitignore || echo 'config_db.inc.php' >> .git/info/exclude
          if git ls-files --error-unmatch config_db.inc.php >/dev/null 2>&1; then
            git update-index --skip-worktree config_db.inc.php
          fi

      - name: Prepare writable dirs and start TestLink (PHP built-in server)
        run: |
          mkdir -p tmp gui/templates_c
          nohup php -S 127.0.0.1:8082 -t . > tmp/php_server.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "app http status: %{http_code}\n" http://127.0.0.1:8082/login.php

      - name: Clone GitHub Wiki (for AGENTS.md rules 7 & 10)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" \
            tmp/wiki-repo || echo "(wiki not initialized yet — agent will create it)"

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg]" \
            "http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq && sudo apt-get install -y -qq google-chrome-stable

      - name: Start Chrome with remote debugging
        run: |
          google-chrome --remote-debugging-port=9222 --headless --no-sandbox \
            --disable-dev-shm-usage --disable-gpu --remote-allow-origins='*' &
          sleep 3

      - name: Install opencode CLI
        run: npm install -g opencode-ai

      - name: Configure opencode.json
        run: |
          cat > opencode.json << 'OPNCFG'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "${{ inputs.model || 'opencode/big-pickle' }}",
            "instructions": ["AGENTS.md"],
            "mcp": {
              "chrome-devtools": {
                "type": "local",
                "command": ["npx", "-y", "chrome-devtools-mcp@latest", "--browser-url=http://127.0.0.1:9222"]
              }
            }
          }
          OPNCFG

      - name: Verify gh auth
        run: gh auth status

      - name: Run opencode — modernize exactly ONE screen
        timeout-minutes: 100
        env:
          DEADLINE_EPOCH_FILE: .ci_deadline_epoch
        run: |
          # record the hard deadline so the agent can pace itself
          date -d '+95 minutes' +%s > "$DEADLINE_EPOCH_FILE"
          git rev-parse HEAD > .ci_before_sha
          PROMPT="You are continuing the TestLink 2.0.1 modernization project in this repository. "
          PROMPT+="Read AGENTS.md in the repo root FIRST and follow ALL its rules strictly. "
          PROMPT+="Environment already prepared on this machine: "
          PROMPT+="TestLink app running at http://localhost:8082 (PHP built-in server, docroot = repo root); "
          PROMPT+="login admin/admin; "
          PROMPT+="MariaDB at 127.0.0.1:3306, database testlink, user testlink, password testlink "
          PROMPT+="(inspect data with: mysql -h 127.0.0.1 -utestlink -ptestlink testlink); "
          PROMPT+="IMPORTANT: the database is freshly imported on every run — data created by previous runs is gone, "
          PROMPT+="so recreate any fixtures (test projects, test cases, keywords) you need for testing; "
          PROMPT+="GitHub Wiki clone at tmp/wiki-repo/ (origin authenticated via token in remote URL); "
          PROMPT+="gh CLI authenticated through GH_TOKEN (use it for issues); "
          PROMPT+="headless Chrome available through the chrome-devtools MCP tools "
          PROMPT+="(navigate to http://localhost:8082/index.php, log in admin/admin, "
          PROMPT+="content screens load inside iframes: navBar / asideMenu / mainframe); "
          PROMPT+="config_db.inc.php is gitignored: NEVER commit it. "
          if [ -n "${SCREEN_INPUT}" ]; then
            PROMPT+="Task: modernize exactly ONE screen: ${SCREEN_INPUT}. "
          else
            PROMPT+="Task: choose the NEXT unmodernized screen by walking the ASIDE menu top to bottom "
            PROMPT+="(screens already modernized exist as gui/templates/**/*.html backed by api/** BFF endpoints; "
            PROMPT+="anything still pointing to lib/**.php is legacy) and modernize exactly that ONE screen. "
          fi
          PROMPT+="Execute the full AGENTS.md cycle for that single screen only: "
          PROMPT+="STEP 0 — MANDATORY, BEFORE ANY exploration or code: ensure the screen's tracking issue "
          PROMPT+="exists on GitHub Issues (label 'enhancement'). If it does not exist, CREATE IT INSTANTLY "
          PROMPT+="(gh issue create --label enhancement --title 'Modernize: <screen>') and post your initial "
          PROMPT+="plan as its first comment. You MUST announce the issue number in the run output before "
          PROMPT+="touching any file. Every commit references it (Refs #<n>). "
          PROMPT+="Then: investigate legacy code -> BFF API -> HTML+JS+CSS screen -> i18n keys in ALL locale bundles -> "
          PROMPT+="switch aside/common links -> browser-test every button/modal/permission path -> "
          PROMPT+="append a numbered test suite to tmp/TLU_Test_Cases.md and run it -> "
          PROMPT+="update wiki page + docs/ mirror WITH screenshots -> check Event Viewer for new errors/warnings -> "
          PROMPT+="log any bugs as GitHub issues (MANDATORY: create them with --label bug, the CI triage depends on it) -> code review subagent over the changes -> apply fixes -> "
          PROMPT+="commit and push to the current branch. "
          PROMPT+="COMMIT+PUSH AFTER EVERY PHASE — mandatory, one small conventional commit pushed immediately at each milestone: "
          PROMPT+="(1) BFF API written -> commit+push; "
          PROMPT+="(2) front-end HTML/JS/CSS screen written -> commit+push; "
          PROMPT+="(3) i18n keys in ALL locale bundles + aside/common link switch -> commit+push; "
          PROMPT+="(4) EACH bug found and fixed while testing -> its own separate commit+push; "
          PROMPT+="(5) test suite executed and recorded in tmp/TLU_Test_Cases.md -> commit+push; "
          PROMPT+="(6) wiki page + docs/ mirror with screenshots -> commit+push; "
          PROMPT+="(7) Event Viewer findings or GitHub issue fixes -> commit+push. "
          PROMPT+="RESUME RULE: before writing any code for the assigned screen, inspect git log and the existing files — "
          PROMPT+="if a previous run already built parts of this screen (BFF file, HTML screen, i18n keys, link switches), "
          PROMPT+="KEEP them and CONTINUE from where that work stopped; never rebuild from zero what is already committed. "
          PROMPT+="PROGRESS CHECKPOINTS (AGENTS.md rule 20) — MANDATORY, time-boxed: post a comment on the tracking "
          PROMPT+="issue AT LEAST every ~20 minutes of work AND at every push, ALWAYS with these sections: "
          PROMPT+="'DONE' (what landed: commit hashes + files), 'DISCOVERIES' (root causes, gotchas, decisions), "
          PROMPT+="'PLAN' (ordered next steps / current strategy), 'RESUME' (exact state + env needed to continue, "
          PROMPT+="verified vs pending), 'FILES' (file -> purpose mapping). Everything must be documented in the "
          PROMPT+="enhancement issue so any other agent can resume from the ticket without re-exploring the repo. "
          PROMPT+="If the run is about to hit its time limit, stop cleanly, commit+push whatever is done and report what remains. "
          PROMPT+="TIME BUDGET: the unix epoch of your hard deadline is in the file .ci_deadline_epoch — check it "
          PROMPT+="periodically (date +%s; cat .ci_deadline_epoch). When fewer than 15 minutes remain, STOP starting "
          PROMPT+="new work: finish the current phase, commit+push everything, delete nothing, and write a short "
          PROMPT+="'REMAINING WORK' summary as your final message. "
          PROMPT+="Git push policy: NEVER use git stash and NEVER force-push; "
          PROMPT+="if a push is rejected, run git fetch + git rebase -X theirs origin/<branch> and retry the push. "
          PROMPT+="AWARENESS: a bug-fix agent may run concurrently — it works on its own fix/* branch and lands "
          PROMPT+="changes via Pull Requests, so it never writes the default branch directly; but its merges can "
          PROMPT+="land between your pushes. You are an AI — no deterministic waiting is imposed on you. Before "
          PROMPT+="each push, check the world and decide your own strategy: in-progress bug-fix runs via "
          PROMPT+="gh api repos/\$GITHUB_REPOSITORY/actions/workflows/fix-bug.yml/runs?status=in_progress, "
          PROMPT+="open agent PRs via gh pr list --state open. If activity is detected, prefer fetching+rebasing "
          PROMPT+="right before your push, or deferring that push to your next phase commit — your call. "
          PROMPT+="The wiki clone tmp/wiki-repo is shared too: if its push is rejected, git pull --rebase origin master and retry. "
          PROMPT+="Never silently discard another agent's work."
          PROMPT+="MCP failure policy: if a chrome-devtools MCP call fails with 'Request timed out' (-32001) or any error, "
          PROMPT+="retry it AT MOST once; before retrying, reset the browser with chrome-devtools_navigate_page to "
          PROMPT+="http://localhost:8082/index.php and log back in. If it still fails, SKIP that step (e.g. leave a "
          PROMPT+="'TODO: screenshot' note in the wiki page) and move on — NEVER loop on the same failing MCP call. "
          PROMPT+="STOP after that one screen is complete. Do NOT start another screen. "
          PROMPT+="IMPORTANT: investigation alone is NOT acceptable. You must actually CREATE the BFF API file, "
          PROMPT+="the HTML screen file and the i18n keys, switch the aside/common links, and COMMIT+PUSH your work "
          PROMPT+="before you finish. Do not end your turn with only a plan or a summary — keep calling tools until "
          PROMPT+="the screen is fully implemented, tested and pushed. "
          PROMPT+="INVESTIGATION TIME-BOX: at most 10 read-only tool calls (grep/cat/sed/mysql desc) TOTAL before "
          PROMPT+="your FIRST write. Your 11th action MUST be creating a real file (start with the BFF API skeleton, "
          PROMPT+="then fill it in). Analyse WHILE coding, not before. If the screen input covers several sub-screens "
          PROMPT+="(e.g. Search = quick + advanced + req search), pick the SMALLEST coherent one, say so in one line, "
          PROMPT+="and BUILD it — do not try to map the whole area first. "
          PROMPT+="DELIVERABLE CONTRACT — you may END YOUR TURN only when ALL of these exist (verify with ls/grep "
          PROMPT+="yourself right before finishing; if any is missing, CONTINUE WORKING instead of summarizing): "
          PROMPT+="(a) gui/templates/<area>/<screen>.html created, (b) api/<area>/index.php created, "
          PROMPT+="(c) i18n keys present in ALL locale bundles, (d) aside link switched in lib/functions/common.php, "
          PROMPT+="(e) test suite appended to tmp/TLU_Test_Cases.md. An investigation-only turn counts as a FAILED run. "
          PROMPT+="All steps must be executed autonomously — no user interaction is allowed. "
          PROMPT+="When in doubt, proceed with the safest action for production."

          BEFORE_SHA="$(git rev-parse HEAD)"
          PRODUCED() {
            # content-based: real file changes (committed OR dirty), immune to
            # SHA shifts caused by concurrent pushes to the default branch
            [ "$(git rev-parse HEAD)" != "$BEFORE_SHA" ] && \
              git diff --name-only "$BEFORE_SHA" HEAD -- . ':(exclude).github' \
                ':(exclude)tmp/wiki-repo' ':(exclude)tmp/opencode' | grep -q . && return 0
            git status --porcelain -- . ':(exclude).github' ':(exclude)tmp/wiki-repo' \
              ':(exclude)tmp/opencode' | grep -q .
          }
          for ATTEMPT in 1 2; do
            RUN_PROMPT="$PROMPT"
            if [ "$ATTEMPT" = "2" ]; then
              echo "::warning::attempt 1 produced nothing — retrying with escalation"
              RUN_PROMPT="CRITICAL: your previous attempt ended after ONLY investigating the codebase, without "
              RUN_PROMPT+="creating a single file or commit. That attempt is recorded as FAILED. Forget analysis; "
              RUN_PROMPT+="this is your FINAL attempt: write the code NOW, file by file, per the DELIVERABLE CONTRACT. $PROMPT"
            fi
            opencode run "$RUN_PROMPT" \
              --dangerously-skip-permissions \
              --print-logs
            # did the attempt produce anything? (real file changes only)
            if PRODUCED; then
              echo "attempt $ATTEMPT produced work — continuing"
              break
            fi
            echo "::warning::attempt $ATTEMPT produced no commits and no file changes"
          done

      - name: Fallback commit of any leftover agent changes
        # MUST run even if the opencode step failed/timed out — otherwise all
        # agent work stays only on the ephemeral runner and is lost
        if: always()
        run: |
          set -e
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          BRANCH="${GITHUB_REF_NAME}"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore(opencode): leftover changes from screen modernization run"
          fi
          # guarantee the push succeeds: sync with remote keeping OUR (agent) work,
          # retry on races, escalate to force-with-lease / force only at the end
          ok=0
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            if git rev-parse "origin/$BRANCH" >/dev/null 2>&1 && \
               ! git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
              echo "::group::rebase onto origin/$BRANCH (attempt $i)"
              git rebase -X theirs "origin/$BRANCH" || { git rebase --abort; continue; }
              echo "::endgroup::"
            fi
            if git push origin "HEAD:$BRANCH"; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::normal push failed, escalating"
            git push --force-with-lease origin "HEAD:$BRANCH" \
              || git push --force origin "HEAD:$BRANCH"
          fi
          echo "push done"

      - name: Verify delivery (fail loudly on an empty run)
        if: always()
        run: |
          BEFORE_SHA="$(cat .ci_before_sha 2>/dev/null || echo unknown)"
          if [ "$BEFORE_SHA" != "unknown" ]; then
            # content-based: did any REAL file change vs the tree the run started on?
            # (immune to SHA shifts from concurrent pushes + fallback rebase)
            CHANGED="$(git diff --name-only "$BEFORE_SHA" HEAD -- . ':(exclude).github' ':(exclude)tmp/wiki-repo' ':(exclude)tmp/opencode' | head -1)"
            DIRTY="$(git status --porcelain -- . ':(exclude).github' ':(exclude)tmp/wiki-repo' ':(exclude)tmp/opencode' | head -1)"
            if [ -z "$CHANGED" ] && [ -z "$DIRTY" ]; then
              echo "::error::opencode produced NO commits and NO file changes — this run is a FAILURE, not a success"
              exit 1
            fi
            echo "delivery verified: real changes present (e.g. $CHANGED$DIRTY)"
          fi

      - name: Upload opencode session logs & server log (post-mortem)
        # available even when the run fails — the main source for learning what
        # the agent did, where it stalled and how many tokens it burned
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-session-logs
          path: |
            /home/runner/.local/share/opencode/
            tmp/php_server.log
            .ci_deadline_epoch
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
