name: Investigate & fix (opencode)

# One run = ONE investigation issue fixed end-to-end: the NEWEST open GitHub
# issue labeled 'investigation'. Manual trigger only — investigation issues
# require explicit assignment, not auto-pick.

on:
  workflow_dispatch: {}

concurrency:
  group: investigate-fix
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  investigate-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testlink
          MARIADB_USER: testlink
          MARIADB_PASSWORD: testlink
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity (agent commits need it)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Setup Node.js (for opencode CLI + MCP servers)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, gd, intl, mysqli, pdo_mysql

      - name: Install MariaDB client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Wait for MariaDB and import TestLink schema + default data
        run: |
          until mysqladmin ping -h 127.0.0.1 --silent; do
            echo "waiting for mariadb..."; sleep 2;
          done
          sed 's|/\*prefix\*/||g' install/sql/mysql/testlink_create_tables.sql \
            | mysql -h 127.0.0.1 -utestlink -ptestlink testlink
          sed 's|/\*prefix\*/||g' install/sql/mysql/testlink_create_default_data.sql \
            | mysql -h 127.0.0.1 -utestlink -ptestlink testlink
          mysql -h 127.0.0.1 -utestlink -ptestlink testlink -e "SELECT COUNT(*) AS tables_created FROM information_schema.tables WHERE table_schema='testlink';"

      - name: Write config_db.inc.php for CI
        run: |
          cat > config_db.inc.php <<'EOF'
          <?php
          // Automatically Generated by GitHub Actions runner
          define('DB_TYPE', 'mysql');
          define('DB_USER', 'testlink');
          define('DB_PASS', 'testlink');
          define('DB_HOST', '127.0.0.1:3306');
          define('DB_NAME', 'testlink');
          define('DB_TABLE_PREFIX', '');
          EOF
          grep -qx 'config_db.inc.php' .gitignore || echo 'config_db.inc.php' >> .git/info/exclude
          if git ls-files --error-unmatch config_db.inc.php >/dev/null 2>&1; then
            git update-index --skip-worktree config_db.inc.php
          fi

      - name: Prepare writable dirs and start TestLink (PHP built-in server)
        run: |
          mkdir -p tmp gui/templates_c
          nohup php -S 127.0.0.1:8082 -t . > tmp/php_server.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "app http status: %{http_code}\n" http://127.0.0.1:8082/login.php

      - name: Clone GitHub Wiki (for documentation duties)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" \
            tmp/wiki-repo || echo "(wiki not initialized yet — agent will create it)"

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg]" \
            "http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq && sudo apt-get install -y -qq google-chrome-stable

      - name: Start Chrome with remote debugging
        run: |
          google-chrome --remote-debugging-port=9222 --headless --no-sandbox \
            --disable-dev-shm-usage --disable-gpu --remote-allow-origins='*' &
          sleep 3

      - name: Install opencode CLI
        run: npm install -g opencode-ai

      - name: Configure opencode.json
        run: |
          cat > opencode.json << 'OPNCFG'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "opencode/big-pickle",
            "instructions": ["ai/AGENTS.md", "ai/INVESTIGATE-FIX.md", "ai/ISSUES.md"],
            "mcp": {
              "chrome-devtools": {
                "type": "local",
                "command": ["npx", "-y", "chrome-devtools-mcp@latest", "--browser-url=http://127.0.0.1:9222"]
              }
            }
          }
          OPNCFG

      - name: Verify gh auth and triage the target issue (investigation only)
        run: |
          gh auth status
          # TRIAGE: newest open issue labeled 'investigation'.
          TARGET=$(gh issue list --state open --limit 200 --json number,title,labels \
            --jq 'map(select([.labels[].name] | any(. == "investigation") | not | not))
                  | sort_by(.createdAt) | reverse | .[0].number // empty')
          echo "$TARGET" > .ci_target_issue || true
          if [ -z "$TARGET" ]; then
            echo "::notice::No open investigation issues — nothing to fix"
            echo "HAS_TARGET=0" >> "$GITHUB_ENV"
          else
            TITLE=$(gh issue view "$TARGET" --json title --jq .title)
            echo "target issue: #$TARGET — $TITLE"
            echo "HAS_TARGET=1" >> "$GITHUB_ENV"
          fi
          git rev-parse HEAD > .ci_before_sha

      - name: Run opencode — investigate & fix the newest open investigation issue
        if: env.HAS_TARGET == '1'
        timeout-minutes: 60
        run: |
          date -d '+55 minutes' +%s > .ci_deadline_epoch
          TARGET_NUM=$(cat .ci_target_issue)

          PROMPT="You are investigating and fixing issue #$TARGET_NUM in this TestLink 2.0.1 repository. "
          PROMPT+="Read ai/AGENTS.md, ai/INVESTIGATE-FIX.md and ai/ISSUES.md in the repo root FIRST and follow ALL their rules strictly. "

          PROMPT+="=== MANDATORY DOCUMENTATION SECTIONS === "
          PROMPT+="Every investigation issue MUST have exactly these comment sections posted on the GitHub issue, IN THIS ORDER, BEFORE code is written: "

          PROMPT+="COMMENT 1 — '## INVESTIGATION' containing: "
          PROMPT+="  - ### Environment (app URL, DB, credentials, dataset) "
          PROMPT+="  - ### Files examined (numbered list with file:line and what you found) "
          PROMPT+="  - ### Code flow analysis (step-by-step execution path with line numbers) "
          PROMPT+="  - ### Key findings (numbered list of specific issues found) "
          PROMPT+="  - ### Attack vectors / failure modes (how the vulnerability exploits) "

          PROMPT+="COMMENT 2 — '## ROOT CAUSE' containing: "
          PROMPT+="  - ### Root cause chain (each hop backed by file:line) "
          PROMPT+="  - ### Why it breaks now (if regression — which commit introduced it) "
          PROMPT+="  - ### Blast radius (number of affected sites, conditions to trigger) "
          PROMPT+="  - ### Fix plan (concrete approach, fallback behavior, regression matrix) "

          PROMPT+="COMMENT 3 — '## FIX checkpoint 1/N' (repeat for each step) containing: "
          PROMPT+="  - **STEP PERFORMED** — exactly what you just did "
          PROMPT+="  - **RESULT — measured:** command output, curl output, syntax check "
          PROMPT+="  - **DISCOVERIES** — surprises, corrections to earlier claims "
          PROMPT+="  - **PLAN** — the single next step "
          PROMPT+="  - **FILES** — files touched or 'none (testing only)' "

          PROMPT+="COMMENT 4 — '## VERIFICATION' containing: "
          PROMPT+="  - ### Commit hashes + push range "
          PROMPT+="  - ### Diff summary (file, +/-) "
          PROMPT+="  - ### Verification matrix (table: #, Check, Expected, Result with ✅/❌) "
          PROMPT+="  - ### Event Viewer check (no new Error/Warning entries) "
          PROMPT+="  - ### RESUME block (how to re-test in one command) "

          PROMPT+="=== WORKFLOW STEPS === "
          PROMPT+="1. Pick the NEWEST open GitHub issue labeled 'investigation' via gh "
          PROMPT+="2. Read its full body and ALL comments "
          PROMPT+="3. Post INVESTIGATION COMMENT (COMMENT 1) — BEFORE touching any code "
          POST_INVESTIGATION="4. Post ROOT CAUSE COMMENT (COMMENT 2) — BEFORE implementing fix "
          PROMPT+="5. Implement the minimal fix "
          PROMPT+="6. Post FIX CHECKPOINT COMMENT(s) (COMMENT 3) — after EACH implemented step "
          PROMPT+="7. Create docs/Bugfix-Issue-<n>-<title>.md following INVESTIGATE-FIX.md §6 structure "
          PROMPT+="8. Post VERIFICATION COMMENT (COMMENT 4) — with commit hashes, diff summary, verification matrix "
          PROMPT+="9. Commit+push fix + documentation "
          PROMPT+="10. Close issue with verification evidence "

          PROMPT+="=== DOCUMENTATION FILE (docs/Bugfix-Issue-<n>-<title>.md) === "
          PROMPT+="MUST contain ALL sections from INVESTIGATE-FIX.md §6.2: "
          PROMPT+="  - Investigation (files examined, code flow analysis, key findings) "
          PROMPT+="  - Root cause chain (with file:line references) "
          PROMPT+="  - Fix approach (chosen approach + REJECTED alternatives with reasons) "
          PROMPT+="  - Files changed (specific line numbers and what changed) "
          PROMPT+="  - Verification performed (specific test cases with steps/expected/result) "
          PROMPT+="  - Notes (systemic issues, follow-up work needed) "

          PROMPT+="=== CRITICAL RULES === "
          PROMPT+="DOCUMENTATION IS THE DELIVERABLE — a fix without documented investigation counts as NOT DONE. "
          PROMPT+="NEVER skip posting any of the 4 mandatory comments on the issue. "
          PROMPT+="NEVER use 'evil.com' or similar — use neutral placeholders like 'testlink.example.com'. "
          PROMPT+="NEVER close an issue without posting all 4 comment sections. "
          PROMPT+="If you cannot complete a section, post what you have and explain what's missing. "

          PROMPT+="=== GIT RULES === "
          PROMPT+="BRANCHING: fix/issue-<n> branch, push via 'git push origin HEAD:fix/issue-<n>'. "
          PROMPT+="NEVER create pull requests — CI lands your branch automatically. "
          PROMPT+="COMMIT MESSAGES: 'fix(<area>): <description> — Refs #<n>' "
          PROMPT+="DOCS COMMIT: 'docs: add Bugfix Issue #<n> <title> documentation' "
          PROMPT+="CLOSING: gh issue close <n> --comment '<evidence with all 4 sections>' "
          PROMPT+="A fixed-and-pushed issue left open is a FAILURE. "

          PROMPT+="=== ENVIRONMENT === "
          PROMPT+="TestLink at http://localhost:8082 (admin/admin); "
          PROMPT+="MariaDB at 127.0.0.1:3306 (testlink/testlink); "
          PROMPT+="Wiki clone at tmp/wiki-repo/; "
          PROMPT+="Chrome at port 9222 via MCP; "
          PROMPT+="config_db.inc.php is gitignored: NEVER commit it. "
          PROMPT+="TIME BUDGET: deadline in .ci_deadline_epoch; wrap up at 10 min remaining. "
          PROMPT+="STOP after this one issue. All steps autonomous — no user interaction."

          opencode run "$PROMPT" \
            --dangerously-skip-permissions \
            --print-logs

      - name: Fallback commit of any leftover agent changes
        if: always()
        run: |
          set -e
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          BRANCH="${GITHUB_REF_NAME}"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "fix(opencode): leftover changes from investigate-fix run"
          fi
          ok=0
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            if git rev-parse "origin/$BRANCH" >/dev/null 2>&1 && \
               ! git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
              echo "::group::rebase onto origin/$BRANCH (attempt $i)"
              git rebase -X theirs "origin/$BRANCH" || { git rebase --abort; continue; }
              echo "::endgroup::"
            fi
            if git push origin "HEAD:$BRANCH"; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::normal push failed, escalating"
            git push --force-with-lease origin "HEAD:$BRANCH" \
              || git push --force origin "HEAD:$BRANCH"
          fi
          echo "push done"

      - name: Auto-close target issue if its fix landed
        if: always()
        run: |
          ISSUE="$(cat .ci_target_issue 2>/dev/null || true)"
          BEFORE="$(cat .ci_before_sha 2>/dev/null || true)"
          [ -z "$ISSUE" ] && { echo "no target issue recorded — nothing to close"; exit 0; }
          STATE="$(gh issue view "$ISSUE" --json state --jq .state 2>/dev/null || echo UNKNOWN)"
          if [ "$STATE" = "CLOSED" ]; then
            echo "issue #$ISSUE already closed by the agent — good"
            exit 0
          fi
          REFS=""
          if [ -n "$BEFORE" ]; then
            REFS="$(git log --oneline "$BEFORE"..HEAD 2>/dev/null | grep -i "#$ISSUE" | head -3 || true)"
          fi
          if [ -n "$REFS" ]; then
            gh issue close "$ISSUE" --comment "Auto-closed by CI: fix commits landed on the default branch during this run — $REFS. The agent verified the fix error-free and documented it with all mandatory sections (INVESTIGATION, ROOT CAUSE, FIX checkpoints, VERIFICATION — see comments above)."
            echo "auto-closed #$ISSUE"
          else
            echo "::notice::issue #$ISSUE still open and no referencing commits landed — leaving it open"
          fi

      - name: Upload opencode session logs & server log (post-mortem)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-session-logs
          path: |
            /home/runner/.local/share/opencode/
            tmp/php_server.log
            .ci_deadline_epoch
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
