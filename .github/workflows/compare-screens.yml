name: Analyze one modernized screen vs legacy (opencode)

# A FEATURE ANALYZER, not a modernizer.
# ONE run = pick ONE modernized screen and rigorously COMPARE it against its
# legacy 1.9.20 counterpart (lib/...php controller + gui/templates/dashio/.../*.tpl),
# by reading both code paths AND exercising both UIs in the browser, to DISCOVER
# legacy features that were forgotten / not implemented in the modern screen.
#
# For every gap found, file a GitHub Issue labeled 'task' ("Implement X in <screen>")
# so it is tracked and can be picked up later. If nothing is missing, say so.
#
# Each run analyzes EXACTLY ONE screen (never all of them). Which screen is chosen:
#   - explicit 'screen' workflow input, OR
#   - the NEXT screen not yet marked analysed in docs/SCREEN-COMPARE-STATUS.md
#     (the agent updates that file at the end, so the next run moves on).
#
# Pattern borrowed from modernize.yml (plain opencode CLI + headless Chrome CDP,
# MariaDB service, no App/OIDC). Concurrency/cron offsets chosen to not collide
# with fix-bug (every 2h) or modernize (every 3h).

on:
  workflow_dispatch:
    inputs:
      screen:
        description: 'Screen (gui/templates/<area>/<screen>.html) to analyze vs legacy. Empty = next un-analyzed screen.'
        required: false
        default: ''
      model:
        description: 'opencode model (provider/model)'
        required: false
        default: 'opencode/big-pickle'

  # every 4 hours; offset from fix-bug (:00/:30 every 2h) and modernize (:15 every 3h)
  schedule:
    - cron: "45 */4 * * *"

concurrency:
  group: compare-screens
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SCREEN_INPUT: ${{ inputs.screen }}
      MODEL_INPUT: ${{ inputs.model }}

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testlink
          MARIADB_USER: testlink
          MARIADB_PASSWORD: testlink
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity (agent commits need it)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Setup Node.js (for opencode CLI + MCP servers)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, gd, intl, mysqli, pdo_mysql

      - name: Install MariaDB client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Wait for MariaDB and import TestLink schema + default data
        run: |
          until mysqladmin ping -h 127.0.0.1 --silent; do
            echo "waiting for mariadb..."; sleep 2;
          done
          sed 's|/\*prefix\*/||g' install/sql/mysql/testlink_create_tables.sql \
            | mysql -h 127.0.0.1 -utestlink -ptestlink testlink
          sed 's|/\*prefix\*/||g' install/sql/mysql/testlink_create_default_data.sql \
            | mysql -h 127.0.0.1 -utestlink -ptestlink testlink
          mysql -h 127.0.0.1 -utestlink -ptestlink testlink -e "SELECT COUNT(*) AS tables_created FROM information_schema.tables WHERE table_schema='testlink';"

      - name: Write config_db.inc.php for CI
        run: |
          cat > config_db.inc.php <<'EOF'
          <?php
          // Automatically Generated by GitHub Actions runner
          define('DB_TYPE', 'mysql');
          define('DB_USER', 'testlink');
          define('DB_PASS', 'testlink');
          define('DB_HOST', '127.0.0.1:3306');
          define('DB_NAME', 'testlink');
          define('DB_TABLE_PREFIX', '');
          EOF
          grep -qx 'config_db.inc.php' .gitignore || echo 'config_db.inc.php' >> .git/info/exclude
          if git ls-files --error-unmatch config_db.inc.php >/dev/null 2>&1; then
            git update-index --skip-worktree config_db.inc.php
          fi

      - name: Prepare writable dirs and start TestLink (PHP built-in server)
        run: |
          mkdir -p tmp gui/templates_c
          nohup php -S 127.0.0.1:8082 -t . > tmp/php_server.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "app http status: %{http_code}\n" http://127.0.0.1:8082/login.php

      - name: Clone GitHub Wiki (only if a discovered gap needs docs, else unused)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" \
            tmp/wiki-repo || echo "(wiki not initialized yet — ignore)"

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg]" \
            "http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq && sudo apt-get install -y -qq google-chrome-stable

      - name: Start Chrome with remote debugging
        run: |
          google-chrome --remote-debugging-port=9222 --headless --no-sandbox \
            --disable-dev-shm-usage --disable-gpu --remote-allow-origins='*' &
          sleep 3

      - name: Install opencode CLI
        run: npm install -g opencode-ai

      - name: Configure opencode.json
        run: |
          cat > opencode.json << 'OPNCFG'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "${{ inputs.model || 'opencode/big-pickle' }}",
            "instructions": ["ai/AGENTS.md"],
            "mcp": {
              "chrome-devtools": {
                "type": "local",
                "command": ["npx", "-y", "chrome-devtools-mcp@latest", "--browser-url=http://127.0.0.1:9222"]
              }
            }
          }
          OPNCFG

      - name: Verify gh auth
        run: gh auth status

      - name: Pick the ONE screen to analyze this run
        run: |
          if [ -n "${SCREEN_INPUT}" ]; then
            echo "analyzing explicitly requested screen: ${SCREEN_INPUT}"
            echo "$SCREEN_INPUT" > .ci_screen
          else
            # NEXT screen not yet marked "✓ analysed" in docs/SCREEN-COMPARE-STATUS.md.
            # Rows the analyzer appended look like: | <n> | gui/templates/<area>/<screen>.html | ✓ | <verdict> |
            # Un-analyzed rows have an empty marker column. First such row wins.
            SCREEN="$(
              awk -F'|' '/\.html/ { gsub(/ /,"",$3); if ($3 != "" && $4 !~ /✓/ && $4 !~ /x/) { print $3; exit } }' \
                docs/SCREEN-COMPARE-STATUS.md 2>/dev/null
            )"
            echo "$SCREEN" > .ci_screen
            if [ -z "$SCREEN" ]; then
              echo "::notice::docs/SCREEN-COMPARE-STATUS.md empty/unreadable or every row already ✓ — falling back to first modernized screen"
              # prime the file with one row for the first modernized screen (from MODERNIZATION-STATUS)
              FIRST="$(
                sed -n 's|.*`\([a-zA-Z0-9_/]*\.html\)`.*|\1|p' docs/MODERNIZATION-STATUS.md | grep -v '^$' | head -1
              )"
              echo "| 1 | $FIRST | | pending |" > docs/SCREEN-COMPARE-STATUS.md
              echo "$FIRST" > .ci_screen
            fi
          fi
          ANALYZING_SCREEN="$(cat .ci_screen 2>/dev/null || true)"
          echo "ANALYZING_SCREEN=$ANALYZING_SCREEN" >> "$GITHUB_ENV"
          echo "analyzing screen: $ANALYZING_SCREEN"

      - name: Run opencode — feature-analyze this one modernized screen vs legacy
        timeout-minutes: 50
        run: |
          date -d '+45 minutes' +%s > .ci_deadline_epoch
          PROMPT="You are a FEATURE ANALYZER for this TestLink 2.0.1 modernization project. "
          PROMPT+="Read ai/AGENTS.md in the repo root FIRST and follow its labeling/triage rules strictly. "
          PROMPT+="This is an ANALYSIS job only — you must NOT implement anything. Your output is a set of "
          PROMPT+="GitHub issues labeled 'task' that describe legacy features missing from a modernized screen. "
          PROMPT+="Environment already prepared on this machine: "
          PROMPT+="TestLink app running at http://localhost:8082 (PHP built-in server, docroot = repo root); "
          PROMPT+="login admin/admin; "
          PROMPT+="MariaDB at 127.0.0.1:3306, database testlink, user testlink, password testlink "
          PROMPT+="(inspect data with: mysql -h 127.0.0.1 -utestlink -ptestlink testlink); "
          PROMPT+="IMPORTANT: the database is freshly imported on every run — recreate any fixtures "
          PROMPT+="(test projects, test cases, keywords, builds, executions, custom fields) you need to "
          PROMPT+="exercise BOTH the legacy and the modern screen as a real user; "
          PROMPT+="gh CLI authenticated through GH_TOKEN (use it to read/what-you-find and to FILE issues); "
          PROMPT+="headless Chrome available through the chrome-devtools MCP tools "
          PROMPT+="(navigate to http://localhost:8082/index.php, log in admin/admin, "
          PROMPT+="content screens load inside iframes: navBar / asideMenu / mainframe); "
          PROMPT+="config_db.inc.php is gitignored: NEVER commit it. "
          PROMPT+=""
          if [ -n "${ANALYZING_SCREEN}" ]; then
            PROMPT+="SCREEN TO ANALYZE THIS RUN (this is the ONLY screen you may look at): ${ANALYZING_SCREEN}. "
          else
            PROMPT+="SCREEN SELECTION: pick the FIRST modernized screen in docs/MODERNIZATION-STATUS.md's DONE "
            PROMPT+="list (plus its 'extras' paragraph) that does NOT yet have a ✓ marker in "
            PROMPT+="docs/SCREEN-COMPARE-STATUS.md. Cross-reference docs/SCREEN-COMPARE-STATUS.md and "
            PROMPT+="docs/MODERNIZATION-STATUS.md. If ALL are already ✓, pick the first row anyway. Analyze "
            PROMPT+="EXACTLY ONE screen and no other. Announce your choice in one line before anything else. "
          fi
          PROMPT+="YOUR MISSION — find legacy features that were FORGOTTEN / NOT implemented in the modern screen: "
          PROMPT+="1. IDENTIFY the modern screen: the file name above lives under gui/templates/<area>/<screen>.html "
          PROMPT+="   and is backed by a REST BFF api/<area>/index.php. "
          PROMPT+="2. MAP it to its legacy 1.9.20 counterpart: search lib/ for the legacy PHP controller "
          PROMPT+="   (often the same name, e.g. lib/results/charts.php) and gui/templates/dashio/.../*.tpl. "
          PROMPT+="   Use the aside menu (lib/general/asideMenu.php), common.php and the 'Refs #N' markers, "
          PROMPT+="   and grep for the modern screen's title/label to find the legacy origin. "
          PROMPT+="3. ENUMERATE the legacy behavior exhaustively from BOTH the PHP controller AND the .tpl: "
          PROMPT+="   every input, button, link, action, dialog, filter, permission/rights check, "
          PROMPT+="   export/print/download, sorting, search, default value, empty state, error message, "
          PROMPT+="   pagination, inline edit, mass action, custom-field handling, history link, etc. "
          PROMPT+="4. VERIFY each legacy feature against the modern screen: read the modern BFF + HTML, then "
          PROMPT+="   ALSO exercise BOTH UIs in the browser with the same fixtures. For every legacy feature, "
          PROMPT+="   determine if the modern screen provides an equivalent. Note anything missing, partially "
          PROMPT+="   implemented, or behaving differently. "
          PROMPT+="5. CONSOLIDATE: for EVERY missing/unimplemented legacy feature (including genuine right/role "
          PROMPT+="   checks, export formats, filters, actions, and empty/error states that the legacy handled "
          PROMPT+="   but the modern one drops), FILE a separate GitHub issue with --label task: "
          PROMPT+="   gh issue create --repo \$GITHUB_REPOSITORY --label task --title 'Implement <feature> in <screen name> (gap vs legacy)' "
          PROMPT+="   --body '<legacy ref file:line> | <what legacy does> | <what modern does instead / drop> | repro steps | suggested fix>'. "
          PROMPT+="   Title EACH issue with the screen name so they are easy to group. Do NOT clutter: one issue "
          PROMPT+="   per DISTINCT missing feature. If the legacy feature is genuinely present in the modern "
          PROMPT+="   screen, do NOT file anything for it. If NOTHING is missing, file ONE issue labeled "
          PROMPT+="   'task' with title 'Nothing missing: <screen> fully matches legacy' (body: comparison summary "
          PROMPT+="   proving each legacy feature is covered) — verifiable bookkeeping. "
          PROMPT+="6. RECORD the result: append/update a row for this screen in docs/SCREEN-COMPARE-STATUS.md "
          PROMPT+="   with a ✓ marker, the commit(s)/issue number(s) filed, and a one-line verdict "
          PROMPT+="   (e.g. '4 gaps filed: #a #b #c #d' or 'no gaps — full parity'). If the file does not "
          PROMPT+="   exist, create it with a header row and mark this screen ✓. COMMIT+PUSH this doc change "
          PROMPT+="   (and nothing else) so the next run sees it and moves to a different screen. "
          PROMPT+="   Do NOT push any app-code changes — you are not implementing anything. "
          PROMPT+=""
          PROMPT+="RULES: "
          PROMPT+="- You are ONLY analyzing: create NO app code, NO BFF, NO HTML. The only commit you make is "
          PROMPT+="  the docs/SCREEN-COMPARE-STATUS.md bookkeeping update. "
          PROMPT+="- Each issue MUST be labeled 'task' (work-type label) so fix-bug.yml never picks it up and it "
          PROMPT+="  stays in the implement-later pool. "
          PROMPT+="- Do not file duplicate issues: before creating, search existing open issues for the same "
          PROMPT+="  screen+feature (gh issue list --state open). Reuse/annotate an existing one instead. "
          PROMPT+="- It is OK (expected) to find zero gaps on a well-done screen — but prove it by walking through "
          PROMPT+="  every legacy feature in the bookkeeping issue. "
          PROMPT+="- A gap is only a gap if it is a REAL legacy behavior. Ignore pure visual/styling differences "
          PROMPT+="  (Dashio look is intended). Focus on missing FUNCTIONALITY, missing rights checks, missing "
          PROMPT+="  filters/actions/links/exports, and data shown or editable in legacy but absent in modern. "
          PROMPT+="- Time-box to the deadline in .ci_deadline_epoch (date +%s; cat .ci_deadline_epoch). File "
          PROMPT+="  issues for what you found, update docs/SCREEN-COMPARE-STATUS.md, commit+push that doc, and stop. "
          PROMPT+="- After you finish, print a short final summary: screen analyzed, how many gaps filed (issue "
          PROMPT+="  numbers), and which legacy features you confirmed as already covered. "
          PROMPT+="MCP failure policy: at most one retry per failed MCP call (reset browser first); if it still "
          PROMPT+="fails, fall back to static code reading only and note you could not browser-verify. "
          PROMPT+="All steps must be executed autonomously — no user interaction. "
          PROMPT+="This run is an ANALYZER, not a fixer: never modernize or change screen code."

          opencode run "$PROMPT" \
            --dangerously-skip-permissions \
            --print-logs

      - name: Fallback commit of any leftover agent changes (docs bookkeeping only)
        if: always()
        run: |
          set -e
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          BRANCH="${GITHUB_REF_NAME}"
          git add docs/SCREEN-COMPARE-STATUS.md 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "docs(compare): SCREEN-COMPARE-STATUS bookkeeping update"
          fi
          ok=0
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            if git rev-parse "origin/$BRANCH" >/dev/null 2>&1 && \
               ! git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
              echo "::group::rebase onto origin/$BRANCH (attempt $i)"
              git rebase -X theirs "origin/$BRANCH" || { git rebase --abort; continue; }
              echo "::endgroup::"
            fi
            if git push origin "HEAD:$BRANCH"; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            git push --force-with-lease origin "HEAD:$BRANCH" \
              || git push --force origin "HEAD:$BRANCH"
          fi
          echo "push done"

      - name: Upload opencode session logs & server log (post-mortem)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-analyzer-logs
          path: |
            /home/runner/.local/share/opencode/
            tmp/php_server.log
            .ci_deadline_epoch
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
