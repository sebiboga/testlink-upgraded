name: Fix latest bug (opencode)

# One run = ONE bug fixed end-to-end: the NEWEST open GitHub issue.
# No inputs on purpose — the agent picks the issue itself (see FIX-ISSUE.md).
# Same environment pattern as modernize.yml.

on:
  workflow_dispatch: {}
  schedule:
    # every 2 hours (UTC); GitHub may delay scheduled runs under load
    - cron: "0 */2 * * *"

concurrency:
  group: fix-bug
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # cheap triage job: ~10s. If there is nothing to fix, the expensive
  # environment (MariaDB container, PHP, Chrome, opencode) never starts.
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.issues.outputs.count }}
      newest: ${{ steps.issues.outputs.newest }}
    steps:
      - name: Count open issues
        id: issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list --repo "${{ github.repository }}" --state open --limit 200 --json number --jq 'length')
          NEWEST=$(gh issue list --repo "${{ github.repository }}" --state open --limit 200 --json number,title,createdAt --jq 'sort_by(.createdAt) | last | .number')
          echo "open issues: $COUNT (newest: #$NEWEST)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "newest=$NEWEST" >> "$GITHUB_OUTPUT"

  fix-bug:
    needs: triage
    if: needs.triage.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testlink
          MARIADB_USER: testlink
          MARIADB_PASSWORD: testlink
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity (agent commits need it)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Setup Node.js (for opencode CLI + MCP servers)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, gd, intl, mysqli, pdo_mysql

      - name: Install MariaDB client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Wait for MariaDB and import TestLink schema + default data
        run: |
          until mysqladmin ping -h 127.0.0.1 --silent; do
            echo "waiting for mariadb..."; sleep 2;
          done
          sed 's|/\*prefix\*/||g' install/sql/mysql/testlink_create_tables.sql \
            | mysql -h 127.0.0.1 -utestlink -ptestlink testlink
          sed 's|/\*prefix\*/||g' install/sql/mysql/testlink_create_default_data.sql \
            | mysql -h 127.0.0.1 -utestlink -ptestlink testlink
          mysql -h 127.0.0.1 -utestlink -ptestlink testlink -e "SELECT COUNT(*) AS tables_created FROM information_schema.tables WHERE table_schema='testlink';"

      - name: Write config_db.inc.php for CI
        run: |
          cat > config_db.inc.php <<'EOF'
          <?php
          // Automatically Generated by GitHub Actions runner
          define('DB_TYPE', 'mysql');
          define('DB_USER', 'testlink');
          define('DB_PASS', 'testlink');
          define('DB_HOST', '127.0.0.1:3306');
          define('DB_NAME', 'testlink');
          define('DB_TABLE_PREFIX', '');
          EOF
          grep -qx 'config_db.inc.php' .gitignore || echo 'config_db.inc.php' >> .git/info/exclude
          if git ls-files --error-unmatch config_db.inc.php >/dev/null 2>&1; then
            git update-index --skip-worktree config_db.inc.php
          fi

      - name: Prepare writable dirs and start TestLink (PHP built-in server)
        run: |
          mkdir -p tmp gui/templates_c
          nohup php -S 127.0.0.1:8082 -t . > tmp/php_server.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "app http status: %{http_code}\n" http://127.0.0.1:8082/login.php

      - name: Clone GitHub Wiki (for documentation duties)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" \
            tmp/wiki-repo || echo "(wiki not initialized yet — agent will create it)"

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg]" \
            "http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq && sudo apt-get install -y -qq google-chrome-stable

      - name: Start Chrome with remote debugging
        run: |
          google-chrome --remote-debugging-port=9222 --headless --no-sandbox \
            --disable-dev-shm-usage --disable-gpu --remote-allow-origins='*' &
          sleep 3

      - name: Install opencode CLI
        run: npm install -g opencode-ai

      - name: Configure opencode.json
        run: |
          cat > opencode.json << 'OPNCFG'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "opencode/big-pickle",
            "instructions": ["AGENTS.md", "FIX-ISSUE.md"],
            "mcp": {
              "chrome-devtools": {
                "type": "local",
                "command": ["npx", "-y", "chrome-devtools-mcp@latest", "--browser-url=http://127.0.0.1:9222"]
              }
            }
          }
          OPNCFG

      - name: Verify gh auth
        run: gh auth status

      - name: Run opencode — fix the newest open issue
        timeout-minutes: 60
        run: |
          date -d '+55 minutes' +%s > .ci_deadline_epoch
          PROMPT="You are fixing bugs in this TestLink 2.0.1 repository. "
          PROMPT+="Read AGENTS.md and FIX-ISSUE.md in the repo root FIRST and follow ALL their rules strictly. "
          PROMPT+="FIX-ISSUE.md is your mission rulebook: pick the NEWEST open GitHub issue yourself via gh "
          PROMPT+"(skip an issue whose latest comment is a github-actions[bot] 'could not fix' note — take the next newest), "
          PROMPT+"(skip an issue whose latest comment is a github-actions[bot] 'could not fix' note — take the next newest), "
          PROMPT+="reproduce it, root-cause it, apply the minimal fix, verify error-free, write the regression "
          PROMPT+="test case in tmp/TLU_Test_Cases.md, document in wiki (tmp/wiki-repo/) + docs/ mirror. "
          PROMPT+="BRANCH + PR WORKFLOW (mandatory): at the start create your own branch "
          PROMPT+"fix/issue-<n>-<short-slug> and write its name into .ci_branch; make ALL commits there. "
          PROMPT+="NEVER push to the default branch directly. Before opening the PR: git fetch origin and "
          PROMPT+="rebase your branch onto origin/<default branch> if it moved — you own this branch, so "
          PROMPT+="resolve any conflicts yourself with full context. Then open a Pull Request via gh pr create "
          PROMPT+"(title 'fix: <summary> (issue #<n>)', body = root cause, approach, verification, test case ID, "
          PROMPT+="and the line 'Fixes #<n>'). Then TRY to merge it yourself: gh pr merge --squash --delete-branch. "
          PROMPT+="If merge is blocked by conflicts, rebase your branch on the updated default branch and retry. "
          PROMPT+="Only if you still cannot land it cleanly, leave the PR open with a clear status comment and finish. "
          PROMPT+="The issue closes AUTOMATICALLY when the PR merges (Fixes #<n>) — do not close it manually while "
          PROMPT+="the PR is open; if you leave the PR unmerged, post your findings on the issue and leave it open. "
          PROMPT+="Environment already prepared on this machine: "
          PROMPT+="TestLink app running at http://localhost:8082 (PHP built-in server, docroot = repo root); "
          PROMPT+="login admin/admin; "
          PROMPT+="MariaDB at 127.0.0.1:3306, database testlink, user testlink, password testlink "
          PROMPT+="(inspect data with: mysql -h 127.0.0.1 -utestlink -ptestlink testlink); "
          PROMPT+="the database is freshly imported on every run — recreate any fixtures you need; "
          PROMPT+="GitHub Wiki clone at tmp/wiki-repo/ (origin authenticated via token in remote URL); "
          PROMPT+="gh CLI authenticated through GH_TOKEN; "
          PROMPT+="headless Chrome available through the chrome-devtools MCP tools "
          PROMPT+="(navigate to http://localhost:8082/index.php, log in admin/admin, "
          PROMPT+="content screens load inside iframes: navBar / asideMenu / mainframe); "
          PROMPT+="config_db.inc.php is gitignored: NEVER commit it. "
          PROMPT+="AWARENESS: other CI agents may run at the same time (the modernize workflow pushes "
          PROMPT+="intermediate commits to the default branch). You are an AI — no deterministic waiting is "
          PROMPT+="imposed on you; check the world and decide your own strategy: in-progress runs via "
          PROMPT+="gh api repos/\$GITHUB_REPOSITORY/actions/workflows/modernize.yml/runs?status=in_progress, "
          PROMPT+="open PRs via gh pr list. Fetch+rebase before push/merge whenever the default branch moved. "
          PROMPT+="MCP failure policy: at most one retry per failed MCP call, reset browser first; "
          PROMPT+="if it still fails, skip that step and move on — never loop on a failing call. "
          PROMPT+="TIME BUDGET: hard deadline epoch is in .ci_deadline_epoch; when fewer than 10 minutes remain, "
          PROMPT+="wrap up: commit+push everything done and state clearly whether the issue was fixed or left open. "
          PROMPT+="STOP after this one bug. All steps must be executed autonomously — no user interaction."

          opencode run "$PROMPT" \
            --dangerously-skip-permissions \
            --print-logs

      - name: Fallback commit of any leftover agent changes
        if: always()
        run: |
          set -e
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # the agent records its working branch in .ci_branch; NEVER push the default branch
          BRANCH="$(cat .ci_branch 2>/dev/null || true)"
          if [ -z "$BRANCH" ]; then
            echo "::warning::no .ci_branch recorded — agent never created its branch, nothing to push safely"
            exit 0
          fi
          echo "fallback target branch: $BRANCH"
          git add -A -- . ':(exclude)tmp/wiki-repo' ':(exclude)tmp/opencode'
          if ! git diff --staged --quiet; then
            git commit -m "fix(opencode): leftover changes from bug-fix run"
          fi
          ok=0
          for i in 1 2 3; do
            git fetch origin "$BRANCH" || true
            if git rev-parse "origin/$BRANCH" >/dev/null 2>&1 && \
               ! git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
              echo "::group::rebase onto origin/$BRANCH (attempt $i)"
              git rebase -X theirs "origin/$BRANCH" || { git rebase --abort; continue; }
              echo "::endgroup::"
            fi
            if git push origin "HEAD:$BRANCH"; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::normal push failed, escalating on agent-owned branch $BRANCH"
            git push --force-with-lease origin "HEAD:$BRANCH" \
              || git push --force origin "HEAD:$BRANCH"
          fi
          echo "push done"

      - name: Upload opencode session logs & server log (post-mortem)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-session-logs
          path: |
            /home/runner/.local/share/opencode/
            tmp/php_server.log
            .ci_deadline_epoch
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
