<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }
.content { padding: 20px 24px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 20px; overflow: hidden; }
.card-header { background: #22242a; color: #fff; padding: 10px 16px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-body { padding: 16px; }
.form-row { display: flex; gap: 16px; margin-bottom: 12px; }
.form-group { flex: 1; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
.form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
.form-group input:focus, .form-group select:focus { outline: none; border-color: #4ECDC4; box-shadow: 0 0 0 2px rgba(78,205,196,.15); }
.form-group .readonly { background: #f5f5f5; color: #888; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-red { background: #e6605e; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-red:hover { background: #d04e4c; }
.btn-outline { background: transparent; color: #4ECDC4; border: 1px solid #4ECDC4; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-outline:hover { background: #4ECDC4; color: #fff; }
.btn-group { display: flex; gap: 10px; margin-top: 12px; }
.alert { padding: 10px 14px; border-radius: 4px; font-size: 13px; margin-bottom: 12px; display: none; }
.alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
.alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
.apikey-display { background: #f5f5f5; border: 1px solid #ddd; border-radius: 4px; padding: 10px 14px; font-family: monospace; font-size: 13px; word-break: break-all; display: flex; align-items: center; justify-content: space-between; }
.apikey-display .copy-btn { cursor: pointer; color: #4ECDC4; margin-left: 12px; font-size: 14px; }
.login-history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.login-history-table th { text-align: left; padding: 6px 10px; background: #f5f5f5; border-bottom: 2px solid #ddd; font-size: 11px; color: #666; text-transform: uppercase; }
.login-history-table td { padding: 6px 10px; border-bottom: 1px solid #eee; }
.login-history-table tr:hover td { background: #f9fffe; }
.timestamp { color: #888; white-space: nowrap; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; }
</style>
</head>
<body>

<div class="header"><span data-i18n="header.userProfile">User Profile</span> <span data-i18n="header.userProfileSub" style="font-size:13px;font-weight:400;opacity:.8;margin-left:12px;">account settings and preferences</span><span id="localeSwitcher" style="float:right;"></span></div>

<div class="content">

  <div id="alertBox" class="alert"></div>

  <!-- Personal Data -->
  <div class="card">
    <div class="card-header"><i class="fa fa-user"></i> <span data-i18n="profile.personalData">Personal Data</span></div>
    <div class="card-body">
      <div class="form-group" style="margin-bottom:12px;">
        <label data-i18n="user.login">Login</label>
        <input type="text" id="login" class="readonly" readonly>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label data-i18n="profile.firstName">First Name *</label>
          <input type="text" id="firstName" maxlength="30">
        </div>
        <div class="form-group">
          <label data-i18n="profile.lastName">Last Name *</label>
          <input type="text" id="lastName" maxlength="30">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label data-i18n="profile.email">Email *</label>
          <input type="email" id="email" maxlength="100">
        </div>
        <div class="form-group">
          <label data-i18n="profile.locale">Locale</label>
          <select id="locale"></select>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label data-i18n="profile.role">Role</label>
        <input type="text" id="roleName" class="readonly" readonly>
      </div>
      <div class="btn-group">
        <button class="btn-teal" onclick="saveProfile()"><i class="fa fa-save"></i> <span data-i18n="profile.save">Save</span></button>
      </div>
    </div>
  </div>

  <!-- Change Password -->
  <div class="card">
    <div class="card-header"><i class="fa fa-lock"></i> <span data-i18n="profile.changePassword">Change Password</span></div>
    <div class="card-body">
      <div id="pwAlert" class="alert"></div>
      <div class="form-group" style="margin-bottom:12px;">
        <label data-i18n="profile.currentPassword">Current Password</label>
        <input type="password" id="oldPassword">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label data-i18n="profile.newPassword">New Password</label>
          <input type="password" id="newPassword">
        </div>
        <div class="form-group">
          <label data-i18n="profile.confirmNewPassword">Confirm New Password</label>
          <input type="password" id="newPasswordCheck">
        </div>
      </div>
      <div class="btn-group">
        <button class="btn-teal" onclick="changePassword()"><i class="fa fa-key"></i> <span data-i18n="profile.changePassword">Change Password</span></button>
      </div>
    </div>
  </div>

  <!-- API Key -->
  <div class="card">
    <div class="card-header"><i class="fa fa-key"></i> <span data-i18n="profile.apiInterface">API Interface</span></div>
    <div class="card-body">
      <div id="apiKeyAlert" class="alert"></div>
      <label data-i18n="profile.yourApiKey" style="font-size:12px;font-weight:600;color:#555;display:block;margin-bottom:6px;">Your API Key</label>
      <div class="apikey-display">
        <span id="apiKeyValue">loading...</span>
        <i class="fa fa-copy copy-btn" title="Copy to clipboard" onclick="copyApiKey()"></i>
      </div>
      <div class="btn-group">
        <button class="btn-outline" onclick="generateApiKey()"><i class="fa fa-refresh"></i> <span data-i18n="profile.generateNewKey">Generate New Key</span></button>
      </div>
    </div>
  </div>

  <!-- Login History -->
  <div class="card">
    <div class="card-header"><i class="fa fa-history"></i> <span data-i18n="profile.loginHistory">Login History</span></div>
    <div class="card-body">
      <div style="margin-bottom:16px;">
        <h4 style="font-size:13px;font-weight:700;color:#22242a;margin:0 0 8px 0;"><i class="fa fa-check-circle" style="color:#4ECDC4;"></i> <span data-i18n="profile.successfulLogins">Successful Logins</span></h4>
        <table class="login-history-table">
          <thead><tr><th data-i18n="profile.timestamp">Timestamp</th><th data-i18n="profile.description">Description</th></tr></thead>
          <tbody id="successfulLogins"><tr><td colspan="2" style="color:#888;">Loading...</td></tr></tbody>
        </table>
      </div>
      <div>
        <h4 style="font-size:13px;font-weight:700;color:#22242a;margin:0 0 8px 0;"><i class="fa fa-times-circle" style="color:#e6605e;"></i> <span data-i18n="profile.failedLogins">Failed Logins</span></h4>
        <table class="login-history-table">
          <thead><tr><th data-i18n="profile.timestamp">Timestamp</th><th data-i18n="profile.description">Description</th></tr></thead>
          <tbody id="failedLogins"><tr><td colspan="2" style="color:#888;">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<div class="footer"><span data-i18n="footers.userInfo">TestLink 2.0.1 - My Settings</span></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
var API = '/api/userinfo/index.php';
var profileData = null;

TLi18n.load(function() {
  TLi18n.apply();
  TLi18n.initLocaleSwitcher('#localeSwitcher');
  loadProfile();
  loadLocales();
  loadLoginHistory();
});

function showAlert(type, msg, target) {
  var el = target ? $('#' + target) : $('#alertBox');
  el.removeClass('alert-success alert-error').addClass(type === 'ok' ? 'alert-success' : 'alert-error').text(msg).show();
  setTimeout(function() { el.fadeOut(); }, 4000);
}

function loadProfile() {
  $.getJSON(API, function(r) {
    profileData = r.item;
    $('#login').val(profileData.login);
    $('#firstName').val(profileData.firstName);
    $('#lastName').val(profileData.lastName);
    $('#email').val(profileData.email);
    $('#roleName').val(profileData.globalRoleName);
    $('#apiKeyValue').text(profileData.apiKey || 'none');
    if (profileData.locale) {
      $('#locale').val(profileData.locale);
    }
  });
}

function loadLocales() {
  $.getJSON(API + '/locales', function(r) {
    var sel = $('#locale');
    var current = profileData ? profileData.locale : '';
    sel.empty();
    $.each(r.items, function(i, loc) {
      sel.append('<option value="' + loc.code + '">' + loc.name + '</option>');
    });
    if (current) sel.val(current);
  });
}

function saveProfile() {
  var data = {
    firstName: $('#firstName').val().trim(),
    lastName: $('#lastName').val().trim(),
    email: $('#email').val().trim(),
    locale: $('#locale').val()
  };
  if (!data.firstName || !data.lastName || !data.email) {
    showAlert('error', TLi18n.t('profile.msg.requiredFields'));
    return;
  }
  $.ajax({
    url: API, type: 'PUT',
    contentType: 'application/json', data: JSON.stringify(data),
    success: function(r) { showAlert('ok', r.message || TLi18n.t('profile.msg.profileUpdated')); },
    error: function(xhr) {
      var msg = TLi18n.t('profile.msg.errorProfile');
      try { msg = JSON.parse(xhr.responseText).message; } catch(e) {}
      showAlert('error', msg);
    }
  });
}

function changePassword() {
  var oldPw = $('#oldPassword').val();
  var newPw = $('#newPassword').val();
  var newPw2 = $('#newPasswordCheck').val();
  if (!oldPw) { showAlert('error', TLi18n.t('profile.msg.passwordRequired'), 'pwAlert'); return; }
  if (!newPw) { showAlert('error', TLi18n.t('profile.msg.newPasswordEmpty'), 'pwAlert'); return; }
  if (newPw !== newPw2) { showAlert('error', TLi18n.t('profile.msg.passwordsNoMatch'), 'pwAlert'); return; }
  $.ajax({
    url: API + '/password', type: 'PUT',
    contentType: 'application/json',
    data: JSON.stringify({ oldPassword: oldPw, newPassword: newPw }),
    success: function(r) {
      showAlert('ok', r.message || TLi18n.t('profile.msg.passwordChanged'), 'pwAlert');
      $('#oldPassword').val('');
      $('#newPassword').val('');
      $('#newPasswordCheck').val('');
    },
    error: function(xhr) {
      var msg = TLi18n.t('profile.msg.errorPassword');
      try { msg = JSON.parse(xhr.responseText).message; } catch(e) {}
      showAlert('error', msg, 'pwAlert');
    }
  });
}

function generateApiKey() {
  $.ajax({
    url: API + '/apikey', type: 'POST',
    contentType: 'application/json',
    success: function(r) {
      $('#apiKeyValue').text(r.apiKey);
      showAlert('ok', r.message || TLi18n.t('profile.msg.apiKeyGenerated'), 'apiKeyAlert');
    },
    error: function(xhr) {
      var msg = TLi18n.t('profile.msg.errorApiKey');
      try { msg = JSON.parse(xhr.responseText).message; } catch(e) {}
      showAlert('error', msg, 'apiKeyAlert');
    }
  });
}

function copyApiKey() {
  var key = $('#apiKeyValue').text();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(key);
    showAlert('ok', TLi18n.t('profile.msg.apiKeyCopied'));
  }
}

function formatTimestamp(ts) {
  if (!ts) return '-';
  var d = new Date(parseInt(ts) * 1000);
  return d.toLocaleString();
}

function loadLoginHistory() {
  $.getJSON(API + '/login-history', function(r) {
    var okHtml = '';
    if (r.successful && r.successful.length) {
      $.each(r.successful, function(i, e) {
        okHtml += '<tr><td class="timestamp">' + formatTimestamp(e.timestamp) + '</td><td>' + (e.description || '') + '</td></tr>';
      });
    } else {
      okHtml = '<tr><td colspan="2" style="color:#888;">' + TLi18n.t('profile.neverLogged') + '</td></tr>';
    }
    $('#successfulLogins').html(okHtml);

    var failHtml = '';
    if (r.failed && r.failed.length) {
      $.each(r.failed, function(i, e) {
        failHtml += '<tr><td class="timestamp">' + formatTimestamp(e.timestamp) + '</td><td>' + (e.description || '') + '</td></tr>';
      });
    } else {
      failHtml = '<tr><td colspan="2" style="color:#888;">' + TLi18n.t('profile.noFailedLogins') + '</td></tr>';
    }
    $('#failedLogins').html(failHtml);
  });
}
</script>
</body>
</html>
