<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Show Newest Test Case Versions</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.toolbar select { font-size: 13px; padding: 5px 8px; border-radius: 4px; border: none; background: #fff; min-width: 220px; }
.btn-dark { background: #353b48; color: #fff; border: none; padding: 7px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-dark:hover { background: #2c313a; }
.mainPane { margin: 18px 24px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; display: flex; flex-direction: column; }
.mainPane .paneHead { background: #22242a; color: #fff; font-size: 13px; letter-spacing: .5px; padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.paneHead .cnt { opacity: .75; font-weight: 400; }
.tableWrap { overflow: auto; max-height: 70vh; }
table.ntcv { width: 100%; border-collapse: collapse; font-size: 13px; }
table.ntcv th { background: #fafafa; text-align: left; padding: 9px 12px; border-bottom: 2px solid #eee; font-size: 12px; color: #555; white-space: nowrap; }
table.ntcv th.c, table.ntcv td.c { text-align: center; }
table.ntcv td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
table.ntcv tr:hover td { background: #f7fdfd; }
.tcpath { display: block; font-size: 11.5px; color: #999; }
.tcname { font-weight: 600; }
.tcid { color: #227d76; font-weight: 700; margin-right: 6px; }
.tclinks { margin-right: 8px; white-space: nowrap; }
.tclinks a { color: #4ECDC4; margin-right: 8px; font-size: 13.5px; text-decoration: none; }
.tclinks a:hover { color: #3dbdb5; }
.ver-tag { display: inline-block; background: #eef6f6; color: #227d76; border-radius: 10px; padding: 2px 10px; font-size: 11.5px; font-weight: 700; }
.ver-tag.newest { background: #e8f9f0; color: #1e8e4e; }
.btn-compare { display: inline-block; background: #4ECDC4; color: #fff !important; text-decoration: none; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 4px; }
.btn-compare:hover { background: #3dbdb5; text-decoration: none; }
.stateBox { margin: 26px auto; max-width: 640px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 30px 26px; text-align: center; color: #888; font-size: 13.5px; }
.stateBox i.big { font-size: 34px; color: #4ECDC4; display: block; margin-bottom: 12px; }
.stateBox.err i.big { color: #e6605e; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #eee; background: #fff; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.toast.err { background: #e6605e; }
</style>
</head>
<body>

<div class="header">
  <span data-i18n="ntcv.header">Show Newest Test Case Versions</span>
  <span class="sub" data-i18n="ntcv.headerSub">test plan</span>
  <span id="tplanNameBadge" style="float:right;font-size:13px;font-weight:400;opacity:.9;"></span>
</div>

<div class="toolbar">
  <span class="ctx"><span data-i18n="ntcv.testProject">Test Project</span>: <b id="tprojectName">-</b></span>
  <span class="ctx"><label for="tplanSel" data-i18n="ntcv.testPlan">Test Plan</label>:</span>
  <select id="tplanSel"></select>
  <span class="ctx" id="linkedInfo"></span>
  <span style="flex:1"></span>
  <button class="btn-dark" id="btnReload" title="reload"><i class="fa fa-rotate-right"></i></button>
  <span id="localeSwitcher"></span>
</div>

<div class="mainPane" id="mainPane" style="display:none;">
  <div class="paneHead">
    <span><i class="fa fa-code-branch"></i> <span data-i18n="ntcv.tableTitle">Linked test cases with a newer active version</span></span>
    <span class="cnt" id="rowsInfo"></span>
  </div>
  <div class="tableWrap">
    <table class="ntcv">
      <thead>
        <tr>
          <th data-i18n="ntcv.colTestCase">Test Case</th>
          <th class="c" style="width:130px;" data-i18n="ntcv.colLinkedVersion">Linked version</th>
          <th class="c" style="width:130px;" data-i18n="ntcv.colNewestVersion">Newest version</th>
          <th class="c" style="width:120px;" data-i18n="ntcv.colCompare">Compare</th>
        </tr>
      </thead>
      <tbody id="tcRows"></tbody>
    </table>
  </div>
  <div class="footer"><span data-i18n="ntcv.footerHint">This report is read-only. Use "Update Linked Test Case Versions" in the menu to switch linked versions.</span></div>
</div>

<div class="stateBox" id="stateBox" style="display:none;">
  <i class="big fa" id="stateIcon"></i>
  <span id="stateText"></span>
</div>

<div class="toast" id="toast"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/plans/index.php';
var tplanId = 0;
var tprojectId = 0;
var tcprefix = '';
var lastData = null;

$(function () {
  var p = new URLSearchParams(window.location.search);
  tplanId = parseInt(p.get('tplan_id') || '0', 10);
  tprojectId = parseInt(p.get('tproject_id') || '0', 10);

  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher') || null;
    TLi18n.apply();
    load();
  });

  $('#tplanSel').on('change', function () {
    tplanId = parseInt($(this).val() || '0', 10);
    syncUrl();
    load();
  });
  $('#btnReload').on('click', load);
});

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg, isErr) {
  var $t = $('#toast').text(msg).toggleClass('err', !!isErr).show();
  clearTimeout($t.data('tm'));
  $t.data('tm', setTimeout(function(){ $t.hide(); }, 3500));
}

function syncUrl() {
  var url = new URL(window.location.href);
  url.searchParams.set('tproject_id', String(tprojectId || ''));
  url.searchParams.set('tplan_id', String(tplanId || ''));
  window.history.replaceState({}, '', url);
}

function apiFail(xhr) {
  if (xhr && xhr.status === 403) { showState(TLi18n.t('common.forbidden'), true); return; }
  if (xhr && xhr.status === 401) { window.location.href = '/login.php'; return; }
  var msg = TLi18n.t('common.error');
  try {
    var r = JSON.parse(xhr.responseText);
    if (r && r.message) { msg = esc(r.message); }
  } catch (e) {}
  showState(msg, true);
}

function showState(text, isErr) {
  $('#mainPane').hide();
  var $b = $('#stateBox').show();
  $b.toggleClass('err', !!isErr);
  $('#stateIcon')
    .attr('class', 'big fa ' + (isErr ? 'fa-circle-exclamation' : 'fa-clipboard-check'));
  $('#stateText').html(esc(text));
}

function hideState() { $('#stateBox').hide(); }

function fillPlans(plans) {
  var $sel = $('#tplanSel').empty();
  $.each(plans || [], function (i, pl) {
    $sel.append('<option value="' + pl.id + '">' + esc(pl.name) + '</option>');
  });
  if (tplanId > 0) { $sel.val(String(tplanId)); }
  if (!$sel.val() && ($sel.find('option:first').val() || '0') !== '') {
    tplanId = parseInt($sel.val() || '0', 10);
    if (tplanId > 0) { syncUrl(); }
  }
}

// legacy popup links (same targets as newest_tcversions.tpl icons)
function designUrl(it) {
  return '/lib/testcases/archiveData.php?allow_edit=0&show_mode=readonly'
       + '&edit=testcase&id=' + it.tc_id
       + '&tcversion_id=' + it.tcversion_id
       + '&tproject_id=' + tprojectId
       + '&tplan_id=' + tplanId;
}
function execHistoryUrl(it) {
  return '/lib/execute/execHistory.php?tcase_id=' + it.tc_id
       + '&tproject_id=' + tprojectId;
}
function compareUrl(it) {
  return '/lib/testcases/tcCompareVersions.php?testcase_id=' + it.tc_id
       + '&version_left=' + it.version
       + '&version_right=' + it.newest_version
       + '&compare_selected_versions=1&use_html_comp=1';
}

function render(data) {
  lastData = data;
  $('#tprojectName').text(data.tproject.name || '-');
  fillPlans(data.tplans);
  tcprefix = data.tcprefix || '';

  if (!data.tplan) {
    $('#linkedInfo').text('');
    $('#tplanNameBadge').text('');
    showState(TLi18n.t('ntcv.noTestplan'), false);
    return;
  }

  $('#tplanNameBadge').text(data.tplan.name);
  $('#linkedInfo').text(TLi18n.t('ntcv.linkedCount') + ': ' + data.linked_count);

  if (data.state === 'no-linked') {
    showState(TLi18n.t('ntcv.noLinkedTcversions'), false);
    return;
  }
  if (data.state === 'all-current') {
    showState(TLi18n.t('ntcv.allUpToDate'), false);
    return;
  }

  hideState();
  var $tb = $('#tcRows').empty();
  $.each(data.items, function (i, it) {
    var fullId = tcprefix + it.tc_external_id;
    $tb.append(
      '<tr>'
      + '<td>'
      +   '<span class="tclinks">'
      +     '<a href="' + execHistoryUrl(it) + '" target="_blank" title="'
      +       esc(TLi18n.t('ntcv.executionHistory')) + '"><i class="fa fa-clock-rotate-left"></i></a>'
      +     '<a href="' + designUrl(it) + '" target="_blank" title="'
      +       esc(TLi18n.t('ntcv.design')) + '"><i class="fa fa-pen-to-square"></i></a>'
      +   '</span>'
      +   '<span class="tcpath">' + esc(it.path) + '</span>'
      +   '<span class="tcid">' + esc(fullId) + '</span>'
      +   '<span class="tcname">' + esc(it.name) + '</span>'
      + '</td>'
      + '<td class="c"><span class="ver-tag">' + esc(String(it.version)) + '</span></td>'
      + '<td class="c"><span class="ver-tag newest">' + esc(String(it.newest_version)) + '</span></td>'
      + '<td class="c"><a class="btn-compare" target="_blank" href="' + compareUrl(it)
      +   '" title="' + esc(TLi18n.t('ntcv.compare')) + '"><i class="fa fa-magnifying-glass"></i> '
      +   esc(TLi18n.t('ntcv.compare')) + '</a></td>'
      + '</tr>'
    );
  });
  $('#rowsInfo').text(
    data.items.length + ' ' + TLi18n.t('ntcv.rowsSuffix'));
  $('#mainPane').show();
}

function load() {
  hideState();
  $('#mainPane').hide();
  showState(TLi18n.t('common.loading'), false);
  $.ajax({
    url: API + '/newest-versions',
    method: 'GET',
    dataType: 'json',
    data: { tproject_id: tprojectId, tplan_id: tplanId },
    success: function (r) {
      if (r.status !== 'ok' ||
          ['ok','no-linked','all-current','pick'].indexOf(r.state) < 0) {
        toast(TLi18n.t('common.error'), true);
        return;
      }
      render(r);
    },
    error: function (xhr) {
      apiFail(xhr);
    }
  });
}
</script>
</body>
</html>
