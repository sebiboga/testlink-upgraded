<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pnav.title">Test Plan Navigator</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; color: #0d3f3c; opacity: 1; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.toolbar label { color: #aaa; font-size: 12px; margin: 0; }
.toolbar b.tp { color: #fff; font-weight: 700; }
.toolbar select { background: #353b48; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 5px 8px; font-size: 13px; max-width: 240px; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-dark { background: #353b48; color: #fff; border: 1px solid #555; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-dark:hover { background: #2c313a; }
.btn-dark:disabled { opacity: .45; cursor: not-allowed; }
.ringer { padding: 16px 24px; }
.panel { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; margin-bottom: 16px; }
.panel > h3 { background: #22242a; color: #fff; margin: 0; padding: 10px 14px; font-size: 13px; letter-spacing: .5px; display: flex; justify-content: space-between; align-items: center; }
.panel > h3 .cnt { color: #9aa; font-weight: 400; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; padding: 14px; }
.card-act { border: 1px solid #e4e4e4; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: #fff; transition: box-shadow .15s, border-color .15s; }
.card-act:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); border-color: #4ECDC4; }
.card-act .ic { color: #4ECDC4; font-size: 22px; }
.card-act .t1 { font-size: 14px; font-weight: 700; color: #2d2d2d; }
.card-act .t2 { font-size: 12px; color: #888; flex: 1; }
.card-act a { margin-top: 4px; text-decoration: none; }
.card-act.locked { opacity: .5; }
.card-act.locked .t2 { color: #b06; }
.layout { display: flex; gap: 16px; align-items: flex-start; }
.panel-side { width: 340px; min-width: 280px; }
.panel-main { flex: 1; min-width: 0; }
.tree { list-style: none; margin: 0; padding: 6px 0; max-height: 58vh; overflow-y: auto; }
.tree li { padding: 7px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; border-left: 3px solid transparent; }
.tree li:hover { background: #f4fbfa; }
.tree li.sel { background: #e8f8f7; border-left-color: #4ECDC4; font-weight: 700; color: #2d8e88; }
.tree li.child { padding-left: 30px; position: relative; }
.tree li.child:before { content: '\2937'; position: absolute; left: 12px; color: #bbb; font-size: 12px; }
.tree .lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge-qty { background: #eee; color: #555; border-radius: 10px; padding: 1px 8px; font-size: 11px; white-space: nowrap; }
.badge-qty .lnk { color: #23756f; font-weight: 700; }
.badge-qty .cov { color: #2e7d32; font-weight: 700; }
.empty { padding: 26px; text-align: center; color: #888; font-size: 13px; }
.detail-row { display: flex; justify-content: space-between; padding: 9px 14px; font-size: 13px; border-bottom: 1px solid #f2f2f2; }
.detail-row:last-child { border-bottom: none; }
.detail-row .k { color: #666; }
.detail-row .v { font-weight: 700; color: #2d2d2d; }
.detail-row .v.good { color: #2e7d32; }
.detail-row .v.bad { color: #d38b0c; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); max-width: 480px; }
.toast.err { background: #e6605e; }
@media (max-width: 1100px) { .layout { flex-direction: column; } .panel-side { width: 100%; } }
</style>
</head>
<body>

<div class="header">
  <span data-i18n="pnav.title">Test Plan Navigator</span>
  <span class="sub" data-i18n="pnav.subTitle">browse test cases and requirement coverage of a test plan and open its planning tools</span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <label><span data-i18n="pv.testProject">Test Project</span>: <b class="tp" id="tprojectName">-</b></label>
  <label for="tplanSel" data-i18n="paddtc.testPlan">Test Plan</label>
  <select id="tplanSel"></select>
  <label for="groupBySel" data-i18n="pnav.groupBy">Group by</label>
  <select id="groupBySel">
    <option value="test_suite" data-i18n="pnav.groupsSuites">Test suites</option>
    <option value="req_coverage" data-i18n="pnav.groupsReqs">Requirement coverage</option>
  </select>
  <label for="buildSel" id="buildLbl" style="display:none;" data-i18n="paddtc.build">Build</label>
  <select id="buildSel" style="display:none;"></select>
  <span style="flex:1"></span>
  <button class="btn-dark" id="btnReload"><i class="fas fa-sync-alt"></i> <span data-i18n="common.refresh">Refresh</span></button>
</div>

<div class="ringer">

  <div class="panel">
    <h3><span><i class="fas fa-bolt"></i> <span data-i18n="pnav.actions">Plan actions</span></span></h3>
    <div class="cards" id="actionCards"></div>
  </div>

  <div class="layout">
    <div class="panel panel-side">
      <h3><span><i class="fas fa-sitemap"></i> <span id="treeHeader" data-i18n="pnav.treeHeader">Test cases tree</span></span>
          <span class="cnt" id="treeCount"></span></h3>
      <div id="treeEmpty" class="empty" style="display:none;" data-i18n="pnav.noItems">Nothing to show for this test plan yet</div>
      <ul class="tree" id="navTree" style="display:none;"></ul>
    </div>

    <div class="panel panel-main">
      <h3><span><i class="fas fa-circle-info"></i> <span data-i18n="pnav.detail">Item details</span></span></h3>
      <div id="detailEmpty" class="empty" data-i18n="pnav.selectHint">Select a test suite or requirement to inspect it</div>
      <div id="detailBody" style="display:none;"></div>
    </div>
  </div>

</div>

<div class="footer" id="footerInfo"></div>
<div class="footer"><span data-i18n="footers.planNav">TestLink 2.0.1 - Test Plan Navigator</span></div>
<div class="toast" id="toast"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/plannav/index.php';
var tprojectId = parseInt(new URLSearchParams(location.search).get('testproject_id')
                 || new URLSearchParams(location.search).get('tproject_id') || '0', 10);
var tplanParam = parseInt(new URLSearchParams(location.search).get('testplan_id')
                 || new URLSearchParams(location.search).get('tplan_id') || '0', 10);
var INIT = null;
var TREE = [];
var selId = 0;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function toast(m,isErr){var $t=$('#toast').text(m).toggleClass('err',!!isErr).show();clearTimeout($t.data('tm'));$t.data('tm',setTimeout(function(){$t.hide();},3500));}

$(function(){
  TLi18n.load(function(){
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    boot();
  });
  $('#btnReload').on('click', function(){ selId = 0; boot(); });
  $('#tplanSel').on('change', function(){ selId = 0; boot(parseInt(this.value, 10)); });
  $('#groupBySel').on('change', function(){ selId = 0; loadTree(); });
  $('#navTree').on('click','li[data-id]',function(){ selectNode(parseInt(this.getAttribute('data-id'),10)); });
});

function boot(chosenTplan){
  if(chosenTplan){ tplanParam = chosenTplan; }
  var q = '/init?tproject_id=' + tprojectId + (tplanParam>0 ? '&tplan_id='+tplanParam : '');
  $.getJSON(API + q)
    .done(function(r){
      if(r.status!=='ok'){ toast(TLi18n.t('common.error'), true); return; }
      INIT = r;
      tprojectId = r.tproject_id;
      $('#tprojectName').text(r.tproject_name);
      document.title = (r.tproject_name || '') + ' - ' + TLi18n.t('pnav.title');
      var $sel = $('#tplanSel').empty();
      (r.plans||[]).forEach(function(p){
        $sel.append('<option value="'+p.id+'"'+(p.id===r.tplan_id?' selected':'')+'>'+esc(p.name)+'</option>');
      });
      var canAssign = !!(r.rights && r.rights.canAssign);
      var $b = $('#buildSel').empty();
      if(canAssign && r.builds){
        var keys = Object.keys(r.builds||{});
        keys.forEach(function(bid){
          $b.append('<option value="'+bid+'"'+(parseInt(bid,10)===r.default_build_id?' selected':'')+'>'+esc(r.builds[bid])+'</option>');
        });
      }
      $('#buildLbl,#buildSel').toggle(canAssign && ($b.children().length>0));
      refreshActions();
      loadTree();
    })
    .fail(function(xhr){
      if(xhr.status===403){ toast(TLi18n.t('pnav.noAccess'), true); }
      else if(xhr.status===401){ location.href = '/login.php'; }
      else { toast(TLi18n.t('common.error'), true); }
    });
}

function refreshActions(){
  if(!INIT || !INIT.actions) return;
  var $c = $('#actionCards').empty();
  var defs = [
    ['actAddRemove','actAddRemoveSub','fas fa-list-check','addremove'],
    ['actUpdateTC','actUpdateTCSub','fas fa-arrows-rotate','updateTC'],
    ['actUrgency','actUrgencySub','fas fa-gauge-high','urgency'],
    ['actAssignment','actAssignmentSub','fas fa-user-check','assignment'],
    ['actEventView','actEventViewSub','fas fa-clock-rotate-left','eventviewer']
  ];
  defs.forEach(function(d){
    var a = INIT.actions[d[3]];
    var href = a ? a.url + '?' + esc(a.params) : '#';
    $c.append(
      '<div class="card-act'+(a?'':' locked')+'">'+
        '<div class="ic"><i class="'+d[2]+'"></i></div>'+
        '<div class="t1">'+esc(TLi18n.t('pnav.'+d[0]))+'</div>'+
        '<div class="t2">'+esc(TLi18n.t('pnav.'+d[1]))+'</div>'+
        (a ? '<a class="btn-teal" href="'+href+'" target="_blank"><i class="fas fa-arrow-up-right-from-square"></i> '+esc(TLi18n.t('pnav.open'))+'</a>'
           : '<a class="btn-dark" href="#" disabled onclick="return false;"><i class="fas fa-lock"></i> '+esc(TLi18n.t('pnav.noRight'))+'</a>')+
      '</div>');
  });
}

function loadTree(){
  var tplanId = $('#tplanSel').val();
  if(!tplanId){ $('#navTree').hide().empty(); $('#treeEmpty').show(); return; }
  var g = $('#groupBySel').val();
  var url = API + '/' + (g==='req_coverage' ? 'reqs' : 'suites') +
            '?tproject_id=' + tprojectId + '&tplan_id=' + tplanId;
  $.getJSON(url)
    .done(function(r){
      TREE = r.items || [];
      renderTree();
    })
    .fail(function(xhr){
      if(xhr.status===401){ location.href='/login.php'; return; }
      toast(TLi18n.t('common.error'), true);
    });
}

function renderTree(){
  var g = $('#groupBySel').val();
  $('#treeHeader').text(g==='req_coverage' ? TLi18n.t('pnav.treeHeaderReqs') : TLi18n.t('pnav.treeHeader'));
  $('#treeCount').text(TREE.length);
  if(!TREE.length){ $('#navTree').hide().empty(); $('#treeEmpty').show(); clearDetail(); return; }
  $('#treeEmpty').hide();
  var $u = $('#navTree').empty().show();
  TREE.forEach(function(item){
    if(g==='req_coverage'){
      var reqs = (item.requirements || []);
      $u.append('<li data-id="'+item.id+'" data-type="reqspec">'+
        '<span class="lname">'+esc(item.name)+'</span>'+
        '<span class="badge-qty"><span class="cov">'+item.covered_qty+'</span>/'+item.total_qty+'</span></li>');
      reqs.forEach(function(rq){
        $u.append('<li class="child" data-id="'+rq.id+'" data-type="req">'+
          '<span class="lname">'+esc(rq.name)+'</span>'+
          '<span class="badge-qty"><span class="cov">'+(rq.covered_qty>0?'\u2713':'')+'</span> '+rq.linked_qty+'</span></li>');
      });
    } else {
      $u.append('<li data-id="'+item.id+'" data-type="suite">'+
        '<span class="lname">'+esc(item.name)+'</span>'+
        '<span class="badge-qty"><span class="lnk">'+item.deep_linked_qty+'</span>/'+item.deep_total_qty+'</span></li>');
    }
  });
}

function selectNode(id){
  selId = id;
  $('#navTree li').removeClass('sel').filter('[data-id="'+id+'"]').addClass('sel');
  var g = $('#groupBySel').val();
  if(g==='req_coverage'){
    var spec = TREE.filter(function(s){ return s.id===id; })[0];
    var req = null;
    if(!spec){ TREE.forEach(function(s){ (s.requirements||[]).forEach(function(r){ if(r.id===id) req=r; }); }); }
    renderDetail(spec ? {name:spec.name, type:'reqspec', cov:spec.covered_qty, tot:spec.total_qty, reqs:(spec.requirements||[]).length}
                       : {name:req.name, type:'req', cov:req.covered_qty, lnk:req.linked_qty});
  } else {
    var suite = TREE.filter(function(s){ return s.id===id; })[0];
    if(!suite) return;
    renderDetail({name:suite.name, type:'suite', lnk:suite.deep_linked_qty, tot:suite.deep_total_qty,
                  direct:suite.deep_total_qty - (suite.requirements?0:0)});
  }
}

function renderDetail(d){
  $('#detailEmpty').hide();
  var $b = $('#detailBody').empty().show();
  $b.append('<div class="detail-row"><span class="k">'+esc(TLi18n.t('pnav.name'))+'</span><span class="v">'+esc(d.name)+'</span></div>');
  if(d.type==='suite'){
    $b.append('<div class="detail-row"><span class="k">'+esc(TLi18n.t('pnav.linked'))+'</span><span class="v">'+d.lnk+'</span></div>');
    $b.append('<div class="detail-row"><span class="k">'+esc(TLi18n.t('pnav.total'))+'</span><span class="v">'+d.tot+'</span></div>');
  } else if(d.type==='reqspec'){
    $b.append('<div class="detail-row"><span class="k">'+esc(TLi18n.t('pnav.requirements'))+'</span><span class="v">'+d.reqs+'</span></div>');
    $b.append('<div class="detail-row"><span class="k">'+esc(TLi18n.t('pnav.covered'))+'</span><span class="v">'+d.cov+'</span></div>');
    $b.append('<div class="detail-row"><span class="k">'+esc(TLi18n.t('pnav.total'))+'</span><span class="v">'+d.tot+'</span></div>');
  } else if(d.type==='req'){
    $b.append('<div class="detail-row"><span class="k">'+esc(TLi18n.t('pnav.linkedTc'))+'</span><span class="v">'+d.lnk+'</span></div>');
    $b.append('<div class="detail-row"><span class="k">'+esc(TLi18n.t('pnav.covered'))+'</span><span class="v '+(d.cov>0?'good':'bad')+'">'+(d.cov>0?esc(TLi18n.t('pnav.yes')):esc(TLi18n.t('pnav.no')))+'</span></div>');
  }
}

function clearDetail(){ $('#detailBody').hide().empty(); $('#detailEmpty').show(); }
</script>
</body>
</html>
