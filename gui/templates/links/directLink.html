<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="dl.title">Direct link</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/gui/templates/dashio/lib/font-awesome/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #22242a; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
.header span { font-size: 12px; font-weight: 400; color: #999; margin-left: 10px; }
.header .loc { float: right; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid #2e3138; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.btn-teal:hover { background: #3dbdb5; color: #fff; }
.btn-ghost { background: transparent; color: #ccc; border: 1px solid #555; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.btn-ghost:hover { border-color: #4ECDC4; color: #4ECDC4; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; max-width: 860px; }
.card-title { background: #f7f7f7; padding: 10px 18px; font-size: 13px; font-weight: 700; color: #22242a; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 8px; }
.card-body { padding: 18px; }
.msg { display: none; margin: 12px 24px 0; padding: 10px 16px; border-radius: 5px; font-size: 13px; max-width: 812px; }
.msg.ok { display: block; background: #e8f8f2; border: 1px solid #b8e6d3; color: #1d7a4f; }
.msg.err { display: block; background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; }
.msg.info { display: block; background: #eef4fb; border: 1px solid #c5d6ec; color: #2c5f9d; }
.row { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px dashed #eee; flex-wrap: wrap; }
.row:last-child { border-bottom: none; }
.row .k { color: #888; font-size: 12px; width: 190px; flex: 0 0 190px; }
.row .v { color: #22242a; font-size: 14px; font-weight: 600; }
.chip { display: inline-block; background: #22242a; color: #4ECDC4; padding: 3px 10px; border-radius: 3px; font-weight: 700; font-size: 12px; }
.chip.grey { background: #efefef; color: #555; font-weight: 600; }
.dlink-row { display: flex; gap: 8px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
.dlink-row input { flex: 1; min-width: 260px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; color: #333; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #e5e5e5; margin-top: 14px; max-width: 860px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #ddd; border-top-color: #4ECDC4; border-radius: 50%; animation: dlspin .8s linear infinite; vertical-align: middle; }
@keyframes dlspin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header"><i class="fa fa-link"></i> <span data-i18n="dl.title">Direct link</span><span id="localeSwitcher" class="loc"></span></div>

<div class="toolbar">
  <a class="btn-ghost" id="againLink" href="#"><i class="fa fa-redo"></i> <span data-i18n="dl.again">Resolve again</span></a>
</div>

<div class="msg" id="msg"></div>

<div class="card" id="resultCard" style="display:none;">
  <div class="card-title"><i class="fa fa-bullseye"></i> <span data-i18n="dl.resolved">Resolved item</span></div>
  <div class="card-body">
    <div class="row"><span class="k" data-i18n="dl.project">Test project</span><span class="v"><span class="chip" id="rProject"></span></span></div>
    <div class="row"><span class="k" data-i18n="dl.reqId">Requirement</span><span class="v"><span class="chip" id="rReqId"></span></span></div>
    <div class="row"><span class="k" data-i18n="dl.titleLbl">Title</span><span class="v" id="rTitle"></span></div>
    <div class="row"><span class="k" data-i18n="dl.version">Version</span><span class="v" id="rVersion"></span></div>
    <div class="row"><span class="k" data-i18n="dl.revision">Revision</span><span class="v" id="rRevision"></span></div>
    <div class="dlink-row">
      <a class="btn-teal" id="openBtn" href="#" target="_blank"><i class="fa fa-external-link-alt"></i> <span data-i18n="dl.open">Open viewer</span></a>
      <input type="text" id="linkInput" readonly value="">
      <button class="btn-ghost" id="copyBtn"><i class="fa fa-copy"></i> <span data-i18n="dl.copy">Copy</span></button>
    </div>
  </div>
</div>

<div class="footer"><span data-i18n="footers.directLink">TestLink 2.0.1 - Direct link</span></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
var API = '/api/directlink/index.php';

$(function () {
  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    resolve();
  });
});

function showMsg(kind, text) {
  var m = $('#msg');
  m.removeClass('ok err info').addClass(kind);
  m.text(text);
}

function showErr(text) {
  showMsg('err', text);
  $('#resultCard').hide();
}

function resolve() {
  var q = new URLSearchParams(location.search);
  var params = {
    action: 'resolve',
    tprojectPrefix: q.get('tprojectPrefix') || q.get('prefix') || '',
    tproject_id: q.get('tproject_id') || '',
    item: q.get('item') || 'req',
    id: q.get('id') || q.get('doc_id') || '',
    version: q.get('version') || ''
  };
  var anchor = q.get('anchor') || '';

  if ((!params.tprojectPrefix && !params.tproject_id) || !params.id) {
    showErr(TLi18n.t('dl.errParams'));
    return;
  }

  $('#againLink').attr('href', location.pathname + location.search);
  showMsg('info', TLi18n.t('dl.loading'));
  $('#resultCard').hide();

  $.ajax({
    url: API + '?' + $.param(params),
    method: 'GET',
    headers: { 'X-Requested-With': 'XMLHttpRequest' },
    success: function (r) {
      $('#msg').hide();
      if (!r || r.status !== 'ok') { showErr((r && r.message) || TLi18n.t('dl.errLoad')); return; }
      document.title = TLi18n.t('dl.title');
      $('#rProject').text(r.tproject_name + ' (' + r.tproject_prefix + ')');
      $('#rReqId').text(r.req_doc_id);
      $('#rTitle').text(r.title || '&mdash;');
      $('#rVersion').text(r.version);
      $('#rRevision').text(r.revision);
      var href = r.href + (anchor ? '#' + encodeURIComponent(anchor) : '');
      $('#openBtn').attr('href', href);
      $('#linkInput').val(location.origin + href);
      $('#resultCard').show();
    },
    error: function (xhr) {
      if (xhr && xhr.status === 401) {
        // Mirrors legacy linkto.php: the user must be logged in first.
        window.location = '/index.php';
        return;
      }
      var msg = TLi18n.t('dl.errLoad');
      switch (xhr && xhr.status) {
        case 403: msg = TLi18n.t('dl.errForbidden'); break;
        case 404: msg = TLi18n.t('dl.errNotFound'); break;
        case 405: msg = TLi18n.t('dl.errMethod'); break;
        case 400: msg = TLi18n.t('dl.errParams'); break;
        case 500: msg = TLi18n.t('dl.errServer'); break;
      }
      try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
      showErr(msg);
    }
  });
}

$('#copyBtn').on('click', function () {
  var inp = $('#linkInput')[0];
  if (!inp) return;
  inp.select();
  try { document.execCommand('copy'); } catch (e) {}
  showMsg('ok', TLi18n.t('dl.copied'));
});
</script>
</body>
</html>
