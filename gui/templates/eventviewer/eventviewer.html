<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Viewer</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/rowgroup/1.4.1/css/rowGroup.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }

.header {
  background: #4ECDC4; color: #fff; padding: 14px 24px;
  font-size: 20px; font-weight: 700; letter-spacing: 1px;
}
.header span { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }

.filters {
  background: #22242a; padding: 16px 24px; display: flex; gap: 16px;
  align-items: flex-end; flex-wrap: wrap;
}

.access-denied {
  background: #fff; border: 1px solid #f0d0d0; border-left: 4px solid #e6605e;
  border-radius: 8px; margin: 24px; padding: 28px 32px; text-align: center;
}
.access-denied i { font-size: 34px; color: #e6605e; margin-bottom: 10px; }
.access-denied h3 { margin: 0 0 8px; font-size: 18px; color: #22242a; }
.access-denied p { margin: 0; font-size: 14px; color: #777; }
.filter-group label { color: #ccc; font-size: 12px; display: block; margin-bottom: 4px; }
.filter-group select, .filter-group input {
  background: #333; color: #fff; border: 1px solid #555;
  border-radius: 4px; padding: 6px 10px; font-size: 13px;
}
.filter-group select { min-width: 160px; }
.filter-group input[type="text"] { width: 140px; }

.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px;
  border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-red { background: #e6605e; color: #fff; border: none; padding: 7px 18px;
  border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-red:hover { background: #d04e4c; }

.charts-row { display: flex; gap: 20px; padding: 20px 24px; flex-wrap: wrap; }
.chart-box {
  background: #fff; border-radius: 8px; padding: 20px; flex: 1; min-width: 300px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.chart-box h3 { margin: 0 0 14px; font-size: 15px; color: #22242a; }
.chart-canvas-wrap { position: relative; max-height: 260px; }

.table-wrap { padding: 0 24px 24px; }
.table-wrap table { background: #fff; border-radius: 8px; overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,.08); width: 100%; }
table.dataTable thead th { background: #22242a; color: #fff; font-size: 13px; padding: 10px 14px; }
table.dataTable tbody td { padding: 10px 14px; font-size: 13px; }

.level-badge {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-size: 11px; font-weight: 700; color: #fff; text-transform: uppercase;
}
.level-AUDIT { background: #4ECDC4; }
.level-ERROR { background: #e6605e; }
.level-WARNING { background: #f0ad4e; color: #333; }
.level-INFO { background: #3498db; }
.level-DEBUG { background: #8f8f8f; }
.level-L18N { background: #9b59b6; }

tr.shown { background: #f9fffe !important; }
.detail-row { background: #f7fffe; }
.detail-row td { padding: 0 !important; }
.detail-content {
  padding: 14px 24px; border-top: 2px solid #4ECDC4;
}
.detail-content table th { color: #555; font-weight: 600; width: 140px; font-size: 12px; }
.detail-content table td { color: #333; font-size: 13px; }

.ev-toolbar {
  background: #fff; border-bottom: 1px solid #eee; padding: 10px 24px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.ev-toolbar .tbtn {
  display: inline-flex; align-items: center; gap: 6px;
  background: #22242a; color: #fff; border: none; border-radius: 4px;
  padding: 7px 12px; font-size: 12px; cursor: pointer;
}
.ev-toolbar .tbtn:hover { background: #33363f; }
.ev-toolbar .tbtn i { color: #4ECDC4; }
.ev-toolbar .ev-tbtn-label { color: #aaa; font-size: 12px; margin-left: auto; }

.no-events-feedback {
  background: #fff; border: 1px solid #d2e6e3; border-left: 4px solid #4ECDC4;
  border-radius: 8px; margin: 24px; padding: 28px 32px; text-align: center;
  color: #2b6f69; font-size: 15px;
}
.no-events-feedback i { font-size: 26px; color: #4ECDC4; margin-right: 8px; vertical-align: middle; }

table.dataTable tr.dtrg-group td {
  background: #e9f5f3; font-weight: 700; color: #2b6f69; cursor: pointer;
  padding: 8px 14px; border-bottom: 1px solid #d2e6e3;
}
table.dataTable tr.dtrg-group td i { margin-right: 8px; color: #4ECDC4; }
table.dataTable tr.dtrg-group td:hover { background: #dcefec; }
table.dataTable tr.dtrg-group td .gcount { font-weight: 400; color: #6aa; font-size: 11px; margin-left: 5px; }

.footer {
  padding: 12px 24px; color: #888; font-size: 12px;
  border-top: 1px solid #ddd; background: #fff;
}

td.details-control span {
  cursor: pointer; text-align: center; color: #4ECDC4; font-weight: 700; font-size: 14px;
}
td.details-control span:hover { color: #2d8e88; }
td.details-control span i { transition: transform 0.2s ease; display: inline-block; }
td.details-control span.shown i { transform: rotate(90deg); }

td.desc-expand { cursor: pointer; }
td.desc-expand:hover { background: #f9fffe !important; }
.dataTables_wrapper .dataTables_paginate .paginate_button.current {
  background: #4ECDC4 !important; color: #fff !important; border: none !important;
}
</style>
</head>
<body>

<div class="header"><span data-i18n="header.eventViewer">Event Viewer</span> <span data-i18n="header.eventViewerSub">real-time log monitoring</span><div id="localeSwitcher" style="float:right;"></div></div>

<div class="filters" id="filtersBar">
  <div class="filter-group">
    <label data-i18n="ev.logLevels">Log Levels</label>
    <select id="filterLevel" multiple size="4"></select>
  </div>
  <div class="filter-group">
    <label data-i18n="ev.selectUsers">Select user(s)</label>
    <select id="filterUser" multiple size="4"></select>
  </div>
  <div class="filter-group">
    <label data-i18n="ev.from">From</label>
    <input type="text" id="filterStart" placeholder="dd/mm/yyyy">
  </div>
  <div class="filter-group">
    <label data-i18n="ev.to">To</label>
    <input type="text" id="filterEnd" placeholder="dd/mm/yyyy">
  </div>
  <div class="filter-group" id="objectFilterGroup" style="display:none;align-items:center;justify-content:center;background:#eef7f6;border:1px solid #cfe8e5;border-radius:6px;padding:4px 10px;">
    <span id="objectFilterLabel" style="font-size:12px;color:#0e7a6e;font-weight:600;"></span>
  </div>
  <div class="filter-group" style="display:flex;gap:8px;">
    <button class="btn-teal" onclick="applyFilters()" data-i18n="ev.apply">Apply</button>
    <button class="btn-red" id="btnClear" onclick="clearEvents()" style="display:none" data-i18n="ev.clearEvents">Clear Events</button>
  </div>
</div>

<div class="access-denied" id="accessDenied" style="display:none;">
  <i class="fa fa-lock"></i>
  <h3 data-i18n="ev.accessDeniedTitle">Access Denied</h3>
  <p data-i18n="ev.accessDeniedMsg">You do not have permission to view the event log.</p>
</div>

<div class="charts-row">
  <div class="chart-box">
    <h3 data-i18n="ev.eventsByLevel">Events by Level</h3>
    <div style="display:flex;align-items:center;gap:20px;">
      <div><canvas id="pieChart" width="240" height="240"></canvas></div>
      <div id="pieLegend" style="font-size:13px;line-height:2;"></div>
    </div>
  </div>
  <div class="chart-box">
    <h3 data-i18n="ev.eventsPerDay">Events per Day (last 30 days)</h3>
    <div class="chart-canvas-wrap"><canvas id="lineChart" width="700" height="260"></canvas></div>
  </div>
</div>

<div class="ev-toolbar" id="evToolbar">
  <button type="button" class="tbtn" id="btnExpandAll"><i class="fa fa-plus-square"></i> <span data-i18n="ev.expandAll">Expand all groups</span></button>
  <button type="button" class="tbtn" id="btnCollapseAll"><i class="fa fa-minus-square"></i> <span data-i18n="ev.collapseAll">Collapse all groups</span></button>
  <button type="button" class="tbtn" id="btnShowCols"><i class="fa fa-columns"></i> <span data-i18n="ev.showAllColumns">Show all columns</span></button>
  <span class="ev-tbtn-label" id="evGroupBadge"></span>
</div>

<div class="no-events-feedback" id="noEventsBox" style="display:none;">
  <i class="fa fa-info-circle"></i><span data-i18n="ev.noEvents">No events found.</span>
</div>

<div class="table-wrap">
  <table id="eventsTable" class="display" style="width:100%">
    <thead>
      <tr>
        <th style="width:30px"></th>
        <th data-i18n="ev.timestamp">Timestamp</th>
        <th data-i18n="ev.level">Level</th>
        <th data-i18n="ev.user">User</th>
        <th data-i18n="ev.description">Description</th>
        <th data-i18n="ev.transaction" class="ev-txn-col">Transaction</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div class="footer" id="footerText"></div>
<div class="footer"><span data-i18n="footers.eventviewer">TestLink 2.0.1 - Event Viewer</span></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap.min.js"></script>
<script src="https://cdn.datatables.net/rowgroup/1.4.1/js/dataTables.rowGroup.min.js"></script>
<script src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
<script src="/gui/templates/dashio/lib/chart-master/Chart.js"></script>
<script src="/gui/templates/dashio/lib/tl-pie-tooltip.js"></script>
<script src="/gui/templates/dashio/lib/tl-line-tooltip.js"></script>
<script>
function esc(s) {
  return s == null ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
var API = '/api/eventviewer/index.php';
var qs = new URLSearchParams(window.location.search);
var tproject_id = qs.get('tproject_id') || '';
var tplan_id = qs.get('tplan_id') || '';
var objectId = qs.get('objectId') || qs.get('object_id') || '';
var objectType = qs.get('objectType') || qs.get('object_type') || '';
var LEVEL_COLORS = {
  AUDIT: '#4ECDC4', ERROR: '#e6605e', WARNING: '#f0ad4e',
  INFO: '#3498db', DEBUG: '#8f8f8f', L18N: '#9b59b6'
};
var table = null;
var pieChart = null;
var lineChart = null;
var pieCanvasSize = null;
var lineCanvasSize = null;
var collapsedGroups = {};

$(function() {
  var pieEl = $('#pieChart'), lineEl = $('#lineChart');
  pieCanvasSize = { w: parseInt(pieEl.attr('width'), 10), h: parseInt(pieEl.attr('height'), 10) };
  lineCanvasSize = { w: parseInt(lineEl.attr('width'), 10), h: parseInt(lineEl.attr('height'), 10) };
  TLi18n.load(function() {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    if (objectId || objectType) {
      $('#objectFilterGroup').css('display', 'flex');
      $('#objectFilterLabel').text(
        TLi18n.t('ev.filteredByObject', {
          type: String(objectType).replace(/[^a-zA-Z0-9_]/g, ''),
          id: String(objectId).replace(/[^a-zA-Z0-9_]/g, '')
        })
      );
    }
    loadMeta();
  });
});

function showAccessDenied() {
  $('#filtersBar').hide();
  $('.charts-row').hide();
  $('.table-wrap').hide();
  $('#footerText').hide();
  $('#accessDenied').show();
}

function loadMeta() {
  $.getJSON(API + '/events/meta/rights')
    .done(function(r) {
      if (r.canDelete) $('#btnClear').show();
      loadFilterOptions();
      loadEvents();
    })
    .fail(function() {
      showAccessDenied();
    });

  $('input[id^="filter"]').each(function() {
    $(this).daterangepicker({
      autoUpdateInput: false,
      locale: { cancelLabel: TLi18n.t('common.cancel'), format: 'DD/MM/YYYY' }
    });
    $(this).on('apply.daterangepicker', function(ev, picker) {
      $(this).val(picker.startDate.format('DD/MM/YYYY') + ' - ' + picker.endDate.format('DD/MM/YYYY'));
    });
    $(this).on('cancel.daterangepicker', function() { $(this).val(''); });
  });
}

function loadFilterOptions() {
  $.getJSON(API + '/events/meta/logLevels', function(r) {
    var sel = $('#filterLevel');
    $.each(r.items, function(code, name) {
      sel.append('<option value="' + code + '" selected>' + name + '</option>');
    });
  });
  $.getJSON(API + '/events/meta/users', function(r) {
    var sel = $('#filterUser');
    $.each(r.items, function(i, u) {
      sel.append('<option value="' + u.id + '">' + u.displayName + '</option>');
    });
  });
}

function buildQuery() {
  var p = [];
  if (tproject_id) p.push('tproject_id=' + tproject_id);
  if (tplan_id) p.push('tplan_id=' + tplan_id);
  if (objectId) p.push('objectId=' + encodeURIComponent(objectId));
  if (objectType) p.push('objectType=' + encodeURIComponent(objectType));
  var levels = $('#filterLevel').val();
  if (levels && levels.length) p.push('logLevel=' + levels.join(','));
  var user = $('#filterUser').val();
  if (user && user.length) p.push('user=' + user.join(','));
  var start = $('#filterStart').val();
  if (start) p.push('startDate=' + encodeURIComponent(start.split(' - ')[0]));
  var end = $('#filterEnd').val();
  if (end) p.push('endDate=' + encodeURIComponent(end.split(' - ').pop()));
  return p.length ? '?' + p.join('&') : '';
}

function loadEvents() {
  var q = buildQuery();
  $.getJSON(API + '/events' + q, function(r) {
    renderTable(r.items);
    var empty = !r.items || !r.items.length;
    // Legacy no_events parity (eventviewer.tpl:184-198): when the filter set
    // matches zero events the table + toolbar are replaced by a localized
    // "no events" feedback box instead of an English DataTables empty grid.
    $('#noEventsBox').toggle(empty);
    $('#evToolbar').toggle(!empty);
    $('.table-wrap').toggle(!empty);
    $('#footerText').text(TLi18n.t('ev.eventsCount', {n: r.total}) + ' | ' + TLi18n.t('common.generatedOn') + ' ' + new Date().toLocaleString());
  });
  $.getJSON(API + '/events/stats/byLevel' + q, function(r) { renderPie(r.items); });
  $.getJSON(API + '/events/stats/perDay' + q, function(r) { renderLine(r.labels, r.data); });
}

function renderTable(items) {
  if (table) { table.destroy(); $('#eventsTable tbody').empty(); }
  var rows = [];
  $.each(items, function(i, ev) {
    rows.push([
      ev.id,
      ev.timestampFormatted,
      ev.logLevel,
      esc(ev.userDisplayName || ev.userID || '-'),
      esc(ev.description || ''),
      ev.transactionID ? '#' + esc(ev.transactionID) : '-'
    ]);
  });

  // Collapsed group state lives on the module-global `collapsedGroups` object.
  // The rowGroup startRender closure reads it directly on every draw, so group
  // clicks and the expand/collapse-all toolbar buttons take effect on redraw
  // (legacy expand/collapse parity, same pattern as tplanWithCF.html).

  table = $('#eventsTable').DataTable({
    data: rows,
    // Legacy ExtGrouping parity: group rows are contiguous by Log Level, and
    // within each group rows are ordered by timestamp DESC. Because DataTables
    // rowGroup only groups *consecutive* equal values, the primary sort must be
    // the level column (dataSrc 2) with the timestamp as the secondary key.
    order: [[2, 'asc'], [1, 'desc']],
    pageLength: 25,
    columns: [
      { orderable: false, searchable: false, render: function(data) { return '<span class="details-control" data-id="' + data + '"><i class="fa fa-chevron-right"></i></span>'; } },
      { type: 'string' },
      { orderable: true, render: function(data, type) {
          if (type === 'display') { return '<span class="level-badge level-' + data + '">' + data + '</span>'; }
          return data;
        } },
      { orderable: true },
      { orderable: false, className: 'desc-expand' },
      { visible: false }
    ],
    rowGroup: {
      dataSrc: 2,
      startRender: function (rows, group) {
        var isCollapsed = !!collapsedGroups[group];
        rows.nodes().each(function (r) { r.style.display = isCollapsed ? 'none' : ''; });
        var n = rows.count();
        var suffix = n === 1 ? TLi18n.t('ev.item') : TLi18n.t('ev.items');
        return $('<tr/>').attr('data-key', encodeURIComponent(group))
          .append($('<td/>').append(
            $('<i/>').addClass('fa ' + (isCollapsed ? 'fa-chevron-right' : 'fa-chevron-down')),
            ' ' + group + '<span class="gcount">(' + n + ' ' + suffix + ')</span>'
          ));
      }
    },
    language: {
      search: TLi18n.t('common.filter') + ':',
      lengthMenu: TLi18n.t('common.showEntries') + ' _MENU_ ' + TLi18n.t('common.entries'),
      info: TLi18n.t('common.pageInfo'),
      paginate: { previous: TLi18n.t('common.prev'), next: TLi18n.t('common.next') },
      emptyTable: TLi18n.t('ev.noEvents'),
      infoEmpty: TLi18n.t('ev.noEvents'),
      zeroRecords: TLi18n.t('ev.noEvents')
    }
  });

  $('#evGroupBadge').text(TLi18n.t('ev.groupedByLevel'));

  $(table.table().container()).off('click.dtrg').on('click.dtrg', 'tr.dtrg-group', function () {
    var key = decodeURIComponent($(this).attr('data-key') || '');
    collapsedGroups[key] = !collapsedGroups[key];
    table.draw(false);
  });

  $('#btnExpandAll').off('click').on('click', function () {
    collapsedGroups = {};
    table.draw(false);
  });

  $('#btnCollapseAll').off('click').on('click', function () {
    items.forEach(function (ev) { collapsedGroups[ev.logLevel] = true; });
    table.draw(false);
  });

  $('#btnShowCols').off('click').on('click', function () {
    // Legacy toolbarShowAllColumnsButton parity: toggle the hidden Transaction
    // column so the transaction id is visible per row (not only in the expand
    // detail or in the chart). DataTables' column().visible() manages both the
    // column cells and the header visibility, so no manual th styling needed.
    table.column(5).visible(!table.column(5).visible());
    table.draw(false);
  });
}

function toggleRow(tr) {
  var row = table.row(tr);
  var icon = tr.find('span.details-control');
  if (row.child.isShown()) {
    row.child.hide();
    tr.removeClass('shown');
    icon.removeClass('shown');
  } else {
    var id = icon.data('id');
    icon.addClass('shown');
    $.getJSON(API + '/events/' + id, function(d) {
      var e = d.item;
      // Legacy eventinfo.tpl parity: full event record with a "Session
      // information" section (User + real PHP session id) when the event has a
      // transaction, and an "Activity" section when objectID is set.
      var html = '<div class="detail-content"><table>';
      html += '<tr><th>' + TLi18n.t('ev.level') + '</th><td>' + esc(e.logLevel) + '</td></tr>';
      html += '<tr><th>' + TLi18n.t('ev.timestamp') + '</th><td>' + esc(e.timestampFormatted) + '</td></tr>';
      html += '<tr><th>' + TLi18n.t('ev.source') + '</th><td>' + esc(e.source) + '</td></tr>';
      html += '<tr><th>' + TLi18n.t('ev.description') + '</th><td>' + esc(e.description) + '</td></tr>';
      if (e.transactionID) {
        html += '<tr><th colspan="2">' + TLi18n.t('ev.sessionInfo') + '</th></tr>';
        html += '<tr><th>' + TLi18n.t('ev.user') + '</th><td>' + esc(e.userDisplayName || e.userName || e.userID) + '</td></tr>';
        html += '<tr><th>' + TLi18n.t('ev.sessionId') + '</th><td>' + esc(e.sessionID) + '</td></tr>';
        html += '<tr><th>' + TLi18n.t('ev.transaction') + '</th><td>#' + esc(e.transactionID) + '</td></tr>';
      }
      if (e.objectID) {
        html += '<tr><th colspan="2">' + TLi18n.t('ev.activity') + '</th></tr>';
        html += '<tr><th>' + TLi18n.t('ev.activityCode') + '</th><td>' + esc(e.activityCode) + '</td></tr>';
        html += '<tr><th>' + TLi18n.t('ev.objectId') + '</th><td>' + esc(e.objectID) + '</td></tr>';
        html += '<tr><th>' + TLi18n.t('ev.objectType') + '</th><td>' + esc(e.objectType) + '</td></tr>';
      }
      html += '</table></div>';
      row.child(html, 'detail-row').show();
      tr.addClass('shown');
    });
  }
}

$('#eventsTable tbody').on('click', 'span.details-control, td.desc-expand', function() {
  var tr = $(this).closest('tr');
  toggleRow(tr);
});

function renderPie(items) {
  var data = [], total = 0;
  $.each(items, function(name, count) { total += count; });
  $.each(items, function(name, count) {
    data.push({value: count, color: LEVEL_COLORS[name] || '#ccc', label: name});
  });
  if (pieChart) { pieChart = null; }
  var pieCanvas = document.getElementById('pieChart');
  if (pieCanvasSize) { pieCanvas.width = pieCanvasSize.w; pieCanvas.height = pieCanvasSize.h; }
  pieChart = new Chart(pieCanvas.getContext('2d'))
    .Doughnut(data, {segmentStrokeWidth: 1, percentageInnerCutout: 45, animationEasing: "easeOutQuart"});
  TLPieTooltip.attach(pieCanvas, data, {percentageInnerCutout: 45});
  var html = '';
  $.each(items, function(name, count) {
    var pct = total > 0 ? Math.round(count / total * 100) : 0;
    html += '<div><span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:' + (LEVEL_COLORS[name]||'#ccc') + ';margin-right:6px;vertical-align:middle;"></span>';
    html += '<span style="vertical-align:middle;">' + name + ': <b>' + count + '</b> (' + pct + '%)</span></div>';
  });
  $('#pieLegend').html(html);
}

function renderLine(labels, data) {
  if (lineChart) { lineChart = null; }
  var lineEl = document.getElementById('lineChart');
  if (lineCanvasSize) { lineEl.width = lineCanvasSize.w; lineEl.height = lineCanvasSize.h; }
  lineChart = new Chart(lineEl.getContext('2d')).Line({
    labels: labels,
    datasets: [{
      fillColor: 'rgba(78,205,196,0.2)',
      strokeColor: '#4ECDC4',
      pointColor: '#4ECDC4',
      pointStrokeColor: '#fff',
      data: data
    }]
  }, {scaleBeginAtZero: true, bezierCurve: true, datasetFill: true});
  TLLineTooltip.attach(document.getElementById('lineChart'), labels, data, {color: '#4ECDC4'});
}

function applyFilters() { loadEvents(); }

function clearEvents() {
  if (!confirm(TLi18n.t('ev.confirmDelete'))) return;
  var levels = $('#filterLevel').val();
  var body = levels && levels.length ? JSON.stringify({logLevel: levels.map(Number)}) : '{}';
  $.ajax({
    url: API + '/events', type: 'DELETE',
    contentType: 'application/json', data: body,
    success: function() {
      // Legacy BUGID 3908 parity: reset every filter after a successful clear
      // so the full event log is shown again with no stale filter applied.
      $('#filterLevel').val([]);
      $('#filterUser').val([]);
      $('#filterStart').val('');
      $('#filterEnd').val('');
      loadEvents();
    }
  });
}
</script>
</body>
</html>
