<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="hlp.title">TestLink Help</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{background:#f2f2f2;font-family:'Ruda',sans-serif;margin:0;padding:0}
.header{background:#4ECDC4;color:#fff;padding:14px 24px;font-size:20px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header .fa-circle-question{font-size:22px}
.header .sub{font-size:13px;font-weight:400;opacity:.85;margin-left:10px}
#localeSwitcher{margin-left:auto}
.toolbar{background:#22242a;padding:12px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn-teal{background:#4ECDC4;color:#fff;border:none;padding:7px 18px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn-teal:hover{background:#3dbdb5;color:#fff}
.btn-ghost{background:#2e3038;color:#fff;border:none;padding:7px 18px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn-ghost:hover{background:#3d4049;color:#fff}
.layout{display:flex;gap:0;align-items:flex-start;margin:14px 24px 0}
.side{width:260px;flex:0 0 260px;background:#fff;border-radius:8px 0 0 8px;border:1px solid #eee;border-right:none;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.side .side-hd{padding:11px 16px;border-bottom:1px solid #eee;font-size:13px;font-weight:700;color:#22242a;display:flex;align-items:center;gap:8px}
.side .side-hd i{color:#4ECDC4}
.side .topic{padding:9px 16px;cursor:pointer;font-size:13px;color:#333;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;gap:8px;text-align:left;width:100%;background:transparent;border-left:3px solid transparent}
.side .topic:hover{background:#f0fffe}
.side .topic.active{background:#e6fbf9;border-left-color:#4ECDC4;font-weight:700;color:#1d8a83}
.side .topic i{color:#4ECDC4;width:14px;text-align:center}
.help{flex:1;min-width:0;background:#fff;border-radius:0 8px 8px 0;border:1px solid #eee;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.help .card-hd{padding:12px 18px;border-bottom:1px solid #eee;font-size:14px;font-weight:700;color:#22242a;display:flex;align-items:center;gap:8px}
.help .card-hd i{color:#4ECDC4}
.help .card-bd{padding:18px;overflow-x:auto}
.help-body{font-size:13.5px;line-height:1.65;color:#333}
.help-body h2{font-size:15px;color:#1d8a83;margin:16px 0 6px}
.help-body h1{font-size:17px;color:#1d8a83;margin:14px 0 6px}
.help-body h3,.help-body h4{font-size:14px;color:#22242a;margin:12px 0 6px}
.help-body ul,.help-body ol{padding-left:22px;margin:6px 0}
.help-body p{margin:6px 0}
.help-body a{color:#2d8e88}
.help-body table{border-collapse:collapse;margin:8px 0}
.help-body table td,.help-body table th{border:1px solid #ddd;padding:5px 9px;font-size:12.5px}
.warnbar{background:#fff3cd;border:1px solid #f0d68a;color:#856404;border-radius:6px;padding:10px 16px;margin:14px 24px 0;font-size:13px;display:none}
.errobbar{background:#fdeceb;border:1px solid #f5c6c2;color:#c0392b;border-radius:6px;padding:10px 16px;margin:14px 24px 0;font-size:13px;display:none}
.footer{padding:12px 24px;color:#888;font-size:12px;border-top:1px solid #ddd;background:#fff;margin-top:18px}
</style>
</head>
<body>

<div class="header">
  <i class="fa-solid fa-circle-question"></i>
  <span data-i18n="hlp.title">TestLink Help</span>
  <span class="sub" data-i18n="hlp.headerSub">Context help topics</span>
  <span id="localeSwitcher"></span>
</div>

<div class="toolbar">
  <button class="btn-teal" id="refreshBtn"><i class="fa fa-refresh"></i> <span data-i18n="common.refresh">Refresh</span></button>
  <button class="btn-ghost" id="closeBtn"><i class="fa fa-times"></i> <span data-i18n="common.close">Close</span></button>
</div>

<div id="warnBar" class="warnbar"></div>
<div id="errBar" class="errobbar"></div>

<div class="layout" id="layout" style="display:none;">
  <div class="side">
    <div class="side-hd"><i class="fa fa-list"></i> <span data-i18n="hlp.topics">Topics</span></div>
    <div id="topicList"></div>
  </div>
  <div class="help">
    <div class="card-hd"><i class="fa fa-circle-info"></i> <span id="cardTitle">-</span></div>
    <div class="card-bd" id="cardBody"></div>
  </div>
</div>

<div class="footer" id="footerText"><span data-i18n="footers.showHelp">TestLink 2.0.1 - Help</span></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/help/index.php';
var CUR_KEY = '';

$(function () {
  var p = new URLSearchParams(window.location.search);
  CUR_KEY = p.get('help') || '';

  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    loadIndex();
  });

  $('#refreshBtn').on('click', function () {
    loadIndex();
  });
  $('#closeBtn').on('click', function () {
    window.close();
    if (window.self !== window.top) { window.top.location.href = '/index.php'; }
    else { window.history.length > 1 ? history.back() : (window.location.href = '/index.php'); }
  });
});

function loadIndex() {
  $('#warnBar').hide();
  $('#errBar').hide();
  $('#layout').hide();
  $.getJSON(API, { action: 'index', locale: TLi18n.getLocale() })
    .done(function (r) {
      if (!r || r.status !== 'ok' || !Array.isArray(r.items)) {
        showError((r && r.message) || TLi18n.t('hlp.loadError'));
        return;
      }
      renderIndex(r.items);
    })
    .fail(function (xhr) { handleFail(xhr); });
}

function renderIndex(items) {
  var $list = $('#topicList').empty();
  if (items.length === 0) {
    $('#layout').hide();
    $('#warnBar').css('display', 'block').text(TLi18n.t('hlp.noTopics'));
    return;
  }
  items.forEach(function (it) {
    $('<button class="topic" data-key="' + esc(it.key) + '">' +
      '<i class="fa fa-file-lines"></i><span>' + esc(it.title || it.key) + '</span></button>')
      .on('click', function () { CUR_KEY = it.key; loadTopic(CUR_KEY); })
      .appendTo($list);
  });
  $('#cardTitle').text(items[0].title || items[0].key);
  $('#layout').css('display', 'flex');
  updateFooter(TLi18n.t('hlp.topics'));
  if (CUR_KEY) {
    loadTopic(CUR_KEY);
  } else {
    $('#cardBody').html('<p style="color:#888;font-size:13px">' +
      esc(TLi18n.t('hlp.chooseTopic')) + '</p>');
  }
}

function loadTopic(key) {
  $('#warnBar').hide();
  $('#errBar').hide();
  $('#layout').hide();
  $.getJSON(API, { action: 'show', help: key, locale: TLi18n.getLocale() })
    .done(function (r) {
      if (!r || r.status !== 'ok') {
        showError((r && r.message) || TLi18n.t('hlp.loadError'));
        return;
      }
      renderTopic(r);
    })
    .fail(function (xhr) { handleFail(xhr); });
}

function renderTopic(r) {
  $('#cardTitle').text(r.title || r.key);
  $('#cardBody').html(r.content_html || '');
  $('.topic', '#topicList').removeClass('active');
  $('.topic[data-key="' + esc(r.key) + '"]', '#topicList').addClass('active');
  $('#layout').css('display', 'flex');
  if (r.notFound) {
    $('#warnBar').css('display', 'block')
      .text(TLi18n.t('hlp.notFound') + ' (' + r.locale + ') : ' + r.key);
  } else {
    $('#warnBar').hide();
  }
  updateFooter(r.key + ' | ' + r.locale);
}

function updateFooter(extra) {
  $('#footerText').text('TestLink 2.0.1 - ' + TLi18n.t('hlp.title') + ' | ' + extra);
}

function showError(msg) {
  $('#layout').hide();
  $('#errBar').css('display', 'block').text(msg);
}

function handleFail(xhr) {
  var msg = TLi18n.t('hlp.loadError');
  try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
  showError(msg);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
</script>
</body>
</html>
