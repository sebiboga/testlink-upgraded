<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requirements Monitor Overview</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/rowgroup/1.4.1/css/rowGroup.dataTables.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; color: #0d3f3c; opacity: 1; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 12px; align-items: center; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.table-wrap { padding: 20px 24px; }
.table-wrap table { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); width: 100%; }
table.dataTable thead th { background: #22242a; color: #fff; font-size: 13px; padding: 10px 14px; }
table.dataTable tbody td { padding: 10px 14px; font-size: 13px; }
.badge-on { background: #4ECDC4; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.badge-off { background: #999; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.action-btn { cursor: pointer; color: #4ECDC4; margin-right: 8px; font-size: 15px; border: none; background: none; padding: 0; }
.action-btn:hover { color: #2d8e88; }
.action-btn.on { color: #e6b34d; }
.action-btn.on:hover { color: #cf9a2e; }
.tbtn { background:#393e46; color:#fff; border:none; padding:6px 14px; border-radius:4px; cursor:pointer; font-size:12px; font-weight:600; }
.tbtn:hover { background:#50555f; }
.tbtn.active { background:#4ECDC4; color:#222; }
tr.dtrg-group { background:#22242a !important; color:#fff; font-weight:700; }
tr.dtrg-group td { padding:8px 14px !important; }
tr.dtrg-group .gcount { margin-left:8px; color:#4ECDC4; font-size:11px; }
tr.dtrg-group i { margin-right:6px; }
.title-link { color: #22242a; text-decoration: none; font-weight: 600; }
.title-link:hover { color: #3dbdb5; text-decoration: underline; }
.docid { color: #888; font-size: 11px; margin-right: 6px; }
.empty-state { padding: 40px; text-align: center; color: #888; font-size: 14px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.dataTables_wrapper .dataTables_paginate .paginate_button.current { background: #4ECDC4 !important; color: #fff !important; border: none !important; }
.dataTables_wrapper .dataTables_filter input { border: 1px solid #ddd; border-radius: 4px; padding: 4px 8px; }
.modal-content { border-radius: 8px; }
.modal-header { background: #22242a; color: #fff; border-radius: 8px 8px 0 0; }
.modal-header .close { color: #fff; opacity: .8; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; }
</style>
</head>
<body>

<div class="header"><span data-i18n="header.reqMonitorOverview">Requirements Monitor Overview</span> <span class="sub" data-i18n="header.reqMonitorOverviewSub">subscribe / unsubscribe to requirement change notifications</span><span id="localeSwitcher" style="float:right;"></span></div>

<div class="toolbar" id="gridToolbar">
  <button type="button" class="tbtn btn-teal" onclick="loadData()"><i class="fa fa-refresh"></i> <span data-i18n="rmo.refresh">Refresh</span></button>
  <button type="button" class="tbtn" id="btnGroupToggle"><i class="fa fa-chevron-down"></i> <span data-i18n="rmo.grid.expandCollapseGroups">Expand/Collapse Groups</span></button>
  <button type="button" class="tbtn" id="btnShowAllCols"><i class="fa fa-columns"></i> <span data-i18n="rmo.grid.showAllColumns">Show all Columns</span></button>
  <button type="button" class="tbtn" id="btnResetFilters"><i class="fa fa-filter"></i> <span data-i18n="rmo.resetFilters">Reset Filters</span></button>
  <button type="button" class="tbtn" id="btnResetState"><i class="fa fa-undo"></i> <span data-i18n="rmo.resetToDefaultState">Reset to Default State</span></button>
  <button type="button" class="tbtn" id="btnMultiSort"><i class="fa fa-sort-amount-down"></i> <span data-i18n="rmo.multiSort">MultiSort</span></button>
  <span style="flex:1"></span>
  <span id="projectInfo" style="color:#aaa;font-size:12px;"></span>
  <span id="gridToolbarInfo" style="color:#aaa;font-size:12px;margin-left:12px;"></span>
</div>

<div class="table-wrap">
  <div id="emptyState" class="empty-state" style="display:none;" data-i18n="rmo.noRequirements">This test project has no requirements.</div>
  <table id="rmoTable" class="display" style="width:100%">
    <thead>
      <tr>
        <th data-i18n="rmo.colSpecPath">Req. Spec</th>
        <th data-i18n="rmo.colTitle">Title</th>
        <th data-i18n="rmo.colCreatedOn">Created On</th>
        <th data-i18n="rmo.colMonitor">Monitor</th>
        <th style="width:110px" data-i18n="rmo.colAction">Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div class="footer" id="footerText"></div>
<div class="footer"><span data-i18n="footers.reqMonitorOverview">TestLink 2.0.1 - Requirements Monitor Overview</span></div>

<!-- Error Modal -->
<div class="modal fade" id="errModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="common.error">Error</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body"><p id="errModalText" style="font-size:13px;color:#c0392b;"></p></div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal" data-i18n="common.cancel">Cancel</button></div>
    </div>
  </div>
</div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.rowGroup.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/requirements/index.php';
var table = null;
var allItems = [];
var tprojectId = 0;
var collapsedGroups = Object.create(null);
var showGroupedCol = false;
var SPEC_COL_IDX = 0;
var reordering = false;

$(function() {
  var p = new URLSearchParams(window.location.search);
  tprojectId = parseInt(p.get('tproject_id') || p.get('tprojectId') || 0, 10);
  TLi18n.load(function() {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    loadData();
  });
  $('#btnGroupToggle').on('click', toggleGroups);
  $('#btnShowAllCols').on('click', function() {
    showGroupedCol = !showGroupedCol;
    applyGroupedColState();
  });
  $('#btnResetFilters').on('click', function() {
    if (table) {
      table.search('').columns().search('').draw();
      $('#gridToolbarInfo').text(TLi18n.t('rmo.resetFilters'));
    }
  });
  $('#btnResetState').on('click', function() {
    collapsedGroups = Object.create(null);
    showGroupedCol = false;
    if (table) {
      table.order([[SPEC_COL_IDX, 'asc']]).pageLength(25).draw(false);
    }
    applyGroupedColState();
    updateGroupToggleBtn();
    $('#gridToolbarInfo').text(TLi18n.t('rmo.resetToDefaultState'));
  });
  $('#btnMultiSort').on('click', function() {
    $('#gridToolbarInfo').text(TLi18n.t('rmo.multiSort') + ' (' + TLi18n.t('common.info') + ')');
  });
  $(document).on('click', '#rmoTable tbody tr.dtrg-group', function() {
    var key = decodeURIComponent($(this).attr('data-key') || '');
    if (isGroupCollapsed(key)) { delete collapsedGroups[key]; } else { collapsedGroups[key] = true; }
    updateGroupToggleBtn();
    if (table) table.draw(false);
  });
  $(document).on('order.dt', function(e, settings) { pinGroupOrder(settings); });
});

function showError(msg) {
  $('#errModalText').text(msg);
  $('#errModal').modal('show');
}

function updateFooter() {
  var monCount = allItems.filter(function(x) { return x.monitored; }).length;
  $('#footerText').text(
    TLi18n.t('rmo.itemsCount', {n: allItems.length, m: monCount}) +
    ' | ' + TLi18n.t('common.generatedOn') + ' ' + new Date().toLocaleString());
}

function loadData() {
  $('#emptyState').hide();

  $.getJSON(API + '/monitor-overview?tprojectId=' + tprojectId, function(r) {
    allItems = r.items || [];
    tprojectId = r.tproject_id || tprojectId;
    if (allItems.length === 0) {
      $('#rmoTable').hide();
      $('#emptyState').show();
    } else {
      $('#emptyState').hide();
      $('#rmoTable').show();
      renderTable(allItems);
    }
    $('#projectInfo').text(r.tproject_name || '');
    updateFooter();
  }).fail(function(xhr) {
    var msg = TLi18n.t('rmo.msg.errorLoad');
    try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e) {}
    showError(msg);
  });
}

function esc(s) {
  // also escape quotes: output is used inside double-quoted title="..." attrs
  return $('<div>').text(s == null ? '' : String(s)).html()
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// build one DataTables row object (used by initial render AND single-row toggle updates)
function buildRowObject(req) {
  var created = '';
  if (req.creation_ts && req.creation_ts.indexOf('0000') !== 0) {
    var d = new Date(String(req.creation_ts).replace(' ', 'T'));
    if (!isNaN(d.getTime())) {
      created = d.toLocaleString() + ' (' + esc(req.author) + ')';
    } else {
      created = esc(req.creation_ts) + ' (' + esc(req.author) + ')';
    }
  }

  // title cell: edit icon + doc-id + title, like legacy openLinkedReqVersionWindow
  var editLink = '<a href="javascript:void(0)" onclick="openReq(' + req.id + ',' + req.version_id + ')" title="' +
                 esc(TLi18n.t('rmo.editRequirement')) + '"><span class="action-btn"><i class="fa fa-pen-to-square"></i></span></a> ';
  var titleCell = '<span class="docid">' + esc(req.req_doc_id) + '</span>' + editLink +
                  '<a class="title-link" href="javascript:void(0)" onclick="openReq(' + req.id + ',' + req.version_id + ')">' +
                  esc(req.title) + '</a>';

  // monitor state badge
  var stateHtml = req.monitored
    ? '<span class="badge-on">' + TLi18n.t('common.yes') + '</span>'
    : '<span class="badge-off">' + TLi18n.t('common.no') + '</span>';

  // toggle button: monitored -> click turns OFF, else turns ON
  var toggleBtn = req.monitored
    ? '<button class="action-btn on" style="color:#e6b34d" onclick="setMonitor(' + req.id + ',\'off\')" title="' +
      esc(TLi18n.t('rmo.turnOff')) + '"><i class="fa fa-bell-slash"></i></button>'
    : '<button class="action-btn" onclick="setMonitor(' + req.id + ',\'on\')" title="' +
      esc(TLi18n.t('rmo.turnOn')) + '"><i class="fa fa-bell"></i></button>';

  return {
    reqId: req.id,
    specPath: esc(req.spec_path),
    title: titleCell,
    createdTs: String(req.creation_ts || ''),   // raw "YYYY-MM-DD HH:MM:SS" -> chronological sort key
    created: created,
    monitorState: stateHtml,
    action: toggleBtn
  };
}

function isGroupCollapsed(key) {
  return Object.prototype.hasOwnProperty.call(collapsedGroups, key);
}

function allGroupKeys() {
  var keys = Object.create(null);
  if (!table) return keys;
  var d = table.rows().data().toArray();
  $.each(d, function(i, r) { keys[r.specPath] = true; });
  return keys;
}

function pruneCollapsedGroups() {
  var keys = allGroupKeys();
  $.each(Object.keys(collapsedGroups), function(i, k) {
    if (!Object.prototype.hasOwnProperty.call(keys, k)) { delete collapsedGroups[k]; }
  });
}

function updateGroupToggleBtn() {
  $('#btnGroupToggle').toggleClass('active', anyGroupCollapsed());
}

function anyGroupCollapsed() {
  var keys = allGroupKeys();
  var any = false;
  $.each(Object.keys(keys), function(i, k) {
    if (Object.prototype.hasOwnProperty.call(collapsedGroups, k)) { any = true; return false; }
  });
  return any;
}

function applyGroupedColState() {
  if (!table) return;
  table.column(SPEC_COL_IDX).visible(showGroupedCol);
  var $btn = $('#btnShowAllCols').toggleClass('active', showGroupedCol);
  $btn.find('span').text(showGroupedCol
    ? TLi18n.t('rmo.grid.hideGroupedColumn')
    : TLi18n.t('rmo.grid.showAllColumns'));
}

function pinGroupOrder(settings) {
  if (!table || reordering) return;
  var cur = table.settings()[0];
  if (settings && cur && settings !== cur) return;
  var o = table.order();
  if (o.length && o[0][0] === SPEC_COL_IDX) return;
  reordering = true;
  setTimeout(function() {
    table.order([[SPEC_COL_IDX, 'asc']].concat(o)).draw(false);
    reordering = false;
  }, 0);
}

function toggleGroups() {
  if (anyGroupCollapsed()) {
    collapsedGroups = Object.create(null);
    if (table) table.draw(false);
    updateGroupToggleBtn();
    $('#gridToolbarInfo').text(TLi18n.t('rmo.grid.groupsExpanded'));
  } else {
    collapsedGroups = allGroupKeys();
    if (table) table.draw(false);
    updateGroupToggleBtn();
    $('#gridToolbarInfo').text(TLi18n.t('rmo.grid.groupsCollapsed'));
  }
}

function renderTable(items) {
  if (table) { table.destroy(); $('#rmoTable tbody').empty(); }
  var rows = $.map(items, function(req) { return [buildRowObject(req)]; });

  table = $('#rmoTable').DataTable({
    data: rows,
    rowId: 'reqId',
    columns: [
      {data: 'specPath', render: function(d) { return d; }},
      {data: 'title'},
      {
        data: 'created',
        render: function(d, type, row) { return type === 'display' ? d : row.createdTs; }
      },
      {data: 'monitorState'},
      {data: 'action'}
    ],
    columnDefs: [
      {orderable: false, targets: 4}
    ],
    order: [[0, 'asc']],
    pageLength: 25,
    rowGroup: {
      dataSrc: 'specPath',
      startRender: function(rows, group) {
        var isCollapsed = isGroupCollapsed(group);
        rows.nodes().each(function(r) { r.style.display = isCollapsed ? 'none' : ''; });
        var n = rows.count();
        var cnt = TLi18n.t(n === 1 ? 'rmo.grid.groupItem' : 'rmo.grid.groupItems', {count: n});
        var visibleCols = $('#rmoTable thead th').filter(function() { return $(this).css('display') !== 'none'; }).length;
        if (visibleCols === 0) visibleCols = 5;
        return $('<tr/>').attr('data-key', encodeURIComponent(group))
          .attr('colspan', visibleCols)
          .append($('<td/>').attr('colspan', visibleCols).append(
            $('<i/>').addClass('fa ' + (isCollapsed ? 'fa-chevron-right' : 'fa-chevron-down')),
            ' ' + group + '<span class="gcount">' + cnt + '</span>'
          ));
      }
    },
    language: {
      search: '', searchPlaceholder: TLi18n.t('common.search'),
      emptyTable: TLi18n.t('common.none'), zeroRecords: TLi18n.t('common.none')
    }
  });
  SPEC_COL_IDX = 0;
  showGroupedCol = false;
  applyGroupedColState();
  pruneCollapsedGroups();
  updateGroupToggleBtn();
}

function openReq(id, versionId) {
  window.open('/gui/templates/requirements/reqView.html?id=' + id +
              '&version_id=' + versionId + '&tproject_id=' + tprojectId,
              'reqView' + id, 'width=800,height=600,resizable=yes,scrollbars=yes');
}

function setMonitor(id, action) {
  $.ajax({
    url: API + '/monitor', type: 'POST',
    contentType: 'application/json',
    data: JSON.stringify({reqId: id, action: action, tprojectId: tprojectId}),
    success: function(r) {
      var updated = null;
      $.each(allItems, function(i, x) {
        if (x.id === id) { x.monitored = r.monitored; updated = x; }
      });
      updateFooter();
      // update only the toggled row, keep paging + filter state
      if (table && updated) {
        var row = table.row('#' + id);
        if (row.length) { row.data(buildRowObject(updated)); table.draw(false); }
        else { renderTable(allItems); }
      } else if (updated) {
        renderTable(allItems);
      }
    },
    error: function(xhr) {
      var msg = TLi18n.t('rmo.msg.errorToggle');
      try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e) {}
      showError(msg);
    }
  });
}
</script>
</body>
</html>
