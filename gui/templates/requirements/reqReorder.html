<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="reqro.title">Reorder Requirements</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/gui/templates/dashio/lib/font-awesome/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #22242a; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
.header span { font-size: 12px; font-weight: 400; color: #999; margin-left: 10px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid #2e3138; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-ghost { background: transparent; color: #ccc; border: 1px solid #555; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.btn-ghost:hover { border-color: #4ECDC4; color: #4ECDC4; }
.hint { color: #999; font-size: 12px; margin-left: auto; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.card-title { background: #f7f7f7; padding: 10px 18px; font-size: 13px; font-weight: 700; color: #22242a; border-bottom: 1px solid #e5e5e5; }
.reorder-list { list-style: none; margin: 0; padding: 8px 14px; min-height: 60px; }
.reorder-list li { display: flex; align-items: center; gap: 10px; padding: 10px 8px; margin: 4px 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 6px; cursor: grab; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.reorder-list li.dragging { opacity: .5; border-color: #4ECDC4; }
.reorder-list li .grip { color: #bbb; font-size: 14px; cursor: grab; }
.reorder-list li .ord { font-size: 11px; color: #999; width: 24px; text-align: center; font-weight: 700; }
.reorder-list li .rdid { font-weight: 700; color: #22242a; font-size: 12px; min-width: 90px; }
.reorder-list li .ttl { flex: 1; color: #555; font-size: 13px; }
.reorder-list li .rowmove { color: #888; font-size: 12px; border: 1px solid #ddd; border-radius: 4px; padding: 2px 8px; cursor: pointer; background: #fafafa; }
.reorder-list li .rowmove:hover { color: #4ECDC4; border-color: #4ECDC4; }
.msg { display: none; margin: 12px 24px 0; padding: 10px 16px; border-radius: 5px; font-size: 13px; }
.msg.ok { display: block; background: #e8f8f2; border: 1px solid #b8e6d3; color: #1d7a4f; }
.msg.err { display: block; background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #e5e5e5; margin-top: 14px; }
.id-chip { background: #22242a; color: #4ECDC4; padding: 3px 10px; border-radius: 3px; font-weight: 700; font-size: 12px; }
</style>
</head>
<body>

<div class="header"><i class="fa fa-list-ol"></i> <span data-i18n="reqro.title">Reorder Requirements</span></div>

<div class="toolbar">
  <button class="btn-teal" onclick="saveOrder()"><i class="fa fa-save"></i> <span data-i18n="common.save">Save</span></button>
  <button class="btn-ghost" onclick="window.close()"><i class="fa fa-times"></i> <span data-i18n="common.close">Close</span></button>
  <span class="hint"><i class="fa fa-grip-vertical"></i> <span data-i18n="reqro.hint">Drag to reorder</span></span>
</div>

<div class="msg" id="msg"></div>

<div class="card">
  <div class="card-title">
    <i class="fa fa-arrows-v"></i> <span data-i18n="reqro.reqsTitle">Requirements</span>
    <span id="specTitle" class="id-chip"></span>
  </div>
  <ul class="reorder-list" id="reqList"></ul>
  <div class="footer"><span data-i18n="reqro.footer">Drag requirements into the desired order. Your changes are saved to the requirement ordering.</span></div>
</div>

<script>
const q = new URLSearchParams(location.search);
const SPEC_ID = parseInt(q.get('req_spec_id') || '0', 10);
const TPROJECT_ID = parseInt(q.get('tproject_id') || '0', 10);
const API = '/api/reqreorder/index.php';
let items = [];

function $(s) { return document.querySelector(s); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function t(key) {
  const m = {
    'reqro.title': 'Reorder Requirements',
    'reqro.hint': 'Drag to reorder',
    'reqro.reqsTitle': 'Requirements',
    'reqro.footer': 'Drag requirements into the desired order. Your changes are saved when you click Save.',
    'reqro.saved': 'Requirements reordered successfully.',
    'reqro.loadfail': 'Failed to load requirements.',
    'reqro.savefail': 'Failed to save the new order.',
    'reqro.nothing': 'Nothing to reorder — this specification has fewer than two requirements.',
    'common.save': 'Save', 'common.close': 'Close',
    'reqro.up': 'Up', 'reqro.down': 'Down', 'reqro.grip': 'Drag',
  };
  return m[key] || key;
}

function showMsg(ok, text) {
  const m = $('#msg');
  m.className = 'msg ' + (ok ? 'ok' : 'err');
  m.textContent = text;
}

function render() {
  const list = $('#reqList');
  list.innerHTML = '';
  items.forEach((it, i) => {
    const li = el('li');
    li.draggable = true;
    li.appendChild(el('span', 'grip ttl', '\u2630'));
    li.appendChild(el('span', 'ord', String(i + 1)));
    li.appendChild(el('span', 'rdid', it.req_doc_id));
    li.appendChild(el('span', 'ttl', it.title));
    const up = el('span', 'rowmove', '\u2191 ' + t('reqro.up'));
    up.onclick = () => move(i, -1);
    li.appendChild(up);
    const down = el('span', 'rowmove', '\u2193 ' + t('reqro.down'));
    down.onclick = () => move(i, 1);
    li.appendChild(down21);
    li.addEventListener('dragstart', (e) => { li.classList.add('dragging'); e.dataTransfer.setData('text/plain', String(i)); });
    li.addEventListener('dragend', () => li.classList.remove('dragging'));
    li.addEventListener('dragover', (e) => { e.preventDefault(); });
    li.addEventListener('drop', (e) => {
      e.preventDefault();
      const from = parseInt(e.dataTransfer.getData('text/plain') || '-1', 10);
      if (from >= 0 && from !== i) {
        const m = items.splice(from, 1)[0];
        items.splice(i > from ? i - 1 : i, 0, m);
        render();
      }
    });
    list.appendChild(li);
  });
}

function move(i, d) {
  const j = i + d;
  if (j < 0 || j >= items.length) return;
  const t = items[i]; items[i] = items[j]; items[j] = t;
  render();
}

async function saveOrder() {
  showMsg(false, '');
  if (items.length < 2) { showMsg(true, t('reqro.nothing')); return; }
  try {
    const res = await fetch(
      API + '?action=reorder&req_spec_id=' + SPEC_ID + '&tproject_id=' + TPROJECT_ID,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
        body: JSON.stringify({ nodes_order: items.map(x => x.id) }),
      });
    const j = await res.json();
    if (j && j.status === 'ok') showMsg(true, t('reqro.saved'));
    else showMsg(false, (j && j.message) || t('reqro.savefail'));
  } catch (e) { showMsg(false, String(e)); }
}

(async function init() {
  try {
    const res = await fetch(
      '/api/reqreorder/index.php?action=init&req_spec_id=' + SPEC_ID + '&tproject_id=' + TPROJECT_ID,
      { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
    const j = await res.json();
    if (j && j.status !== 'ok') { showMsg(false, (j && j.message) || t('reqro.loadfail')); return; }
    document.title = t('reqro.title');
    $('#specTitle').textContent = j.req_spec_title || '';
    items = (j.requirements || []).map(r => ({ id: r.id, req_doc_id: r.req_doc_id, title: r.title }));
    render();
  } catch (e) { showMsg(false, String(e)); }
})();
</script>
</body>
</html>
