<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="reqro.title">Reorder requirements</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #22242a; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
.header span { font-size: 12px; font-weight: 400; color: #999; margin-left: 10px; }
.header .loc { float: right; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid #2e3138; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.btn-teal:hover { background: #3dbdb5; }
.btn-ghost { background: transparent; color: #ccc; border: 1px solid #555; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.btn-ghost:hover { border-color: #4ECDC4; color: #4ECDC4; }
.hint { color: #999; font-size: 12px; margin-left: auto; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.card-title { background: #f7f7f7; padding: 10px 18px; font-size: 13px; font-weight: 700; color: #22242a; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 8px; }
.reorder-list { list-style: none; margin: 0; padding: 8px 14px; min-height: 60px; }
.reorder-list li { display: flex; align-items: center; gap: 10px; padding: 10px 8px; margin: 4px 0; background: #fff; border: 1px solid #e3e3e3; border-radius: 6px; cursor: grab; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.reorder-list li.dragging { opacity: .5; border-color: #4ECDC4; }
.reorder-list li .grip { color: #bbb; font-size: 14px; cursor: grab; }
.reorder-list li .ord { font-size: 11px; color: #999; width: 24px; text-align: center; font-weight: 700; }
.reorder-list li .rdid { font-weight: 700; color: #22242a; font-size: 12px; min-width: 90px; }
.reorder-list li .ttl { flex: 1; color: #555; font-size: 13px; }
.reorder-list li .rowmove { color: #888; font-size: 12px; border: 1px solid #ddd; border-radius: 4px; padding: 2px 8px; cursor: pointer; background: #fafafa; }
.reorder-list li .rowmove:hover { color: #4ECDC4; border-color: #4ECDC4; }
.msg { display: none; margin: 12px 24px 0; padding: 10px 16px; border-radius: 5px; font-size: 13px; }
.msg.ok { display: block; background: #e8f8f2; border: 1px solid #b8e6d3; color: #1d7a4f; }
.msg.err { display: block; background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; }
.empty-state { padding: 30px; text-align: center; color: #888; font-size: 14px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #e5e5e5; margin-top: 14px; }
.id-chip { background: #22242a; color: #4ECDC4; padding: 3px 10px; border-radius: 3px; font-weight: 700; font-size: 12px; }
</style>
</head>
<body>

<div class="header"><i class="fa fa-list-ol"></i> <span data-i18n="reqro.title">Reorder requirements</span><span id="localeSwitcher" class="loc"></span></div>

<div class="toolbar">
  <button class="btn-teal" id="saveBtn"><i class="fa fa-save"></i> <span data-i18n="common.save">Save</span></button>
  <a class="btn-ghost" id="backLink" href="#" target="_blank"><i class="fa fa-arrow-left"></i> <span data-i18n="reqro.back">Back to spec viewer</span></a>
  <span class="hint"><i class="fa fa-grip-vertical"></i> <span data-i18n="reqro.hint">Drag and drop to reorder</span></span>
</div>

<div class="msg" id="msg"></div>

<div class="card">
  <div class="card-title">
    <i class="fa fa-arrows-v"></i> <span data-i18n="reqro.reqsTitle">Requirements</span>
    <span id="specTitle" class="id-chip"></span>
  </div>
  <ul class="reorder-list" id="reqList"></ul>
  <div class="empty-state" id="emptyState" style="display:none;" data-i18n="reqro.empty">This specification has no requirements to reorder.</div>
</div>

<div class="footer"><span data-i18n="footers.reqReorder">TestLink 2.0.1 - Reorder Requirements</span></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
var q = new URLSearchParams(location.search);
var SPEC_ID = parseInt(q.get('req_spec_id') || q.get('id') || '0', 10);
var TPROJECT_ID = parseInt(q.get('tproject_id') || '0', 10);
var API = '/api/reqreorder/index.php';
var items = [];

$(function () {
  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    $('#saveBtn').off('click').on('click', saveOrder);
    load();
  });
});

function showMsg(ok, text) {
  var m = $('#msg');
  m.removeClass('ok err').addClass(ok ? 'ok' : 'err');
  m.text(text);
}

function emptyState(show) {
  $('#emptyState').css('display', show ? 'block' : 'none');
  $('#reqList').css('display', show ? 'none' : 'block');
}

function render() {
  var list = $('#reqList');
  list.empty();
  if (items.length < 1) { emptyState(true); return; }
  emptyState(false);
  items.forEach(function (it, i) {
    var li = $('<li draggable="true"></li>');
    li.append($('<span class="grip" title="' + TLi18n.t('reqro.grip') + '"><i class="fa fa-grip-vertical"></i></span>'));
    li.append($('<span class="ord">' + (i + 1) + '</span>'));
    li.append($('<span class="rdid"></span>').text(it.req_doc_id));
    li.append($('<span class="ttl"></span>').text(it.title));
    var up = $('<span class="rowmove"><i class="fa fa-arrow-up"></i> ' + TLi18n.t('reqro.up') + '</span>');
    up.on('click', function () { move(i, -1); });
    li.append(up);
    var down = $('<span class="rowmove"><i class="fa fa-arrow-down"></i> ' + TLi18n.t('reqro.down') + '</span>');
    down.on('click', function () { move(i, 1); });
    li.append(down);
    li.on('dragstart', function (e) {
      li.addClass('dragging');
      e.originalEvent.dataTransfer.setData('text/plain', String(i));
    });
    li.on('dragend', function () { li.removeClass('dragging'); });
    li.on('dragover', function (e) { e.preventDefault(); });
    li.on('drop', function (e) {
      e.preventDefault();
      var from = parseInt(e.originalEvent.dataTransfer.getData('text/plain') || '-1', 10);
      if (from >= 0 && from !== i) {
        var m = items.splice(from, 1)[0];
        items.splice(i > from ? i - 1 : i, 0, m);
        render();
      }
    });
    list.append(li);
  });
}

function move(i, d) {
  var j = i + d;
  if (j < 0 || j >= items.length) return;
  var t = items[i]; items[i] = items[j]; items[j] = t;
  render();
}

function saveOrder() {
  showMsg(false, '');
  if (items.length < 2) { showMsg(true, TLi18n.t('reqro.nothing')); return; }
  $('#saveBtn').prop('disabled', true);
  $.ajax({
    url: API + '?action=reorder&req_spec_id=' + SPEC_ID + '&tproject_id=' + TPROJECT_ID,
    method: 'POST',
    contentType: 'application/json',
    headers: { 'X-Requested-With': 'XMLHttpRequest' },
    data: JSON.stringify({ nodes_order: items.map(function (x) { return x.id; }) }),
    success: function (r) {
      $('#saveBtn').prop('disabled', false);
      if (r && r.status === 'ok') showMsg(true, TLi18n.t('reqro.saved'));
      else showMsg(false, (r && r.message) || TLi18n.t('reqro.savefail'));
    },
    error: function (xhr) {
      $('#saveBtn').prop('disabled', false);
      var msg = TLi18n.t('reqro.savefail');
      try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
      showMsg(false, msg);
    }
  });
}

function load() {
  $('#specTitle').text('');
  items = [];
  if (!SPEC_ID) {
    showMsg(false, TLi18n.t('reqro.errNoSpec'));
    return;
  }
  $('#backLink').attr('href', '/gui/templates/requirements/reqSpecView.html?id=' + SPEC_ID + '&tproject_id=' + TPROJECT_ID);
  $.ajax({
    url: API + '?action=init&req_spec_id=' + SPEC_ID + '&tproject_id=' + TPROJECT_ID,
    method: 'GET',
    headers: { 'X-Requested-With': 'XMLHttpRequest' },
    success: function (r) {
      if (!r || r.status !== 'ok') { showMsg(false, (r && r.message) || TLi18n.t('reqro.loadfail')); return; }
      document.title = TLi18n.t('reqro.title');
      $('#specTitle').text(r.req_spec_title || '');
      items = (r.requirements || []).map(function (x) {
        return { id: x.id, req_doc_id: x.req_doc_id, title: x.title };
      });
      render();
      if (items.length < 2) showMsg(true, TLi18n.t('reqro.nothing'));
      if (r.grant && !r.grant.reorder) {
        $('#saveBtn').prop('disabled', true).css('opacity', .5);
        showMsg(false, TLi18n.t('reqro.noModRight'));
      }
    },
    error: function (xhr) {
      var msg = TLi18n.t('reqro.loadfail');
      try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
      showMsg(false, msg);
    }
  });
}
</script>
</body>
</html>
