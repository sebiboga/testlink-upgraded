<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Requirement Versions</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; color: #0d3f3c; opacity: 1; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-ghost { background: transparent; color: #ccc; border: 1px solid #555; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.btn-ghost:hover { border-color: #4ECDC4; color: #4ECDC4; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.card-title { background: #f7f7f7; padding: 10px 18px; font-size: 13px; font-weight: 700; color: #22242a; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 8px; }
.card-body { padding: 16px 18px; font-size: 13px; color: #444; }
.warn-banner { background: #fff8e1; border: 1px solid #ffe082; color: #9a7d0a; border-radius: 6px; padding: 12px 18px; font-size: 13px; margin: 16px 24px; display: none; }
.id-chip { background: #22242a; color: #4ECDC4; padding: 3px 10px; border-radius: 3px; font-weight: 700; font-size: 13px; }
.badge-rev { background: #3498db; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.badge-lchanged { background: #e67e22; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.badge-same { background: #27ae60; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
table.diff-table { width: 100%; border-collapse: collapse; font-size: 13px; }
table.diff-table th { background: #22242a; color: #fff; padding: 8px 12px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
table.diff-table td { padding: 8px 12px; border-bottom: 1px solid #eee; vertical-align: top; }
table.diff-table tr.changed { background: #fdf3e7; }
.del { color: #c0392b; background: #fdecea; }
.ins { color: #1a7f79; background: #eaf7f6; }
.scope-diff { background: #fafafa; border: 1px solid #eee; border-radius: 5px; padding: 14px; font-size: 13px; line-height: 1.6; word-break: break-word; }
.scope-diff del { background: #fdecea; color: #c0392b; text-decoration: line-through; }
.scope-diff ins { background: #eaf7f6; color: #1a7f79; text-decoration: none; }
.method-box { background: #f7f7f7; border: 1px solid #e5e5e5; border-radius: 6px; padding: 12px 16px; margin: 12px 0; }
.method-box label { font-weight: 400; margin-right: 18px; font-size: 13px; color: #333; }
.context-row { margin-top: 8px; display: none; }
.context-row input { width: 70px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }
.empty-state { padding: 30px; text-align: center; color: #888; font-size: 14px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.dataTables_wrapper .dataTables_filter input { border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px; }
.table>tbody>tr>td { padding: 8px 12px; }
/* Refs #1308 - log-message hover tooltip mirroring the legacy Ext.ToolTip affordance
   (reqCompareVersions.tpl tip4log: width 500, dismissDelay 0, trackMouse true) and
   the already-modernized sibling reqSpecCompare.html. */
td.log-cell { max-width: 340px; cursor: help; }
#logTooltip { display: none; position: fixed; z-index: 9999; max-width: 500px;
  background: #22242a; color: #fff; border: 1px solid #4ECDC4; border-radius: 6px;
  padding: 8px 12px; font-size: 12px; line-height: 1.55;
  box-shadow: 0 3px 10px rgba(0,0,0,.35); pointer-events: none;
  white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>

<div class="header"><i class="fa fa-code-compare"></i> <span data-i18n="rcmp.title">Compare Requirement Versions</span><span id="projName"></span><span id="localeSwitcher" style="float:right;"></span></div>

<div class="toolbar">
  <button class="btn-ghost" id="backBtn" onclick="goBack()"><i class="fa fa-arrow-left"></i> <span data-i18n="common.cancel">Cancel</span></button>
  <button class="btn-teal" id="selMode" onclick="loadVersions()"><i class="fa fa-refresh"></i> <span data-i18n="common.refresh">Refresh</span></button>
  <button class="btn-ghost" id="compareBtn" style="display:none;" onclick="doCompare()"><i class="fa fa-code-compare"></i> <span data-i18n="rcmp.compareSelected">Compare selected versions</span></button>
  <span class="ctx" style="margin-left:auto;color:#aaa;font-size:12px;" id="infoLine"></span>
</div>

<div id="warnBanner" class="warn-banner"></div>

<div id="content">
  <div class="card" id="selCard">
    <div class="card-title"><i class="fa fa-list"></i> <span data-i18n="rcmp.selectVersions">Select two versions to compare</span></div>
    <div class="card-body">
      <div class="method-box">
        <div><b data-i18n="rcmp.diffMethod">Diff method</b></div>
        <label><input type="radio" name="diff_method" value="html" checked> <span data-i18n="rcmp.htmlCompare">HTML comparison</span></label>
        <label><input type="radio" name="diff_method" value="text"> <span data-i18n="rcmp.codeCompare">HTML code comparison</span></label>
        <div class="context-row" id="contextRow">
          <label><span data-i18n="rcmp.context">Context</span> <input type="text" id="context" maxlength="4" size="4" value="" data-def=""></label>
          <label><input type="checkbox" id="contextShowAll"> <span data-i18n="rcmp.showAll">Show all</span></label>
        </div>
      </div>
      <table id="verTable" class="table table-striped table-bordered" width="100%">
        <thead>
          <tr>
            <th data-i18n="rcmp.version">Version</th>
            <th data-i18n="rcmp.revision">Revision</th>
            <th data-i18n="rcmp.compare">Compare (left / right)</th>
            <th data-i18n="rcmp.logMessage">Log message</th>
            <th data-i18n="rcmp.timestamp">Last change</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="diffWrap" style="display:none;">
    <div class="card">
      <div class="card-title"><i class="fa fa-code-compare"></i> <span data-i18n="rcmp.diffDetails">Diff details</span><span id="subtitle" style="margin-left:auto;font-weight:400;font-size:12px;color:#666;"></span></div>
      <div class="card-body">
        <div id="attrSection"></div>
        <h5 style="margin-top:18px;"><i class="fa fa-align-left"></i> <span data-i18n="rcmp.scope">Scope</span></h5>
        <div class="scope-diff" id="scopeDiff"></div>
        <div id="cfSection"></div>
      </div>
    </div>
  </div>
</div>

<div class="footer" id="footerText"></div>

<div id="logTooltip"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script>
var API = '/api/reqcompare/index.php';
var REQ_ID = 0;
var TPROJECT_ID = 0;
var REQ_DOC = '';
var verTable = null;
var curMethod = 'html';
var LOG_LEN = 0;   // Refs #1308 - req_cfg->log_message_len, from the BFF response
var fullLogs = {}; // Refs #1308 - item_id -> FULL untruncated log (tooltip payload)

$(function() {
  var p = new URLSearchParams(window.location.search);
  REQ_ID = parseInt(p.get('requirement_id') || p.get('id') || 0, 10);
  TPROJECT_ID = parseInt(p.get('tproject_id') || 0, 10);
  TLi18n.load(function() {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    if (!REQ_ID) {
      showWarn(TLi18n.t('rcmp.noReq'));
      $('#content').hide();
      return;
    }
    loadVersions();
  });
  $('input[name=diff_method]').on('change', function() {
    curMethod = this.value;
    if (curMethod === 'text') { $('#contextRow').show(); }
    else { $('#contextRow').hide(); }
  });
  $('#contextShowAll').on('change', function() {
    $('#context').prop('disabled', this.checked);
  });
});

function loadVersions() {
  var url = API + '?action=versions&requirement_id=' + REQ_ID;
  if (TPROJECT_ID > 0) url += '&tproject_id=' + TPROJECT_ID;
  $('#warnBanner').hide();
  $('#diffWrap').hide();
  $('#selCard').show();
  $('#compareBtn').show();
  $('#infoLine').text('');
  $.getJSON(url, function(r) {
    if (r.status !== 'ok') { showWarn(r.message || TLi18n.t('rcmp.loadError')); return; }
    TPROJECT_ID = r.tproject_id || TPROJECT_ID;
    REQ_DOC = r.req_doc_id || '';
    LOG_LEN = parseInt(r.log_message_len, 10);
    if (isNaN(LOG_LEN)) LOG_LEN = 0;
    $('#projName').text(' - ' + (r.tproject_name || ('#' + r.tproject_id)) + ' [' + REQ_DOC + ']');
    var defCtx = r.context || 5;
    $('#context').val(defCtx);
    $('#footerText').text('TestLink 2.0.1 - ' + TLi18n.t('rcmp.title') +
      ' | ' + TLi18n.t('common.generatedOn') + ' ' + new Date().toLocaleString());
    renderVersions(r.items || []);
    bindLogTooltips();
  }).fail(function(xhr) {
    var msg = TLi18n.t('rcmp.loadError');
    try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e) {}
    showWarn(msg);
  });
}

function renderVersions(items) {
  var rows = '';
  fullLogs = {};
  $('#logTooltip').hide();
  // pre-select two most recent (API returns DESC): right = newest, left = previous
  if (items.length >= 2) {
    rows += verRow(items[0], true, false);
    rows += verRow(items[1], false, true);
    for (var i = 2; i < items.length; i++) rows += verRow(items[i], false, false);
  } else if (items.length === 1) {
    rows += verRow(items[0], true, false);
  } else {
    rows = '<tr><td colspan="5" class="empty-state">' + TLi18n.t('rcmp.noVersions') + '</td></tr>';
  }
  $('#verTable tbody').html(rows);
  // Refs #1308 (code review): keep the FULL log searchable even though
  // the cell text is truncated — set DataTables data-search from the per-item map
  // (jQuery.attr escapes it properly, so quotes/special chars in logs are safe) and
  // the empty placeholder still matches an empty-string search value.
  // Mirrors reqSpecCompare.html (Refs #1357, commit d70e500c6).
  $('#verTable tbody tr').each(function() {
    var $cell = $(this).find('td.log-cell');
    var id = $cell.data('item-id');
    if (id && fullLogs[id] !== undefined) {
      $cell.attr('data-search', fullLogs[id]);
    }
  });
  if (verTable) { verTable.destroy(); verTable = null; }
  if (items.length > 0) {
    verTable = $('#verTable').DataTable({
      paging: false, searching: true, info: false, ordering: true
    });
  }
  TLi18n.apply();
}

// Refs #1308 - legacy tip4log() per-row Ext.ToolTip (reqCompareVersions.tpl:32-48,
// lib/ajax/getreqlog.php:23-43): hover shows the FULL untruncated log. Here the
// full text is already in the BFF payload, so the tooltip is a lightweight
// mouse-tracked div (dismissDelay 0 / trackMouse true like Ext). Event delegation
// survives the DataTables tbody rebuild on every loadVersions().
function normalizeLogTip(msg) {
  msg = String(msg || '');
  // mirror lib/ajax/getreqlog.php: strip wrapping <p> and turn </p> into a line break
  msg = msg.replace(/<p>/gi, '').replace(/<\/p>/gi, '\n');
  msg = $.trim(msg);
  if (msg === '') { msg = TLi18n.t('common.emptyLogMessage'); }
  return msg;
}

function bindLogTooltips() {
  $('#verTable')
    .off('.logtip')
    .on('mouseenter.logtip', '.log-cell', function(e) {
      var msg = fullLogs[$(this).data('item-id')] || '';
      $('#logTooltip').text(normalizeLogTip(msg))
        .css({ left: e.clientX + 14, top: e.clientY + 16 })
        .show();
    })
    .on('mousemove.logtip', '.log-cell', function(e) {
      $('#logTooltip').css({ left: e.clientX + 14, top: e.clientY + 16 });
    })
    .on('mouseleave.logtip', '.log-cell', function() {
      $('#logTooltip').hide();
    })
    // safety net: if the tbody is rebuilt while the pointer sits on a cell, the
    // per-cell mouseleave never fires — hide the tip whenever the pointer leaves
    // the table body entirely (renderVersions also hides it explicitly).
    .on('mouseleave.logtip', 'tbody', function() {
      $('#logTooltip').hide();
    });
}

function verRow(it, isRight, isLeft) {
  var revTag = it.revision_id > 0 ? TLi18n.t('rcmp.revision') + ' ' + escapeHtml(it.revision) : '-';
  // Refs #1308 - legacy reqCompareVersions.php:280-289: the cell shows the log
  // truncated to req_cfg->log_message_len with '...'; the full, untruncated text
  // is kept for the hover tooltip (legacy tip4log + lib/ajax/getreqlog.php) and
  // the empty log renders the legacy empty_log_message placeholder instead of '-'.
  var logMsg = it.log_message || '';
  fullLogs[it.item_id] = logMsg;
  var logShort = (LOG_LEN > 0 && Array.from(logMsg).length > LOG_LEN)
    ? Array.from(logMsg).slice(0, LOG_LEN).join('') + '...' : logMsg;
  var logDisp = logMsg === '' ? TLi18n.t('common.emptyLogMessage') : logShort;
  return '<tr>' +
    '<td><span class="badge-rev">' + TLi18n.t('rcmp.version') + ' ' + escapeHtml(it.version) + '</span></td>' +
    '<td>' + revTag + '</td>' +
    '<td style="white-space:nowrap;">' +
      '<label class="radio-inline" title="' + TLi18n.t('rcmp.left') + '"><input type="radio" name="left_item_id" value="' + it.item_id + '"' + (isLeft ? ' checked' : '') + '></label> ' +
      '<label class="radio-inline" title="' + TLi18n.t('rcmp.right') + '"><input type="radio" name="right_item_id" value="' + it.item_id + '"' + (isRight ? ' checked' : '') + '></label>' +
    '</td>' +
    '<td class="log-cell" data-item-id="' + it.item_id + '">' + escapeHtml(logDisp) + '</td>' +
    // Refs #1309 - legacy reqCompareVersions.tpl:228-230 renders the Last change
    // cell as a link (onclick openReqRevisionWindow(item_id)); restore the
    // clickable cell opening the modern revision viewer (reqRevisionView.html),
    // honoring the ReqPopupWidth/ReqPopupHeight size-cookie popup behavior.
    '<td style="white-space:nowrap;cursor:pointer;color:rgb(0,85,153);" title="' +
      TLi18n.t('rcmp.openRevision') + '" onclick="openReqRevision(' + it.item_id + ')">' +
      fmtTs(it.timestamp) + ' · ' + escapeHtml(it.last_editor || '-') + '</td>' +
    '</tr>';
}

function doCompare() {
  var left = $('input[name=left_item_id]:checked').val();
  var right = $('input[name=right_item_id]:checked').val();
  if (!left || !right) { showWarn(TLi18n.t('rcmp.selectTwo')); return; }
  if (left === right) { showWarn(TLi18n.t('rcmp.sameSelected')); return; }
  var method = curMethod;
  if (method === 'text') {
    var ctx = $('#context').val();
    if (!$('#contextShowAll').prop('checked')) {
      if (ctx === '' || isNaN(parseInt(ctx, 10)) || parseInt(ctx, 10) < 0) {
        showWarn(TLi18n.t('rcmp.invalidContext'));
        return;
      }
    }
  }
  var url = API + '?action=compare&requirement_id=' + REQ_ID +
    '&left=' + left + '&right=' + right + '&method=' + method;
  if (TPROJECT_ID > 0) url += '&tproject_id=' + TPROJECT_ID;
  if (method === 'text') {
    if ($('#contextShowAll').prop('checked')) url += '&context_show_all=1';
    else url += '&context=' + encodeURIComponent($('#context').val() || '');
  }
  $('#warnBanner').hide();
  $('#infoLine').text(TLi18n.t('rcmp.computing'));
  $.getJSON(url, function(r) {
    if (r.status !== 'ok') { showWarn(r.message || TLi18n.t('rcmp.loadError')); return; }
    renderDiff(r);
  }).fail(function(xhr) {
    var msg = TLi18n.t('rcmp.loadError');
    try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e) {}
    showWarn(msg);
  });
}

function renderDiff(r) {
  var leftDisp = Number(r.left.version) + ' r' + Number(r.left.revision);
  var rightDisp = Number(r.right.version) + ' r' + Number(r.right.revision);
  $('#subtitle').text(TLi18n.t('rcmp.diffBetween') + ' v' + leftDisp + ' ↔ v' + rightDisp);

  // attributes table
  var attrHtml = '<h5><i class="fa fa-list-ul"></i> <span data-i18n="rcmp.attributes">Attributes</span></h5>' +
    '<table class="diff-table"><thead><tr>' +
    '<th>' + TLi18n.t('rcmp.attribute') + '</th>' +
    '<th>' + TLi18n.t('rcmp.left') + ' (v' + leftDisp + ')</th>' +
    '<th>' + TLi18n.t('rcmp.right') + ' (v' + rightDisp + ')</th></tr></thead><tbody>';
  $.each(r.attributes || [], function(i, a) {
    var cls = a.changed ? 'del' : 'ins';
    attrHtml += '<tr class="' + (a.changed ? 'changed' : '') + '">' +
      '<td><b>' + escapeHtml(a.label) + '</b></td>' +
      '<td class="' + cls + '">' + escapeHtml(a.lvalue) + '</td>' +
      '<td class="' + cls + '">' + escapeHtml(a.rvalue) + '</td></tr>';
  });
  attrHtml += '</tbody></table>';
  $('#attrSection').html(attrHtml);

  // scope diff
  showBadgeCount(r.scope.count);
  if (r.scope.diff) {
    $('#scopeDiff').html(sanitizeDiffHtml(r.scope.diff));
  } else {
    $('#scopeDiff').html('<span style="color:#888;">' + TLi18n.t('rcmp.noChanges') + '</span>');
  }

  // custom fields diff
  var cfRows = r.custom_fields || [];
  var cfHtml = '';
  if (cfRows.length > 0) {
    cfHtml = '<h5 style="margin-top:18px;"><i class="fa fa-tags"></i> <span data-i18n="rcmp.customFields">Custom Fields</span></h5>' +
      '<table class="diff-table"><thead><tr>' +
      '<th>' + TLi18n.t('rcmp.customField') + '</th>' +
      '<th>' + TLi18n.t('rcmp.left') + ' (v' + leftDisp + ')</th>' +
      '<th>' + TLi18n.t('rcmp.right') + ' (v' + rightDisp + ')</th></tr></thead><tbody>';
    $.each(cfRows, function(i, c) {
      var cls = c.changed ? 'del' : 'ins';
      cfHtml += '<tr class="' + (c.changed ? 'changed' : '') + '">' +
        '<td><b>' + escapeHtml(c.label) + '</b></td>' +
        '<td class="' + cls + '">' + escapeHtml(c.lvalue || '') + '</td>' +
        '<td class="' + cls + '">' + escapeHtml(c.rvalue || '') + '</td></tr>';
    });
    cfHtml += '</tbody></table>';
  }
  $('#cfSection').html(cfHtml);
  $('#diffWrap').show();
  $('#selCard').hide();
  $('#compareBtn').hide();
  $('#infoLine').text('');
  TLi18n.apply();
}

function showBadgeCount(count) {
  $('#scopeCount').remove();
  var badge = count > 0
    ? '<span class="badge-lchanged" id="scopeCount" style="margin-left:10px;">' + count + ' ' + TLi18n.t('rcmp.changes') + '</span>'
    : '<span class="badge-same" id="scopeCount" style="margin-left:10px;">' + TLi18n.t('rcmp.noChanges') + '</span>';
  $('#subtitle').append(badge);
}

function sanitizeDiffHtml(html) {
  if (!html) { return html; }
  var doc = new DOMParser().parseFromString(html, 'text/html');
  var DANGEROUS = 'script, iframe, object, embed, link, meta, base, form, input, button, textarea, select, option';
  doc.querySelectorAll(DANGEROUS).forEach(function (el) { el.parentNode.removeChild(el); });
  doc.querySelectorAll('*').forEach(function (el) {
    var i;
    var attrs = el.attributes;
    for (i = attrs.length - 1; i >= 0; i--) {
      var name = attrs[i].name.toLowerCase();
      if (name === 'srcdoc' || name.indexOf('on') === 0) {
        el.removeAttribute(attrs[i].name);
        continue;
      }
      if (name === 'href' || name === 'src' || name === 'xlink:href') {
        var v = (attrs[i].value || '').trim().toLowerCase();
        if (/^(javascript|vbscript|data):/.test(v)) { el.removeAttribute(attrs[i].name); }
      }
    }
  });
  return doc.body ? doc.body.innerHTML : html;
}

function showWarn(msg) {
  $('#warnBanner').text(msg).css('display', 'block');
}

// Refs #1310 - legacy reqCompareVersions.tpl cancel_top/cancel_bottom
// buttons (btn_cancel -> history.back()); same affordance, with a same-origin
// fallback when reqCompare was opened in a fresh tab (window.open from
// reqView openCompare) where history has nothing to walk back.
function goBack() {
  if (window.history.length > 1) { window.history.back(); }
  else if (REQ_ID > 0) {
    window.location.href = '/gui/templates/requirements/reqView.html?id=' + REQ_ID +
      (TPROJECT_ID > 0 ? '&tproject_id=' + TPROJECT_ID : '');
  } else {
    window.location.href = '/index.php';
  }
}

function fmtTs(ts) {
  if (!ts) return '-';
  var d = new Date(String(ts).replace(' ', 'T'));
  if (isNaN(d.getTime())) return String(ts);
  return d.toLocaleString();
}

// Refs #1309 - mirror of legacy openReqRevisionWindow(item_id) in
// gui/javascript/testlink_library.js:1618 opens reqRevisionView.html for the
// requirement version/revision id in a popup sized from the
// ReqPopupWidth/ReqPopupHeight cookies (defaults 800x600), window name
// "Requirement Revision" (same as legacy), honoring item_id being a
// requirement_version or requirement_revision node.
function openReqRevision(itemId) {
  var url = '/gui/templates/requirements/reqRevisionView.html?showReqSpecTitle=1&item_id=' + itemId;
  var width = getCookie('ReqPopupWidth') || '800';
  var height = getCookie('ReqPopupHeight') || '600';
  var windowCfg = 'width=' + width + ',height=' + height +
    ',resizable=yes,scrollbars=yes,dependent=yes';
  window.open(url, 'Requirement Revision', windowCfg);
}

function getCookie(name) {
  var cookie = document.cookie;
  var posName = cookie.indexOf('; ' + name + '=');
  if (posName === -1) {
    if (cookie.indexOf(name + '=') === 0) { posName = 0; }
    else { return null; }
  }
  var valueStart = cookie.indexOf('=', posName) + 1;
  var valueEnd = cookie.indexOf(';', posName + 1);
  if (valueEnd === -1) { valueEnd = cookie.length; }
  return cookie.substring(valueStart, valueEnd);
}

function escapeHtml(s) {
  return $('<div>').text(s == null ? '' : String(s)).html();
}
</script>
