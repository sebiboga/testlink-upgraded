<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="rbm.title">Bulk Monitoring</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; color: #0d3f3c; opacity: 1; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.btn-teal:hover { background: #3dbdb5; }
.btn-teal:disabled { opacity: .45; cursor: not-allowed; }
.btn-ghost { background: transparent; color: #ccc; border: 1px solid #555; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.btn-ghost:hover { border-color: #4ECDC4; color: #4ECDC4; text-decoration: none; }
.sep { flex: 1; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.card-title { background: #f7f7f7; padding: 10px 18px; font-size: 13px; font-weight: 700; color: #22242a; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 8px; }
.card-body { padding: 16px 18px; font-size: 13px; color: #444; }
.id-chip { background: #22242a; color: #4ECDC4; padding: 3px 10px; border-radius: 3px; font-weight: 700; font-size: 13px; }
table.dataTable thead th { background: #22242a; color: #fff; font-size: 13px; padding: 9px 14px; }
table.dataTable tbody td { padding: 9px 14px; font-size: 13px; }
.dataTables_wrapper .dataTables_paginate .paginate_button.current { background: #4ECDC4 !important; color: #fff !important; border: none !important; }
.badge-mon { background: #4ECDC4; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.badge-off { background: #999; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.check-all { width: 16px; height: 16px; cursor: pointer; }
.check-req { width: 16px; height: 16px; cursor: pointer; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-top: 1px solid #eee; }
.msg { display: none; margin: 12px 24px 0; padding: 10px 16px; border-radius: 5px; font-size: 13px; }
.msg.ok { display: block; background: #e8f8f2; border: 1px solid #b8e6d3; color: #1d7a4f; }
.msg.err { display: block; background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; }
.empty-state { padding: 30px; text-align: center; color: #888; font-size: 14px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.req-link { color: #3498db; cursor: pointer; }
.req-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="header"><i class="fa fa-bell-o"></i> <span data-i18n="rbm.title">Bulk Monitoring</span>
  <span class="sub" data-i18n="rbm.headerSub">start / stop monitoring of requirement change notifications</span>
  <span id="specLine" class="id-chip" style="margin-left:14px;background:#1c7a94;color:#fff;"></span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <button class="btn-teal" onclick="loadData()"><i class="fa fa-refresh"></i> <span data-i18n="common.refresh">Refresh</span></button>
  <a class="btn-ghost" id="backLink" href="#" target="_blank"><i class="fa fa-arrow-left"></i> <span data-i18n="rbm.back">Back to spec viewer</span></a>
  <span class="ctx" id="infoLine"></span>
  <span class="sep"></span>
  <button class="btn-ghost" id="toBeChecked" style="display:none;"></button>
</div>

<div class="msg" id="msg"></div>

<div class="card">
  <div class="card-title"><i class="fa fa-list"></i> <span data-i18n="rbm.reqsTitle">Requirements</span></div>
  <div class="card-body" style="padding:6px 18px;">
    <div id="emptyState" class="empty-state" style="display:none;" data-i18n="rbm.noReqs">This specification has no requirements to monitor.</div>
    <table id="monTable" class="display" style="width:100%;display:none;">
      <thead>
        <tr>
          <th style="width:36px;"><input type="checkbox" id="checkAll" class="check-all" title=""></th>
          <th data-i18n="rsv.docId">Identifier</th>
          <th data-i18n="rbm.reqTitle">Title</th>
          <th data-i18n="rbm.monitoring">Monitoring</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="actions" id="actionsBar" style="display:none;">
    <button class="btn-teal" id="toggleBtn"><i class="fa fa-toggle-on"></i> <span data-i18n="rbm.toggle">Toggle Monitoring</span></button>
    <button class="btn-teal" id="startBtn" style="background:#3498db;"><i class="fa fa-bell"></i> <span data-i18n="rbm.start">Start Monitoring</span></button>
    <button class="btn-ghost" id="stopBtn"><i class="fa fa-bell-slash"></i> <span data-i18n="rbm.stop">Stop Monitoring</span></button>
  </div>
</div>

<div class="footer" id="footerText"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap.min.js"></script>
<script>
var API = '/api/reqspec/index.php';
var SPEC_ID = 0;
var TPROJECT_ID = 0;
var allItems = [];
var monTable = null;

$(function () {
  var p = new URLSearchParams(window.location.search);
  SPEC_ID = parseInt(p.get('id') || p.get('req_spec_id') || 0, 10);
  TPROJECT_ID = parseInt(p.get('tproject_id') || 0, 10);
  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    $('#checkAll').off('change').on('change', onCheckAll);
    $('#toggleBtn').off('click').on('click', function () { submitAction('toogleMon'); });
    $('#startBtn').off('click').on('click', function () { submitAction('startMon'); });
    $('#stopBtn').off('click').on('click', function () { submitAction('stopMon'); });
    if (!SPEC_ID) {
      showMsg(true, TLi18n.t('rbm.errNoSpec'));
      return;
    }
    loadData();
  });
});

function showMsg(ok, text) {
  var m = $('#msg');
  m.removeClass('ok err').addClass(ok ? 'ok' : 'err').text(text);
  // override any residual inline display:none left by a previous auto-hide
  // (Refs #1549) — otherwise repeat messages stay invisible.
  m.css('display', 'block');
  clearTimeout(m.data('tm'));
  m.data('tm', setTimeout(function () { m.removeClass('ok err'); m.css('display', 'none'); }, 6000));
}

function esc(s) {
  return $('<div>').text(s == null ? '' : String(s)).html();
}

function canToggler() {
  // callback used by the toggle-all checkbox reset
}

function selectedIds() {
  var out = [];
  $('.check-req:checked').each(function () { out.push(parseInt($(this).val(), 10)); });
  return out;
}

function syncCheckAll() {
  var total = $('.check-req').length;
  var sel = $('.check-req:checked').length;
  $('#checkAll').prop('checked', total > 0 && sel === total);
  $('#checkAll').prop('indeterminate', sel > 0 && sel < total);
  var any = sel > 0;
  $('#toggleBtn').prop('disabled', !any);
  $('#startBtn').prop('disabled', !any);
  $('#stopBtn').prop('disabled', !any);
}

function onCheckAll() {
  $('.check-req').prop('checked', $('#checkAll').is(':checked'));
  syncCheckAll();
}

function loadData() {
  $('#emptyState').hide();
  var url = API + '?action=bulk_mon_options&id=' + SPEC_ID;
  if (TPROJECT_ID > 0) { url += '&tproject_id=' + TPROJECT_ID; }
  $.getJSON(url, function (r) {
    if (r.status !== 'ok') { showMsg(false, r.message || TLi18n.t('rbm.errLoad')); return; }
    TPROJECT_ID = r.tproject_id || TPROJECT_ID;
    allItems = r.items || [];
    $('#specLine').text(r.spec.doc_id + ' — ' + r.spec.title);
    $('#backLink').attr('href', '/gui/templates/requirements/reqSpecView.html?id=' + SPEC_ID +
      '&tproject_id=' + TPROJECT_ID);
    $('#infoLine').html('#' + SPEC_ID + ' · <b>' + (r.spec.doc_id || '') + '</b>');
    var monOn = allItems.filter(function (x) { return x.monitor; }).length;
    $('#footerText').text('TestLink 2.0.1 - ' + TLi18n.t('rbm.title') + ' | ' +
      TLi18n.t('common.generatedOn') + ' ' + new Date().toLocaleString());
    renderTable(allItems);
    $('#toggleBtn').prop('disabled', true);
    $('#startBtn').prop('disabled', true);
    $('#stopBtn').prop('disabled', true);
    $('#startBtn').css('display', r.enable_start_btn ? '' : 'none');
    $('#stopBtn').css('display', r.enable_stop_btn ? '' : 'none');
    $('#actionsBar').css('display', allItems.length ? 'flex' : 'none');
  }).fail(function (xhr) {
    var msg = TLi18n.t('rbm.errLoad');
    try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
    showMsg(false, msg);
  });
}

function renderTable(items) {
  if (monTable) { monTable.destroy(); monTable = null; }
  $('#monTable tbody').empty();
  if (!items.length) {
    $('#monTable').hide();
    $('#emptyState').css('display', 'block');
    return;
  }
  $('#emptyState').hide();
  $('#monTable').show();
  var rows = items.map(function (q) {
    var badge = q.monitor
      ? '<span class="badge-mon"><i class="fa fa-bell"></i> ' + TLi18n.t('rbm.on') + '</span>'
      : '<span class="badge-off"><i class="fa fa-bell-slash"></i> ' + TLi18n.t('rbm.off') + '</span>';
    var del = q.monitor
      ? badge
      : badge;
    return [
      '<input type="checkbox" class="check-req" value="' + q.id + '">',
      '<span class="id-chip" style="font-size:11px;">' + esc(q.req_doc_id) + '</span>',
      '<a class="req-link" href="javascript:void(0)" onclick="openReq(' + q.id + ')">' + esc(q.title) + '</a>',
      del
    ];
  });
  monTable = $('#monTable').DataTable({
    data: rows,
    pageLength: 10,
    lengthMenu: [[10, 25, -1], [10, 25, 'All']],
    language: { search: '', searchPlaceholder: TLi18n.t('common.search') },
    columnDefs: [
      { targets: 0, orderable: false, className: 'check-col' },
      { targets: 3, orderable: false }
    ],
    bInfo: false,
    initComplete: function () {
      $('.check-req').off('change').on('change', syncCheckAll);
      $('#checkAll').prop('checked', false);
      syncCheckAll();
    }
  });
}

function openReq(reqId) {
  var w = Math.floor(window.innerWidth * 0.85), h = Math.floor(window.innerHeight * 0.85);
  window.open('/gui/templates/requirements/reqView.html?id=' + reqId + '&tproject_id=' + TPROJECT_ID,
    'req_view_' + reqId, 'width=' + w + ',height=' + h + ',resizable=yes,scrollbars=yes');
}

function submitAction(op) {
  var ids = selectedIds();
  if (!ids.length) { showMsg(false, TLi18n.t('rbm.errSelect')); return; }
  $('#toggleBtn, #startBtn, #stopBtn').prop('disabled', true);
  $.ajax({
    url: API + '?action=bulk_mon_toggle',
    method: 'POST',
    contentType: 'application/json',
    headers: { 'X-Requested-With': 'XMLHttpRequest' },
    data: JSON.stringify({ tproject_id: TPROJECT_ID, req_spec_id: SPEC_ID, op: op, itemSet: ids }),
    success: function (r) {
      if (r.status !== 'ok') { showMsg(false, r.message || TLi18n.t('rbm.errToggle')); loadData(); return; }
      var updated = allItems.map(function (x) {
        var next = r.items.filter(function (y) { return y.id === x.id; })[0];
        return next || x;
      });
      allItems = updated;
      showMsg(true, (op === 'toogleMon' ? TLi18n.t('rbm.toggled') : (op === 'startMon' ? TLi18n.t('rbm.started') : TLi18n.t('rbm.stopped'))) +
        ' (' + ids.length + ')');
      loadData();
    },
    error: function (xhr) {
      var msg = TLi18n.t('rbm.errToggle');
      try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
      showMsg(false, msg);
      loadData();
    }
  });
}
</script>
</body>
</html>
