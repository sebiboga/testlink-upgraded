<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="reqexp.header">Requirement Export</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-teal:disabled { background: #b5e3e0; cursor: not-allowed; }
.btn-dark { background: #22242a; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-dark:hover { background: #33363e; }
.section { padding: 20px 24px 4px; }
.section h2 { font-size: 15px; font-weight: 700; color: #22242a; margin: 0; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 0 24px 18px; overflow: hidden; }
.card-head { padding: 12px 18px; border-bottom: 1px solid #eee; font-size: 14px; font-weight: 700; color: #22242a; display: flex; align-items: center; gap: 8px; }
.card-head i { color: #4ECDC4; }
.card-body { padding: 16px 18px; }
.form-group { margin-bottom: 14px; }
.form-group label { font-size: 12px; font-weight: 600; color: #445; display: block; margin-bottom: 5px; }
.form-control { font-size: 13px; border: 1px solid #cdd; border-radius: 4px; padding: 7px 10px; width: 100%; }
.form-control:focus { outline: none; border-color: #4ECDC4; }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #445; }
.check-row input[type=checkbox] { width: 16px; height: 16px; }
.hint { color: #999; font-size: 12px; margin-top: 6px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 6px; }
.loading-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(34,36,42,.55); color:#fff; display:none; align-items:center; justify-content:center; font-size:15px; z-index:10000; }
.loading-overlay i { margin-right: 10px; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.toast.err { background: #e6605e; }
.warn-box { background:#fdeaea; color:#b45452; border:1px solid #f3cccc; border-radius: 4px; padding: 10px 14px; font-size: 13px; margin: 0 24px 18px; display:none; }
</style>
</head>
<body>

<div class="header">
  <span data-i18n="reqexp.header">Requirement Export</span>
  <span id="projectSub" class="sub"></span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <span class="ctx"><span data-i18n="reqexp.reqSpec">Requirement Specification</span>: <b id="specTitle">-</b></span>
  <span style="flex:1"></span>
  <button class="btn-dark" id="btnBack" onclick="goBack()"><i class="fa fa-arrow-left"></i> <span data-i18n="reqexp.cancel">Cancel</span></button>
</div>

<div class="warn-box" id="warnBox"></div>

<div class="card">
  <div class="card-head"><i class="fa fa-file-export"></i> <span data-i18n="reqexp.header">Requirement Export</span></div>
  <div class="card-body">
    <div class="form-group">
      <label for="exportFilename" data-i18n="reqexp.exportFilename">Export file name</label>
      <input type="text" class="form-control" id="exportFilename" required>
      <div class="hint" data-i18n="reqexp.scope">Export scope</div>
    </div>
    <div class="form-group">
      <label for="exportType" data-i18n="reqexp.fileType">File type</label>
      <select id="exportType" class="form-control">
        <option value="XML">XML</option>
      </select>
      <div class="hint"><a href="/docs/tl-file-formats.pdf" target="_blank" data-i18n="reqimp.fileFormatsDoc">view file format documentation</a></div>
    </div>
    <div class="form-group">
      <div class="check-row">
        <input type="checkbox" id="exportAttachments">
        <label for="exportAttachments" style="font-weight:400;color:#445;margin:0;" data-i18n="reqexp.exportAttachments">Export attachments</label>
      </div>
      <div class="hint" data-i18n="reqexp.exportAttachmentsHint">Attachment contents are included (base64) in the exported XML file.</div>
    </div>
    <div class="actions">
      <button class="btn-teal" id="btnExport"><i class="fa fa-download"></i> <span data-i18n="reqexp.export">Export</span></button>
      <button class="btn-dark" id="btnCancel" onclick="goBack()" data-i18n="reqexp.cancel">Cancel</button>
    </div>
  </div>
</div>

<div class="footer" id="footerInfo"></div>
<div class="footer"><span data-i18n="reqexp.footer">TestLink 2.0.1 - Requirement Export</span></div>

<div class="loading-overlay" id="loadingOverlay"><i class="fa fa-spinner fa-spin"></i> <span data-i18n="reqexp.generating">Generating export...</span></div>
<div class="toast" id="toast"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/reqexport/index.php';
var ctx = {
  tprojectId: 0,
  reqSpecId: 0,
  scope: 'items',
  info: null
};

function qs(name) {
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : '';
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg, isErr) {
  var $t = $('#toast').text(msg).toggleClass('err', !!isErr).show();
  clearTimeout($t.data('tm'));
  $t.data('tm', setTimeout(function(){ $t.hide(); }, 4000));
}

function showFatal(msg) {
  $('#warnBox').html('<i class="fa fa-lock"></i> ' + esc(msg)).show();
  $('#btnExport').prop('disabled', true);
}

function goBack() {
  window.history.length > 1 ? window.history.back() : window.close();
}

function scopeTitle(scope) {
  switch (scope) {
    case 'tree': return TLi18n.t('reqexp.scopeTree');
    case 'branch': return TLi18n.t('reqexp.scopeBranch');
    case 'items': default: return TLi18n.t('reqexp.scopeItems');
  }
}

$(function () {
  var p = new URLSearchParams(window.location.search);
  ctx.tprojectId = parseInt(p.get('tproject_id') || '0', 10);
  ctx.reqSpecId = parseInt(p.get('req_spec_id') || '0', 10);
  var s = p.get('scope') || (ctx.reqSpecId > 0 ? 'branch' : 'tree');
  ctx.scope = (s === 'items' || s === 'branch' || s === 'tree') ? s : (ctx.reqSpecId > 0 ? 'branch' : 'tree');

  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    loadOptions();
  });
  $('#btnExport').on('click', doExport);
  $('#btnBack').on('click', goBack);
  $('#exportFilename').on('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); doExport(); }
  });
});

function loadOptions() {
  var params = { action: 'options', tproject_id: ctx.tprojectId, scope: ctx.scope };
  if (ctx.reqSpecId > 0) params.req_spec_id = ctx.reqSpecId;
  $.get(API, params)
    .done(function (r) {
      if (r.status !== 'ok') { showFatal(r.message || TLi18n.t('reqexp.errLoadInfo')); return; }
      ctx.info = r;
      ctx.tprojectId = r.tproject.id;
      ctx.reqSpecId = r.req_spec_id;
      ctx.scope = r.scope;
      renderContext();
    })
    .fail(function (xhr) {
      var msg = TLi18n.t('reqexp.errLoadInfo');
      try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
      showFatal(msg);
    });
}

function renderContext() {
  document.title = TLi18n.t('reqexp.header') + ' - ' + ctx.info.tproject.name;
  $('#projectSub').text(' - ' + ctx.info.tproject.name);
  var title = ctx.info.req_spec_title || '-';
  if (ctx.scope === 'tree') title = TLi18n.t('reqexp.reqSpec') + ': ' + title;
  $('#specTitle').text(title);
  $('#exportFilename').val(ctx.info.filename || 'all-req.xml');
  $('.hint[data-i18n="reqexp.scope"]').text(scopeTitle(ctx.scope));
  if (ctx.info.rights && ctx.info.rights.mgt_view_req) {
    $('#btnExport').prop('disabled', false);
  } else {
    showFatal(TLi18n.t('common.error'));
  }
}

function doExport() {
  var fn = ($('#exportFilename').val() || '').trim();
  if (!fn) { toast(TLi18n.t('reqexp.errEmptyFilename'), true); $('#exportFilename').focus(); return; }

  var params = {
    action: 'export',
    tproject_id: ctx.tprojectId,
    req_spec_id: ctx.reqSpecId,
    scope: ctx.scope,
    exportType: $('#exportType').val() || 'XML',
    export_filename: fn
  };
  if ($('#exportAttachments').is(':checked')) params.exportAttachments = '1';

  $('#loadingOverlay').show().find('span').text(TLi18n.t('reqexp.generating'));
  $('#btnExport').prop('disabled', true);

  $.ajax({
    url: API,
    method: 'POST',
    data: params,
    xhrFields: { responseType: 'blob' },
    beforeSend: function (xhr) { xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest'); }
  }).done(function (blob, textStatus, xhr) {
    var contentType = xhr.getResponseHeader('Content-Type') || '';
    if (contentType.indexOf('application/json') !== -1) {
      var reader = new FileReader();
      reader.onload = function () {
        var msg = TLi18n.t('reqexp.errExport');
        try { msg = JSON.parse(reader.result).message || msg; } catch (e) {}
        toast(msg, true);
        $('#loadingOverlay').hide();
        $('#btnExport').prop('disabled', false);
      };
      reader.readAsText(blob);
      return;
    }
    var url = window.URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fn;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
    $('#loadingOverlay').hide();
    $('#btnExport').prop('disabled', false);
    toast(TLi18n.t('reqexp.exportDone'));
  }).fail(function (xhr) {
    var msg = TLi18n.t('reqexp.errExport');
    try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
    toast(msg, true);
    $('#loadingOverlay').hide();
    $('#btnExport').prop('disabled', false);
  });
}
</script>
</body>
</html>
