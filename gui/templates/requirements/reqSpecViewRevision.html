<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requirement Spec Revision Viewer</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-ghost { background: transparent; color: #ccc; border: 1px solid #555; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.btn-ghost:hover { border-color: #4ECDC4; color: #4ECDC4; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.card-title { background: #f7f7f7; padding: 10px 18px; font-size: 13px; font-weight: 700; color: #22242a; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 8px; }
.card-body { padding: 16px 18px; font-size: 13px; color: #444; }
.deleted-banner { background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; border-radius: 6px; padding: 14px 18px; font-size: 14px; margin: 16px 24px; }
.info-banner { background: #eaf7f6; border: 1px solid #bfe6e2; color: #1a7f79; border-radius: 6px; padding: 12px 18px; font-size: 13px; margin: 16px 24px; display: none; }
.warn-banner { background: #fff8e1; border: 1px solid #ffe082; color: #9a7d0a; border-radius: 6px; padding: 12px 18px; font-size: 13px; margin: 16px 24px; display: none; }
.id-chip { background: #22242a; color: #4ECDC4; padding: 3px 10px; border-radius: 3px; font-weight: 700; font-size: 13px; }
.badge-type { background: #e67e22; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.badge-rev { background: #3498db; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.badge-latest { background: #27ae60; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.badge-old { background: #95a5a6; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.kv { display: grid; grid-template-columns: 190px 1fr; row-gap: 7px; column-gap: 16px; }
.kv .k { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; padding-top: 2px; }
.kv .v { color: #333; word-break: break-word; }
.scope-text { white-space: pre-wrap; background: #fafafa; border: 1px solid #eee; border-radius: 5px; padding: 12px; color: #333; font-size: 13px; line-height: 1.55; }
.log-text { white-space: pre-wrap; background: #f4f8fb; border: 1px solid #dbe9f5; border-radius: 5px; padding: 12px; color: #333; font-size: 13px; line-height: 1.5; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.empty-state { padding: 30px; text-align: center; color: #888; font-size: 14px; }
</style>
</head>
<body>

<div class="header"><i class="fa fa-history"></i> <span data-i18n="rsvr.title">Requirement Spec Revision Viewer</span><span id="projName"></span><span id="localeSwitcher" style="float:right;"></span></div>

<div class="toolbar">
  <button class="btn-teal" onclick="loadView()"><i class="fa fa-refresh"></i> <span data-i18n="common.refresh">Refresh</span></button>
  <a class="btn-ghost" id="currentLink" href="#" target="_blank"><i class="fa fa-file-text-o"></i> <span data-i18n="rsvr.openCurrent">Open current revision</span></a>
  <span class="ctx" style="margin-left:auto;color:#aaa;font-size:12px;" id="infoLine"></span>
</div>

<div id="deletedBanner" class="deleted-banner" style="display:none;" data-i18n="rsvr.notFound"></div>
<div id="oldBanner" class="warn-banner" style="display:none;" data-i18n="rsvr.oldRevision"></div>

<div id="content">
  <div class="card">
    <div class="card-title"><i class="fa fa-info-circle"></i> <span data-i18n="rsvr.overview">Overview</span></div>
    <div class="card-body">
      <div class="kv">
        <div class="k" data-i18n="rsvr.identifier">Identifier</div><div class="v" id="vDocId"></div>
        <div class="k" data-i18n="rsvr.revision">Revision</div><div class="v" id="vRevision"></div>
        <div class="k" data-i18n="rsvr.type">Type</div><div class="v" id="vType"></div>
        <div class="k" data-i18n="rsvr.totalReq">Total requirements (declared)</div><div class="v" id="vTotalReq"></div>
        <div class="k" data-i18n="rsvr.createdBy">Created by</div><div class="v" id="vCreatedBy"></div>
        <div class="k" data-i18n="rsvr.createdOn">Created on</div><div class="v" id="vCreatedOn"></div>
        <div class="k" data-i18n="rsvr.modifiedBy">Last modified by</div><div class="v" id="vModifiedBy"></div>
        <div class="k" data-i18n="rsvr.modifiedOn">Last modified</div><div class="v" id="vModifiedOn"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><i class="fa fa-align-left"></i> <span data-i18n="rsvr.scope">Scope</span></div>
    <div class="card-body"><div class="scope-text" id="vScope"></div></div>
  </div>

  <div class="card">
    <div class="card-title"><i class="fa fa-sticky-note-o"></i> <span data-i18n="rsvr.logMessage">Revision log message</span></div>
    <div class="card-body"><div class="log-text" id="vLog"></div></div>
  </div>

  <div class="card" id="cfCard" style="display:none;">
    <div class="card-title"><i class="fa fa-tags"></i> <span data-i18n="rsvr.customFields">Custom Fields</span></div>
    <div class="card-body"><div class="kv" id="vCF"></div></div>
  </div>
</div>

<div class="footer" id="footerText"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/reqspec/index.php';
var REV_ID = 0;
var SPEC_ID = 0;
var TPROJECT_ID = 0;
var TOKEN = 0;

$(function() {
  var p = new URLSearchParams(window.location.search);
  REV_ID = parseInt(p.get('id') || p.get('revision_id') || p.get('item_id') || 0, 10);
  TPROJECT_ID = parseInt(p.get('tproject_id') || 0, 10);
  TLi18n.load(function() {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    if (!REV_ID) {
      $('#deletedBanner').css('display', 'block').attr('data-i18n', 'rsvr.noId');
      TLi18n.apply();
      return;
    }
    loadView();
  });
});

function loadView() {
  var tok = ++TOKEN;
  var url = API + '?action=spec_revision_view&id=' + REV_ID;
  if (TPROJECT_ID > 0) url += '&tproject_id=' + TPROJECT_ID;
  $.getJSON(url, function(r) {
    if (tok !== TOKEN) return;
    if (r.status !== 'ok') {
      if (r.message) { $('#deletedBanner').text(r.message); }
      $('#deletedBanner').css('display', 'block');
      $('#content').hide();
      $('#footerText').text('TestLink 2.0.1 - ' + TLi18n.t('rsvr.title'));
      return;
    }
    $('#deletedBanner').hide();
    $('#content').show();
    var rev = r.revision;
    SPEC_ID = r.spec_id;
    TPROJECT_ID = r.tproject_id || TPROJECT_ID;
    $('#projName').text(' - ' + (r.tproject_name || ('#' + r.tproject_id)));
    renderOverview(r, rev);
    renderCF(r);
    showBanners(rev);
    $('#footerText').text('TestLink 2.0.1 - ' + TLi18n.t('rsvr.title') +
      ' | ' + TLi18n.t('common.generatedOn') + ' ' + new Date().toLocaleString());
  }).fail(function(xhr) {
    if (tok !== TOKEN) return;
    var msg = TLi18n.t('rsvr.loadError');
    try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e) {}
    $('#deletedBanner').css('display', 'block').attr('data-i18n', null)
      .text(TLi18n.t('rsvr.loadError') + ': ' + msg);
    $('#content').hide();
  });
}

function renderOverview(r, rev) {
  $('#vDocId').html('<span class="id-chip">' + escapeHtml(rev.doc_id) + '</span> <b>' +
    escapeHtml(rev.name) + '</b> <span class="id-chip" style="font-size:10px;color:#999;"># ' +
    escapeHtml(r.spec_doc_id) + '</span>');
  var revBadge = rev.is_latest
    ? '<span class="badge-latest" data-i18n="rsvr.latest">LATEST</span>'
    : '<span class="badge-old" data-i18n="rsvr.historical">HISTORICAL</span>';
  $('#vRevision').html('<span class="badge-rev">' + TLi18n.t('rsvr.revision') + ' ' +
    escapeHtml(String(rev.revision)) + '</span> <span> ' + revBadge + '</span>');
  TLi18n.apply();
  $('#vType').html('<span class="badge-type">' + escapeHtml(rev.type_label || rev.type) + '</span>');
  $('#vTotalReq').text(rev.total_req != null ? String(rev.total_req) : '-');
  $('#vCreatedBy').text(rev.author || '-');
  $('#vCreatedOn').text(fmtTs(rev.creation_ts));
  if (rev.modified_never) {
    $('#vModifiedBy').text('-');
    $('#vModifiedOn').text('-');
  } else {
    $('#vModifiedBy').text(rev.modifier || '-');
    $('#vModifiedOn').text(fmtTs(rev.modification_ts));
  }
  $('#vScope').text(rev.scope || '-');
  $('#vLog').text(rev.log_message || '-');
  $('#infoLine').text('#' + rev.id + ' · ' + TLi18n.t('rsvr.revision') + ' r' + rev.revision);
  $('#currentLink').attr('href', '/gui/templates/requirements/reqSpecView.html?id=' +
    SPEC_ID + '&tproject_id=' + TPROJECT_ID);
}

function renderCF(r) {
  var out = '';
  $.each(r.cfields || [], function(i, cf) {
    out += '<div class="k">' + escapeHtml(cf.label) + '</div>' +
      '<div class="v">' + escapeHtml(cf.value || '') + '</div>';
  });
  if (!out) { $('#cfCard').hide(); return; }
  $('#vCF').html(out);
  $('#cfCard').show();
}

function showBanners(rev) {
  if (!rev.is_latest) { $('#oldBanner').css('display', 'block'); }
  else { $('#oldBanner').css('display', 'none'); }
}

function fmtTs(ts) {
  if (!ts) return '-';
  var d = new Date(String(ts).replace(' ', 'T'));
  if (isNaN(d.getTime())) return String(ts);
  return d.toLocaleString();
}

function escapeHtml(s) {
  return $('<div>').text(s == null ? '' : String(s)).html();
}
</script>
</body>
</html>
