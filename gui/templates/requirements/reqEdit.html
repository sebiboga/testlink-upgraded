<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requirement Editor</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; color: #0d3f3c; opacity: 1; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-version { background: #3598dc; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-version:hover { background: #2a83c0; }
.btn-ghost { background: transparent; color: #ccc; border: 1px solid #555; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
.btn-ghost:hover { border-color: #4ECDC4; color: #4ECDC4; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.card-title { background: #f7f7f7; padding: 10px 18px; font-size: 13px; font-weight: 700; color: #22242a; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 8px; }
.card-body { padding: 18px; font-size: 13px; color: #444; }
.f-label { color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.f-req { color: #e6605e; }
.form-control { font-size: 13px; height: 34px; border-radius: 4px; }
textarea.form-control { height: auto; min-height: 120px; }
.version-chip { background: #22242a; color: #4ECDC4; padding: 3px 10px; border-radius: 3px; font-weight: 700; font-size: 13px; }
.error-bar { background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; border-radius: 6px; padding: 12px 16px; font-size: 13px; margin: 16px 24px 0; display: none; }
.info-bar { background: #eaf6ef; border: 1px solid #b7e0c3; color: #1e8e4e; border-radius: 6px; padding: 12px 16px; font-size: 13px; margin: 16px 24px 0; }
.coverage-hint { color: #888; font-size: 12px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.readonly-note { background: #fff8e1; border: 1px solid #efe0a6; color: #8a6d3b; border-radius: 6px; padding: 12px 16px; font-size: 13px; margin: 16px 24px 0; }
.input-group .form-control { height: 34px; }
.lastdoc-btn { background: #4ECDC4; color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0 12px; border-radius: 0 4px 4px 0; font-size: 13px; }
.lastdoc-btn:hover { background: #3dbdb5; }
.cf-block-title { color: #22242a; font-size: 13px; font-weight: 700; margin-bottom: 12px; }
.cf-row { margin-bottom: 14px; max-width: 720px; }
.cf-label { color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.cf-label .f-req { color: #e6605e; }
.cf-hint { color: #888; font-size: 11px; margin-top: 3px; }
select.cf-input[multiple] { height: auto; min-height: 72px; }
</style>
</head>
<body>

<div class="header"><i class="fa fa-file-text-o"></i> <span data-i18n="reqe.pageTitle">Requirement Editor</span><span id="projName"></span><span id="localeSwitcher" style="float:right;"></span></div>

<div class="toolbar">
  <span class="ctx" id="specLine"></span>
  <span class="ctx"><span data-i18n="reqe.version">Version</span>: <b id="versionChip" class="version-chip">-</b></span>
  <span style="flex:1"></span>
  <button id="newVersionBtn" class="btn-version" style="display:none;"><i class="fa fa-code-branch"></i> <span data-i18n="reqe.newVersion">Create New Version</span></button>
  <button class="btn-teal" onclick="save()"><i class="fa fa-save"></i> <span data-i18n="common.save">Save</span></button>
  <button class="btn-ghost" onclick="goBack()"><i class="fa fa-arrow-left"></i> <span data-i18n="common.cancel">Cancel</span></button>
</div>

<div id="readonlyNote" class="readonly-note" style="display:none;" data-i18n="reqe.readonly"></div>
<div id="errorBar" class="error-bar"></div>
<div id="infoBar" class="info-bar" style="display:none;"></div>

<div class="card">
  <div class="card-title"><i class="fa fa-edit"></i> <span data-i18n="reqe.details">Requirement details</span></div>
  <div class="card-body">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label class="f-label" data-i18n="reqe.docId">Document ID <span class="f-req">*</span></label>
          <div class="input-group">
            <input type="text" id="reqDocId" class="form-control" maxlength="64">
            <span id="insertLastDocIdBtn" class="input-group-addon lastdoc-btn" style="display:none;"
                  title="" onclick="insertLastDocId()"><i class="fa fa-mouse-pointer"></i></span>
            <span id="btnEventHistory" class="input-group-addon lastdoc-btn" style="display:none;"
                  title="" onclick="showEventHistory()"><i class="fas fa-history"></i></span>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label class="f-label" data-i18n="reqe.title">Title <span class="f-req">*</span></label>
          <input type="text" id="reqTitle" class="form-control" maxlength="100">
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label class="f-label" data-i18n="reqe.status">Status</label>
          <select id="reqStatus" class="form-control"></select>
        </div>
      </div>
      <div class="col-md-3">
        <div class="form-group">
          <label class="f-label" data-i18n="reqe.type">Type</label>
          <select id="reqType" class="form-control"></select>
        </div>
      </div>
      <div id="expectedCoverageCol" class="col-md-3">
        <div class="form-group">
          <label class="f-label" data-i18n="reqe.expectedCoverage">Expected Coverage</label>
          <input type="text" id="reqExpectedCoverage" class="form-control" maxlength="6">
          <div class="coverage-hint" data-i18n="reqe.coverageHint">How many test cases should cover this requirement.</div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="form-group">
          <label class="f-label" data-i18n="reqe.scope">Scope / Description</label>
          <textarea id="reqScope" class="form-control"></textarea>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="card" id="cfCard" style="display:none;">
  <div class="card-title"><i class="fa fa-tags"></i> <span data-i18n="reqe.customFields">Custom Fields</span></div>
  <div class="card-body">
    <div id="cfRows"></div>
  </div>
</div>

<div class="footer"><span id="footerText">TestLink 2.0.1 - Requirement Editor</span></div>

<form id="eventhistory" target="_blank" method="GET" action="/gui/templates/eventviewer/eventviewer.html" style="display:none;">
  <input type="hidden" name="object_id" id="eh_object_id">
  <input type="hidden" name="object_type" id="eh_object_type" value="requirements">
</form>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/reqedit/index.php';
var REQ_ID = 0;
var SPEC_ID = 0;
var TPROJECT_ID = 0;
var EDIT_VERSION_ID = 0;
var MODE = 'create';
var OPTIONS = null;
var CURRENT = null;
var CAN_MANAGE = false;
var CAN_VIEW_EVENTS = false;

function fillSelect($sel, map, selected) {
  $sel.empty();
  $.each(map || {}, function(code, label) {
    $sel.append($('<option>').val(code).text(label));
  });
  if (selected !== undefined && selected !== null && selected !== '') {
    $sel.val(String(selected));
  }
}

/* Refs #1376: legacy expected-coverage gates (reqEdit.tpl:345 + reqCommands.class.php:33):
   the field is a FREE NUMERIC input and it is hidden entirely when coverage management is
   disabled or when the selected requirement type is not enabled in type_expected_coverage.
   When hidden, legacy persisted expected_coverage = 0. */
function coverageManagementEnabled() {
  return !(OPTIONS && OPTIONS.expectedCoverageManagement === false);
}

function coverageEnabledForType(type) {
  var byType = (OPTIONS && OPTIONS.expectedCoverageByType) || {};
  var v = byType[String(type)];
  return (v === undefined) ? true : (v == 1);
}

function refreshCoverageField() {
  var visible = coverageManagementEnabled() && coverageEnabledForType($('#reqType').val());
  $('#expectedCoverageCol').toggle(!!visible);
  return visible;
}

function currentCoverageEnabled() {
  return coverageManagementEnabled() && coverageEnabledForType($('#reqType').val());
}

/* Refs #1380: mirror legacy checkmodified.js - warn on unload when edits are
   pending, suppress the warning once Save/Cancel force a deliberate
   navigation (legacy reqEdit.tpl BUGID 4153 handling). */
var content_modified = false;
var show_modified_warning = true;

function markModified() {
  content_modified = true;
}

function resetModified() {
  content_modified = false;
}

function doBeforeUnload(e) {
  if (!show_modified_warning || !content_modified) {
    return;
  }
  var msg = TLi18n.t('reqe.unsavedWarning');
  e = e || window.event;
  if (e) {
    if (e.preventDefault) e.preventDefault();
    e.returnValue = msg;
  }
  return msg;
}

window.onbeforeunload = doBeforeUnload;

/* Legacy parity: reqEdit.tpl showEventHistoryFor(req_id,'requirements') opens
   the event viewer for the requirement in a new tab (mgt_view_events). */
function showEventHistory() {
  if (!REQ_ID) { return; }
  $('#eh_object_id').val(REQ_ID);
  $('#eventhistory').submit();
}

function goBack() {
  show_modified_warning = false;
  if (window.history.length > 1) { window.history.back(); }
  else { window.parent && window.parent.mainframe ? window.parent.location.href = '/gui/templates/requirements/reqOverview.html?tproject_id=' + TPROJECT_ID : window.location.href = '/index.php'; }
}

function showError(msg) {
  $('#errorBar').text(msg).show();
}
function hideError() { $('#errorBar').hide(); }

function loadForm() {
  hideError();
  var url = API + '?action=form' +
    (REQ_ID > 0 ? '&id=' + REQ_ID : '&spec_id=' + SPEC_ID) +
    '&tproject_id=' + TPROJECT_ID;
  if (REQ_ID > 0 && EDIT_VERSION_ID > 0) url += '&version_id=' + EDIT_VERSION_ID;
  $.getJSON(url, function(r) {
    if (r.status !== 'ok') { showError(r.message || TLi18n.t('reqe.loadError')); return; }
    MODE = r.mode;
    OPTIONS = r.options || {};
    CURRENT = r.requirement || {};
    EDIT_VERSION_ID = CURRENT.version_id || EDIT_VERSION_ID;
    CURRENT.last_doc_id = r.last_doc_id || null;
    CURRENT.allow_insert_last_doc_id = !!(r.allow_insert_last_doc_id);
    SPEC_ID = CURRENT.srs_id || SPEC_ID;
    $('#footerText').text('TestLink 2.0.1 - ' + TLi18n.t('reqe.pageTitle'));

    $('#specLine').html('<span data-i18n="reqe.spec">Specification</span>: <b>' + esc(CURRENT.spec_title) + '</b>');
    $('#projName').text((r.tproject_name ? ' | ' + r.tproject_name : ''));
    $('#versionChip').text(CURRENT.version || 0);

    $('#reqDocId').val(CURRENT.req_doc_id || '');
    $('#reqTitle').val(CURRENT.title || '');
    $('#reqScope').val(CURRENT.scope || '');

    fillSelect($('#reqStatus'), OPTIONS.reqStatuses, CURRENT.status);
    fillSelect($('#reqType'), OPTIONS.reqTypes, CURRENT.type);
    /* Refs #1376: free numeric input, value carried as-is (any positive int) */
    $('#reqExpectedCoverage').val(
      (CURRENT.expected_coverage !== undefined && CURRENT.expected_coverage !== null && CURRENT.expected_coverage !== '')
        ? CURRENT.expected_coverage : 1);
    refreshCoverageField();

resetModified();
    var canManage = r.rights && r.rights.manage;
    CAN_MANAGE = !!canManage;
    CAN_VIEW_EVENTS = !!(r.rights && r.rights.canViewEvents);
    /* Legacy reqEdit.tpl:288: event-history icon shown only on edit mode AND
       mgt_view_events right. */
    $('#btnEventHistory').toggle(MODE === 'edit' && CAN_VIEW_EVENTS);
    if (MODE === 'edit' && CAN_VIEW_EVENTS) {
      $('#btnEventHistory').attr('title', TLi18n.t('reqe.showEventHistory'));
    }
    if (MODE === 'edit') {
      $('#newVersionBtn').show();
      if (!canManage) {
        setEditable(false);
        $('#readonlyNote').show();
      }
    } else {
      $('#newVersionBtn').hide();
      if (!canManage) { setEditable(false); $('#readonlyNote').show(); }
    }
    applyLastDocIdHelper();
    /* Refs #1374: design-time CF inputs (values already carried by the BFF). */
    renderCustomFields(r.custom_fields || []);
  }).fail(function(xhr) {
    var msg = TLi18n.t('reqe.loadError');
    try { if (xhr.responseJSON && xhr.responseJSON.message) { msg = xhr.responseJSON.message; } } catch (e) {}
    showError(msg);
  });
}

function setEditable(on) {
  $('.form-control').prop('disabled', !on);
}

/* Mirrors legacy insert_last_doc_id(): fill Document ID with the project's last
   req doc id (only offered in create mode when config
   req_cfg->allow_insertion_of_last_doc_id is enabled). */
function insertLastDocId() {
  if (!CURRENT || !CURRENT.last_doc_id) { return; }
  $('#reqDocId').val(CURRENT.last_doc_id);
  $('#reqDocId').trigger('change');
}

function applyLastDocIdHelper() {
  var showBtn = MODE === 'create' && CAN_MANAGE && CURRENT &&
                CURRENT.allow_insert_last_doc_id && CURRENT.last_doc_id;
  $('#insertLastDocIdBtn').toggle(!!showBtn);
  if (showBtn) {
    $('#insertLastDocIdBtn').attr('title', TLi18n.t('reqe.insertLastDocId') + ': "' + CURRENT.last_doc_id + '"');
  }
}

/* ========================================================================
   Refs #1374: design-time custom-field inputs.  Mirrors gui/templates/testcases/
   testSpec.html cfOptionsList/cfInputHtml/customFieldsHtml, adapting the same
   cf-input naming convention (custom_field_<type>_<id>) for legacy _build_cfield
   parity.  collectCustomFields() gathers the user inputs into the JSON payload
   custom_fields:[{id,type,value}] the BFF save handler consumes via
   saveReqCustomFields → reqCfValueSet → design_values_to_db.
   ======================================================================== */
function cfOptionsList(cf) {
  var raw = cf.possible_values || '';
  return raw.split('|').filter(function (v) { return v.trim() !== ''; });
}

function cfInputHtml(cf) {
  var type = cf.verbose_type || 'string';
  var val  = (cf.value !== undefined && cf.value !== null) ? cf.value : '';
  var cls  = 'form-control cf-input';
  var req  = cf.required ? ' required' : '';
  var label = esc(cf.label || '');
  var requiredMark = cf.required ? ' <span style="color:#e6605e;">*</span>' : '';
  var cfId   = cf.id != null ? cf.id : 0;
  var typeId = cf.type != null ? cf.type : 0;
  var baseName = 'custom_field_' + typeId + '_' + cfId;
  var nameAttr = '';
  if (type === 'date' || type === 'datetime') {
    nameAttr = ' name="' + baseName + '_input"';
  } else {
    nameAttr = ' name="' + baseName + '"';
  }
  var inner = '';
  switch (type) {
    case 'numeric': case 'float':
      inner = '<input type="number" step="any" class="' + cls + '"' + nameAttr + ' value="' + esc(val) + '"' + req + '>';
      break;
    case 'email':
      inner = '<input type="email" class="' + cls + '"' + nameAttr + ' value="' + esc(val) + '"' + req + '>';
      break;
    case 'checkbox':
      inner = '<label style="display:flex;align-items:center;gap:8px;font-weight:normal;">' +
        '<input type="checkbox" class="cf-input"' + nameAttr + ' value="1"' + (val === '1' ? ' checked' : '') + '> ' +
        TLi18n.t('reqe.yes') + '</label>';
      break;
    case 'list':
      inner = '<select class="' + cls + '"' + nameAttr + '>' +
        '<option value="">' + TLi18n.t('reqe.cfSelectEmpty') + '</option>' +
        cfOptionsList(cf).map(function (opt) {
          return '<option value="' + esc(opt) + '"' + (val === opt ? ' selected' : '') + '>' + esc(opt) + '</option>';
        }).join('') + '</select>';
      break;
    case 'radio':
      inner = cfOptionsList(cf).map(function (opt) {
        return '<label style="display:flex;align-items:center;gap:8px;font-weight:normal;margin-right:14px;">' +
          '<input type="radio" class="cf-input"' + nameAttr + ' value="' + esc(opt) + '"' + (val === opt ? ' checked' : '') + '> ' +
          esc(opt) + '</label>';
      }).join('');
      break;
    case 'multiselection list':
      inner = '<select multiple size="' + Math.max(3, cfOptionsList(cf).length) + '" class="' + cls + '"' + nameAttr + '>' +
        cfOptionsList(cf).map(function (opt) {
          var sel = val.split('|').indexOf(opt) !== -1 ? ' selected' : '';
          return '<option value="' + esc(opt) + '"' + sel + '>' + esc(opt) + '</option>';
        }).join('') + '</select>';
      break;
    case 'date':
      inner = '<input type="date" class="' + cls + '"' + nameAttr + ' value="' + esc(val) + '"' + req + '>';
      break;
    case 'datetime':
      inner = '<input type="datetime-local" class="' + cls + '"' + nameAttr + ' value="' + esc(val) + '"' + req + '>';
      break;
    case 'text area':
      inner = '<textarea class="' + cls + '"' + nameAttr + req + '>' + esc(val) + '</textarea>';
      break;
    default:
      inner = '<input type="text" class="' + cls + '"' + nameAttr + ' value="' + esc(val) + '"' + req + '>';
      break;
  }
  return '<div class="cf-row" data-cfid="' + cfId + '" data-cftype="' + typeId + '"' +
    (cf.required ? ' data-required="1"' : '') + '>' +
    '<div class="cf-label">' + label + requiredMark + '</div>' + inner +
    '</div>';
}

function renderCustomFields(cfList) {
  if (!cfList || !cfList.length) { $('#cfCard').hide(); return; }
  $('#cfCard').show();
  var h = '';
  cfList.forEach(function (cf) { h += cfInputHtml(cf); });
  $('#cfRows').html(h);
}

function collectCustomFields() {
  var cfs = [];
  $('#cfRows .cf-row').each(function (i, row) {
    var $r = $(row);
    var val = '';
    var $radio = $r.find('input[type="radio"]:checked');
    if ($radio.length) { val = $radio.val() || ''; }
    var $input = $r.find('input.cf-input:not([type="radio"])');
    if (!val && $input.length) {
      if ($input.attr('type') === 'checkbox') {
        val = $input.is(':checked') ? '1' : '';
      } else {
        val = $input.val();
      }
    }
    var $sel = $r.find('select.cf-input');
    if (!val && $sel.length) {
      val = $sel.attr('multiple') ? ($sel.val() || []) : ($sel.val() || '');
    }
    if (!val) { val = $r.find('textarea.cf-input').val() || ''; }
    cfs.push({
      id:    parseInt($r.attr('data-cfid'), 10),
      type:  parseInt($r.attr('data-cftype'), 10),
      value: val
    });
  });
  return cfs;
}

function validateCustomFieldsUI() {
  var bad = null;
  $('#cfRows .cf-row[data-required="1"]').each(function (i, row) {
    var $r = $(row);
    var val = '';
    var $radio = $r.find('input[type="radio"]:checked');
    if ($radio.length) { val = $radio.val() || ''; }
    var $input = $r.find('input.cf-input:not([type="radio"])');
    if (!val && $input.length) {
      val = $input.attr('type') === 'checkbox'
        ? ($input.is(':checked') ? '1' : '') : ($input.val() || '');
    }
    var $sel = $r.find('select.cf-input');
    if (!val && $sel.length) {
      var v = $sel.val();
      val = v ? (typeof v === 'object' ? v.join('|') : v) : '';
    }
    if (!val) { val = $r.find('textarea.cf-input').val() || ''; }
    if (!val && !bad) {
      bad = $r.find('.cf-label').text().replace(/[*\s]+$/, '') || TLi18n.t('reqe.customFields');
    }
  });
  return bad;
}

function sanitize(v) { return $('<div>').text(v == null ? '' : String(v)).html(); }
function esc(v) { return $('<div>').text(v == null ? '' : String(v)).html(); }

function save() {
  hideError();
  $('#infoBar').hide();
  /* Refs #1376: legacy reqEdit.tpl validation — for an enabled type the coverage
     must be a number > 0; for a disabled type (or management disabled) legacy
     forces the stored value to 0. */
  var expectedCoverage = 0;
  if (currentCoverageEnabled()) {
    expectedCoverage = parseInt($('#reqExpectedCoverage').val(), 10);
    if (isNaN(expectedCoverage)) { showError(TLi18n.t('reqe.warningExpectedCoverage')); return; }
    if (expectedCoverage < 1) { showError(TLi18n.t('reqe.warningExpectedCoverageRange')); return; }
  }
  var payload = {
    tproject_id: TPROJECT_ID,
    req_doc_id: $.trim($('#reqDocId').val()),
    title: $.trim($('#reqTitle').val()),
    scope: $('#reqScope').val(),
    status: $('#reqStatus').val(),
    type: $('#reqType').val(),
    expected_coverage: expectedCoverage
  };
  if (!payload.req_doc_id) { showError(TLi18n.t('reqe.errDocId')); return; }
  if (!payload.title) { showError(TLi18n.t('reqe.errTitle')); return; }
  /* Refs #1374: legacy reqEdit.tpl validateForm() calls validateCustomFields()
     over the inputs in #custom_field_container (reqEdit.tpl:93-114); the modern
     editor enforces required CFs client-side with the same warn-and-abort. */
  var missingCf = validateCustomFieldsUI();
  if (missingCf) {
    showError(TLi18n.t('reqe.cfRequired').replace('%s', missingCf));
    return;
  }
  payload.custom_fields = collectCustomFields();
  if (MODE === 'edit') {
    payload.id = REQ_ID;
    if (EDIT_VERSION_ID > 0) payload.version_id = EDIT_VERSION_ID;
  }
  else { payload.spec_id = SPEC_ID; }

  doSave(payload, function(r) {
    /* Refs #1375: legacy prompt4revision/prompt4log (reqEdit.tpl:115-151).
       The data is already persisted by this first round-trip (legacy first
       submit parity); the prompt only asks whether to create a REVISION and
       with which log message:
         'suggest' -> scope-only change, revision optional (cancel = save
                      without revision, exactly like the legacy Ext prompt).
         'force'   -> status/type/coverage/doc-id/title changed, revision
                      expected; cancel leaves the save without a revision. */
    if (r.revision_prompt === 'suggest' || r.revision_prompt === 'force') {
      var revLog = window.prompt(
        r.revision_prompt === 'force'
          ? TLi18n.t('reqe.revLogPrompt')
          : TLi18n.t('reqe.revScopePrompt'), '');
      if (revLog === null) { showSaved(r); return; }
      payload.create_revision = true;
      payload.log_message = revLog;
      doSave(payload, showSaved);
      return;
    }
    showSaved(r);
  });
}

/* Refs #1375: single AJAX save call shared by the first round-trip and the
   confirmed revision round-trip. */
function doSave(payload, onOk) {
  $.ajax({
    url: API + '?action=save',
    method: 'POST',
    contentType: 'application/json',
    data: JSON.stringify(payload),
    success: function(r) {
      if (r.status !== 'ok') { showError(r.message || TLi18n.t('reqe.saveError')); return; }
      onOk(r);
    },
    error: function(xhr) {
      var msg = TLi18n.t('reqe.saveError');
      try { if (xhr.responseJSON && xhr.responseJSON.message) { msg = xhr.responseJSON.message; } } catch (e) {}
      showError(msg);
    }
  });
}

function showSaved(r) {
  hideError();
  resetModified();
  if (r && r.id) { REQ_ID = r.id; MODE = 'edit'; $('#newVersionBtn').show(); applyLastDocIdHelper(); }
  $('#infoBar').text((r && r.revision_created) ? TLi18n.t('reqe.revisionCreated') : TLi18n.t('reqe.saved')).show();
  setTimeout(function() { $('#infoBar').fadeOut(); }, 2500);
}

function newVersion() {
  if (!REQ_ID) { return; }
  /* Refs #1377: legacy ask4log() (reqViewVersions.tpl:155) prompts for a log
     message before creating the new version (commit_title / please_add_revision_log).
     Reuse the modern revision-log prompt pattern (reqSpecView.html newRevision()). */
  var logMsg = window.prompt(TLi18n.t('reqe.newVersionPrompt'), '');
  if (logMsg === null) { return; }
  hideError();
  $.ajax({
    url: API + '?action=version&id=' + REQ_ID,
    method: 'POST',
    contentType: 'application/json',
    data: JSON.stringify({ tproject_id: TPROJECT_ID, id: REQ_ID,
                           version_id: (CURRENT && CURRENT.version_id) || 0,
                           log_message: logMsg }),
    success: function(r) {
      if (r.status !== 'ok') { showError(r.message || TLi18n.t('reqe.versionError')); return; }
      EDIT_VERSION_ID = parseInt(r.version_id || 0, 10);
      if (CURRENT) { CURRENT.version_id = EDIT_VERSION_ID; }
      $('#infoBar').text(TLi18n.t('reqe.versionCreated') + ' v' + r.version).show();
      setTimeout(function() { $('#infoBar').fadeOut(); }, 2500);
      loadForm();
    },
    error: function(xhr) {
      var msg = TLi18n.t('reqe.versionError');
      try { if (xhr.responseJSON && xhr.responseJSON.message) { msg = xhr.responseJSON.message; } } catch (e) {}
      showError(msg);
    }
  });
}

$(function() {
  var p = new URLSearchParams(window.location.search);
  REQ_ID = parseInt(p.get('id') || p.get('requirement_id') || 0, 10);
  SPEC_ID = parseInt(p.get('spec_id') || 0, 10);
  TPROJECT_ID = parseInt(p.get('tproject_id') || p.get('tp_id') || 0, 10);
  EDIT_VERSION_ID = parseInt(p.get('version_id') || p.get('req_version_id') || 0, 10);
  TLi18n.load(function() {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    $('#footerText').text('TestLink 2.0.1 - ' + TLi18n.t('reqe.pageTitle'));
    if (REQ_ID <= 0 && SPEC_ID <= 0) { showError(TLi18n.t('reqe.errContext')); return; }
    loadForm();
  });
  $('#newVersionBtn').on('click', newVersion);
  /* Refs #1376: legacy configure_attr() (reqEdit.tpl:188) — hide/show the
     coverage field when the requirement type changes. */
  $('#reqType').on('change', function() {
    refreshCoverageField();
  });
  /* Refs #1380: track every edit on the form controls (scope, title, doc id,
     status, type, expected coverage) so an unload mid-edit warns the user. */
  $(document).on('input change', '.form-control', markModified);
});
</script>
</body>
