<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Message</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }

.header {
  background: #4ECDC4; color: #fff; padding: 14px 24px;
  font-size: 20px; font-weight: 700; letter-spacing: 1px;
}
.header span.sub { font-size: 13px; font-weight: 400; opacity: .85; margin-left: 12px; }

.toolbar {
  background: #22242a; padding: 10px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.toolbar .tbtn {
  display: inline-flex; align-items: center; gap: 6px;
  background: #33363f; color: #fff; border: none; border-radius: 4px;
  padding: 7px 12px; font-size: 12px; cursor: pointer; text-decoration: none;
}
.toolbar .tbtn:hover { background: #454955; color: #fff; text-decoration: none; }
.toolbar .tbtn i { color: #4ECDC4; }

.card {
  background: #fff; border-radius: 8px; margin: 20px 24px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden;
}
.card-head {
  padding: 14px 24px; border-bottom: 1px solid #eee; display: flex;
  align-items: center; gap: 10px; flex-wrap: wrap;
}
.card-head h3 { margin: 0; font-size: 16px; color: #22242a; }
.card-body { padding: 6px 24px 18px; }

table.logctx { width: 100%; border-collapse: collapse; }
table.logctx th {
  color: #555; font-weight: 600; width: 220px; font-size: 12px;
  text-align: left; padding: 8px 12px 8px 0; vertical-align: top;
}
table.logctx td { color: #333; font-size: 13px; padding: 8px 0; word-break: break-word; }

.type-badge {
  display: inline-block; padding: 2px 10px; border-radius: 3px;
  font-size: 11px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: .5px;
}
.type-requirement_spec_version { background: #9b59b6; }
.type-requirement_version { background: #4ECDC4; }
.type-requirement { background: #3498db; }

#logBody {
  white-space: pre-wrap; word-break: break-word;
  font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.6;
  color: #333; background: #fafbfc; border: 1px solid #e6e9ee;
  border-radius: 6px; padding: 16px 18px; margin: 4px 0 0;
  max-height: 46vh; overflow: auto;
}
#logBody:empty { display: none; }
.log-empty { color: #8a8a8a; font-style: italic; margin: 4px 0 0; font-size: 13px; }
.log-meta { color: #999; font-size: 11px; margin: 8px 0 0; }

.state-box {
  background: #fff; border-radius: 8px; margin: 20px 24px; padding: 28px 32px; text-align: center;
}
.state-box i { font-size: 34px; margin-bottom: 10px; display: block; }
.state-box h3 { margin: 0 0 8px; font-size: 18px; color: #22242a; }
.state-box p { margin: 0; font-size: 14px; color: #777; }
.state-denied { border: 1px solid #f0d0d0; border-left: 4px solid #e6605e; }
.state-denied i { color: #e6605e; }
.state-error { border: 1px solid #f0d0d0; border-left: 4px solid #e6605e; }
.state-error i { color: #e6605e; }
.state-notfound { border: 1px solid #f3e6c8; border-left: 4px solid #f0ad4e; }
.state-notfound i { color: #f0ad4e; }

.footer {
  padding: 12px 24px; color: #888; font-size: 12px;
  border-top: 1px solid #ddd; background: #fff;
}
</style>
</head>
<body>

<div class="header">
  <span data-i18n="logv.title">Log Message</span>
  <span class="sub" data-i18n="logv.subtitle">full, untruncated change log</span>
  <div id="localeSwitcher" style="float:right;"></div>
</div>

<div class="toolbar">
  <button type="button" class="tbtn" id="btnRefresh"><i class="fa fa-sync"></i> <span data-i18n="common.refresh">Refresh</span></button>
  <button type="button" class="tbtn" id="btnCopy"><i class="fa fa-copy"></i> <span data-i18n="logv.copy">Copy log</span></button>
  <button type="button" class="tbtn" id="btnClose"><i class="fa fa-times"></i> <span data-i18n="common.close">Close</span></button>
</div>

<div class="card" id="ctxCard" style="display:none;">
  <div class="card-head">
    <h3 id="ctxTitle"></h3>
    <span id="typeBadge" class="type-badge"></span>
  </div>
  <div class="card-body">
    <table class="logctx">
      <tbody id="ctxBody"></tbody>
    </table>
  </div>
</div>

<div class="card" id="logCard" style="display:none;">
  <div class="card-head">
    <h3 data-i18n="logv.logHeading">Change log</h3>
    <span class="log-meta" id="logMeta"></span>
  </div>
  <div class="card-body">
    <pre id="logBody"></pre>
    <div class="log-empty" id="logEmpty" style="display:none;" data-i18n="common.emptyLogMessage"></div>
  </div>
</div>

<div class="state-box state-denied" id="accessDenied" style="display:none;">
  <i class="fa fa-lock"></i>
  <h3 data-i18n="ev.accessDeniedTitle">Access Denied</h3>
  <p data-i18n="logv.accessDeniedMsg">You do not have permission to view requirements.</p>
</div>

<div class="state-box state-notfound" id="notFound" style="display:none;">
  <i class="fa fa-search-minus"></i>
  <h3 data-i18n="logv.notFoundTitle">Log not found</h3>
  <p data-i18n="logv.notFoundMsg">The requested version or revision does not exist.</p>
</div>

<div class="state-box state-error" id="loadError" style="display:none;">
  <i class="fa fa-exclamation-triangle"></i>
  <h3 data-i18n="common.error">Error</h3>
  <p id="loadErrorMsg"></p>
</div>

<div class="footer"><span data-i18n="footers.logViewer">TestLink 2.0.1 - Log Message</span></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
function esc(s) {
  return s == null ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

var API = '/api/logviewer/index.php';
var qs = new URLSearchParams(window.location.search);
// `item_id` is the legacy getreqspeclog.php / getreqlog.php parameter name - kept
// so a legacy deep link (?item_id=N) still resolves.
var itemId = qs.get('id') || qs.get('item_id') || '';
var type = qs.get('type') || '';
var tproject_id = qs.get('tproject_id') || '';

// Legacy type aliases: getreqspeclog.php carried no type (always a spec
// revision), getreqlog.php auto-detected a requirement version vs revision.
var TYPE_ALIASES = {
  'reqspec': 'requirement_spec_version',
  'requirement_spec_version': 'requirement_spec_version',
  'spec_version': 'requirement_spec_version',
  'reqver': 'requirement_version',
  'requirement_version': 'requirement_version',
  'version': 'requirement_version',
  'req': 'requirement',
  'requirement': 'requirement',
  'reqrev': 'requirement',
  'requirement_revision': 'requirement'
};

var lastText = '';

$(function() {
  $('#btnClose').on('click', function() { window.close(); });
  $('#btnRefresh').on('click', function() { loadLog(); });
  $('#btnCopy').on('click', function() {
    if (!lastText) { return; }
    var done = function() { flash(TLi18n.t('logv.copied')); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastText).then(done, function() { legacyCopy(done); });
    } else {
      legacyCopy(done);
    }
  });

  TLi18n.load(function() {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    if (!itemId || !/^\d+$/.test(String(itemId))) {
      showState('#loadError');
      $('#loadErrorMsg').text(TLi18n.t('logv.missingId'));
      return;
    }
    if (!TYPE_ALIASES[type]) {
      showState('#loadError');
      $('#loadErrorMsg').text(TLi18n.t('logv.missingType'));
      return;
    }
    loadLog();
  });
});

function legacyCopy(done) {
  var ta = document.createElement('textarea');
  ta.value = lastText;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) { /* nothing to do */ }
  document.body.removeChild(ta);
  done();
}

function flash(msg) {
  var $b = $('#btnCopy');
  var orig = $b.html();
  $b.html('<i class="fa fa-check"></i> <span>' + esc(msg) + '</span>');
  setTimeout(function() { $b.html(orig); }, 2000);
}

function showState(sel) {
  $('#ctxCard').hide();
  $('#logCard').hide();
  $('#accessDenied').hide();
  $('#notFound').hide();
  $('#loadError').hide();
  if (sel) { $(sel).show(); }
}

function loadLog() {
  var q = '?action=log&type=' + encodeURIComponent(TYPE_ALIASES[type]) +
          '&id=' + encodeURIComponent(itemId);
  if (tproject_id) { q += '&tproject_id=' + encodeURIComponent(tproject_id); }
  $.ajax({ url: API + q, dataType: 'json' })
    .done(function(d) {
      if (!d || d.status !== 'ok' || !d.context || !d.log) {
        showState('#loadError');
        $('#loadErrorMsg').text((d && d.message) || TLi18n.t('common.errorLoading'));
        return;
      }
      render(d);
    })
    .fail(function(xhr) {
      if (xhr.status === 403) { showState('#accessDenied'); }
      else if (xhr.status === 404) { showState('#notFound'); }
      else if (xhr.status === 401) {
        // Session expired: the BFF answered 401, send the user to login.
        window.location.href = '/login.php?note=expired';
      } else {
        showState('#loadError');
        var msg = null;
        try { msg = JSON.parse(xhr.responseText).message; } catch (e) {}
        $('#loadErrorMsg').text(msg || TLi18n.t('common.errorLoading'));
      }
    });
}

function row(labelKey, value) {
  return '<tr><th>' + esc(TLi18n.t(labelKey)) + '</th><td>' + esc(value) + '</td></tr>';
}

function render(d) {
  var c = d.context;
  var label = (c.type === 'requirement_spec_version')
    ? TLi18n.t('logv.requirementSpec')
    : TLi18n.t('logv.requirement');

  $('#ctxTitle').text(c.object_id ? (c.object_id + ' — ' + (c.object_label || '')) : (c.object_label || label));
  $('#typeBadge').text(TLi18n.t('logv.type_' + c.type))
    .attr('class', 'type-badge type-' + c.type);

  var html = '';
  html += row('logv.objectKind', label);
  html += row('logv.testProject', c.parent_name || '');
  if (c.object_id) { html += row('logv.docId', c.object_id); }
  // For a requirement version / revision the owning spec's Doc ID is useful
  // context that the object row does not carry.
  if (c.parent_doc_id && c.parent_doc_id !== c.object_id) {
    html += row('logv.specDocId', c.parent_doc_id);
  }
  html += row('logv.version', c.version_label || '');
  html += row('logv.itemId', String(c.item_id));
  $('#ctxBody').html(html);

  lastText = d.log.text || '';
  // The payload is PLAIN TEXT: render it as text, never as markup, so a log
  // containing HTML can no longer be injected into the DOM (the legacy
  // getreqlog.php / getreqspeclog.php echoed it raw).
  $('#logBody').text(lastText);
  $('#logEmpty').toggle(!!d.log.is_empty);
  $('#logMeta').text(
    TLi18n.t('logv.charCount', { count: Array.from(lastText).length, raw: d.log.raw_length })
  );
  $('#btnCopy').prop('disabled', !!d.log.is_empty);

  showState('');
  $('#ctxCard').show();
  $('#logCard').show();
}
</script>
</body>
</html>
