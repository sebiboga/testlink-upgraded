<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requirements Overview</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/rowgroup/1.4.1/css/rowGroup.dataTables.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.switch-label { color: #fff; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.table-wrap { padding: 20px 24px; }
.table-wrap table { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); width: 100%; }
table.dataTable thead th { background: #22242a; color: #fff; font-size: 13px; padding: 10px 14px; }
table.dataTable tbody td { padding: 10px 14px; font-size: 13px; }
.badge-frozen { background: #3598dc; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.badge-open { background: #4ECDC4; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.cov-ok { color: #27ae60; font-weight: 700; }
.cov-low { color: #e6605e; font-weight: 700; }
.action-btn { cursor: pointer; color: #4ECDC4; margin-right: 8px; font-size: 14px; }
.action-btn:hover { color: #2d8e88; }
.dataTables_wrapper .dataTables_paginate .paginate_button.current { background: #4ECDC4 !important; color: #fff !important; border: none !important; }
.empty-state { padding: 40px; text-align: center; color: #888; font-size: 15px; }
.notes { padding: 0 24px 20px; color: #777; font-size: 12px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; }
.info-line { color: #aaa; font-size: 12px; margin-left: auto; }
/* Grid toolbar (legacy exttable.class.php:96-124 showToolbar) */
.grid-toolbar { background: #2c2f38; padding: 8px 24px; display: flex; gap: 8px; align-items: center; border-top: 1px solid #3a3d47; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; background: #3a3d47; color: #fff; border: none; border-radius: 4px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
.tbtn:hover { background: #4ECDC4; color: #fff; }
.tbtn i { color: #4ECDC4; }
.tbtn:hover i { color: #fff; }
.tbtn.active { background: #4ECDC4; color: #fff; }
.tbtn.active i { color: #fff; }
/* Group header rows (legacy groupTextTpl '{text} (N Items)', exttable.class.php:591) */
table.dataTable tbody tr.dtrg-group td { background: #e9f5f3; font-weight: 700; color: #2b6f69; cursor: pointer; padding: 8px 14px; font-size: 12px; }
table.dataTable tbody tr.dtrg-group td i { margin-right: 6px; color: #4ECDC4; }
table.dataTable tbody tr.dtrg-group td .gcount { font-weight: 400; color: #6aa; font-size: 11px; margin-left: 6px; }
</style>
</head>
<body>

<div class="header"><span data-i18n="header.reqOverview">Requirements Overview</span><span id="projName"></span><span id="localeSwitcher" style="float:right;"></span></div>

<div class="toolbar">
  <label class="switch-label"><input type="checkbox" id="allVersions"> <span data-i18n="ro.showAllVersionsBtn">Show all versions</span></label>
  <span class="info-line" id="infoLine"></span>
</div>

<!-- Legacy grid toolbar parity: lib/requirements/reqOverview.php:289-294
     (showToolbar, toolbarExpandCollapseGroupsButton, toolbarShowAllColumnsButton,
     toolbarRefreshButton, showGroupItemsCount) + exttable.class.php:104/109/119 -->
<div class="toolbar grid-toolbar" id="gridToolbar">
  <button type="button" class="tbtn" id="btnGroupToggle"><i class="fa fa-chevron-down"></i> <span data-i18n="ro.grid.expandCollapseGroups">Expand/Collapse Groups</span></button>
  <button type="button" class="tbtn" id="btnShowAllCols"><i class="fa fa-columns"></i> <span data-i18n="ro.grid.showAllColumns">Show all Columns</span></button>
  <button type="button" class="tbtn" id="btnRefresh"><i class="fa fa-refresh"></i> <span data-i18n="common.refresh">Refresh</span></button>
  <span style="flex:1"></span>
  <span id="gridToolbarInfo" style="color:#8a8f99;font-size:12px;"></span>
</div>

<div class="table-wrap" id="tableWrap" style="display:none;">
  <table id="reqTable" class="display" style="width:100%">
    <thead><tr id="headRow"></tr></thead>
    <tbody></tbody>
  </table>
</div>

<div class="empty-state" id="emptyState" style="display:none;"></div>

<div class="notes" id="notesBlock" style="display:none;">
  <p data-i18n="ro.notesReqOverview"></p>
  <p data-i18n="ro.hlpCoverageTable"></p>
</div>

<div class="footer" id="footerText"></div>
<div class="footer"><span data-i18n="footers.reqOverview">TestLink 2.0.1 - Requirements Overview</span></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap.min.js"></script>
<script src="https://cdn.datatables.net/rowgroup/1.4.1/js/dataTables.rowGroup.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/requirements/index.php';
var TPROJECT_ID = 0;
var META = null;
var table = null;
// Legacy parity (reqOverview.php init_args): an explicit all_versions request
// param wins; when omitted the server falls back to $_SESSION['all_versions'].
// After the first explicit toggle every subsequent call sends the param again.
var explicitAllVersions = null;
// Legacy grid grouping state (lib/requirements/reqOverview.php:282 setGroupByColumnName,
// exttable.class.php:588 hideGroupedColumn=true -> the grouped column is hidden by
// default and only revealed by the toolbarShowAllColumnsButton).
var collapsedGroups = Object.create(null);
var showGroupedCol = false;
var GRID_SPEC_COL = 'spec_path';
var SPEC_COL_IDX = 0;
// guard for the order.dt re-apply (see pinGroupOrder)
var reordering = false;

$(function() {
  var p = new URLSearchParams(window.location.search);
  TPROJECT_ID = parseInt(p.get('tproject_id') || 0);
  if (p.has('all_versions')) {
    explicitAllVersions = p.get('all_versions') === '1';
    $('#allVersions').prop('checked', explicitAllVersions);
  }
  TLi18n.load(function() {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    loadOverview();
  });
  $('#allVersions').on('change', function() {
    explicitAllVersions = $(this).is(':checked');
    loadOverview();
  });
  $('#btnRefresh').on('click', function() { loadOverview(); });
  $('#btnGroupToggle').on('click', toggleGroups);
  $('#btnShowAllCols').on('click', function() {
    showGroupedCol = !showGroupedCol;
    applyGroupedColState();
  });
  // Single group expand/collapse on click of a group header row (legacy ExtJS
  // group header toggle).
  $(document).on('click', '#reqTable tbody tr.dtrg-group', function() {
    var key = decodeURIComponent($(this).attr('data-key') || '');
    if (isGroupCollapsed(key)) { delete collapsedGroups[key]; } else { collapsedGroups[key] = true; }
    updateGroupToggleBtn();
    if (table) table.draw(false);
  });
  // Keep the group column as the primary sort criterion: DataTables RowGroup
  // only merges *contiguous* runs, so sorting by another column first would
  // split one req spec into several group headers.
  $(document).on('order.dt', function(e, settings) { pinGroupOrder(settings); });
});

function loadOverview() {
  var url = API + '/overview?tproject_id=' + TPROJECT_ID;
  if (explicitAllVersions !== null) {
    url += '&all_versions=' + ($('#allVersions').is(':checked') ? '1' : '0');
  }
  $.getJSON(url, function(r) {
    META = r.meta;
    $('#allVersions').prop('checked', !!r.all_versions);
    $('#projName').text(' - ' + (r.tproject_name || ('#' + r.meta.tproject_id)));
    renderTable(r.items);
    var info = TLi18n.t(r.all_versions ? 'ro.allVersionsDisplayed' : 'ro.latestVersionDisplayed');
    $('#infoLine').text(info + ' | ' + TLi18n.t('ro.countRows', {n: r.total}));
    $('#footerText').text(TLi18n.t('common.generatedOn') + ' ' + new Date().toLocaleString() +
      (r.elapsed_seconds ? ' (' + r.elapsed_seconds + ' s)' : ''));
    if (r.error) alert(r.error);
  }).fail(function(xhr) {
    var msg = 'Error';
    try { msg = JSON.parse(xhr.responseText).message; } catch(e) {}
    $('#emptyState').show().text(msg);
    $('#tableWrap').hide();
    $('#gridToolbar').hide();
    $('#emptyState').attr('data-i18n', null);
  });
}

function renderTable(items) {
  if (!items.length) {
    $('#tableWrap').hide();
    $('#gridToolbar').hide();
    $('#notesBlock').hide();
    $('#emptyState').show().attr('data-i18n', 'ro.noRequirements')
      .text(TLi18n.t('ro.noRequirements'));
    return;
  }
  $('#emptyState').hide();
  $('#notesBlock').show();
  $('#tableWrap').show();
  $('#gridToolbar').show();

  // build columns dynamically depending on cfg flags and linked custom fields
  var cols = [
    {key: 'spec_path'},
    {key: 'display_title'},
    {key: 'version_tag'},
    {key: 'created_on'},
    {key: 'modified_on'},
    {key: 'frozen'}
  ];
  if (META.expected_coverage_management) cols.push({key: 'coverage'});
  cols.push({key: 'type'}, {key: 'status'});
  if (META.relations_enabled) cols.push({key: 'relations'});
  $.each(META.cfields || [], function(i, cf) { cols.push({key: 'cf:' + cf.name}); });

  var headRow = $('#headRow').empty();
  $.each(cols, function(i, c) {
    var k = c.key.indexOf('cf:') === 0 ? null : 'ro.col.' + c.key;
    headRow.append('<th' + (k ? ' data-i18n="' + k + '"' : '') + '>' +
      (k ? TLi18n.t(k) : $('<div>').text(c.key.substr(3)).html()) + '</th>');
  });

  if (table) { table.destroy(); $('#reqTable tbody').empty(); }

  var rows = [];
  $.each(items, function(i, it) {
    var created = fmtTs(it.creation_ts_raw);
    var modified = it.modified_never ? TLi18n.t('ro.never')
      : fmtTs(it.modification_ts_raw) + ' (' + escapeHtml(it.modifier || '') + ')';
    var row = {
      // raw value: the grouping key and the visible column text are escaped
      // on render, so the group header text matches the column content
      spec_path: it.spec_path,
      display_title: '<i class="fa fa-edit action-btn" title="' + TLi18n.t('ro.openReq') + '" onclick="openReq(' +
        it.req_id + ',' + it.version_id + ')"></i>' +
        '<a href="javascript:void(0)" onclick="openReq(' + it.req_id + ',' + it.version_id + ')">' +
        escapeHtml(it.display_title) + '</a>',
      version_tag: '[v' + it.version + 'r' + it.revision + ']',
      created_on: escapeHtml(created) + ' (' + escapeHtml(it.author || '') + ')',
      modified_on: modified,
      frozen: it.frozen
        ? '<span class="badge-frozen">' + TLi18n.t('common.yes') + '</span>'
        : '<span class="badge-open">' + TLi18n.t('common.no') + '</span>'
    };
    if (META.expected_coverage_management) {
      var cov;
      if (it.coverage_pct !== null && it.coverage_pct !== undefined) {
        cov = '<span class="' + (it.coverage_pct >= 100 ? 'cov-ok' : 'cov-low') + '">' +
              it.coverage_pct.toFixed(2).replace(/\.00$/, '') + '%</span> (' +
              it.coverage_qty + '/' + it.expected_coverage + ')';
      } else {
        cov = TLi18n.t('ro.notApplicable') + ' (' + (it.coverage_qty || 0) + '/0)';
      }
      row.coverage = cov;
    }
    row.type = escapeHtml((META.type_labels[it.type] || ''));
    row.status = escapeHtml((META.status_labels[it.status] || ''));
    if (META.relations_enabled) { row.relations = it.relations_qty; }
    $.each(META.cfields || [], function(j, cf) {
      var v = (it.cfields && it.cfields[cf.name] !== undefined) ? String(it.cfields[cf.name]) : '';
      row['cf:' + cf.name] = '<span style="white-space:normal;word-break:break-word;">' + escapeHtml(v) + '</span>';
    });
    rows.push(row);
  });

  // column descriptors; the header labels are rendered in <thead> (kept with
  // their data-i18n attributes so the locale switcher keeps working)
  var columns = [];
  var specIdx = 0;
  $.each(cols, function(i, c) {
    if (c.key === GRID_SPEC_COL) { specIdx = i; }
    columns.push({
      data: c.key,
      // legacy hides the grouped column (exttable.class.php:55 hideGroupedColumn)
      visible: c.key === GRID_SPEC_COL ? showGroupedCol : true,
      // display-only renderer: sorting/filtering keep the raw spec path
      render: c.key === GRID_SPEC_COL ? {display: escapeHtml} : undefined
    });
  });
  SPEC_COL_IDX = specIdx;

  // default sort: spec path asc (group order, as the legacy ExtJS grid orders
  // groups) then coverage desc when available, else status desc (reqOverview.php:286-288)
  var covIdx = cols.findIndex(function(c) { return c.key === 'coverage'; });
  var orderIdx = covIdx >= 0 ? covIdx : cols.findIndex(function(c) { return c.key === 'status'; });

  table = $('#reqTable').DataTable({
    data: rows,
    columns: columns,
    order: [[0, 'asc'], [orderIdx, 'desc']],
    // Legacy parity: rows are grouped per Requirement Specification path
    // (reqOverview.php:282) with a collapsible header showing the item count
    // (exttable.class.php:591 groupTextTpl '{text} (N Items)').
    rowGroup: {
      dataSrc: GRID_SPEC_COL,
      startRender: function (rows, group) {
        var isCollapsed = isGroupCollapsed(group);
        rows.nodes().each(function (r) { r.style.display = isCollapsed ? 'none' : ''; });
        var n = rows.count();
        var cnt = TLi18n.t('ro.grid.groupItem', {count: n});
        if (n !== 1) { cnt = TLi18n.t('ro.grid.groupItems', {count: n}); }
        // RowGroup only sets a colspan when startRender does not return a <tr>,
        // so the teal group band is spanned over the visible columns here
        // (the grouped column itself is hidden by default).
        var visibleCols = $('#reqTable thead th').filter(function() {
          return $(this).css('display') !== 'none';
        }).length;
        return $('<tr/>').attr('data-key', encodeURIComponent(group))
          .attr('colspan', visibleCols)
          .append($('<td/>').attr('colspan', visibleCols).append(
            $('<i/>').addClass('fa ' + (isCollapsed ? 'fa-chevron-right' : 'fa-chevron-down')),
            ' ' + escapeHtml(group) + '<span class="gcount">' + cnt + '</span>'
          ));
      }
    },
    pageLength: 25,
    lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, 'All']],
    columnDefs: [{targets: '_all', defaultContent: ''}]
  });
  applyGroupedColState();
  pruneCollapsedGroups();
  updateGroupToggleBtn();
}

// toolbarShowAllColumnsButton: shows/hides the grouped column
// (exttable.class.php:109 + hideGroupedColumn=true at exttable.class.php:55).
function applyGroupedColState() {
  if (!table) return;
  table.column(SPEC_COL_IDX).visible(showGroupedCol);
  var $btn = $('#btnShowAllCols').toggleClass('active', showGroupedCol);
  $btn.find('span').text(showGroupedCol
    ? TLi18n.t('ro.grid.hideGroupedColumn')
    : TLi18n.t('ro.grid.showAllColumns'));
}

// hasOwnProperty based: a req spec named e.g. 'toString' must not inherit
// Object.prototype members (the legacy grid has no such edge case).
function isGroupCollapsed(key) {
  return Object.prototype.hasOwnProperty.call(collapsedGroups, key);
}

function allGroupKeys() {
  var keys = Object.create(null);
  if (!table) return keys;
  var d = table.rows().data().toArray();
  $.each(d, function(i, r) { keys[r[GRID_SPEC_COL]] = true; });
  return keys;
}

// The grid is rebuilt on every loadOverview(); drop collapse state of groups
// that no longer exist in the current data set (e.g. after switching between
// latest and all versions).
function pruneCollapsedGroups() {
  var keys = allGroupKeys();
  $.each(Object.keys(collapsedGroups), function(i, k) {
    if (!Object.prototype.hasOwnProperty.call(keys, k)) { delete collapsedGroups[k]; }
  });
}

function updateGroupToggleBtn() {
  $('#btnGroupToggle').toggleClass('active', anyGroupCollapsed());
}

// decide from the live data, never from the (prunable) state map alone
function anyGroupCollapsed() {
  var keys = allGroupKeys();
  var any = false;
  $.each(Object.keys(keys), function(i, k) {
    if (Object.prototype.hasOwnProperty.call(collapsedGroups, k)) { any = true; return false; }
  });
  return any;
}

// DataTables RowGroup merges only contiguous runs, so the group column must
// stay the primary sort criterion even when the user sorts by another column.
// order.dt fires *during* a draw: re-drawing synchronously there would rebuild
// the tbody while it is being written, so the re-apply is deferred one tick.
function pinGroupOrder(settings) {
  if (!table || reordering) return;
  // ignore events of a previous instance (the grid is destroyed and rebuilt on
  // every loadOverview(), and its initial draw fires order.dt)
  var cur = table.settings()[0];
  if (settings && cur && settings !== cur) return;
  var o = table.order();
  if (o.length && o[0][0] === SPEC_COL_IDX) return;
  reordering = true;
  setTimeout(function() {
    table.order([[SPEC_COL_IDX, 'asc']].concat(o)).draw(false);
    reordering = false;
  }, 0);
}

function expandAllGroups() {
  collapsedGroups = Object.create(null);
  if (table) table.draw(false);
  updateGroupToggleBtn();
  $('#gridToolbarInfo').text(TLi18n.t('ro.grid.groupsExpanded'));
}

function collapseAllGroups() {
  collapsedGroups = allGroupKeys();
  if (table) table.draw(false);
  updateGroupToggleBtn();
  $('#gridToolbarInfo').text(TLi18n.t('ro.grid.groupsCollapsed'));
}

function toggleGroups() {
  if (anyGroupCollapsed()) { expandAllGroups(); } else { collapseAllGroups(); }
}

function openReq(reqId, versionId) {
  var w = Math.floor(window.innerWidth * 0.85), h = Math.floor(window.innerHeight * 0.85);
  window.open('/gui/templates/requirements/reqView.html?id=' + reqId +
    '&version_id=' + versionId + '&tproject_id=' + TPROJECT_ID,
    'req_view_' + reqId, 'width=' + w + ',height=' + h + ',resizable=yes,scrollbars=yes');
}

function fmtTs(ts) {
  if (!ts) return '-';
  var d = new Date(String(ts).replace(' ', 'T'));
  if (isNaN(d.getTime())) return String(ts);
  return d.toLocaleString();
}

function escapeHtml(s) {
  return $('<div>').text(s == null ? '' : String(s)).html();
}
</script>
</body>
</html>
