<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Field Editor</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; color: #0d3f3c; margin-left: 12px; }
.toolbar { background: #22242a; padding: 10px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-teal:disabled { opacity: .45; cursor: not-allowed; }
.btn-ghost { background: none; border: 1px solid #555; color: #ddd; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.btn-ghost:hover { border-color: #4ECDC4; color: #4ECDC4; }
.btn-danger { background: #e6605e; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-danger:hover { background: #cf4f4d; }
.btn-danger:disabled { opacity: .45; cursor: not-allowed; }
.section { padding: 20px 24px 24px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 18px; }
.card > .card-h { background: #22242a; color: #fff; padding: 10px 16px; font-size: 14px; font-weight: 700; border-radius: 8px 8px 0 0; }
.card > .card-h .fa { margin-right: 6px; }
.card > .card-b { padding: 16px; }
.kv { display: flex; flex-wrap: wrap; gap: 26px; }
.kv div { font-size: 13px; color: #555; }
.kv div b { color: #22242a; }
.row { margin-bottom: 14px; }
label { display: block; font-size: 12px; font-weight: 600; color: #22242a; margin-bottom: 5px; }
label .req { color: #e6605e; }
input[type=text], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #d5d5d5; border-radius: 4px; font-size: 13px; font-family: inherit; background: #fff; }
input[readonly], select[disabled], input[disabled] { background: #f0f0f0; color: #777; cursor: not-allowed; }
.hint { font-size: 11px; color: #888; margin-top: 5px; }
.locked { display: inline-block; font-size: 11px; color: #8a6d3b; background: #fcf3e3; border: 1px solid #e8d3a8; border-radius: 3px; padding: 2px 6px; margin-left: 6px; }
.locked .fa { margin-right: 3px; }
.ok { background: #e8f8f5; border: 1px solid #bfe5e2; color: #1d6f69; border-radius: 5px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
.err { background: #fdeceb; border: 1px solid #f5c6c4; color: #a13b39; border-radius: 5px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
.err .code { font-family: monospace; font-size: 11px; opacity: .75; }
.warn { background: #fcf3e3; border: 1px solid #e8d3a8; color: #8a6d3b; border-radius: 5px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
.msg-card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 34px; text-align: center; }
.msg-card .ico { font-size: 34px; margin-bottom: 12px; }
.msg-card .t { font-size: 16px; font-weight: 700; color: #22242a; margin-bottom: 6px; }
.msg-card .m { font-size: 13px; color: #777; }
.msg-card .m .code { font-family: monospace; font-size: 11px; color: #999; }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 4px 0 0; }
.pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #4ECDC4; color: #0d3f3c; font-weight: 700; }
.pill.gray { background: #e2e2e2; color: #555; }
.linked-list { margin: 0; padding-left: 18px; font-size: 13px; color: #555; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; }
.toast.err { background: #e6605e; }
#cfDelOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 10000; }
#cfDelOverlay .dialog { background: #fff; border-radius: 8px; max-width: 460px; margin: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
#cfDelOverlay .dialog .card-h { border-radius: 8px 8px 0 0; }
#cfDelOverlay .dialog .card-b { padding: 20px; font-size: 13px; color: #555; }
</style>
</head>
<body>

<div class="header">
  <span data-i18n="cfed.title">Custom Field Editor</span>
  <span class="sub" data-i18n="cfed.subtitle">create, change or remove a custom field definition</span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <span class="ctx"><span data-i18n="cfed.testProject">Test Project</span>: <b id="tprojectName">-</b></span>
  <span class="ctx"><span data-i18n="cfed.mode">Mode</span>: <b id="modeLabel">-</b></span>
  <span style="flex:1"></span>
  <button class="btn-ghost" onclick="reload()"><i class="fa fa-refresh"></i> <span data-i18n="common.refresh">Refresh</span></button>
  <button class="btn-ghost" onclick="goBack()"><i class="fa fa-arrow-left"></i> <span data-i18n="cfed.backToManager">Back to Custom Fields</span></button>
  <button class="btn-ghost" onclick="window.close()"><i class="fa fa-times"></i> <span data-i18n="common.close">Close</span></button>
</div>

<div class="section" id="content"></div>

<div class="footer"><span data-i18n="footers.cfieldsEdit">TestLink 2.0.1 - Custom Field Editor</span></div>
<div class="toast" id="toast"></div>

<div id="cfDelOverlay">
  <div class="dialog">
    <div class="card-h"><i class="fa fa-trash"></i> <span id="cfDelTitle">Delete</span></div>
    <div class="card-b">
      <p id="cfDelText" style="margin-top:0"></p>
      <div class="actions" style="justify-content:flex-end">
        <button class="btn-ghost" onclick="closeDel()"><span data-i18n="common.cancel">Cancel</span></button>
        <button class="btn-danger" id="cfDelOk" onclick="confirmDel()"><span data-i18n="cfed.deleteBtn">Delete</span></button>
      </div>
    </div>
  </div>
</div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
var API = '/api/cfieldsedit/index.php';
var VIEW = '/gui/templates/cfields/cfieldsView.html';
var MODE = 'create';
var CFIELD_ID = 0;
var TPROJECT_ID = 0;
var CTX = null;
var SAVE_ERROR = null;
/** node types that lock the Type / Available-on combos (is_used()). */
var TCASE_NODE = 3;
var AREA_KEYS = ['execution', 'design', 'testplan_design'];

function qs(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function esc(s) {
  if (s === null || s === undefined) { return ''; }
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function t(key, params) {
  var v = TLi18n.t(key, params);
  return (v === undefined || v === null || v === '') ? key : v;
}

function toast(msg, isErr) {
  var el = $('#toast');
  el.text(msg).toggleClass('err', !!isErr).fadeIn(160);
  clearTimeout(el.data('timer'));
  el.data('timer', setTimeout(function () { el.fadeOut(220); }, 4200));
}

function goBack() {
  window.location.href = VIEW + '?tproject_id=' + TPROJECT_ID;
}

/* ------------------------------------------------------------------ errors */
/** BFF machine code -> i18n key. Every failure keeps the code visible. */
var ERR_CODE = {
  not_authenticated: 'cfed.errNotAuth',
  no_right: 'cfed.errNoRight',
  no_right_on_project: 'cfed.errNoRightOnProject',
  session_expired: 'cfed.errSessionExpired',
  empty_name: 'cfed.errEmptyName',
  empty_label: 'cfed.errEmptyLabel',
  name_too_long: 'cfed.errNameTooLong',
  label_too_long: 'cfed.errLabelTooLong',
  possible_values_too_long: 'cfed.errPvTooLong',
  unknown_type: 'cfed.errUnknownType',
  unknown_node_type: 'cfed.errUnknownNodeType',
  area_not_allowed_for_node_type: 'cfed.errAreaNotAllowed',
  type_locked: 'cfed.errTypeLocked',
  node_type_locked: 'cfed.errNodeTypeLocked',
  name_exists: 'cfed.errNameExists',
  cfield_not_found: 'cfed.errNotFound',
  tproject_not_found: 'cfed.errTprojectNotFound',
  no_tproject_selected: 'cfed.errNoTproject',
  missing_cfield_id: 'cfed.errNoId',
  missing_action: 'cfed.errNoAction',
  unknown_do_action: 'cfed.errUnknownDoAction',
  method_not_allowed: 'cfed.errMethod',
  create_failed: 'cfed.errCreateFailed',
  update_failed: 'cfed.errUpdateFailed',
  delete_failed: 'cfed.errDeleteFailed',
  bad_request: 'cfed.errBadRequest',
  error: 'common.error'
};

function errText(code, fallbackMsg) {
  var key = ERR_CODE[code] || 'common.error';
  /* The *too_long messages carry a {max} that depends on the field; pick the
     right limit for the code, not name_maxlen for everything (CTX.limits is
     only present once init answered, so fall back to compiled-in maxima). */
  var lim = (CTX && CTX.limits) || {};
  var maxByCode = {
    name_too_long: lim.name_maxlen,
    label_too_long: lim.label_maxlen,
    possible_values_too_long: lim.possible_values_maxlen
  };
  var v;
  if (Object.prototype.hasOwnProperty.call(maxByCode, code)) {
    v = t(key, { max: maxByCode[code] || 255 });
  } else {
    v = t(key, {
      max: lim.name_maxlen || lim.label_maxlen || lim.possible_values_maxlen || 255
    });
  }
  return (v === key) ? (fallbackMsg || code) : v;
}

function showError(xhr) {
  var code = 'error';
  var msg = '';
  try {
    var b = JSON.parse(xhr.responseText || '{}');
    code = b.code || code;
    msg = b.message || '';
  } catch (e) { /* non-JSON body */ }
  if (xhr.status === 401) {
    window.location.href = '/login.php?note=expired';
    return;
  }
  if (xhr.status === 403) {
    renderState('denied', errText(code, msg), code);
    return;
  }
  if (xhr.status === 404) {
    renderState('notfound', errText(code, msg), code);
    return;
  }
  if (xhr.status === 400 || xhr.status === 405 || xhr.status === 409) {
    SAVE_ERROR = { code: code, text: errText(code, msg) };
    renderForm();
    toast(SAVE_ERROR.text, true);
    return;
  }
  renderState('error', errText(code, msg), code);
}

function renderState(kind, message, code) {
  var ico = 'fa-exclamation-circle';
  var titleKey = 'common.error';
  if (kind === 'denied') { ico = 'fa-lock'; titleKey = 'cfed.deniedTitle'; }
  else if (kind === 'notfound') { ico = 'fa-search'; titleKey = 'cfed.notFoundTitle'; }
  else if (kind === 'error') { ico = 'fa-exclamation-triangle'; titleKey = 'common.error'; }
  $('#content').html(
    '<div class="msg-card"><div class="ico"><i class="fa ' + ico + '"></i></div>' +
    '<div class="t">' + esc(t(titleKey)) + '</div>' +
    '<div class="m">' + esc(message) +
    (code ? ' <span class="code">(' + esc(code) + ')</span>' : '') +
    '</div><div class="actions" style="justify-content:center;margin-top:16px">' +
    '<button class="btn-teal" onclick="reload()">' + esc(t('common.refresh')) + '</button>' +
    '<button class="btn-ghost" onclick="goBack()">' + esc(t('cfed.backToManager')) + '</button>' +
    '</div></div>');
}

/* --------------------------------------------------------------- rendering */
function nodeName(id) {
  var list = (CTX && CTX.nodes) || [];
  for (var i = 0; i < list.length; i++) {
    if (parseInt(list[i].id, 10) === parseInt(id, 10)) { return list[i].name; }
  }
  return '-';
}

function areaLabel(id) {
  var list = (CTX && CTX.areas) || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) { return list[i].label; }
  }
  return id;
}

/** current enable_on combo value, legacy-parity: default is 'design'. */
function currentEnableOn() {
  var v = $('#cfEnableOn').val();
  return (AREA_KEYS.indexOf(v) >= 0) ? v : 'design';
}

function cfgFor(kind, area) {
  var list = (CTX && CTX.areas) || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === area) {
      return kind === 'enable' ? (list[i].enable_on_cfg || {}) : (list[i].show_on_cfg || {});
    }
  }
  return {};
}

/**
 * configure_cf_attr() parity (cfieldsEditJS.tpl): for the chosen node type
 *  - hide the enable_on options the node type does not support; when NONE is
 *    left, hide the whole combo;
 *  - hide / disable each show_on combo the node type does not support, and for
 *    a test case enabled on execution the combo disappears and is forced to 1
 *    (cfieldsEdit.php:94-96).
 */
function configureCfAttr() {
  var nodeSel = document.getElementById('cfNodeType');
  if (!nodeSel) { return; }
  /* select.value and hidden-input.value are STRINGS: normalise once, or the
     TCASE_NODE comparison below silently never matched and the "Display on
     Test Execution" combo stayed visible on an execution-enabled test case CF. */
  var node = parseInt(nodeSel.value, 10);
  var enabled = 0;
  AREA_KEYS.forEach(function (area) {
    var opt = document.getElementById('option_' + area);
    if (!opt) { return; }
    var allow = parseInt((cfgFor('enable', area) || {})[node], 10) === 1;
    opt.style.display = allow ? '' : 'none';
    if (allow) { enabled++; }
  });
  document.getElementById('containerCfEnableOn').style.display = enabled ? '' : 'none';

  var enableOn = currentEnableOn();
  AREA_KEYS.forEach(function (area) {
    var sel = document.getElementById('cfShowOn_' + area);
    var box = document.getElementById('containerCfShowOn_' + area);
    if (!sel || !box) { return; }
    var allow = parseInt((cfgFor('show', area) || {})[node], 10) === 1;
    if (!allow) {
      sel.disabled = true; sel.value = '0'; box.style.display = 'none';
      return;
    }
    if (node === TCASE_NODE && area === 'execution' && enableOn === 'execution') {
      sel.disabled = true; sel.value = '1'; box.style.display = 'none';
      return;
    }
    sel.disabled = false; box.style.display = '';
  });
}

/** initShowOnExec() parity: enable on execution implies show on execution. */
function initShowOnExec() {
  if (currentEnableOn() === 'execution') {
    var box = document.getElementById('containerCfShowOn_execution');
    var sel = document.getElementById('cfShowOn_execution');
    if (box) { box.style.display = 'none'; }
    if (sel) { sel.value = '1'; }
  } else {
    var box2 = document.getElementById('containerCfShowOn_execution');
    if (box2) { box2.style.display = ''; }
  }
  configureCfAttr();
}

/** cfg_possible_values_display() parity: Possible Values only for some types. */
function cfgPossibleValues() {
  var typeSel = document.getElementById('cfType');
  var box = document.getElementById('containerCfPossibleValues');
  if (!typeSel || !box) { return; }
  var cfg = (CTX && CTX.possible_values_cfg) || {};
  var allow = parseInt(cfg[typeSel.value], 10) === 1;
  box.style.display = allow ? '' : 'none';
}

function lockedBadge() {
  return ' <span class="locked"><i class="fa fa-lock"></i>' +
    esc(t('cfed.lockedBadge')) + '</span>';
}

function renderForm() {
  var cf = CTX.cfield || {};
  var limits = (CTX && CTX.limits) || {};
  var isUsed = CTX.is_used === 1;
  var isEdit = MODE === 'edit';

  var html = '';

  if (SAVE_ERROR) {
    html += '<div class="err"><i class="fa fa-exclamation-circle"></i> ' +
      esc(SAVE_ERROR.text) + ' <span class="code">(' + esc(SAVE_ERROR.code) + ')</span></div>';
  }

  if (isUsed) {
    html += '<div class="warn"><i class="fa fa-exclamation-triangle"></i> ' +
      esc(t('cfed.warnIsInUse')) + '</div>';
  }

  /* ---- context card ---- */
  html += '<div class="card"><div class="card-h"><i class="fa fa-info-circle"></i> ' +
    esc(t('cfed.contextTitle')) + '</div><div class="card-b"><div class="kv">' +
    '<div>' + esc(t('cfed.testProject')) + ': <b>' + esc(CTX.tproject_name || '-') + '</b></div>' +
    '<div>' + esc(t('cfed.mode')) + ': <b>' +
    esc(isEdit ? t('cfed.modeEdit') : t('cfed.modeCreate')) + '</b></div>' +
    '<div>' + esc(t('cfed.fieldId')) + ': <b>' + esc(cf.id || 0) + '</b></div>' +
    '<div>' + esc(t('cfed.inUse')) + ': <b>' +
    (isUsed ? esc(t('common.yes')) : esc(t('common.no'))) + '</b></div>';
  if (CTX.is_linked) {
    html += '<div>' + esc(t('cfed.linkedTo')) + ': <b>' +
      esc((CTX.linked_tprojects || []).length) + '</b>' +
      (isEdit ? '' : ' <span class="pill gray">' + esc(t('cfed.afterSave')) + '</span>') + '</div>';
  }
  html += '</div>';
  if (isEdit && (CTX.linked_tprojects || []).length) {
    html += '<ul class="linked-list">';
    (CTX.linked_tprojects || []).forEach(function (p) {
      html += '<li>' + esc(p.name) + '</li>';
    });
    html += '</ul>';
  }
  html += '</div></div>';

  /* ---- form card ---- */
  html += '<div class="card"><div class="card-h"><i class="fa fa-pencil-alt"></i> ' +
    esc(t(isEdit ? 'cfed.formTitleEdit' : 'cfed.formTitleCreate')) +
    '</div><div class="card-b">';

  /* Name */
  html += '<div class="row"><label for="cfName">' + esc(t('cfed.name')) +
    ' <span class="req">*</span></label>' +
    '<input type="text" id="cfName" maxlength="' + (limits.name_maxlen || 25) + '">' +
    '<div class="hint">' + esc(t('cfed.nameHint', {
      max: (limits.name_maxlen || 25) })) + '</div></div>';

  /* Label */
  html += '<div class="row"><label for="cfLabel">' + esc(t('cfed.label')) +
    ' <span class="req">*</span></label>' +
    '<input type="text" id="cfLabel" maxlength="' + (limits.label_maxlen || 50) + '">' +
    '<div class="hint">' + esc(t('cfed.labelHint', {
      max: (limits.label_maxlen || 50) })) + '</div></div>';

  /* Available on (node type) */
  html += '<div class="row"><label for="cfNodeType">' + esc(t('cfed.availableOn')) +
    (isUsed ? lockedBadge() : '') + '</label>';
  if (isUsed) {
    html += '<input type="text" id="cfNodeTypeText" readonly value="' +
      esc(nodeName(cf.node_type_id)) + '">' +
      '<input type="hidden" id="cfNodeType" value="' + esc(cf.node_type_id) + '">';
  } else {
    html += '<select id="cfNodeType" onchange="configureCfAttr()">';
    (CTX.nodes || []).forEach(function (n) {
      html += '<option value="' + esc(n.id) + '"' +
        (parseInt(n.id, 10) === parseInt(cf.node_type_id, 10) ? ' selected' : '') +
        '>' + esc(n.name) + '</option>';
    });
    html += '</select>';
  }
  html += '</div>';

  /* Type */
  html += '<div class="row"><label for="cfType">' + esc(t('cfed.type')) +
    (isUsed ? lockedBadge() : '') + '</label>';
  if (isUsed) {
    var typeName = '-';
    (CTX.types || []).forEach(function (ty) {
      if (parseInt(ty.id, 10) === parseInt(cf.type, 10)) { typeName = ty.name; }
    });
    html += '<input type="text" id="cfTypeText" readonly value="' + esc(typeName) + '">' +
      '<input type="hidden" id="cfType" value="' + esc(cf.type) + '">';
  } else {
    html += '<select id="cfType" onchange="cfgPossibleValues()">';
    (CTX.types || []).forEach(function (ty) {
      html += '<option value="' + esc(ty.id) + '"' +
        (parseInt(ty.id, 10) === parseInt(cf.type, 10) ? ' selected' : '') +
        '>' + esc(ty.name) + '</option>';
    });
    html += '</select>';
  }
  html += '</div>';

  /* Possible values */
  html += '<div class="row" id="containerCfPossibleValues"><label for="cfPossibleValues">' +
    esc(t('cfed.possibleValues')) + '</label>' +
    '<textarea id="cfPossibleValues" rows="4" maxlength="' +
    (limits.possible_values_maxlen || 255) + '"></textarea>' +
    '<div class="hint">' + esc(t('cfed.possibleValuesHint', {
      max: (limits.possible_values_maxlen || 255) })) + '</div></div>';

  /* Enable on */
  html += '<div class="row" id="containerCfEnableOn"><label for="cfEnableOn">' +
    esc(t('cfed.enableOn')) + '</label><select id="cfEnableOn" onchange="initShowOnExec()">';
  AREA_KEYS.forEach(function (area) {
    var on = parseInt(cf['enable_on_' + area], 10) === 1;
    html += '<option id="option_' + area + '" value="' + area + '"' +
      (on ? ' selected' : '') + '>' + esc(areaLabel(area)) + '</option>';
  });
  html += '</select><div class="hint">' + esc(t('cfed.enableOnHint')) + '</div></div>';

  /* Show on (cfieldsEditJS.tpl parity / Refs #1873 m2: the legacy screen
     rendered ONLY the execution combo - cfieldsEdit.tpl:175-179. show_on_design
     and show_on_testplan_design are derived server side from enable_on
     (request2cf()), so exposing them as editable combos was a silent no-op. */
  var on = parseInt(cf.show_on_execution, 10) === 1;
  html += '<div class="row" id="containerCfShowOn_execution"><label for="cfShowOn_execution">' +
    esc(t('cfed.showOnArea', { area: areaLabel('execution') })) +
    '</label><select id="cfShowOn_execution" data-area="execution">' +
    '<option value="1"' + (on ? ' selected' : '') + '>' + esc(t('common.yes')) + '</option>' +
    '<option value="0"' + (on ? '' : ' selected') + '>' + esc(t('common.no')) + '</option>' +
    '</select></div>';

  html += '<div class="actions">';
  if (isEdit) {
    html += '<button class="btn-teal" id="btnSave" onclick="doSave()">' +
      '<i class="fa fa-save"></i> ' + esc(t('cfed.saveBtn')) + '</button>' +
      '<button class="btn-danger" id="btnDelete" onclick="askDelete()">' +
      '<i class="fa fa-trash"></i> ' + esc(t('cfed.deleteBtn')) + '</button>';
  } else {
    html += '<button class="btn-teal" id="btnSave" onclick="doSave()">' +
      '<i class="fa fa-plus"></i> ' + esc(t('cfed.addBtn')) + '</button>' +
      '<button class="btn-teal" id="btnSaveAssign" onclick="doSave(true)" ' +
      'style="background:#0f6862">' + '<i class="fa fa-link"></i> ' +
      esc(t('cfed.addAndAssignBtn')) + '</button>';
  }
  html += '<button class="btn-ghost" onclick="goBack()">' +
    esc(t('common.cancel')) + '</button>';
  html += '</div>';

  html += '</div></div>';

  $('#content').html(html);

  $('#cfName').val(cf.name || '');
  $('#cfLabel').val(cf.label || '');
  $('#cfPossibleValues').val(cf.possible_values || '');
  /* An "add and assign" only makes sense when a project is actually selected. */
  if (TPROJECT_ID <= 0) {
    $('#btnSaveAssign').prop('disabled', true)
      .attr('title', t('cfed.assignNeedsProject'));
  }

  configureCfAttr();
  cfgPossibleValues();
}

function render() {
  if (CTX && CTX.__state) { renderState(CTX.__state, CTX.__message, CTX.__code); return; }
  renderForm();
}

/* ------------------------------------------------------------------ writes */
function collectPayload() {
  var cf = CTX.cfield || {};
  var payload = {
    name: $('#cfName').val() || '',
    label: $('#cfLabel').val() || '',
    type: parseInt($('#cfType').val(), 10),
    node_type_id: parseInt($('#cfNodeType').val(), 10),
    possible_values: $('#cfPossibleValues').val() || '',
    enable_on: currentEnableOn(),
    tproject_id: TPROJECT_ID
  };
  /* The show_on_* pairs are derived server side from enable_on, exactly like
     request2cf(); only show_on_execution is forwarded because the legacy form
     submitted it and the modern UI lets the user uncheck it. */
  var se = $('#cfShowOn_execution');
  payload.show_on_execution = (se && se.prop('disabled')) ? 1 : parseInt(se.val(), 10);
  if (MODE === 'edit') { payload.id = cf.id; }
  return payload;
}

function doSave(assign) {
  var payload = collectPayload();
  if (assign) { payload.assign = true; }
  var action = (MODE === 'edit') ? 'update' : 'create';
  SAVE_ERROR = null;
  $('#btnSave,#btnSaveAssign,#btnDelete').prop('disabled', true);
  $.ajax({
    url: API + '?action=' + action,
    type: 'POST',
    contentType: 'application/json; charset=utf-8',
    data: JSON.stringify(payload)
  }).done(function (r) {
    if (MODE === 'edit') {
      CTX.cfield = r.cfield || CTX.cfield;
      CTX.is_used = (r.cfield && r.cfield.is_used) ? 1 : 0;
      if (CTX.cfield && CTX.cfield.id) {
        CFIELD_ID = parseInt(CTX.cfield.id, 10);
      }
      renderForm();
      toast(t('cfed.savedOk'), false);
    } else {
      toast(t(assign ? 'cfed.createdAndAssignedOk' : 'cfed.createdOk'), false);
      /* The legacy screen redirected to the manager after a successful save
         (cfieldsEdit.php:108-112); stay put only long enough to flash it. */
      setTimeout(function () { goBack(); }, 900);
    }
  }).fail(function (xhr) {
    $('#btnSave,#btnSaveAssign,#btnDelete').prop('disabled', false);
    showError(xhr);
  });
}

/** Delete confirmation. The CF name is DATA, never interpolated into code. */
function askDelete() {
  var cf = CTX.cfield || {};
  var text = t('cfed.deleteConfirm', { name: cf.name || ('#' + cf.id) });
  if (CTX.is_used) {
    text += ' ' + t('cfed.deleteConfirmUsed');
  }
  if (CTX.is_linked) {
    text += ' ' + t('cfed.deleteConfirmLinked', {
      n: (CTX.linked_tprojects || []).length
    });
  }
  $('#cfDelTitle').text(t('cfed.deleteTitle'));
  $('#cfDelText').text(text);
  $('#cfDelOverlay').css('display', 'flex');
}
function closeDel() { $('#cfDelOverlay').css('display', 'none'); }

function confirmDel() {
  var cf = CTX.cfield || {};
  $('#cfDelOk').prop('disabled', true);
  $.ajax({
    url: API + '?action=delete',
    type: 'POST',
    contentType: 'application/json; charset=utf-8',
    data: JSON.stringify({ id: cf.id })
  }).done(function (r) {
    toast(t('cfed.deletedOk', { n: r.unlinked_projects || 0 }), false);
    setTimeout(function () { goBack(); }, 900);
  }).fail(function (xhr) {
    $('#cfDelOk').prop('disabled', false);
    closeDel();
    showError(xhr);
  });
}

/* ------------------------------------------------------------------- boot */
function load() {
  SAVE_ERROR = null;
  var url = API + '?action=init&do_action=' + encodeURIComponent(MODE) +
    '&cfield_id=' + CFIELD_ID + '&tproject_id=' + TPROJECT_ID;
  $.ajax({ url: url })
    .done(function (r) {
      CTX = r || {};
      CTX.__state = null;
      $('#tprojectName').text(CTX.tproject_name || '-');
      $('#modeLabel').text(MODE === 'edit' ? t('cfed.modeEdit') : t('cfed.modeCreate'));
      render();
    })
    .fail(function (xhr) { showError(xhr); });
}

function reload() { load(); }

$(document).ready(function () {
  var da = qs('do_action');
  MODE = (da === 'edit') ? 'edit' : 'create';
  CFIELD_ID = parseInt(qs('cfield_id') || '0', 10);
  if (MODE === 'edit' && CFIELD_ID <= 0) {
    MODE = 'create';
  }
  TPROJECT_ID = parseInt(qs('tproject_id') || '0', 10);
  /* TLi18n must finish loading the bundle BEFORE any rendering. */
  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    if (MODE === 'edit' && CFIELD_ID <= 0) {
      renderState('notfound', t('cfed.errNoId'), 'missing_cfield_id');
      return;
    }
    load();
  });
});
</script>
</body>
</html>
