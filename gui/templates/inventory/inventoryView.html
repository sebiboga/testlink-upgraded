<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-teal:disabled { opacity: .45; cursor: not-allowed; }
.btn-red { background: #e6605e; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-red:hover { background: #d04e4c; }
.section { padding: 20px 24px 4px; }
.table-wrap { padding: 0 24px 8px; }
.table-wrap table { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); width: 100%; }
table.dataTable thead th { background: #22242a; color: #fff; font-size: 13px; padding: 10px 14px; }
table.dataTable tbody td { padding: 8px 14px; font-size: 13px; vertical-align: middle; }
.dev-name { font-weight: 700; color: #2d8e88; text-decoration: none; cursor: pointer; }
.dev-name:hover { text-decoration: underline; }
.dev-name.plain { color: #22242a; cursor: default; }
.dev-name.plain:hover { text-decoration: none; }
.ip-badge { font-family: monospace; background: #eefaf9; color: #2d8e88; border: 1px solid #bfe5e2; border-radius: 10px; padding: 0 8px; font-size: 11px; font-weight: 600; }
.notes-cell, .purpose-cell, .hw-cell { color: #555; max-width: 320px; white-space: pre-wrap; word-break: break-word; }
.del-btn { background: none; border: none; color: #e6605e; cursor: pointer; font-size: 15px; padding: 2px 6px; }
.del-btn:hover { color: #c53f3d; }
.empty { background: #fff; border-radius: 8px; padding: 26px; text-align: center; color: #888; font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.toast.err { background: #e6605e; }
.modal-title { font-size: 16px; font-weight: 700; }
.form-group label { font-size: 12px; font-weight: 600; }
.warn-banner { margin: 16px 24px 0; padding: 10px 14px; border-radius: 6px; background: #fff7e0; border: 1px solid #ecd28a; color: #8a6d1a; font-size: 13px; display: none; }
</style>
</head>
<body>

<div class="header">
  <span data-i18n="inv.title">Inventory</span>
  <span class="sub" data-i18n="inv.subtitle">devices and hardware assigned to this test project</span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <span class="ctx"><span data-i18n="inv.testProject">Test Project</span>: <b id="tprojectName">-</b></span>
  <span style="flex:1"></span>
  <button class="btn-teal" id="btnCreate" onclick="openCreate()" style="display:none"><i class="fa fa-plus"></i> <span data-i18n="inv.create">Create Device</span></button>
</div>

<div class="warn-banner" id="warnBanner"></div>

<div class="section">
  <h2 style="font-size:15px;font-weight:700;color:#22242a;margin:0;"><span data-i18n="inv.title">Inventory</span><span class="count" id="devCount" style="font-weight:400;color:#888;font-size:13px;margin-left:6px;"></span></h2>
</div>
<div class="table-wrap">
  <div id="devEmpty" class="empty" style="display:none" data-i18n="inv.empty">No device defined.</div>
  <table id="devTable" class="display" style="width:100%">
    <thead>
      <tr>
        <th style="width:16%" data-i18n="inv.name">Host name</th>
        <th style="width:13%" data-i18n="inv.ipaddress">IP Address</th>
        <th data-i18n="inv.purpose">Purpose</th>
        <th data-i18n="inv.hw">Hardware</th>
        <th style="width:10%" data-i18n="inv.owner">Owner</th>
        <th data-i18n="inv.notes">Notes</th>
        <th data-orderable="false" style="width:60px"></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div class="footer" id="footerInfo"></div>
<div class="footer"><span data-i18n="footers.inventoryView">TestLink 2.0.1 - Inventory</span></div>
<div class="toast" id="toast"></div>

<!-- Create/Edit Device Modal -->
<div class="modal fade" id="devModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="devModalTitle">Define a device data</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editDevId">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group" style="margin-bottom:12px;">
              <label for="editDevName" data-i18n="inv.nameLabel">Host name *</label>
              <input type="text" id="editDevName" class="form-control" maxlength="255" style="font-size:13px;">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group" style="margin-bottom:12px;">
              <label for="editDevIp" data-i18n="inv.ipaddress">IP Address</label>
              <input type="text" id="editDevIp" class="form-control" maxlength="50" placeholder="192.168.0.1" style="font-size:13px;">
            </div>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label for="editDevOwner" data-i18n="inv.owner">Owner</label>
          <select id="editDevOwner" class="form-control" style="font-size:13px;"></select>
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label for="editDevPurpose" data-i18n="inv.purpose">Purpose</label>
          <textarea id="editDevPurpose" class="form-control" rows="2" maxlength="2000" style="font-size:13px;"></textarea>
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label for="editDevHw" data-i18n="inv.hw">Hardware</label>
          <textarea id="editDevHw" class="form-control" rows="2" maxlength="2000" style="font-size:13px;"></textarea>
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label for="editDevNotes" data-i18n="inv.notes">Notes</label>
          <textarea id="editDevNotes" class="form-control" rows="2" maxlength="2000" style="font-size:13px;"></textarea>
        </div>
        <div id="devModalError" style="color:#e6605e;font-size:12px;margin-top:8px;display:none;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" style="font-size:13px;" data-i18n="common.cancel">Cancel</button>
        <button type="button" class="btn-teal" onclick="saveDevice()" style="font-size:13px;" data-i18n="common.save">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal fade" id="delModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="delTitle">Delete</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body" style="font-size:13px;" id="delMsg"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" style="font-size:13px;" data-i18n="common.cancel">Cancel</button>
        <button type="button" class="btn-red" onclick="doDelete()" style="font-size:13px;" data-i18n="inv.delete">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/inventory/index.php';
var tprojectId = 0;
var canManage = false;
var currentUserId = 0;
var ownersCache = [];
var itemsCache = [];
var devTbl = null;
var deleteTarget = null;

$(function () {
  var p = new URLSearchParams(window.location.search);
  tprojectId = parseInt(p.get('tproject_id') || '0', 10);
  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    load();
  });
});

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg, isErr) {
  var $t = $('#toast').text(msg).toggleClass('err', !!isErr).show();
  clearTimeout($t.data('tm'));
  $t.data('tm', setTimeout(function(){ $t.hide(); }, 3500));
}

function load() {
  $.getJSON(API + '/?tproject_id=' + tprojectId)
    .done(function (r) {
      if (r.status !== 'ok') { toast(TLi18n.t('common.error'), true); return; }
      canManage = r.rights.canManage;
      currentUserId = r.user ? r.user.id : 0;
      $('#tprojectName').text(r.tproject.name);
      document.title = r.tproject.name + ' - ' + TLi18n.t('inv.title');
      $('#btnCreate').toggle(canManage);

      var warn = '';
      if (!r.tproject.inventoryEnabled) {
        warn += '<i class="fa fa-exclamation-triangle"></i> ' + esc(TLi18n.t('inv.disabledWarning'));
      }
      if (!canManage) {
        warn += (warn ? '<br>' : '') + '<i class="fa fa-lock"></i> ' + esc(TLi18n.t('inv.msg.noRights'));
      }
      $('#warnBanner').html(warn).toggle(warn !== '');

      render(r.items);
    })
    .fail(function (xhr) {
      var msg = TLi18n.t('common.error');
      try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e) {}
      if (xhr.status === 403) {
        // no project_inventory_view right - say it in place of the grid
        $('#devCount').text('');
        $('#devEmpty').text(TLi18n.t('inv.msg.noRights')).show();
        $('#devTable').closest('.dataTables_wrapper').hide();
        $('#footerInfo').text('');
        return;
      }
      toast(msg, true);
    });
}

function cellOrDash(v) {
  v = esc(v);
  return v === '' ? '<span style="color:#bbb">-</span>' : v;
}

function render(items) {
  itemsCache = items;
  $('#devCount').text('(' + items.length + ')');
  $('#devEmpty').toggle(items.length === 0);
  // hide the whole DataTables wrapper (search box + pagination included)
  $('#devTable').toggle(items.length > 0)
    .closest('.dataTables_wrapper').toggle(items.length > 0);
  $('#footerInfo').text(items.length > 0
    ? items.length + ' ' + TLi18n.t('inv.devicesCount')
    : '');

  if (devTbl) { devTbl.destroy(); $('#devTable tbody').empty(); }

  var rows = items.map(function (d) {
    var nameCell;
    if (canManage) {
      nameCell = '<a class="dev-name" href="javascript:void(0)" onclick="editDevice(' + d.id + ')">' + esc(d.name) + '</a>';
    } else {
      nameCell = '<span class="dev-name plain">' + esc(d.name) + '</span>';
    }
    var ipCell = d.ipaddress === ''
      ? '<span style="color:#bbb">-</span>'
      : '<span class="ip-badge">' + esc(d.ipaddress) + '</span>';

    var action = '';
    if (canManage) {
      // no device data inside the handler attribute - avoids any
      // attribute/JS-context escaping pitfalls (XSS)
      action = '<button class="del-btn" data-del="' + parseInt(d.id, 10) +
               '" title="' + esc(TLi18n.t('inv.altDelete')) + '">' +
               '<i class="fas fa-trash-alt"></i></button>';
    }
    return [nameCell, ipCell, cellOrDash(d.purpose), cellOrDash(d.hardware),
            cellOrDash(d.owner), cellOrDash(d.notes), action];
  });

  devTbl = $('#devTable').DataTable({
    destroy: true,
    data: rows,
    language: { search: '', searchPlaceholder: TLi18n.t('common.search') },
    columnDefs: [
      { targets: [2,3,5], width: '15%' },
      { targets: 6, orderable: false, className: 'text-center' }
    ]
  });
}

// dblclick a row opens edit (legacy grid had rowdblclick -> deviceEdit);
// row().index() maps back into itemsCache regardless of current sort/filter
$(document).on('dblclick', '#devTable tbody tr', function () {
  if (!canManage || !devTbl) return;
  var idx = devTbl.row(this).index();
  if (isNaN(idx) || !itemsCache[idx]) return;
  editDevice(itemsCache[idx].id);
});

function loadOwners(cb) {
  $.getJSON(API + '/owners?tproject_id=' + tprojectId)
    .done(function (r) {
      ownersCache = (r.status === 'ok') ? r.items : [];
      cb();
    })
    .fail(function () {
      ownersCache = [{id: 0, login: ''}];
      cb();
    });
}

function fillOwners(selectedId) {
  var $sel = $('#editDevOwner').empty();
  ownersCache.forEach(function (o) {
    $sel.append('<option value="' + o.id + '">' + esc(o.login === '' ? '(' + TLi18n.t('inv.noOwner') + ')' : o.login) + '</option>');
  });
  // default owner = logged in user when available, like the legacy form
  if (selectedId == null) { selectedId = currentUserId; }
  var exists = false;
  $('#editDevOwner option').each(function () {
    if (parseInt(this.value, 10) === parseInt(selectedId || 0, 10)) { exists = true; }
  });
  $sel.val(exists ? String(selectedId) : ($('#editDevOwner option:first').val() || '0'));
}

function openCreate() {
  $('#editDevId').val('');
  $('#editDevName').val('');
  $('#editDevIp').val('');
  $('#editDevPurpose').val('');
  $('#editDevHw').val('');
  $('#editDevNotes').val('');
  $('#devModalError').hide();
  $('#devModalTitle').text(TLi18n.t('inv.createTitle'));
  loadOwners(function () {
    fillOwners(null);
    $('#devModal').modal('show');
  });
}

function editDevice(id) {
  var dev = null;
  itemsCache.forEach(function (d) { if (d.id === id) { dev = d; } });
  if (!dev) { toast(TLi18n.t('common.error'), true); return; }
  $('#editDevId').val(dev.id);
  $('#editDevName').val(dev.name);
  $('#editDevIp').val(dev.ipaddress);
  $('#editDevPurpose').val(dev.purpose);
  $('#editDevHw').val(dev.hardware);
  $('#editDevNotes').val(dev.notes);
  $('#devModalError').hide();
  $('#devModalTitle').text(TLi18n.t('inv.editTitle'));
  loadOwners(function () {
    fillOwners(dev.owner_id > 0 ? dev.owner_id : null);
    $('#devModal').modal('show');
  });
}

function errorCodeToMessage(code, fallback) {
  switch (parseInt(code, 10)) {
    case -1: return TLi18n.t('inv.msg.nameExists');
    case -2: return TLi18n.t('inv.msg.nameEmpty');
    case -4: return TLi18n.t('inv.msg.ipExists');
    case -8: return TLi18n.t('inv.msg.dbFails');
  }
  return fallback || TLi18n.t('common.error');
}

function saveDevice() {
  $('#devModalError').hide();
  var $btn = $('#devModal .btn-teal');
  if ($btn.prop('disabled')) { return; } // in-flight guard (double-click)
  var id = $('#editDevId').val();
  var name = $.trim($('#editDevName').val());
  var ip = $.trim($('#editDevIp').val());

  if (name === '') {
    showError($('#devModalError'), TLi18n.t('inv.msg.nameEmpty'));
    return;
  }
  // full IPv4: four numeric octets 0-255 (legacy Ext vtype accepted 999.999.9.9)
  var ipv4 = /^((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)$/;
  if (ip !== '' && !ipv4.test(ip)) {
    showError($('#devModalError'), TLi18n.t('inv.msg.badIp'));
    return;
  }

  var payload = JSON.stringify({
    tproject_id: tprojectId,
    machineName: name,
    machineIp: ip,
    machineOwner: parseInt($('#editDevOwner').val() || '0', 10),
    machinePurpose: $('#editDevPurpose').val(),
    machineHw: $('#editDevHw').val(),
    machineNotes: $('#editDevNotes').val()
  });

  var req;
  if (id) {
    req = $.ajax({ url: API + '/' + id, method: 'PUT', contentType: 'application/json', data: payload });
  } else {
    req = $.ajax({ url: API, method: 'POST', contentType: 'application/json', data: payload });
  }

  $btn.prop('disabled', true);
  req.done(function (r) {
    if (r.status === 'ok') {
      $('#devModal').modal('hide');
      toast(TLi18n.t(id ? 'inv.msg.saved' : 'inv.msg.created'));
      load();
    } else {
      showError($('#devModalError'), errorCodeToMessage(r.error_code, r.message));
    }
  }).fail(function (xhr) {
    var r = {};
    try { r = JSON.parse(xhr.responseText); } catch(e) {}
    if (xhr.status === 403) {
      $('#devModal').modal('hide');
      toast(TLi18n.t('inv.msg.noRights'), true);
      return;
    }
    showError($('#devModalError'), errorCodeToMessage(r.error_code, r.message));
  }).always(function () {
    $btn.prop('disabled', false);
  });
}

function showError($el, msgText) {
  $el.text(msgText).show();
}

// delete buttons: delegated handler resolves the device from itemsCache
$(document).on('click', '#devTable .del-btn', function () {
  var id = parseInt($(this).data('del'), 10);
  var dev = null;
  itemsCache.forEach(function (d) { if (d.id === id) { dev = d; } });
  if (!dev) { return; }
  confirmDelete(dev.id, dev.name);
});

function confirmDelete(id, name) {
  deleteTarget = id;
  $('#delTitle').text(TLi18n.t('inv.delete'));
  $('#delMsg').html('<b>' + esc(name) + '</b><br>' + esc(TLi18n.t('inv.dlgDeleteTxt')));
  $('#delModal').modal('show');
}

function doDelete() {
  if (!deleteTarget) return;
  var $btn = $('#delModal .btn-red');
  if ($btn.prop('disabled')) { return; } // in-flight guard (double-click)
  $btn.prop('disabled', true);
  $.ajax({
    url: API + '/' + deleteTarget + '?tproject_id=' + tprojectId,
    method: 'DELETE'
  }).done(function (r) {
    $('#delModal').modal('hide');
    if (r.status === 'ok') {
      toast(TLi18n.t('inv.msg.deleted'));
    } else {
      toast(r.error_code === 'NOT_FOUND' ? TLi18n.t('common.error')
            : TLi18n.t('inv.msg.dbFails'), true);
    }
    load();
  }).fail(function (xhr) {
    $('#delModal').modal('hide');
    var r = {};
    try { r = JSON.parse(xhr.responseText); } catch(e) {}
    toast(xhr.status === 403 ? TLi18n.t('inv.msg.noRights')
          : xhr.status === 404 ? TLi18n.t('common.error')
          : TLi18n.t('inv.msg.dbFails'), true);
    load();
  }).always(function () {
    $btn.prop('disabled', false);
  });
}
</script>
</body>
</html>
