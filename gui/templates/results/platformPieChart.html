<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overall Metrics by Platform</title>
<!--
  Overall Metrics by Platform report (Refs #1906).

  Modern twin of lib/results/platformPieChart.php. The 1.9.20 file was an image
  endpoint: it included the vendored pChart library and answered with a PNG pie
  chart of the execution-status totals of ONE test plan platform, the data
  coming from tlTestPlanMetrics::getStatusTotalsByPlatformForRender() (only
  ACTIVE BUILDS by default, status set = results.status_label_for_exec_ui). One
  platform per call / per PNG.

  The charts_data report that feeds the pretty pies in the modern "Charts" hub
  only carries per-platform label/value slices (no table, no breakdown, no
  export). This page renders the missing numbers view: ALL platforms of the
  plan in one response - a stacked horizontal bar per platform drawn with plain
  CSS (no chart library to ship), a DataTable with the exact status totals
  behind each bar, the progress percentage and a UTF-8 CSV export. The numbers
  come from api/platformpiechart/index.php, which aggregates all platforms with
  the same getStatusTotalsByPlatformForRender() the legacy pie drew and enforces
  testplan_metrics on the OWNING project + plan; see that file for the full
  semantics. Because one version can be assigned to several platforms, the
  Totals row is the sum of the shown platform columns, not a de-duplicated
  whole-plan count.
-->
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; color: #0d3f3c; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toolbar .spacer { flex: 1 1 auto; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-dark { background: #2f323a; color: #eee; border: 1px solid #444; padding: 7px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.btn-dark:hover { background: #3a3e48; }
.btn-teal:disabled, .btn-dark:disabled { opacity: .45; cursor: not-allowed; }
.panel { margin: 20px 24px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 18px 20px; }
.panel h3 { font-size: 15px; font-weight: 700; color: #22242a; margin: 0 0 14px 0; }
.panel h3 i { color: #4ECDC4; margin-right: 8px; }
.ctx-grid { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.ctx-item { min-width: 150px; }
.ctx-item .k { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .5px; display: block; }
.ctx-item .v { font-size: 14px; color: #22242a; font-weight: 600; }
.back-link { display: inline-block; margin: 16px 0 0 24px; font-size: 13px; }
.back-link a { color: #3a7bd5; text-decoration: none; }
.back-link a:hover { text-decoration: underline; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }
.legend span.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.chart-row { margin-bottom: 14px; }
.chart-row .label { font-size: 12px; color: #444; margin-bottom: 4px; font-weight: 600; }
.chart-row .label .cnt { color: #888; font-weight: 400; }
.bar { display: flex; height: 22px; border-radius: 3px; overflow: hidden; background: #eceff1; }
.bar > span { display: block; height: 100%; }
.chart-row .pct { font-size: 11px; color: #888; margin-top: 3px; }
.state { margin: 20px 24px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 34px 20px; text-align: center; color: #777; font-size: 14px; }
.state h4 { font-size: 16px; color: #22242a; margin: 0 0 8px 0; }
.state.warn { border-left: 5px solid #e6b34d; }
.state.deny { border-left: 5px solid #e05c5c; color: #7a2b2b; }
.state .code { font-size: 11px; color: #aaa; margin-top: 10px; font-family: monospace; }
.state .spinner { display: inline-block; width: 18px; height: 18px; margin-right: 8px; vertical-align: -3px; border: 3px solid #4ECDC4; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.table-wrap { margin: 20px 24px; }
table.dataTable thead th { background: #22242a; color: #fff; font-size: 13px; padding: 10px 14px; }
table.dataTable tbody td { padding: 9px 14px; font-size: 13px; vertical-align: middle; }
table.dataTable tbody tr.total-row { background: #eef7f7; font-weight: 700; }
.badge-st { display: inline-block; min-width: 22px; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; color: #fff; text-align: center; }
.meter { background: #eceff1; border-radius: 3px; height: 8px; width: 90px; display: inline-block; vertical-align: middle; margin-right: 8px; }
.meter > span { display: block; height: 100%; background: #4ECDC4; border-radius: 3px; }
.dataTables_wrapper .dataTables_paginate .paginate_button.current { background: #4ECDC4 !important; color: #fff !important; border: none !important; }
.dataTables_wrapper .dataTables_filter input { border: 1px solid #ddd; border-radius: 4px; padding: 4px 8px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; z-index: 2000; display: none; }
.toast.err { background: #e05c5c; }
</style>
</head>
<body>

<div class="header">
  <span data-i18n="ppc.title">Overall Metrics by Platform</span>
  <span class="sub" data-i18n="ppc.subtitle">execution status totals per test plan platform</span>
</div>

<div class="toolbar">
  <button class="btn-teal" id="btnRefresh"><i class="fa fa-refresh"></i> <span data-i18n="ppc.refresh">Refresh</span></button>
  <button class="btn-dark" id="btnCsv"><i class="fa fa-download"></i> <span data-i18n="ppc.exportCsv">Export CSV</span></button>
  <span class="spacer"></span>
  <button class="btn-dark" id="btnClose"><i class="fa fa-times"></i> <span data-i18n="ppc.close">Close</span></button>
</div>

<div id="stateBox"></div>

<div id="report" style="display:none;">
  <div class="back-link"><a id="backCharts" href="/gui/templates/results/charts.html">
    <i class="fa fa-arrow-left"></i> <span data-i18n="ppc.backCharts">Charts</span></a>
  </div>

  <div class="panel">
    <h3><i class="fa fa-info-circle"></i><span data-i18n="ppc.contextTitle">Report context</span></h3>
    <div class="ctx-grid">
      <div class="ctx-item"><span class="k" data-i18n="ppc.ctxProject">Test project</span><span class="v" id="ctxProject">&mdash;</span></div>
      <div class="ctx-item"><span class="k" data-i18n="ppc.ctxPlan">Test plan</span><span class="v" id="ctxPlan">&mdash;</span></div>
      <div class="ctx-item"><span class="k" data-i18n="ppc.ctxPlatforms">Platforms</span><span class="v" id="ctxPlatforms">&mdash;</span></div>
      <div class="ctx-item"><span class="k" data-i18n="ppc.ctxVersions">Test case versions</span><span class="v" id="ctxVersions">&mdash;</span></div>
    </div>
  </div>

  <div class="panel">
    <h3><i class="fa fa-bar-chart"></i><span data-i18n="ppc.chartTitle">Execution totals per platform</span></h3>
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
  </div>

  <div class="table-wrap">
    <table id="tbl" class="display" style="width:100%;">
      <thead>
        <tr id="tblHead">
          <th data-i18n="ppc.colPlatform">Platform</th>
          <th data-i18n="ppc.colTotal">Total</th>
          <th data-i18n="ppc.colProgress">Progress</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="footer"><span data-i18n="footers.platformPieChart"></span><span id="localeSwitcher"></span></div>
<div class="toast" id="toast"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/platformpiechart/index.php';
var currentData = null;
var dt = null;

// Palette per status code (the family colours the sibling chart screens use).
// Unknown statuses an installation configured on top of the exec-UI four fall
// back to a neutral slate so the table keeps rendering.
var STATUS_STYLE = {
  passed:  { bg: '#2f9e44', key: 'ppc.status.passed' },
  failed:  { bg: '#e05c5c', key: 'ppc.status.failed' },
  blocked: { bg: '#3a7bd5', key: 'ppc.status.blocked' },
  not_run: { bg: '#b9bec7', key: 'ppc.status.notRun' }
};
var FALLBACK_STYLE = { bg: '#6c757d', key: 'ppc.status.other' };

function styleFor(code) {
  var s = STATUS_STYLE[code];
  return s || { bg: FALLBACK_STYLE.bg, key: FALLBACK_STYLE.key };
}

function esc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function q(name) {
  return new URLSearchParams(window.location.search).get(name);
}

/** Localized label for a BFF failure code -> a {code} message key. */
function stateFor(code, httpStatus, rawMessage) {
  var map = {
    not_authenticated:      { cls: 'deny', title: 'ppc.deniedTitle',    body: 'ppc.deniedBody' },
    session_expired:        { cls: 'deny', title: 'ppc.deniedTitle',    body: 'ppc.expiredBody' },
    no_right:               { cls: 'deny', title: 'ppc.deniedTitle',    body: 'ppc.noRightBody' },
    tplan_not_found:        { cls: 'warn', title: 'ppc.notFoundTitle',  body: 'ppc.notFoundBody' },
    project_mismatch:       { cls: 'warn', title: 'ppc.notFoundTitle',  body: 'ppc.mismatchBody' },
    invalid_request:        { cls: 'warn', title: 'ppc.badRequestTitle', body: 'ppc.badRequestBody' },
    method_not_allowed:     { cls: 'warn', title: 'ppc.badRequestTitle', body: 'ppc.badRequestBody' }
  };
  var m = map[code];
  var detail = '';
  if (!m) {
    m = { cls: 'warn', title: 'ppc.serverErrorTitle', body: 'ppc.serverErrorBody' };
    // The BFF message is a server-side English string, NOT a bundle key: it must
    // never be handed to TLi18n.t(), which would echo it verbatim on a localized
    // screen. It is shown as escaped raw detail under the localized sentence.
    if (rawMessage) {
      detail = '<div class="code">' + esc(rawMessage) + '</div>';
    }
  }
  // ppc.serverErrorBody carries a {status} placeholder, so the params are
  // always passed - calling t() without them would print the literal "{status}".
  return '<div class="state ' + m.cls + '"><h4>' + esc(TLi18n.t(m.title)) + '</h4><div>'
       + esc(TLi18n.t(m.body, { status: httpStatus })) + '</div>' + detail
       + '<div class="code">' + esc(code || ('http_' + httpStatus)) + '</div></div>';
}

function showState(html) {
  $('#report').hide();
  $('#stateBox').html(html);
}

function showLoading() {
  $('#report').hide();
  $('#stateBox').html('<div class="state"><div class="spinner"></div>'
    + esc(TLi18n.t('ppc.loading')) + '</div>');
}

function toast(msg, kind) {
  var $t = $('#toast');
  $t.attr('class', 'toast' + (kind ? ' ' + kind : '')).text(msg).fadeIn(180);
  window.clearTimeout(toast._h);
  toast._h = window.setTimeout(function () { $t.fadeOut(220); }, 3200);
}

function renderLegend(statuses) {
  var html = '';
  $.each(statuses, function (i, code) {
    var s = styleFor(code);
    html += '<span><span class="sw" style="background:' + s.bg + '"></span>'
         + esc(TLi18n.t(s.key)) + '</span>';
  });
  $('#legend').html(html);
}

function renderChart(data) {
  var html = '';
  $.each(data.platforms, function (i, p) {
    var total = parseInt(p.total_tc, 10) || 0;
    var pctPerUnit = total > 0 ? (100 / total) : 0;
    var label = esc(TLi18n.t('ppc.chartAria', { platform: p.platform }));
    var segs = '';
    $.each(data.statuses, function (j, code) {
      var v = parseInt((p.details[code] || {}).qty, 10) || 0;
      if (v <= 0) { return; }
      var s = styleFor(code);
      segs += '<span style="background:' + s.bg + ';width:' + (v * pctPerUnit) + '%" title="'
           + esc(TLi18n.t('ppc.seriesTitle', { series: TLi18n.t(s.key), count: v })) + '"></span>';
    });
    html += '<div class="chart-row"><div class="label">' + esc(p.platform)
         + ' <span class="cnt">' + total + '</span></div>'
         + '<div class="bar" role="img" aria-label="' + label + '">' + segs + '</div>'
         + '<div class="pct">' + esc(TLi18n.t('ppc.executedOf', {
               executed: p.executed, total: total, percent: p.percentage_completed }))
         + '</div></div>';
  });
  $('#chart').html(html);
}

function badge(code, value) {
  var v = parseInt(value, 10) || 0;
  var s = styleFor(code);
  return '<span class="badge-st" style="background:' + s.bg + '">' + v + '</span>';
}

function renderTable(data) {
  var extraHead = '';
  $.each(data.statuses, function (i, code) {
    extraHead += '<th>' + esc(TLi18n.t(styleFor(code).key)) + '</th>';
  });
  $('#tblHead').append($(extraHead));

  var rows = '';
  $.each(data.platforms, function (i, p) {
    var cells = '';
    $.each(data.statuses, function (j, code) {
      cells += '<td>' + badge(code, (p.details[code] || {}).qty) + '</td>';
    });
    rows += '<tr>'
      + '<td>' + esc(p.platform) + '</td>'
      + '<td>' + (parseInt(p.total_tc, 10) || 0) + '</td>'
      + cells
      + '<td><span class="meter"><span style="width:' + (parseFloat(p.percentage_completed) || 0) + '%"></span></span>'
      + (parseFloat(p.percentage_completed) || 0) + '%</td>'
      + '</tr>';
  });
  var t = data.totals || {};
  var totalCells = '';
  $.each(data.statuses, function (j, code) {
    totalCells += '<td>' + badge(code, t[code]) + '</td>';
  });
  rows += '<tr class="total-row">'
    + '<td>' + esc(TLi18n.t('ppc.totals')) + '</td>'
    + '<td>' + (parseInt(t.total_tc, 10) || 0) + '</td>'
    + totalCells
    + '<td>' + (parseFloat(t.percentage_completed) || 0) + '%</td>'
    + '</tr>';

  if (dt) {
    dt.clear().rows.add([]).draw();
    dt.destroy();
    dt = null;
  }
  $('#tbl tbody').html(rows);
  dt = $('#tbl').DataTable({ paging: false, ordering: false, info: false, searching: false });
}

function renderContext(data) {
  $('#ctxProject').text(data.context.tproject_name || '-');
  $('#ctxPlan').text(data.context.tplan_name || '-');
  $('#ctxPlatforms').text(data.context.platforms || 0);
  $('#ctxVersions').text(data.context.tcversions || 0);
}

function load() {
  var tplanId = q('tplan_id');
  if (!tplanId || !/^[0-9]+$/.test(String(tplanId))) {
    showState('<div class="state warn"><h4>' + esc(TLi18n.t('ppc.badRequestTitle')) + '</h4><div>'
      + esc(TLi18n.t('ppc.missingContext')) + '</div><div class="code">tplan_id</div></div>');
    return;
  }

  showLoading();
  var params = new URLSearchParams({ action: 'init', tplan_id: tplanId });
  var asserted = q('tproject_id');
  if (asserted && /^[0-9]+$/.test(String(asserted))) { params.set('tproject_id', asserted); }

  $.ajax({
    url: API,
    method: 'GET',
    data: params.toString(),
    dataType: 'json',
    headers: { 'X-Requested-With': 'XMLHttpRequest' }
  }).done(function (data) {
    if (!data || data.status !== 'ok') {
      showState(stateFor(data && data.code, 200, data && data.message));
      return;
    }
    currentData = data;
    renderContext(data);
    if (data.platforms && data.platforms.length > 0 && data.statuses && data.statuses.length) {
      renderLegend(data.statuses);
      renderChart(data);
      renderTable(data);
      $('#stateBox').html('');
      $('#report').show();
    } else {
      $('#stateBox').html('<div class="state"><h4>' + esc(TLi18n.t('ppc.emptyTitle'))
        + '</h4><div>' + esc(TLi18n.t('ppc.emptyBody')) + '</div></div>');
      $('#report').show();
      $('#chart').html('');
      $('#tbl tbody').html('');
    }
  }).fail(function (xhr) {
    var body = null;
    try { body = JSON.parse(xhr.responseText); } catch (e) { body = null; }
    if (xhr.status === 401) {
      var code = (body && body.code) || 'not_authenticated';
      if (code === 'session_expired' || code === 'not_authenticated') {
        window.location.href = '/login.php?note=expired&destination='
          + encodeURIComponent(window.location.pathname + window.location.search);
        return;
      }
    }
    showState(stateFor(body && body.code, xhr.status, (body && body.message) || null));
  });
}

function exportCsv() {
  if (!currentData || !currentData.platforms || currentData.platforms.length === 0) {
    toast(TLi18n.t('ppc.nothingToExport'), 'err');
    return;
  }
  var head = [TLi18n.t('ppc.colPlatform'), TLi18n.t('ppc.colTotal')];
  $.each(currentData.statuses, function (i, code) {
    head.push(TLi18n.t(styleFor(code).key));
  });
  head.push(TLi18n.t('ppc.colProgress'));
  // A platform name may legally contain the ';' separator, so a cell is quoted when it
  // carries one (double quotes are doubled, per RFC 4180).
  var cell = function (v) {
    var t = String(v === null || v === undefined ? '' : v);
    return /[;"\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  var lines = [$.map(head, cell).join(';')];
  $.each(currentData.platforms, function (i, p) {
    var line = [p.platform, p.total_tc];
    $.each(currentData.statuses, function (j, code) {
      line.push((p.details[code] || {}).qty || 0);
    });
    line.push((p.percentage_completed || 0) + '%');
    lines.push($.map(line, cell).join(';'));
  });
  var tl = currentData.totals || {};
  var ltot = [TLi18n.t('ppc.totals'), tl.total_tc || 0];
  $.each(currentData.statuses, function (j, code) { ltot.push(tl[code] || 0); });
  ltot.push((tl.percentage_completed || 0) + '%');
  lines.push($.map(ltot, cell).join(';'));
  var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'overall-metrics-by-platform-tplan-' + (currentData.context.tplan_id || 0) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast(TLi18n.t('ppc.csvDone'), 'ok');
}

$(function () {
  $('#btnRefresh').on('click', load);
  $('#btnCsv').on('click', exportCsv);
  $('#btnClose').on('click', function () { window.close(); });
  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    load();
  });
});

function clearHeaderAria() {
  $("#tbl thead th").removeAttr("aria-label");
}
</script>
</body>
</html>
