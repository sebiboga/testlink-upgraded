<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Test Plan Metrics</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.btn-teal:hover { background: #3dbdb5; }
.btn-dark { background: #2e3038; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.btn-dark:hover { background: #3d4049; color: #fff; }
.notice { margin: 12px 24px 0; background: #eefaf9; border: 1px solid #bfe5e2; color: #2d8e88; border-radius: 6px; padding: 10px 14px; font-size: 12px; display: none; }
.warnbox { margin: 12px 24px 0; background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; border-radius: 6px; padding: 10px 14px; font-size: 13px; display: none; }
.section { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.section-head { padding: 13px 20px; border-bottom: 1px solid #eee; font-size: 15px; font-weight: 700; color: #22242a; display: flex; align-items: center; gap: 9px; }
.section-head i { color: #4ECDC4; }
.section-body { padding: 6px 20px 14px; overflow-x: auto; }
.sub-title { font-size: 13px; font-weight: 700; color: #2d8e88; margin: 14px 0 4px; }
table.metrics { width: 100%; border-collapse: collapse; font-size: 13px; }
table.metrics th { background: #22242a; color: #fff; padding: 7px 10px; text-align: right; white-space: nowrap; font-size: 12px; }
table.metrics th:first-child { text-align: left; border-top-left-radius: 6px; }
table.metrics th:nth-child(2) { text-align: right; }
table.metrics td { padding: 6px 10px; border-bottom: 1px solid #eee; text-align: right; white-space: nowrap; }
table.metrics td:first-child { text-align: left; font-weight: 600; color: #33363f; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
table.metrics tr:hover td { background: #f4fbfa; }
td.tot { font-weight: 700; color: #22242a; }
.pct { display: inline-block; min-width: 46px; margin-left: 6px; font-size: 11px; border-radius: 8px; padding: 0 7px; background: #eefaf9; color: #2d8e88; font-weight: 600; }
.pct.bad { background: #fdecea; color: #b94a48; }
.note { color: #888; font-style: italic; font-size: 12px; margin: 10px 2px 2px; }
.empty { background: #fff; border-radius: 8px; padding: 30px; text-align: center; color: #888; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px; }
.empty i { font-size: 34px; color: #4ECDC4; display: block; margin-bottom: 10px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.toast.err { background: #e6605e; }
.spin { text-align: center; color: #888; font-size: 13px; padding: 40px 24px; }
.spin i { font-size: 22px; color: #4ECDC4; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 8px; }
@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
</style>
</head>
<body>

<div class="header">
  <i class="fa fa-chart-bar" style="margin-right:8px;"></i><span data-i18n="rgm.header">General Test Plan Metrics</span>
  <span class="sub"><span data-i18n="rgm.inPlan">for test plan</span> <b id="tplanName">-</b></span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <span class="ctx"><span data-i18n="rgm.testProject">Test Project</span>: <b id="tprojectName">-</b></span>
  <span style="flex:1"></span>
  <form id="mailForm" method="POST" target="_blank" style="display:inline;">
    <input type="hidden" name="sendByEmail" value="1">
    <button type="submit" class="btn-dark" id="btnMail" title=""><i class="fa fa-envelope"></i> <span data-i18n="rgm.btnSendEmail">Send report by e-mail</span></button>
  </form>
  <form id="xlsForm" method="POST" target="_blank" style="display:inline;">
    <button type="submit" class="btn-dark" id="btnXls" title=""><i class="fa fa-file-excel"></i> <span data-i18n="rgm.btnExportXls">Export as spreadsheet</span></button>
  </form>
  <button class="btn-teal" id="btnRefresh"><i class="fa fa-sync-alt"></i> <span data-i18n="common.refresh">Refresh</span></button>
</div>

<div class="notice" id="platNotice">
  <i class="fa fa-info-circle"></i> <b data-i18n="rgm.importantNotice">Important notice:</b>
  <span data-i18n="rgm.platformRelationship">Test cases are counted per platform relationship.</span>
</div>

<div class="warnbox" id="warnBox"></div>

<div id="loadingBox" class="spin"><i class="fa fa-circle-notch"></i><br><span data-i18n="common.loading">Loading...</span></div>

<div id="reportArea"></div>

<div class="empty" id="emptyBox" style="display:none;"></div>

<div class="footer" id="footerInfo"></div>
<div class="toast" id="toast"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/reports/index.php';
var tprojectId = 0;
var tplanId = 0;
var DATA = null;

$(function () {
  var p = new URLSearchParams(window.location.search);
  tprojectId = parseInt(p.get('tproject_id') || '0', 10);
  tplanId = parseInt(p.get('tplan_id') || '0', 10);
  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    $('#btnRefresh').on('click', loadReport);
    loadReport();
  });
});

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg, isErr) {
  var $t = $('#toast').text(msg).toggleClass('err', !!isErr).show();
  clearTimeout($t.data('tm'));
  $t.data('tm', setTimeout(function(){ $t.hide(); }, 4000));
}

function warn(msg) {
  if (msg) { $('#warnBox').html('<i class="fa fa-exclamation-triangle"></i> ' + msg).show(); }
  else { $('#warnBox').hide(); }
}

function loadReport() {
  $('#emptyBox').hide();
  $('#reportArea').empty();
  $('#loadingBox').show();
  $.getJSON(API, { action: 'metrics_general', tproject_id: tprojectId, tplan_id: tplanId }, function (r) {
    $('#loadingBox').hide();
    if (r.status !== 'ok') { toast(r.message || TLi18n.t('common.error'), true); return; }
    DATA = r;
    tprojectId = r.tproject_id;
    tplanId = r.tplan_id;
    $('#tprojectName').text(r.tproject_name);
    $('#tplanName').text(r.tplan_name);
    document.title = r.tplan_name + ' - ' + TLi18n.t('rgm.header');
    // legacy export endpoints (document/mail/XLS generation stays legacy)
    $('#mailForm').attr('action', r.send_mail_url);
    $('#xlsForm').attr('action', r.export_xls_url);

    if (!r.hasData) {
      $('#emptyBox').html('<i class="fa fa-inbox"></i>' + esc(TLi18n.t('rgm.noTsuites'))).show();
      return;
    }

    renderAll(r);
    var gen = TLi18n.t('common.generatedOn') + ' ' + new Date().toLocaleString();
    $('#footerInfo').html(esc(gen) + ' &middot; ' +
      esc(TLi18n.t('rgm.elapsedSeconds')) + ' ' + esc(r.elapsed_time));
  }).fail(function (xhr) {
    $('#loadingBox').hide();
    var msg = TLi18n.t('rgm.errLoad');
    if (xhr.status === 403) { msg = TLi18n.t('common.forbidden'); }
    warn(msg);
    toast(msg, true);
  });
}

function renderAll(r) {
  var $area = $('#reportArea').empty();
  var platOrder = platformOrder(r);

  if (r.show_platforms) {
    $area.append(section(TLi18n.t('rgm.resByPlatform'), 'fa-server',
      singleMapTables(r.platform, platOrder, 'rgm.thPlatform', 'total',
        'rgm.infoPlatform')));
    $('#platNotice').show();
  } else {
    $('#platNotice').hide();
  }

  // Metrics by build (active builds with assigned testers)
  if (r.overall_build_status && r.overall_build_status.info &&
      Object.keys(r.overall_build_status.info).length > 0) {
    var $bs = section(TLi18n.t('rgm.metricsByBuild'), 'fa-cubes',
      statTable(r.overall_build_status.info, r.overall_build_status.columns,
        'rgm.thBuild', 'total_assigned', true));
    $bs.find('.section-body').append(
      '<p class="note">' + esc(TLi18n.t('rgm.buildMetricsFeedback')) + '</p>');
    $area.append($bs);
  }

  // Build status per platform
  if (r.show_platforms && r.build_by_platform && r.build_by_platform.info &&
      Object.keys(r.build_by_platform.info).length > 0) {
    var html = '';
    forEachPlatformKey(platOrder, r.build_by_platform.info, function (platId, pname) {
      html += '<div class="sub-title">' + esc(TLi18n.t('rgm.resByBuildOnPlat')) +
        ' ' + esc(pname) + '</div>';
      html += statTable(r.build_by_platform.info[platId],
        r.build_by_platform.columns, 'rgm.thBuild', 'total_assigned', true);
      html += '<p class="note">' + esc(TLi18n.t('rgm.buildMetricsFeedback')) + '</p>';
    });
    if (html !== '') {
      $area.append(section(TLi18n.t('rgm.resBuild'), 'fa-layer-group', html));
    }
  }

  // Results by Top Level Test Suite
  $area.append(section(TLi18n.t('rgm.resByTopLevelSuites'), 'fa-sitemap',
    doubleMapTables(r.suites, platOrder, 'rgm.testSuite', 'infoTopLevelSuites')));

  // Results by priority (only when the project option is on)
  if (r.priority_enabled && r.priorities) {
    $area.append(section(TLi18n.t('rgm.resByPriority'), 'fa-sort-amount-up',
      doubleMapTables(r.priorities, platOrder, 'rgm.priority', 'infoPriorities')));
  }

  // Results by keyword
  if (r.keywords && r.keywords.info && Object.keys(r.keywords.info).length > 0) {
    $area.append(section(TLi18n.t('rgm.resByKeyword'), 'fa-tags',
      doubleMapTables(r.keywords, platOrder, 'rgm.trepKw', 'infoKeywords')));
  }

  // Milestones & priority report (two legacy variants)
  if (r.milestones && r.milestones.length) {
    $area.append(milestonesSection(r.milestones, r.priority_enabled));
  }
}

function platformOrder(r) {
  // ordered [{id,name}] - BFF already natsorted it like initializeGui()
  var out = [];
  var set = r.platform_set || {};
  Object.keys(set).forEach(function (k) { out.push({ id: k, name: set[k] }); });
  if (out.length === 0) { out.push({ id: '', name: '' }); }
  return out;
}

// iterate a double-keyed info map following the platform order
function forEachPlatformKey(platOrder, info, cb) {
  platOrder.forEach(function (pl) {
    if (info.hasOwnProperty(pl.id)) { cb(pl.id, pl.name); }
  });
}

// wrap body html into a panel section
function section(title, icon, bodyHtml) {
  return $(
    '<div class="section"><div class="section-head"><i class="fa ' + icon + '"></i>' +
    '<span>' + esc(title) + '</span></div>' +
    '<div class="section-body">' + bodyHtml + '</div></div>');
}

// sections whose info map is keyed by platform then item (suites/prio/kw)
function doubleMapTables(sec, platOrder, firstNameKey, infoKey) {
  var html = '';
  if (!sec || !sec.info) { return '<p class="note">' + esc(TLi18n.t('common.no')) + '</p>'; }
  forEachPlatformKey(platOrder, sec.info, function (platId, pname) {
    var title = '';
    if (pname !== '') { title = '<div class="sub-title">' +
      esc(TLi18n.t('rgm.subOnPlat')) + ' ' + esc(pname) + '</div>'; }
    html += title + statTable(sec.info[platId], sec.columns,
      firstNameKey, 'total', true);
  });
  html += '<p class="note">' + esc(TLi18n.t('rgm.' + infoKey)) + '</p>';
  return html;
}

// sections whose info map is a plain id->row map (platform totals)
function singleMapTables(sec, platOrder, firstNameKey, totalKey, noteKey) {
  if (!sec || !sec.info || Object.keys(sec.info).length === 0) {
    return '<p class="note">' + esc(TLi18n.t('common.no')) + '</p>';
  }
  return statTable(sec.info, sec.columns,
    firstNameKey, totalKey, true) +
    (noteKey ? '<p class="note">' + esc(TLi18n.t(noteKey)) + '</p>' : '');
}

/**
 * The core table renderer - same columns as legacy
 * results/inc_results_show_table.tpl:
 * first column | TOTAL | per-status qty | per-status [%]
 * Column headers use the server-provided localized status labels.
 */
function statTable(rows, columns, firstNameKey, totalKey, showPct) {
  var rowArr = Object.keys(rows).map(function (k) { return rows[k]; });
  if (rowArr.length === 0) { return ''; }

  var statuses = [];
  if (columns) { statuses = Object.keys(columns); }
  else if (rowArr[0].details) { statuses = Object.keys(rowArr[0].details); }

  function cellTotal(row) {
    if (row[totalKey] != null) { return row[totalKey]; }
    if (row.total != null) { return row.total; }
    var s = 0;
    if (row.details) { Object.keys(row.details).forEach(function (st) {
      s += parseInt(row.details[st].qty || 0, 10); }); }
    return s;
  }

  var h = '<table class="metrics"><thead><tr><th>' +
    esc(TLi18n.t(firstNameKey)) + '</th><th>' + esc(TLi18n.t('rgm.thTcTotal')) + '</th>';
  statuses.forEach(function (st) {
    var lbl = (columns && columns[st] && columns[st].qty) ? columns[st].qty : st;
    h += '<th colspan="' + (showPct ? 2 : 1) + '">' + esc(lbl) + '</th>';
  });
  h += '</tr></thead><tbody>';

  rowArr.forEach(function (row) {
    var tot = cellTotal(row);
    h += '<tr><td>' + esc(row[nameKeyOf(firstNameKey)] || row.name || '') + '</td>' +
         '<td class="tot">' + esc(tot) + '</td>';
    statuses.forEach(function (st) {
      var d = (row.details && row.details[st]) ? row.details[st] : { qty: 0, percentage: 0 };
      var bad = parseFloat(d.percentage) > 0 && st !== 'passed' && st !== 'not_run';
      h += '<td>' + esc(d.qty) + (showPct ? ' <span class="pct ' + (bad ? 'bad' : '') +
        '">' + esc(d.percentage) + '%</span>' : '') + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  return h;
}

// build rows carry the name under build_name, everything else under name
function nameKeyOf(firstNameKey) {
  return firstNameKey === 'rgm.thBuild' ? 'build_name' : 'name';
}

/* Milestones report - two variants exactly like the legacy template */
function milestonesSection(list, prioEnabled) {
  var h = '<table class="metrics"><thead><tr>';
  h += '<th>' + esc(TLi18n.t('rgm.thMilestone')) + '</th>';
  if (prioEnabled) {
    ['high','medium','low'].forEach(function (lv) {
      h += '<th>' + esc(TLi18n.t('rgm.prio_' + lv)) + '</th><th>' +
           esc(TLi18n.t('rgm.thExpected')) + '</th>';
    });
    h += '<th>' + esc(TLi18n.t('rgm.thOverall')) + '</th>';
  } else {
    h += '<th>' + esc(TLi18n.t('rgm.thTcTotal')) + '</th><th>' +
         esc(TLi18n.t('rgm.thCompleted')) + '</th><th>' +
         esc(TLi18n.t('rgm.thProgress')) + '</th><th>' +
         esc(TLi18n.t('rgm.thGoal')) + '</th>';
  }
  h += '</tr></thead><tbody>';

  list.forEach(function (m) {
    var dates = esc(m.name || '');
    if (m.start_date && m.start_date !== '0000-00-00') {
      dates += ' (' + esc(TLi18n.t('rgm.from')) + ' ' + esc(m.start_date);
    } else {
      dates += ' (';
    }
    dates += ' ' + esc(TLi18n.t('rgm.until')) + ' ' + esc(m.target_date) + ')';

    h += '<tr><td>' + dates + '</td>';
    if (prioEnabled) {
      [['high',3],['medium',2],['low',1]].forEach(function (pair) {
        var key = pair[0], idx = pair[1];
        var res = (m.results && m.results[idx]) || 0;
        var tcs = (m.tcs_priority && m.tcs_priority[idx]) || 0;
        var incProp = key + '_incomplete';
        var cls = m[incProp] ? 'bad' : '';
        var pctProp = 'result_' + key + '_percentage';
        h += '<td><span class="pct ' + cls + '">' + esc(m[pctProp]) + '%</span> (' +
             esc(res) + '/' + esc(tcs) + ')</td>';
        var goalProp = key + '_percentage';
        h += '<td>' + esc(m[goalProp]) + '%</td>';
      });
      h += '<td>' + esc(m.percentage_completed) + '%</td>';
    } else {
      var cls = m.medium_incomplete ? 'bad' : '';
      h += '<td>' + esc(m.tc_total) + '</td><td>' + esc(m.tc_completed) + '</td>' +
        '<td><span class="pct ' + cls + '">' + esc(m.percentage_completed) +
        '%</span> (' + esc((m.results && m.results[2]) || 0) + '/' +
        esc((m.tcs_priority && m.tcs_priority[2]) || 0) + ')</td>' +
        '<td>' + esc(m.medium_percentage) + '%</td>';
    }
    h += '</tr>';
  });
  h += '</tbody></table><p class="note">' +
    esc(TLi18n.t(prioEnabled ? 'rgm.infoMilestonesPrio' : 'rgm.infoMilestonesNoPrio')) +
    '</p>';

  return section(TLi18n.t('rgm.milestonesTitle'), 'fa-flag-checkered', h);
}
</script>
</body>
</html>
