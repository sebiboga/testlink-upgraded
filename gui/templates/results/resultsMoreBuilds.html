<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results by Multiple Builds</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.btn-teal:hover { background: #3dbdb5; }
.chk { color: #ccc; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; user-select: none; }
.chk input { accent-color: #4ECDC4; width: 15px; height: 15px; cursor: pointer; }
.warnbox { margin: 12px 24px 0; background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; border-radius: 6px; padding: 10px 14px; font-size: 13px; display: none; }
.section { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.section-head { padding: 13px 20px; border-bottom: 1px solid #eee; font-size: 15px; font-weight: 700; color: #22242a; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.section-head i { color: #4ECDC4; }
.section-body { padding: 16px 20px; overflow-x: auto; }
table.matrix { width: 100%; border-collapse: collapse; font-size: 13px; }
table.matrix th { background: #22242a; color: #fff; padding: 7px 10px; text-align: left; white-space: nowrap; font-size: 12px; }
table.matrix td { padding: 6px 10px; border-bottom: 1px solid #eee; }
table.matrix tr:hover td { background: #f4fbfa; }
table.matrix td.exid { font-weight: 600; color: #33363f; white-space: nowrap; }
td.st { text-align: center; border-radius: 4px; font-size: 12px; font-weight: 600; padding: 3px 8px !important; }
.st-p { background: #d4edda; color: #155724; }
.st-f { background: #f8d7da; color: #721c24; }
.st-b { background: #fff3cd; color: #856404; }
.st-n { background: #e2e3e5; color: #383d41; }
.st-x { background: #d1ecf1; color: #0c5460; }
.ftext { font-size: 12px; }
.ftext label { display: block; font-weight: 700; color: #33363f; margin: 10px 0 4px; font-size: 12px; }
.ftext select, .ftext input { width: 100%; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 18px; }
.form-grid .multi { max-height: 110px; overflow-y: auto; }
.opts-grid { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; border-top: 1px dashed #ddd; padding-top: 12px; }
.opts-grid label { font-size: 13px; color: #33363f; display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; }
.opts-grid select { min-width: 120px; }
.empty { background: #fff; border-radius: 8px; padding: 30px; text-align: center; color: #888; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px; }
.empty i { font-size: 34px; color: #4ECDC4; display: block; margin-bottom: 10px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.toast.err { background: #e6605e; }
.spin { text-align: center; color: #888; font-size: 13px; padding: 40px 24px; }
.spin i { font-size: 22px; color: #4ECDC4; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 8px; }
@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
.params-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.params-table th { background: #f7f7f7; color: #33363f; padding: 6px 10px; text-align: left; font-size: 12px; border: 1px solid #eee; }
.params-table td { padding: 6px 10px; border: 1px solid #eee; }
.summary-table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.summary-table th, .summary-table td { border: 1px solid #eee; padding: 6px 10px; text-align: center; }
.summary-table th { background: #f7f7f7; }
.suite-sum { margin-bottom: 14px; }
.suite-sum h4 { font-size: 14px; color: #2d8e88; margin: 14px 0 6px; }
</style>
</head>
<body>

<div class="header">
  <i class="fa fa-th-large" style="margin-right:8px;"></i><span data-i18n="rmb.header">Results by Multiple Builds</span>
  <span class="sub"><span data-i18n="rmb.forPlan">for test plan</span> <b id="tplanName">-</b></span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <span class="ctx"><span data-i18n="rmb.testProject">Test Project</span>: <b id="tprojectName">-</b></span>
  <span style="flex:1"></span>
  <button class="btn-teal" id="btnRun"><i class="fa fa-play"></i> <span data-i18n="rmb.runQuery">Run Query</span></button>
</div>

<div class="warnbox" id="warnBox"></div>

<div class="section" id="filterSection">
  <div class="section-head"><i class="fa fa-sliders-h"></i><span data-i18n="rmb.filters">Query Parameters</span></div>
  <div class="section-body">
    <div class="form-grid" id="filterGrid">
      <div class="ftext"><label data-i18n="rmb.selectBuilds">Builds</label><select id="fBuilds" multiple class="multi"></select></div>
      <div class="ftext"><label data-i18n="rmb.selectTestsuites">Test Suites</label><select id="fSuites" multiple class="multi"></select></div>
      <div class="ftext"><label data-i18n="rmb.selectPlatforms">Platforms</label><select id="fPlatforms" multiple class="multi"></select></div>
      <div class="ftext"><label data-i18n="rmb.selectKeyword">Keyword</label><select id="fKeyword"></select></div>
      <div class="ftext"><label data-i18n="rmb.selectLastResult">Last Result</label><select id="fLastStatus" multiple class="multi"></select></div>
      <div class="ftext"><label data-i18n="rmb.owner">Owner</label><select id="fOwner"></select></div>
      <div class="ftext"><label data-i18n="rmb.executor">Executor</label><select id="fExecutor"></select></div>
      <div class="ftext"><label data-i18n="rmb.searchInNotes">Search in Notes</label><input id="fNotes" type="text" value=""></div>
      <div class="ftext"><label data-i18n="rmb.startDate">Start Date</label><input id="fStart" type="date"></div>
      <div class="ftext"><label data-i18n="rmb.endDate">End Date</label><input id="fEnd" type="date"></div>
    </div>
    <div class="opts-grid">
      <label><input type="checkbox" id="optSuiteSummaries" checked> <span data-i18n="rmb.displaySuiteSummaries">Display suite summaries</span></label>
      <label><input type="checkbox" id="optTestCases" checked> <span data-i18n="rmb.displayTestCases">Display test cases</span></label>
      <label><input type="checkbox" id="optQueryParams" checked> <span data-i18n="rmb.displayQueryParams">Display query parameters</span></label>
      <label><input type="checkbox" id="optTotals" checked> <span data-i18n="rmb.displayTotals">Display totals</span></label>
      <label><span data-i18n="rmb.displayResults">Results:</span>
        <select id="optLatest"><option value="1"><span data-i18n="rmb.resultsAll">All results</span></option><option value="0"><span data-i18n="rmb.resultsLatest">Latest results</span></option></select>
      </label>
    </div>
  </div>
</div>

<div id="loadingBox" class="spin"><i class="fa fa-circle-notch"></i><br><span data-i18n="common.loading">Loading...</span></div>
<div id="reportArea"></div>
<div class="empty" id="emptyBox" style="display:none;"></div>
<div class="footer" id="footerInfo"></div>
<div class="footer"><span data-i18n="footers.resultsMoreBuilds">TestLink 2.0.1 - Results by Multiple Builds</span></div>
<div class="toast" id="toast"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/reports/index.php';
var tprojectId = 0;
var tplanId = 0;
var statusLabels = {};

$(function () {
  var p = new URLSearchParams(window.location.search);
  tprojectId = parseInt(p.get('tproject_id') || '0', 10);
  tplanId = parseInt(p.get('tplan_id') || '0', 10);
  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    $('#btnRun').on('click', runQuery);
    loadInit();
  });
});

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg, isErr) {
  var $t = $('#toast').text(msg).toggleClass('err', !!isErr).show();
  clearTimeout($t.data('tm'));
  $t.data('tm', setTimeout(function(){ $t.hide(); }, 4000));
}

function warn(msg) {
  if (msg) { $('#warnBox').html('<i class="fa fa-exclamation-triangle"></i> ' + msg).show(); }
  else { $('#warnBox').hide(); }
}

function loadInit() {
  $('#filterSection').hide();
  $('#loadingBox').show();
  $('#reportArea').empty();
  $.getJSON(API, { action: 'more_builds_init', tproject_id: tprojectId, tplan_id: tplanId }, function (r) {
    $('#loadingBox').hide();
    if (r.status !== 'ok') { toast(r.message || TLi18n.t('common.error'), true); return; }
    tprojectId = r.tproject_id;
    tplanId = r.tplan_id;
    $('#tprojectName').text(r.tproject_name);
    $('#tplanName').text(r.tplan_name);
    document.title = r.tplan_name + ' - ' + TLi18n.t('rmb.header');
    statusLabels = r.status_labels || {};
    fillFilters(r);
    $('#filterSection').show();
    runQuery();
  }).fail(function (xhr) {
    $('#loadingBox').hide();
    var msg = TLi18n.t('rmb.errLoad');
    if (xhr.status === 403 || xhr.status === 401) { msg = TLi18n.t('common.forbidden'); }
    warn(msg);
    toast(msg, true);
  });
}

function fillFilters(r) {
  // Builds (active) with a separator note for closed builds appended
  var $b = $('#fBuilds').empty();
  r.builds.forEach(function (b) {
    $b.append('<option value="' + b.id + '" selected>' + esc(b.name) + '</option>');
  });
  if (r.closed_builds.length) {
    $b.append('<optgroup label="' + esc(TLi18n.t('rmb.closedBuilds')) + '">');
    r.closed_builds.forEach(function (b) {
      $b.append('<option value="' + b.id + '">' + esc(b.name) + '</option>');
    });
    $b.append('</optgroup>');
  }

  var $s = $('#fSuites').empty();
  r.testsuites.forEach(function (t) {
    $s.append('<option value="' + t.id + '" selected>' + esc(t.name) + '</option>');
  });

  var $pl = $('#fPlatforms').empty();
  r.platforms.forEach(function (p) {
    $pl.append('<option value="' + p.id + '" selected>' + esc(p.name) + '</option>');
  });

  var $k = $('#fKeyword').empty();
  r.keywords.forEach(function (k) {
    $k.append('<option value="' + k.id + '">' + esc(k.name) + '</option>');
  });

  var $ls = $('#fLastStatus').empty();
  r.status_options.forEach(function (s) {
    $ls.append('<option value="' + esc(s.code) + '" selected>' + esc(s.label) + '</option>');
  });

  var $o = $('#fOwner').empty();
  var $e = $('#fExecutor').empty();
  r.users.forEach(function (u) {
    $o.append('<option value="' + u.id + '">' + esc(u.name) + '</option>');
    $e.append('<option value="' + u.id + '">' + esc(u.name) + '</option>');
  });

  $('#fStart').val(r.selected_start_date);
  $('#fEnd').val(r.selected_end_date);
}

function runQuery() {
  var q = {
    action: 'more_builds',
    tproject_id: tprojectId,
    tplan_id: tplanId,
    build: $('#fBuilds').val() || [],
    testsuite: $('#fSuites').val() || [],
    platform: $('#fPlatforms').val() || [],
    keyword: $('#fKeyword').val(),
    owner: $('#fOwner').val(),
    executor: $('#fExecutor').val(),
    lastStatus: $('#fLastStatus').val() || [],
    search_notes_string: $('#fNotes').val(),
    display_suite_summaries: $('#optSuiteSummaries').prop('checked') ? 1 : 0,
    display_test_cases: $('#optTestCases').prop('checked') ? 1 : 0,
    display_query_params: $('#optQueryParams').prop('checked') ? 1 : 0,
    display_totals: $('#optTotals').prop('checked') ? 1 : 0,
    display_latest_results: $('#optLatest').val()
  };
  if (q.build.length === 0) {
    toast(TLi18n.t('rmb.errNoBuild'), true);
    return;
  }
  $('#warnBox').hide();
  $('#emptyBox').hide();
  $('#reportArea').empty();
  $('#loadingBox').show();
  $.getJSON(API, q, function (r) {
    $('#loadingBox').hide();
    if (r.status !== 'ok') { toast(r.message || TLi18n.t('common.error'), true); return; }
    statusLabels = r.status_labels || statusLabels;
    if (!r.hasData) {
      renderEmpty(TLi18n.t('rmb.noResults'));
      return;
    }
    renderReport(r);
    $('#footerInfo').html(
      esc(TLi18n.t('common.generatedOn')) + ' ' + new Date().toLocaleString() +
      ' &middot; ' + esc(TLi18n.t('rmb.elapsedSeconds')) + ' ' + esc(r.elapsed_time));
  }).fail(function (xhr) {
    $('#loadingBox').hide();
    var msg = TLi18n.t('rmb.errLoad');
    if (xhr.status === 403) { msg = TLi18n.t('common.forbidden'); }
    else if (xhr.status === 401) { msg = TLi18n.t('common.forbidden'); }
    warn(msg);
    toast(msg, true);
  });
}

function renderEmpty(msgHtml) {
  $('#reportArea').empty();
  $('#emptyBox').html('<i class="fa fa-inbox"></i>' + msgHtml).show();
}

function statusCellHtml(status) {
  var label = statusLabels[status] != null ? statusLabels[status] : status;
  var cls = { 'p':'st-p','f':'st-f','b':'st-b','n':'st-n','x':'st-x' }[status] || 'st-n';
  return '<span class="st ' + cls + '">' + esc(label) + '</span>';
}

function renderReport(r) {
  var $area = $('#reportArea').empty();
  var html = '';

  // Query parameters summary
  if (r.display.query_params) {
    html += '<div class="section"><div class="section-head"><i class="fa fa-filter"></i><span>' +
      esc(TLi18n.t('rmb.captionQueryParams')) + '</span></div><div class="section-body"><table class="params-table"><tbody>' +
      '<tr><th>' + esc(TLi18n.t('rmb.thTestPlan')) + '</th><td>' + esc(r.tplan_name) + '</td></tr>' +
      '<tr><th>' + esc(TLi18n.t('rmb.thBuilds')) + '</th><td>' + r.builds.map(function(b){return esc(b.name);}).join('<br>') + '</td></tr>' +
      '<tr><th>' + esc(TLi18n.t('rmb.thTestSuites')) + '</th><td>' + (r.selected.suite_names.length ? r.selected.suite_names.map(esc).join('<br>') : '&mdash;') + '</td></tr>' +
      '<tr><th>' + esc(TLi18n.t('rmb.thKeyword')) + '</th><td>' + esc(r.selected.keyword_name) + '</td></tr>' +
      '<tr><th>' + esc(TLi18n.t('rmb.owner')) + '</th><td>' + esc(r.selected.owner_name) + '</td></tr>' +
      '<tr><th>' + esc(TLi18n.t('rmb.selectLastResult')) + '</th><td>' + r.selected.last_status.map(function(c){return esc(statusLabels[c] != null ? statusLabels[c] : c);}).join('<br>') + '</td></tr>' +
      '<tr><th>' + esc(TLi18n.t('rmb.executor')) + '</th><td>' + esc(r.selected.executor_name) + '</td></tr>' +
      '<tr><th>' + esc(TLi18n.t('rmb.searchInNotes')) + '</th><td>' + esc(r.selected.search_notes_string) + '</td></tr>' +
      '<tr><th>' + esc(TLi18n.t('rmb.displayResults')) + '</th><td>' + esc(r.display.latest_results ? TLi18n.t('rmb.resultsAll') : TLi18n.t('rmb.resultsLatest')) + '</td></tr>' +
      '</tbody></table></div></div>';
  }

  // Totals summary per build
  if (r.display.totals) {
    var statKeys = Object.keys(r.status_labels);
    html += '<div class="section"><div class="section-head"><i class="fa fa-chart-bar"></i><span>' +
      esc(TLi18n.t('rmb.totals')) + '</span></div><div class="section-body"><table class="summary-table"><thead><tr>';
    r.builds.forEach(function (b) { html += '<th>' + esc(b.name) + '</th>'; });
    html += '</tr></thead><tbody><tr>';
    r.builds.forEach(function (b) {
      var total = 0, cells = '';
      statKeys.forEach(function (code) {
        var n = b.counts[code] || 0; total += n;
        cells += '<td>' + esc(statusLabels[code] != null ? statusLabels[code] : code) + ': ' + n + '</td>';
      });
      html += '<td><b>' + total + '</b> total<br>' + cells + '</td>';
    });
    html += '</tr></tbody></table></div></div>';
  }

  // Suite summaries
  if (r.display.suite_summaries && Object.keys(r.suite_summaries).length) {
    html += '<div class="section"><div class="section-head"><i class="fa fa-folder-open"></i><span>' +
      esc(TLi18n.t('rmb.suiteSummaries')) + '</span></div><div class="section-body">';
    Object.keys(r.suite_summaries).sort().forEach(function (sn) {
      var st = r.suite_summaries[sn];
      html += '<div class="suite-sum"><h4>' + esc(sn) + '</h4>';
      html += '<table class="summary-table"><thead><tr><th>' + esc(TLi18n.t('rmb.thTotalCases')) + '</th>';
      statKeys.forEach(function (code) {
        html += '<th>' + esc(statusLabels[code] != null ? statusLabels[code] : code) + '</th>';
      });
      html += '</tr></thead><tbody><tr><td>' + esc(st.total) + '</td>';
      statKeys.forEach(function (code) {
        html += '<td>' + esc(st[code] || 0) + '</td>';
      });
      html += '</tr></tbody></table></div>';
    });
    html += '</div></div>';
  }

  // Test case matrix
  if (r.display.test_cases) {
    html += '<div class="section"><div class="section-head"><i class="fa fa-table"></i><span>' +
      esc(TLi18n.t('rmb.matrix')) + '</span></div><div class="section-body"><table class="matrix"><thead><tr>' +
      '<th>' + esc(TLi18n.t('rmb.thTestCase')) + '</th>' +
      '<th>' + esc(TLi18n.t('rmb.thSuite')) + '</th>';
    r.builds.forEach(function (b) { html += '<th>' + esc(b.name) + '</th>'; });
    html += '</tr></thead><tbody>';
    r.rows.forEach(function (row) {
      html += '<tr><td class="exid">' + esc(row.full_external_id) + ':&nbsp;' + esc(row.name) + '</td>' +
              '<td>' + esc(row.suite_name) + '</td>';
      row.cells.forEach(function (c) { html += '<td>' + statusCellHtml(c.status) + '</td>'; });
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
  }

  $area.html(html);
}
</script>
</body>
</html>
