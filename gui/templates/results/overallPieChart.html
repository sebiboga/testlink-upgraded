<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overall Metrics Pie Chart</title>
<!--
  Overall Metrics Pie Chart screen (Refs #1907).

  Modern twin of lib/results/overallPieChart.php. The 1.9.20 file was an orphan
  PNG endpoint: it never rendered a Smarty template, it included the vendored
  pChart library (third_party/pchart) and answered with a pie chart of the
  plan-wide execution-status distribution (passed / failed / blocked / not run /
  unknown), all builds + all platforms.

  On 2.0.1 the modern Charts screen (charts.html) draws the overall pie as pixels
  via the api/reports charts_data chart, but it exposes no standalone numbers/CSV
  report - unlike its four siblings platformPieChart.html, priorityBarChart.html
  (#1845), keywordBarChart.html (#1906) and topLevelSuitesBarChart.html (#1905).
  This page renders the report the way every other modernized screen does: a
  Dashio shell, the report context, one stacked horizontal bar drawn with plain
  CSS (no chart library to ship) plus a legend, and a DataTable with the exact
  numbers behind the pie. The numbers come from api/overallpiechart/index.php;
  see that file for the documented semantics (latest execution per test-case
  version + platform, all builds, the unknown-bucket convention of
  tlTestPlanMetrics).
-->
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; color: #0d3f3c; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toolbar .spacer { flex: 1 1 auto; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-dark { background: #2f323a; color: #eee; border: 1px solid #444; padding: 7px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.btn-dark:hover { background: #3a3e48; }
.btn-teal:disabled, .btn-dark:disabled { opacity: .45; cursor: not-allowed; }
.panel { margin: 20px 24px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 18px 20px; }
.panel h3 { font-size: 15px; font-weight: 700; color: #22242a; margin: 0 0 14px 0; }
.panel h3 i { color: #4ECDC4; margin-right: 8px; }
.ctx-grid { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.ctx-item { min-width: 150px; }
.ctx-item .k { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .5px; display: block; }
.ctx-item .v { font-size: 14px; color: #22242a; font-weight: 600; }
.back-link { display: inline-block; margin: 16px 0 0 24px; font-size: 13px; }
.back-link a { color: #3a7bd5; text-decoration: none; }
.back-link a:hover { text-decoration: underline; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }
.legend span.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.chart-row { margin-bottom: 6px; }
.chart-row .label { font-size: 12px; color: #444; margin-bottom: 4px; font-weight: 600; }
.chart-row .label .cnt { color: #888; font-weight: 400; }
.bar { display: flex; height: 26px; border-radius: 3px; overflow: hidden; background: #eceff1; }
.bar > span { display: block; height: 100%; }
.chart-row .pct { font-size: 11px; color: #888; margin-top: 6px; }
.state { margin: 20px 24px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 34px 20px; text-align: center; color: #777; font-size: 14px; }
.state h4 { font-size: 16px; color: #22242a; margin: 0 0 8px 0; }
.state.warn { border-left: 5px solid #e6b34d; }
.state.deny { border-left: 5px solid #e05c5c; color: #7a2b2b; }
.state .code { font-size: 11px; color: #aaa; margin-top: 10px; font-family: monospace; }
.state .spinner { display: inline-block; width: 18px; height: 18px; margin-right: 8px; vertical-align: -3px; border: 3px solid #4ECDC4; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.table-wrap { margin: 20px 24px; }
table.dataTable thead th { background: #22242a; color: #fff; font-size: 13px; padding: 10px 14px; }
table.dataTable tbody td { padding: 9px 14px; font-size: 13px; vertical-align: middle; }
table.dataTable tbody tr.total-row { background: #eef7f7; font-weight: 700; }
.badge-st { display: inline-block; min-width: 22px; padding: 1px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; color: #fff; text-align: center; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.meter { background: #eceff1; border-radius: 3px; height: 8px; width: 90px; display: inline-block; vertical-align: middle; margin-right: 8px; }
.meter > span { display: block; height: 100%; background: #4ECDC4; border-radius: 3px; }
.dataTables_wrapper .dataTables_paginate .paginate_button.current { background: #4ECDC4 !important; color: #fff !important; border: none !important; }
.dataTables_wrapper .dataTables_filter input { border: 1px solid #ddd; border-radius: 4px; padding: 4px 8px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; z-index: 2000; display: none; }
.toast.err { background: #e05c5c; }
</style>
</head>
<body>

<div class="header">
  <span data-i18n="opc.title">Overall Metrics Pie Chart</span>
  <span class="sub" data-i18n="opc.subtitle">execution-status distribution of the test plan</span>
</div>

<div class="toolbar">
  <button class="btn-teal" id="btnRefresh"><i class="fa fa-refresh"></i> <span data-i18n="opc.refresh">Refresh</span></button>
  <button class="btn-dark" id="btnCsv"><i class="fa fa-download"></i> <span data-i18n="opc.exportCsv">Export CSV</span></button>
  <span class="spacer"></span>
  <button class="btn-dark" id="btnClose"><i class="fa fa-times"></i> <span data-i18n="opc.close">Close</span></button>
</div>

<div id="stateBox"></div>

<div id="report" style="display:none;">
  <div class="back-link"><a id="backCharts" href="/gui/templates/results/charts.html">
    <i class="fa fa-arrow-left"></i> <span data-i18n="opc.backCharts">Charts</span></a>
  </div>

  <div class="panel">
    <h3><i class="fa fa-info-circle"></i><span data-i18n="opc.contextTitle">Report context</span></h3>
    <div class="ctx-grid">
      <div class="ctx-item"><span class="k" data-i18n="opc.ctxProject">Test project</span><span class="v" id="ctxProject">&mdash;</span></div>
      <div class="ctx-item"><span class="k" data-i18n="opc.ctxPlan">Test plan</span><span class="v" id="ctxPlan">&mdash;</span></div>
      <div class="ctx-item"><span class="k" data-i18n="opc.ctxExecutions">Executions</span><span class="v" id="ctxExecutions">&mdash;</span></div>
      <div class="ctx-item"><span class="k" data-i18n="opc.ctxExecuted">Executed</span><span class="v" id="ctxExecuted">&mdash;</span></div>
    </div>
  </div>

  <div class="panel">
    <h3><i class="fa fa-chart-pie"></i><span data-i18n="opc.chartTitle">Execution-status distribution</span></h3>
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
  </div>

  <div class="table-wrap">
    <table id="tbl" class="display" style="width:100%;">
      <thead>
        <tr>
          <th data-i18n="opc.colStatus">Status</th>
          <th data-i18n="opc.colQuantity">Quantity</th>
          <th data-i18n="opc.colPercentage">Percentage</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="footer"><span data-i18n="footers.overallPieChart"></span><span id="localeSwitcher"></span></div>
<div class="toast" id="toast"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/overallpiechart/index.php';
var currentData = null;
var dt = null;

function esc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function q(name) {
  return new URLSearchParams(window.location.search).get(name);
}

/** Localized label for a BFF failure code -> a {code} message key. */
function stateFor(code, httpStatus, rawMessage) {
  var map = {
    not_authenticated:  { cls: 'deny', title: 'opc.deniedTitle',     body: 'opc.deniedBody' },
    session_expired:    { cls: 'deny', title: 'opc.deniedTitle',     body: 'opc.expiredBody' },
    no_right:           { cls: 'deny', title: 'opc.deniedTitle',     body: 'opc.noRightBody' },
    tplan_not_found:    { cls: 'warn', title: 'opc.notFoundTitle',   body: 'opc.notFoundBody' },
    project_mismatch:   { cls: 'warn', title: 'opc.notFoundTitle',   body: 'opc.mismatchBody' },
    invalid_request:    { cls: 'warn', title: 'opc.badRequestTitle', body: 'opc.badRequestBody' },
    method_not_allowed: { cls: 'warn', title: 'opc.badRequestTitle', body: 'opc.badRequestBody' }
  };
  var m = map[code];
  var detail = '';
  if (!m) {
    m = { cls: 'warn', title: 'opc.serverErrorTitle', body: 'opc.serverErrorBody' };
    // The BFF message is a server-side English string, NOT a bundle key: it must
    // never be handed to TLi18n.t(), which would echo it verbatim on a localized
    // screen. It is shown as escaped raw detail under the localized sentence.
    if (rawMessage) {
      detail = '<div class="code">' + esc(rawMessage) + '</div>';
    }
  }
  return '<div class="state ' + m.cls + '"><h4>' + esc(TLi18n.t(m.title)) + '</h4><div>'
       + esc(TLi18n.t(m.body, { status: httpStatus })) + '</div>' + detail
       + '<div class="code">' + esc(code || ('http_' + httpStatus)) + '</div></div>';
}

function showState(html) {
  $('#report').hide();
  $('#stateBox').html(html);
}

function showLoading() {
  $('#report').hide();
  $('#stateBox').html('<div class="state"><div class="spinner"></div>'
    + esc(TLi18n.t('opc.loading')) + '</div>');
}

function toast(msg, kind) {
  var $t = $('#toast');
  $t.attr('class', 'toast' + (kind ? ' ' + kind : '')).text(msg).fadeIn(180);
  window.clearTimeout(toast._h);
  toast._h = window.setTimeout(function () { $t.fadeOut(220); }, 3200);
}

// Localized label for a status code. Declared explicitly per code: composing
// 'opc.series' + 'Not_run' would build a key that exists in no bundle and
// TLi18n.t() would echo the raw dotted key.
var SERIES = {
  passed:  'opc.seriesPassed',
  failed:  'opc.seriesFailed',
  blocked: 'opc.seriesBlocked',
  not_run: 'opc.seriesNotRun',
  unknown: 'opc.seriesUnknown'
};

function statusLabel(code, fallback) {
  var key = SERIES[code];
  if (!key) { return fallback || code; }
  var v = TLi18n.t(key);
  return (v && v !== key) ? v : (fallback || code);
}

function colourOf(item) {
  var c = String(item.colour || '').replace(/^#/, '');
  return /^[0-9a-fA-F]{6}$/.test(c) ? '#' + c : '#999999';
}

function renderLegend(items) {
  var html = '';
  $.each(items, function (i, it) {
    html += '<span><span class="sw" style="background:' + colourOf(it) + '"></span>'
         + esc(statusLabel(it.code, it.label)) + '</span>';
  });
  $('#legend').html(html);
}

function renderChart(data) {
  // A single stacked bar of the whole distribution, plus an executed caption.
  var total = parseInt(data.totals.total, 10) || 0;
  var html = '<div class="chart-row"><div class="label">'
    + esc(TLi18n.t('opc.distribution')) + ' <span class="cnt">' + total + '</span></div>'
    + '<div class="bar" role="img" aria-label="' + esc(TLi18n.t('opc.chartAria')) + '">';
  $.each(data.items, function (i, it) {
    var pct = parseFloat(it.percentage) || 0;
    if (pct <= 0) { return; }
    html += '<span style="width:' + pct + '%;background:' + colourOf(it) + '" title="'
         + esc(TLi18n.t('opc.seriesTitle', { series: statusLabel(it.code, it.label), count: it.qty }))
         + '"></span>';
  });
  html += '</div><div class="pct">' + esc(TLi18n.t('opc.executedOf', {
      executed: parseInt(data.totals.executed, 10) || 0,
      total: total,
      percent: total > 0 ? (Math.round(1000 * (data.totals.executed / total)) / 10) : 0
    })) + '</div></div>';
  $('#chart').html(html);
}

function renderTable(data) {
  var rows = '';
  $.each(data.items, function (i, it) {
    rows += '<tr>'
      + '<td><span class="swatch" style="background:' + colourOf(it) + '"></span>'
      + esc(statusLabel(it.code, it.label)) + '</td>'
      + '<td>' + (parseInt(it.qty, 10) || 0) + '</td>'
      + '<td><span class="meter"><span style="width:' + (parseFloat(it.percentage) || 0) + '%"></span></span>'
      + (parseFloat(it.percentage) || 0) + '%</td>'
      + '</tr>';
  });
  var t = data.totals || {};
  rows += '<tr class="total-row">'
    + '<td>' + esc(TLi18n.t('opc.totals')) + '</td>'
    + '<td>' + (parseInt(t.total, 10) || 0) + '</td>'
    + '<td>' + esc(TLi18n.t('opc.executedShort', { executed: parseInt(t.executed, 10) || 0 })) + '</td>'
    + '</tr>';

  if (dt) {
    dt.clear().rows.add([]).draw();
    dt.destroy();
    dt = null;
  }
  $('#tbl tbody').html(rows);
  dt = $('#tbl').DataTable({ paging: false, ordering: false, info: false, searching: false });
  setTimeout(function() {
    var $wrap = $('#overallPieChartTable').closest('.dataTables_wrapper');
    if ($wrap.length) {
      var $inp = $wrap.find('.dataTables_filter input[type=search]');
      if ($inp.length) {
        if (!$inp.attr('id')) $inp.attr('id', 'overallPieChartTableSearch');
        if (!$inp.attr('name')) $inp.attr('name', 'overallPieChartTableSearch');
      }
    }
  }, 0);
}

function renderContext(data) {
  $('#ctxProject').text(data.context.tproject_name || '-');
  $('#ctxPlan').text(data.context.tplan_name || '-');
  $('#ctxExecutions').text(parseInt(data.totals.total, 10) || 0);
  $('#ctxExecuted').text(parseInt(data.totals.executed, 10) || 0);
}

function load() {
  var tplanId = q('tplan_id');
  if (!tplanId || !/^[0-9]+$/.test(String(tplanId))) {
    showState('<div class="state warn"><h4>' + esc(TLi18n.t('opc.badRequestTitle')) + '</h4><div>'
      + esc(TLi18n.t('opc.missingContext')) + '</div><div class="code">tplan_id</div></div>');
    return;
  }

  showLoading();
  var params = new URLSearchParams({ action: 'init', tplan_id: tplanId });
  var asserted = q('tproject_id');
  if (asserted && /^[0-9]+$/.test(String(asserted))) { params.set('tproject_id', asserted); }

  $.ajax({
    url: API,
    method: 'GET',
    data: params.toString(),
    dataType: 'json',
    headers: { 'X-Requested-With': 'XMLHttpRequest' }
  }).done(function (data) {
    if (!data || data.status !== 'ok') {
      showState(stateFor(data && data.code, 200, data && data.message));
      return;
    }
    currentData = data;
    renderContext(data);
    // can_draw=false (plan without builds, legacy #634) OR a plan whose build
    // exists but has no assigned/evaluated versions (total 0): both are an empty
    // distribution, so the screen shows its "nothing to chart" state instead of
    // a table of zeros.
    if (!data.items || data.items.length === 0 || (parseInt(data.totals.total, 10) || 0) === 0) {
      $('#stateBox').html('<div class="state"><h4>' + esc(TLi18n.t('opc.emptyTitle'))
        + '</h4><div>' + esc(TLi18n.t('opc.emptyBody')) + '</div></div>');
      $('#report').show();
      $('#chart').html('');
      $('#legend').html('');
      $('#tbl tbody').html('');
      return;
    }
    $('#stateBox').html('');
    renderLegend(data.items);
    renderChart(data);
    renderTable(data);
    $('#report').show();
  }).fail(function (xhr) {
    var body = null;
    try { body = JSON.parse(xhr.responseText); } catch (e) { body = null; }
    if (xhr.status === 401) {
      var code = (body && body.code) || 'not_authenticated';
      if (code === 'session_expired' || code === 'not_authenticated') {
        window.location.href = '/login.php?note=expired&destination='
          + encodeURIComponent(window.location.pathname + window.location.search);
        return;
      }
    }
    showState(stateFor(body && body.code, xhr.status, (body && body.message) || null));
  });
}

function exportCsv() {
  if (!currentData || !currentData.items || currentData.items.length === 0) {
    toast(TLi18n.t('opc.nothingToExport'), 'err');
    return;
  }
  var head = [TLi18n.t('opc.colStatus'), TLi18n.t('opc.colQuantity'), TLi18n.t('opc.colPercentage')];
  // A status label is fixed, but a locale could legally carry the ';' separator,
  // so a cell is quoted when it carries one (double quotes doubled, RFC 4180).
  var cell = function (v) {
    var t = String(v === null || v === undefined ? '' : v);
    // Neutralize spreadsheet formula injection (= + - @ leading cell).
    if (/^[=+\-@]/.test(t)) { t = "'" + t; }
    return /[;"\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  var lines = [$.map(head, cell).join(';')];
  $.each(currentData.items, function (i, it) {
    lines.push($.map([statusLabel(it.code, it.label), it.qty, (it.percentage || 0) + '%'], cell).join(';'));
  });
  lines.push($.map([TLi18n.t('opc.totals'),
    parseInt(currentData.totals.total, 10) || 0,
    (parseInt(currentData.totals.executed, 10) || 0) + ' ' + TLi18n.t('opc.executedWord')], cell).join(';'));
  var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'overall-metrics-pie-tplan-' + (currentData.context.tplan_id || 0) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast(TLi18n.t('opc.csvDone'), 'ok');
}

$(function () {
  // Keep the active plan/project context on the way back to the charts hub
  // (charts.html reads tplan_id/tproject_id from the query string).
  $('#backCharts').attr('href', '/gui/templates/results/charts.html' + window.location.search);
  $('#btnRefresh').on('click', load);
  $('#btnCsv').on('click', exportCsv);
  $('#btnClose').on('click', function () { window.close(); });
  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    load();
  });
});

function clearHeaderAria() {
  $("#tbl thead th").removeAttr("aria-label");
}
</script>
</body>
</html>
