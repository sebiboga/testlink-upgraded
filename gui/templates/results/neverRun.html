<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Cases Never Run</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.btn-teal:hover { background: #3dbdb5; }
.btn-ghost { background: transparent; color: #ccc; border: 1px solid #555; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.btn-ghost:hover { border-color: #4ECDC4; color: #4ECDC4; }
.warnbox { margin: 12px 24px 0; background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; border-radius: 6px; padding: 10px 14px; font-size: 13px; display: none; }
.section { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.section-head { padding: 13px 20px; border-bottom: 1px solid #eee; font-size: 15px; font-weight: 700; color: #22242a; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.section-head i { color: #4ECDC4; }
.section-head .bmeta { font-size: 12px; font-weight: 400; color: #667; margin-left: auto; }
.section-body { padding: 10px 20px 14px; overflow-x: auto; }
table.flat { width: 100%; border-collapse: collapse; font-size: 12px; }
table.flat th { background: #22242a; color: #fff; padding: 7px 10px; text-align: left; white-space: nowrap; font-size: 11.5px; position: sticky; top: 0; z-index: 1; }
table.flat td { padding: 5px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
table.flat tr:hover td { background: #f4fbfa; }
td.suitecell { color: #667; font-size: 11px; max-width: 200px; word-break: break-word; }
td.tccell { white-space: nowrap; }
.tcid { font-weight: 600; color: #33363f; }
.empty { background: #fff; border-radius: 8px; padding: 30px; text-align: center; color: #888; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px; }
.empty i { font-size: 34px; color: #4ECDC4; display: block; margin-bottom: 10px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.footer p.info { margin: 6px 0 0; font-style: italic; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.toast.err { background: #e6605e; }
.spin { text-align: center; color: #888; font-size: 13px; padding: 40px 24px; }
.spin i { font-size: 22px; color: #4ECDC4; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 8px; }
@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
.dataTables_wrapper .dataTables_filter input { border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px; font-size: 12px; }
.dataTables_wrapper .dataTables_length select { border: 1px solid #ccc; border-radius: 4px; padding: 4px; font-size: 12px; }
.launcher-box { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px; padding: 24px; }
.launcher-box h4 { margin: 0 0 14px; font-size: 15px; color: #22242a; }
.launcher-box h4 i { color: #4ECDC4; margin-right: 8px; }
.launcher-box label { font-weight: 600; font-size: 13px; color: #444; display: block; margin-bottom: 6px; }
.launcher-box select { width: 100%; max-width: 500px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
.launcher-box .actions { margin-top: 16px; display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>

<div class="header">
  <i class="fa fa-forward" style="margin-right:8px;"></i>
  <span data-i18n="nr.header">Test Cases Never Run</span>
  <span class="sub"><span data-i18n="nr.forPlan">for test plan</span> <b id="tplanName">-</b></span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <span class="ctx"><span data-i18n="nr.testProject">Test Project</span>: <b id="tprojectName">-</b></span>
  <span style="flex:1"></span>
  <a class="btn-ghost" id="btnXls" href="#" target="_blank" style="display:none;">
    <i class="fa fa-file-excel"></i> <span data-i18n="nr.btnExportXls">Export as spreadsheet</span>
  </a>
  <a class="btn-ghost" id="btnMailXls" href="#" target="avoidMailFrame" style="display:none;">
    <i class="fa fa-envelope"></i> <span data-i18n="nr.btnSendEmail">Send spreadsheet by email</span>
  </a>
  <button class="btn-teal" id="btnRefresh" style="display:none;"><i class="fa fa-sync-alt"></i> <span data-i18n="common.refresh">Refresh</span></button>
</div>

<div class="warnbox" id="warnBox"></div>

<div id="loadingBox" class="spin"><i class="fa fa-circle-notch"></i><br><span data-i18n="common.loading">Loading...</span></div>

<div id="launcherBox" class="launcher-box" style="display:none;">
  <h4><i class="fa fa-filter"></i> <span data-i18n="nr.selectPlatforms">Select platforms to include</span></h4>
  <div id="platformSection">
    <label data-i18n="platform">Platform</label>
    <select multiple id="platSelect"></select>
  </div>
  <div class="actions">
    <button class="btn-teal" id="btnGenerate"><i class="fa fa-play"></i> <span data-i18n="nr.btnGenerate">Generate Report</span></button>
  </div>
</div>

<div id="reportArea"></div>

<div class="empty" id="emptyBox" style="display:none;"></div>

<div class="footer" id="footerInfo"></div>
<div class="footer"><span data-i18n="footers.neverRun">TestLink 2.0.1 - Test Cases Never Run</span></div>
<div class="toast" id="toast"></div>
<iframe name="avoidMailFrame" style="display:none;"></iframe>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script>
var tproject_id = parseInt(new URLSearchParams(window.location.search).get('tproject_id')) || 0;
var tplan_id = parseInt(new URLSearchParams(window.location.search).get('tplan_id')) || 0;
var initDone = false;

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function toast(msg, isErr) {
  var $t = $('#toast').text(msg).show();
  if (isErr) $t.addClass('err'); else $t.removeClass('err');
  setTimeout(function(){ $t.fadeOut(300); }, 3000);
}
function t(key, fallback) {
  var v = TLi18n.t(key);
  return (v && v !== key) ? v : (fallback || key);
}

function loadInit() {
  $('#loadingBox').show();
  $.ajax({
    url: '/api/reports/index.php',
    data: { action: 'never_run_init', tproject_id: tproject_id, tplan_id: tplan_id },
    dataType: 'json',
    success: function(d) {
      $('#loadingBox').hide();
      if (d.status === 'error') { $('#warnBox').text(d.message).show(); return; }
      $('#tplanName').text(d.tplan_name || '-');
      $('#tprojectName').text(d.tproject_name || '-');
      if (d.export_xls_url) $('#btnXls').attr('href', d.export_xls_url).show();
      if (d.send_mail_url) $('#btnMailXls').attr('href', d.send_mail_url).show();

      if (!d.show_platforms || !d.platforms || d.platforms.length === 0) {
        $('#platformSection').hide();
      } else {
        var sel = $('#platSelect');
        sel.empty();
        for (var i = 0; i < d.platforms.length; i++) {
          sel.append('<option value="' + d.platforms[i].id + '">' + esc(d.platforms[i].name) + '</option>');
        }
        $('#platformSection').show();
      }

      $('#launcherBox').show();
      initDone = true;
    },
    error: function(xhr) {
      $('#loadingBox').hide();
      $('#warnBox').text('Error loading data: ' + xhr.statusText).show();
    }
  });
}

function loadResult() {
  $('#btnRefresh').hide();
  $('#loadingBox').show();
  $('#warnBox').hide().empty();
  $('#emptyBox').hide();
  $('#reportArea').empty();
  $('#footerInfo').empty();

  var platSet = [];
  $('#platSelect option:selected').each(function() {
    var v = parseInt($(this).val());
    if (v > 0) platSet.push(v);
  });

  var params = { action: 'never_run_result', tproject_id: tproject_id, tplan_id: tplan_id };
  if (platSet.length > 0) {
    params['platSet[]'] = platSet;
  }

  $.ajax({
    url: '/api/reports/index.php',
    data: params,
    dataType: 'json',
    success: function(d) {
      $('#loadingBox').hide();
      if (d.status === 'error') { $('#warnBox').text(d.message).show(); return; }

      if (d.export_xls_url) $('#btnXls').attr('href', d.export_xls_url);
      if (d.send_mail_url) $('#btnMailXls').attr('href', d.send_mail_url);

      if (!d.hasData || !d.rows || d.rows.length === 0) {
        $('#emptyBox').html('<i class="fa fa-check-circle"></i> ' +
          esc(d.info_msg || t('nr.noNeverRun', 'All test cases have been executed at least once.'))).show();
        return;
      }

      var cols = [
        { title: t('title_test_case_title', 'Test Case') }
      ];
      if (d.show_platforms) {
        cols.push({ title: t('platform', 'Platform') });
      }

      var rows = [];
      for (var i = 0; i < d.rows.length; i++) {
        var r = d.rows[i], row = [];
        row.push('<td class="tccell"><span class="tcid">' + esc(r.test_title) + '</span></td>');
        if (d.show_platforms) row.push('<td>' + esc(r.platform_name || '') + '</td>');
        rows.push(row);
      }

      var $sec = $('<div class="section"></div>');
      $sec.append('<div class="section-head"><i class="fa fa-forward"></i> ' + t('nr.header', 'Test Cases Never Run') +
        '<span class="bmeta">' + d.rows.length + ' ' + t('common.records', 'records') + '</span></div>');
      var $tbl = $('<table class="flat" id="dtResults"></table>');
      var hdr = '<tr>'; for (var c = 0; c < cols.length; c++) hdr += '<th>' + cols[c].title + '</th>'; hdr += '</tr>';
      $tbl.append('<thead>' + hdr + '</thead>');
      var tbody = ''; for (var ri = 0; ri < rows.length; ri++) { tbody += '<tr>'; for (var ci = 0; ci < rows[ri].length; ci++) tbody += rows[ri][ci]; tbody += '</tr>'; }
      $tbl.append('<tbody>' + tbody + '</tbody>');
      $sec.append($('<div class="section-body"></div>').append($tbl));
      $('#reportArea').append($sec);
      $('#dtResults').DataTable({ pageLength: 25, order: [], language: { search: t('common.search', 'Search:') } });

      var footer = '';
      if (d.info_msg) footer += '<p class="info">' + esc(d.info_msg) + '</p>';
      footer += '<p>' + t('common.generatedBy', 'Generated by TestLink on') + ' ' + new Date().toLocaleString() + '</p>';
      if (d.elapsed_time) footer += '<p class="info">' + t('nr.elapsedSeconds', 'Elapsed') + ': ' + d.elapsed_time + 's</p>';
      $('#footerInfo').html(footer);
      toast(t('common.loaded', 'Loaded'));
    },
    error: function(xhr) {
      $('#loadingBox').hide();
      $('#warnBox').text('Error loading data: ' + xhr.statusText).show();
    }
  });
}

$(function() {
  TLi18n.load(function() {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    $('#btnGenerate').on('click', function() {
      $('#launcherBox').hide();
      $('#btnRefresh').show();
      loadResult();
    });
    $('#btnRefresh').on('click', function() {
      $('#launcherBox').show();
      $('#btnRefresh').hide();
      loadResult();
    });
    loadInit();
  });
});
</script>
</body>
</html>
