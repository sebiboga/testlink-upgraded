<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results by Keyword Bar Chart</title>
<!--
  Results by Keyword Bar Chart screen (Refs #1906).

  Modern twin of lib/results/keywordBarChart.php. The 1.9.20 file was an orphan
  PNG endpoint: it never rendered a Smarty template, it included the vendored
  pChart wrapper (charts.inc.php -> third_party/pchart) and answered with a
  stacked bar chart, one bar per KEYWORD used by the test cases of the test
  plan, each bar stacked over the execution-status totals (passed / failed /
  blocked / not run) of every test-case version carrying it, all builds + all
  platforms.

  On 2.0.1 the modern Charts screen (charts.html) draws Results by Keyword as
  pixels via the api/reports charts_data chart, but it exposes no standalone
  numbers/CSV report - unlike its siblings priorityBarChart.html (#1845) and
  topLevelSuitesBarChart.html (#1905). This page renders the report the way
  every other modernized screen does: a Dashio shell, the report context, a
  stacked horizontal bar per keyword drawn with plain CSS (no chart library to
  ship), and a DataTable with the exact numbers behind each bar. The numbers
  come from api/keywordbarchart/index.php; see that file for the documented
  semantics (execution counts by status, all builds / platforms, the
  launch-totals convention of tlTestPlanMetrics).
-->
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; color: #0d3f3c; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toolbar .spacer { flex: 1 1 auto; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-dark { background: #2f323a; color: #eee; border: 1px solid #444; padding: 7px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.btn-dark:hover { background: #3a3e48; }
.btn-teal:disabled, .btn-dark:disabled { opacity: .45; cursor: not-allowed; }
.panel { margin: 20px 24px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 18px 20px; }
.panel h3 { font-size: 15px; font-weight: 700; color: #22242a; margin: 0 0 14px 0; }
.panel h3 i { color: #4ECDC4; margin-right: 8px; }
.ctx-grid { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.ctx-item { min-width: 150px; }
.ctx-item .k { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .5px; display: block; }
.ctx-item .v { font-size: 14px; color: #22242a; font-weight: 600; }
.back-link { display: inline-block; margin: 16px 0 0 24px; font-size: 13px; }
.back-link a { color: #3a7bd5; text-decoration: none; }
.back-link a:hover { text-decoration: underline; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }
.legend span.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.sw-passed { background: #2f9e44; }
.sw-failed { background: #e05c5c; }
.sw-blocked { background: #3a7bd5; }
.sw-not_run { background: #b9bec7; }
.chart-row { margin-bottom: 14px; }
.chart-row .label { font-size: 12px; color: #444; margin-bottom: 4px; font-weight: 600; }
.chart-row .label .cnt { color: #888; font-weight: 400; }
.bar { display: flex; height: 22px; border-radius: 3px; overflow: hidden; background: #eceff1; }
.bar > span { display: block; height: 100%; }
.bar .passed { background: #2f9e44; }
.bar .failed { background: #e05c5c; }
.bar .blocked { background: #3a7bd5; }
.bar .not_run { background: #b9bec7; }
.chart-row .pct { font-size: 11px; color: #888; margin-top: 3px; }
.state { margin: 20px 24px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 34px 20px; text-align: center; color: #777; font-size: 14px; }
.state h4 { font-size: 16px; color: #22242a; margin: 0 0 8px 0; }
.state.warn { border-left: 5px solid #e6b34d; }
.state.deny { border-left: 5px solid #e05c5c; color: #7a2b2b; }
.state .code { font-size: 11px; color: #aaa; margin-top: 10px; font-family: monospace; }
.state .spinner { display: inline-block; width: 18px; height: 18px; margin-right: 8px; vertical-align: -3px; border: 3px solid #4ECDC4; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.table-wrap { margin: 20px 24px; }
table.dataTable thead th { background: #22242a; color: #fff; font-size: 13px; padding: 10px 14px; }
table.dataTable tbody td { padding: 9px 14px; font-size: 13px; vertical-align: middle; }
table.dataTable tbody tr.total-row { background: #eef7f7; font-weight: 700; }
.badge-st { display: inline-block; min-width: 22px; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; color: #fff; text-align: center; }
.badge-st.passed { background: #2f9e44; }
.badge-st.failed { background: #e05c5c; }
.badge-st.blocked { background: #3a7bd5; }
.badge-st.not_run { background: #b9bec7; color: #333; }
.meter { background: #eceff1; border-radius: 3px; height: 8px; width: 90px; display: inline-block; vertical-align: middle; margin-right: 8px; }
.meter > span { display: block; height: 100%; background: #4ECDC4; border-radius: 3px; }
.dataTables_wrapper .dataTables_paginate .paginate_button.current { background: #4ECDC4 !important; color: #fff !important; border: none !important; }
.dataTables_wrapper .dataTables_filter input { border: 1px solid #ddd; border-radius: 4px; padding: 4px 8px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; z-index: 2000; display: none; }
.toast.err { background: #e05c5c; }
</style>
</head>
<body>

<div class="header">
  <span data-i18n="kwbc.title">Results by Keyword Bar Chart</span>
  <span class="sub" data-i18n="kwbc.subtitle">execution totals per keyword</span>
</div>

<div class="toolbar">
  <button class="btn-teal" id="btnRefresh"><i class="fa fa-refresh"></i> <span data-i18n="kwbc.refresh">Refresh</span></button>
  <button class="btn-dark" id="btnCsv"><i class="fa fa-download"></i> <span data-i18n="kwbc.exportCsv">Export CSV</span></button>
  <span class="spacer"></span>
  <button class="btn-dark" id="btnClose"><i class="fa fa-times"></i> <span data-i18n="kwbc.close">Close</span></button>
</div>

<div id="stateBox"></div>

<div id="report" style="display:none;">
  <div class="back-link"><a id="backCharts" href="/gui/templates/results/charts.html">
    <i class="fa fa-arrow-left"></i> <span data-i18n="kwbc.backCharts">Charts</span></a>
  </div>

  <div class="panel">
    <h3><i class="fa fa-info-circle"></i><span data-i18n="kwbc.contextTitle">Report context</span></h3>
    <div class="ctx-grid">
      <div class="ctx-item"><span class="k" data-i18n="kwbc.ctxProject">Test project</span><span class="v" id="ctxProject">&mdash;</span></div>
      <div class="ctx-item"><span class="k" data-i18n="kwbc.ctxPlan">Test plan</span><span class="v" id="ctxPlan">&mdash;</span></div>
      <div class="ctx-item"><span class="k" data-i18n="kwbc.ctxKeywords">Keywords</span><span class="v" id="ctxKeywords">&mdash;</span></div>
      <div class="ctx-item"><span class="k" data-i18n="kwbc.ctxVersions">Test case versions</span><span class="v" id="ctxVersions">&mdash;</span></div>
    </div>
  </div>

  <div class="panel">
    <h3><i class="fa fa-bar-chart"></i><span data-i18n="kwbc.chartTitle">Execution totals per keyword</span></h3>
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
  </div>

  <div class="table-wrap">
    <table id="tbl" class="display" style="width:100%;">
      <thead>
        <tr>
          <th data-i18n="kwbc.colKeyword">Keyword</th>
          <th data-i18n="kwbc.colTotal">Total</th>
          <th data-i18n="kwbc.colPassed">Passed</th>
          <th data-i18n="kwbc.colFailed">Failed</th>
          <th data-i18n="kwbc.colBlocked">Blocked</th>
          <th data-i18n="kwbc.colNotRun">Not run</th>
          <th data-i18n="kwbc.colProgress">Progress</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="footer"><span data-i18n="footers.keywordBarChart"></span><span id="localeSwitcher"></span></div>
<div class="toast" id="toast"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/keywordbarchart/index.php';
var currentData = null;
var dt = null;

function esc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function q(name) {
  return new URLSearchParams(window.location.search).get(name);
}

/** Localized label for a BFF failure code -> a {code} message key. */
function stateFor(code, httpStatus, rawMessage) {
  var map = {
    not_authenticated:      { cls: 'deny', title: 'kwbc.deniedTitle',    body: 'kwbc.deniedBody' },
    session_expired:        { cls: 'deny', title: 'kwbc.deniedTitle',    body: 'kwbc.expiredBody' },
    no_right:               { cls: 'deny', title: 'kwbc.deniedTitle',    body: 'kwbc.noRightBody' },
    tplan_not_found:        { cls: 'warn', title: 'kwbc.notFoundTitle',  body: 'kwbc.notFoundBody' },
    project_mismatch:       { cls: 'warn', title: 'kwbc.notFoundTitle',  body: 'kwbc.mismatchBody' },
    invalid_request:        { cls: 'warn', title: 'kwbc.badRequestTitle', body: 'kwbc.badRequestBody' },
    method_not_allowed:     { cls: 'warn', title: 'kwbc.badRequestTitle', body: 'kwbc.badRequestBody' }
  };
  var m = map[code];
  var detail = '';
  if (!m) {
    m = { cls: 'warn', title: 'kwbc.serverErrorTitle', body: 'kwbc.serverErrorBody' };
    // The BFF message is a server-side English string, NOT a bundle key: it must
    // never be handed to TLi18n.t(), which would echo it verbatim on a localized
    // screen. It is shown as escaped raw detail under the localized sentence.
    if (rawMessage) {
      detail = '<div class="code">' + esc(rawMessage) + '</div>';
    }
  }
  // kwbc.serverErrorBody carries a {status} placeholder, so the params are
  // always passed - calling t() without them would print the literal "{status}".
  return '<div class="state ' + m.cls + '"><h4>' + esc(TLi18n.t(m.title)) + '</h4><div>'
       + esc(TLi18n.t(m.body, { status: httpStatus })) + '</div>' + detail
       + '<div class="code">' + esc(code || ('http_' + httpStatus)) + '</div></div>';
}

function showState(html) {
  $('#report').hide();
  $('#stateBox').html(html);
}

function showLoading() {
  $('#report').hide();
  $('#stateBox').html('<div class="state"><div class="spinner"></div>'
    + esc(TLi18n.t('kwbc.loading')) + '</div>');
}

function toast(msg, kind) {
  var $t = $('#toast');
  $t.attr('class', 'toast' + (kind ? ' ' + kind : '')).text(msg).fadeIn(180);
  window.clearTimeout(toast._h);
  toast._h = window.setTimeout(function () { $t.fadeOut(220); }, 3200);
}

// The four stacked series. Declared explicitly, never composed from the CSS
// class: 'kwbc.series' + 'Not_run' would build a key that exists in no bundle
// (it is kwbc.seriesNotRun) and TLi18n.t() would echo the raw dotted key.
var SERIES = [
  ['passed', 'kwbc.seriesPassed'],
  ['failed', 'kwbc.seriesFailed'],
  ['blocked', 'kwbc.seriesBlocked'],
  ['not_run', 'kwbc.seriesNotRun']
];

function renderLegend() {
  var html = '';
  $.each(SERIES, function (i, it) {
    html += '<span><span class="sw sw-' + it[0] + '"></span>'
         + esc(TLi18n.t(it[1])) + '</span>';
  });
  $('#legend').html(html);
}

function renderChart(data) {
  var html = '';
  $.each(data.items, function (i, k) {
    var total = parseInt(k.total_tc, 10) || 0;
    var q = function (s) { return parseInt(k.details[s].qty, 10) || 0; };
    var sum = q('passed') + q('failed') + q('blocked') + q('not_run');
    // Scale the buckets by their own sum, not by total_tc: a version with two
    // latest-status buckets can push sum above total_tc, which would overflow
    // the track. Using the sum keeps the proportions and clamps the bar to 100%.
    var pct = sum > 0 ? (100 / sum) : 0;
    var label = esc(TLi18n.t('kwbc.chartAria', { keyword: k.name }));
    html += '<div class="chart-row"><div class="label">' + esc(k.name)
         + ' <span class="cnt">' + total + '</span></div>'
         + '<div class="bar" role="img" aria-label="' + label + '">'
         + bar(SERIES[0], k.details.passed.qty, pct)
         + bar(SERIES[1], k.details.failed.qty, pct)
         + bar(SERIES[2], k.details.blocked.qty, pct)
         + bar(SERIES[3], k.details.not_run.qty, pct)
         + '</div><div class="pct">' + esc(TLi18n.t('kwbc.executedOf', {
              executed: total - (parseInt(k.details.not_run.qty, 10) || 0),
              total: total, percent: k.percentage_completed })) + '</div></div>';
  });
  $('#chart').html(html);
}

function bar(series, value, pctPerUnit) {
  var v = parseInt(value, 10) || 0;
  if (v <= 0) { return ''; }
  return '<span class="' + series[0] + '" style="width:' + (v * pctPerUnit) + '%" title="'
       + esc(TLi18n.t('kwbc.seriesTitle', { series: TLi18n.t(series[1]), count: v }))
       + '"></span>';
}

function badge(cls, value) {
  var v = parseInt(value, 10) || 0;
  return '<span class="badge-st ' + cls + '">' + v + '</span>';
}

function renderTable(data) {
  var rows = '';
  $.each(data.items, function (i, k) {
    var total = parseInt(k.total_tc, 10) || 0;
    rows += '<tr>'
      + '<td>' + esc(k.name) + '</td>'
      + '<td>' + total + '</td>'
      + '<td>' + badge('passed', k.details.passed.qty) + '</td>'
      + '<td>' + badge('failed', k.details.failed.qty) + '</td>'
      + '<td>' + badge('blocked', k.details.blocked.qty) + '</td>'
      + '<td>' + badge('not_run', k.details.not_run.qty) + '</td>'
      + '<td><span class="meter"><span style="width:' + (parseFloat(k.percentage_completed) || 0) + '%"></span></span>'
      + (parseFloat(k.percentage_completed) || 0) + '%</td>'
      + '</tr>';
  });
  var t = data.totals || {};
  rows += '<tr class="total-row">'
    + '<td>' + esc(TLi18n.t('kwbc.totals')) + '</td>'
    + '<td>' + (parseInt(t.passed, 10) + parseInt(t.failed, 10) + parseInt(t.blocked, 10) + parseInt(t.not_run, 10)) + '</td>'
    + '<td>' + badge('passed', t.passed) + '</td>'
    + '<td>' + badge('failed', t.failed) + '</td>'
    + '<td>' + badge('blocked', t.blocked) + '</td>'
    + '<td>' + badge('not_run', t.not_run) + '</td>'
    + '<td>' + (parseInt(t.passed, 10) + parseInt(t.failed, 10) + parseInt(t.blocked, 10)) + '</td>'
    + '</tr>';

  if (dt) {
    dt.clear().rows.add([]).draw();
    dt.destroy();
    dt = null;
  }
  $('#tbl tbody').html(rows);
  dt = $('#tbl').DataTable({ paging: false, ordering: false, info: false, searching: false });
}

function renderContext(data) {
  $('#ctxProject').text(data.context.tproject_name || '-');
  $('#ctxPlan').text(data.context.tplan_name || '-');
  var total = 0;
  $.each(data.items, function (i, k) { total += parseInt(k.total_tc, 10) || 0; });
  $('#ctxKeywords').text(data.items ? data.items.length : 0);
  $('#ctxVersions').text(total);
}

function load() {
  var tplanId = q('tplan_id');
  if (!tplanId || !/^[0-9]+$/.test(String(tplanId))) {
    showState('<div class="state warn"><h4>' + esc(TLi18n.t('kwbc.badRequestTitle')) + '</h4><div>'
      + esc(TLi18n.t('kwbc.missingContext')) + '</div><div class="code">tplan_id</div></div>');
    return;
  }

  showLoading();
  var params = new URLSearchParams({ action: 'init', tplan_id: tplanId });
  var asserted = q('tproject_id');
  if (asserted && /^[0-9]+$/.test(String(asserted))) { params.set('tproject_id', asserted); }

  $.ajax({
    url: API,
    method: 'GET',
    data: params.toString(),
    dataType: 'json',
    headers: { 'X-Requested-With': 'XMLHttpRequest' }
  }).done(function (data) {
    if (!data || data.status !== 'ok') {
      showState(stateFor(data && data.code, 200, data && data.message));
      return;
    }
    currentData = data;
    renderContext(data);
    renderLegend();
    if (!data.items || data.items.length === 0) {
      $('#stateBox').html('<div class="state"><h4>' + esc(TLi18n.t('kwbc.emptyTitle'))
        + '</h4><div>' + esc(TLi18n.t('kwbc.emptyBody')) + '</div></div>');
      $('#report').show();
      $('#chart').html('');
      $('#tbl tbody').html('');
      return;
    }
    $('#stateBox').html('');
    renderChart(data);
    renderTable(data);
    $('#report').show();
  }).fail(function (xhr) {
    var body = null;
    try { body = JSON.parse(xhr.responseText); } catch (e) { body = null; }
    if (xhr.status === 401) {
      var code = (body && body.code) || 'not_authenticated';
      if (code === 'session_expired' || code === 'not_authenticated') {
        window.location.href = '/login.php?note=expired&destination='
          + encodeURIComponent(window.location.pathname + window.location.search);
        return;
      }
    }
    showState(stateFor(body && body.code, xhr.status, (body && body.message) || null));
  });
}

function exportCsv() {
  if (!currentData || !currentData.items || currentData.items.length === 0) {
    toast(TLi18n.t('kwbc.nothingToExport'), 'err');
    return;
  }
  var head = [TLi18n.t('kwbc.colKeyword'), TLi18n.t('kwbc.colTotal'), TLi18n.t('kwbc.colPassed'),
    TLi18n.t('kwbc.colFailed'), TLi18n.t('kwbc.colBlocked'), TLi18n.t('kwbc.colNotRun'),
    TLi18n.t('kwbc.colProgress')];
  // A keyword name may legally contain the ';' separator, so a cell is quoted when it
  // carries one (double quotes are doubled, per RFC 4180).
  var cell = function (v) {
    var t = String(v === null || v === undefined ? '' : v);
    // Neutralize spreadsheet formula injection: a keyword name beginning with
    // = + - @ would otherwise execute as a formula when the CSV is opened.
    if (/^[=+\-@]/.test(t)) { t = "'" + t; }
    return /[;"\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  var lines = [$.map(head, cell).join(';')];
  var push = function (label, k) {
    var qty = function (d, s) { return (d && d[s] && d[s].qty) ? d[s].qty : 0; };
    var total = qty(k.details, 'passed') + qty(k.details, 'failed')
              + qty(k.details, 'blocked') + qty(k.details, 'not_run');
    var executed = qty(k.details, 'passed') + qty(k.details, 'failed') + qty(k.details, 'blocked');
    lines.push($.map([label, total, qty(k.details, 'passed'), qty(k.details, 'failed'),
      qty(k.details, 'blocked'), qty(k.details, 'not_run'),
      (k.percentage_completed || 0) + '%'], cell).join(';'));
    return executed;
  };
  var totalExecuted = 0;
  $.each(currentData.items, function (i, k) { totalExecuted += push(k.name, k); });
  push(TLi18n.t('kwbc.totals'), {
    details: { passed: { qty: currentData.totals.passed }, failed: { qty: currentData.totals.failed },
               blocked: { qty: currentData.totals.blocked }, not_run: { qty: currentData.totals.not_run } }
  });
  var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'results-by-keyword-bar-chart-tplan-' + (currentData.context.tplan_id || 0) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast(TLi18n.t('kwbc.csvDone'), 'ok');
}

$(function () {
  // Keep the active plan/project context on the way back to the charts hub
  // (charts.html reads tplan_id/tproject_id from the query string).
  $('#backCharts').attr('href', '/gui/templates/results/charts.html' + window.location.search);
  $('#btnRefresh').on('click', load);
  $('#btnCsv').on('click', exportCsv);
  $('#btnClose').on('click', function () { window.close(); });
  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    load();
  });
});
</script>
</body>
</html>
