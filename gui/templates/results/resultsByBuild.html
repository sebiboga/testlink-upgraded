<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Test Plan Results by Build report of TestLink 2.0.1 (Refs #1980)">
<title>Test Plan Results by Build</title>
<!--
  Test Plan Results by Build report (Refs #1980).

  Net-new modern Reports-menu screen replacing the last legacy Results renderer
  (gui/templates/dashio/results/resultsBuild.tpl). One row per build of the
  plan: how many assigned versions were executed in that build, their latest
  status split (passed / failed / blocked / not run), pass rate and coverage,
  plus the execution-event count and the last execution timestamp. Data comes
  from api/resultsbybuild/index.php (actions init / report); see that file for
  the documented semantics.
-->
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #0d3f3c; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toolbar label { color: #cfd3da; font-size: 12px; margin-right: 4px; }
.toolbar select { background: #2f323a; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 6px 10px; font-size: 13px; max-width: 240px; }
.toolbar .spacer { flex: 1 1 auto; }
.btn-teal { background: #4ECDC4; color: #0d3f3c; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-dark { background: #2f323a; color: #eee; border: 1px solid #444; padding: 7px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.btn-dark:hover { background: #3a3e48; }
.btn-teal:disabled, .btn-dark:disabled { opacity: .45; cursor: not-allowed; }
.panel { margin: 20px 24px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 18px 20px; }
.panel h3 { font-size: 15px; font-weight: 700; color: #22242a; margin: 0 0 14px 0; }
.panel h3 i { color: #4ECDC4; margin-right: 8px; }
.ctx-grid { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.ctx-item { min-width: 150px; }
.ctx-item .k { font-size: 11px; color: #5c6470; text-transform: uppercase; letter-spacing: .5px; display: block; }
.ctx-item .v { font-size: 14px; color: #22242a; font-weight: 600; }
.cards { display: flex; flex-wrap: wrap; gap: 14px; }
.card { flex: 1 1 120px; background: #f8f9fb; border: 1px solid #eceef2; border-radius: 6px; padding: 12px 14px; }
.card .k { font-size: 11px; color: #5c6470; text-transform: uppercase; letter-spacing: .5px; }
.card .v { font-size: 22px; font-weight: 700; color: #22242a; margin-top: 4px; }
.card .u { font-size: 11px; color: #5c6470; font-weight: 400; margin-left: 3px; }
.card.good { border-left: 4px solid #2f9e44; }
.card.bad { border-left: 4px solid #e05c5c; }
.card.warn { border-left: 4px solid #e6b34d; }
.card.info { border-left: 4px solid #4ECDC4; }
.banner { margin: 20px 24px 0 24px; border-radius: 8px; padding: 14px 18px; font-size: 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.banner i { font-size: 18px; }
.banner.bad { background: #fdecea; color: #8a2b28; border-left: 5px solid #e05c5c; }
.banner.good { background: #eaf7ee; color: #23633a; border-left: 5px solid #2f9e44; }
.banner.warn { background: #fff6e5; color: #8a6216; border-left: 5px solid #e6b34d; }
.banner.info { background: #eef7f7; color: #17756e; border-left: 5px solid #4ECDC4; }
.state { margin: 20px 24px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 34px 20px; text-align: center; color: #777; font-size: 14px; }
.state h4 { font-size: 16px; color: #22242a; margin: 0 0 8px 0; }
.state.warn { border-left: 5px solid #e6b34d; }
.state.deny { border-left: 5px solid #e05c5c; color: #7a2b2b; }
.state .code { font-size: 11px; color: #6b7280; margin-top: 10px; font-family: monospace; }
.state .spinner { display: inline-block; width: 18px; height: 18px; margin-right: 8px; vertical-align: -3px; border: 3px solid #4ECDC4; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.table-wrap { margin: 0 24px 24px 24px; }
table.dataTable thead th { background: #22242a; color: #fff; font-size: 12px; padding: 10px 12px; }
table.dataTable tbody td { padding: 9px 12px; font-size: 13px; vertical-align: middle; }
table.dataTable tbody tr.open-build td { background: #f4fcfb; }
.bar { height: 6px; background: #eceef2; border-radius: 4px; overflow: hidden; margin-top: 4px; min-width: 80px; }
.bar > span { display: block; height: 100%; background: #4ECDC4; }
.bar > span.bad { background: #e05c5c; }
.bar > span.warn { background: #e6b34d; }
.bar > span.good { background: #2f9e44; }
.pill { display: inline-block; min-width: 22px; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; text-align: center; background: #eceef2; color: #33363f; }
.pill.bad { background: #f5c6cb; color: #8a2b28; }
.pill.warn { background: #ffe8ad; color: #7a5611; }
.pill.good { background: #d4edda; color: #1e5d34; }
.pill.info { background: #d5f4f2; color: #0d3f3c; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.dataTables_wrapper .dataTables_paginate .paginate_button.current { background: #4ECDC4 !important; color: #0d3f3c !important; border: none !important; }
.dataTables_wrapper .dataTables_filter input { border: 1px solid #ddd; border-radius: 4px; padding: 4px 8px; }
.footer { padding: 12px 24px; color: #5c6470; font-size: 12px; border-top: 1px solid #ddd; background: #fff; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; z-index: 2000; display: none; }
.toast.err { background: #e05c5c; }
</style>
</head>
<body>

<main id="mainContent">
<div class="header">
  <i class="fa fa-layer-group" style="margin-right:8px;"></i>
  <span data-i18n="rbb.title">Test Plan Results by Build</span>
  <span class="sub" data-i18n="rbb.subtitle">execution status of every build of the plan</span>
</div>

<div class="toolbar">
  <button class="btn-teal" id="btnRefresh"><i class="fa fa-refresh"></i> <span data-i18n="rbb.refresh">Refresh</span></button>
  <button class="btn-dark" id="btnCsv" disabled><i class="fa fa-download"></i> <span data-i18n="rbb.exportCsv">Export CSV</span></button>
  <span class="spacer"></span>
  <label for="selPlatform" data-i18n="rbb.platform">Platform</label>
  <select id="selPlatform"></select>
  <button class="btn-dark" id="btnApply"><i class="fa fa-filter"></i> <span data-i18n="rbb.apply">Apply</span></button>
  <button class="btn-dark" id="btnClose"><i class="fa fa-times"></i> <span data-i18n="rbb.close">Close</span></button>
</div>

<div id="stateBox" role="status" aria-live="polite"></div>
<div id="bannerBox" role="status" aria-live="polite"></div>

<div id="report" style="display:none;">
  <div class="panel">
    <h3><i class="fa fa-info-circle"></i> <span data-i18n="rbb.context">Report context</span></h3>
    <div class="ctx-grid" id="ctxGrid"></div>
  </div>

  <div class="panel">
    <h3><i class="fa fa-gauge-high"></i> <span data-i18n="rbb.kpis">Key indicators</span></h3>
    <div class="cards" id="kpis"></div>
  </div>

  <div class="table-wrap">
    <table id="grid" class="table table-striped table-bordered" style="width:100%" aria-label="Test Plan Results by Build">
      <caption class="sr-only" data-i18n="rbb.title">Test Plan Results by Build</caption>
      <thead>
        <tr>
          <th scope="col" data-i18n="rbb.colBuild">Build</th>
          <th scope="col" data-i18n="rbb.colState">State</th>
          <th scope="col" data-i18n="rbb.colAssigned">Assigned</th>
          <th scope="col" data-i18n="rbb.colExecuted">Executed</th>
          <th scope="col" data-i18n="rbb.colPassed">Passed</th>
          <th scope="col" data-i18n="rbb.colFailed">Failed</th>
          <th scope="col" data-i18n="rbb.colBlocked">Blocked</th>
          <th scope="col" data-i18n="rbb.colNotRun">Not run</th>
          <th scope="col" data-i18n="rbb.colPassRate">Pass rate</th>
          <th scope="col" data-i18n="rbb.colCoverage">Coverage</th>
          <th scope="col" data-i18n="rbb.colExecutions">Executions</th>
          <th scope="col" data-i18n="rbb.colLast">Last execution</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="footer"><span data-i18n="footers.resultsByBuild"></span><span id="localeSwitcher"></span></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/resultsbybuild/index.php';
var currentData = null;
var dt = null;

function esc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function q(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function stateFor(code, httpStatus, rawMessage) {
  var map = {
    not_authenticated: { cls: 'deny', title: 'rbb.deniedTitle',  body: 'rbb.deniedBody' },
    session_expired:   { cls: 'deny', title: 'rbb.deniedTitle',  body: 'rbb.expiredBody' },
    no_right:          { cls: 'deny', title: 'rbb.deniedTitle',  body: 'rbb.noRightBody' },
    tplan_not_found:   { cls: 'warn', title: 'rbb.notFoundTitle', body: 'rbb.notFoundBody' },
    project_mismatch:  { cls: 'warn', title: 'rbb.notFoundTitle', body: 'rbb.mismatchBody' },
    invalid_request:   { cls: 'warn', title: 'rbb.badRequestTitle', body: 'rbb.badRequestBody' },
    invalid_parameter: { cls: 'warn', title: 'rbb.badRequestTitle', body: 'rbb.badRequestBody' },
    method_not_allowed:{ cls: 'warn', title: 'rbb.badRequestTitle', body: 'rbb.badRequestBody' }
  };
  var m = map[code];
  var detail = '';
  if (!m) {
    m = { cls: 'warn', title: 'rbb.serverErrorTitle', body: 'rbb.serverErrorBody' };
    if (rawMessage) { detail = '<div class="code">' + esc(rawMessage) + '</div>'; }
  }
  return '<div class="state ' + m.cls + '"><h4>' + esc(TLi18n.t(m.title)) + '</h4><div>'
       + esc(TLi18n.t(m.body, { status: httpStatus })) + '</div>' + detail
       + '<div class="code">' + esc(code || ('http_' + httpStatus)) + '</div></div>';
}

function isAuthError(code) {
  return code === 'session_expired' || code === 'not_authenticated';
}

function redirectToLogin() {
  window.location.href = '/login.php?note=expired&destination='
    + encodeURIComponent(window.location.pathname + window.location.search);
}

function showState(html) {
  currentData = null;
  $('#btnCsv').prop('disabled', true);
  $('#report').hide();
  $('#bannerBox').html('');
  $('#stateBox').html(html);
}

function showLoading() {
  currentData = null;
  $('#btnCsv').prop('disabled', true);
  $('#report').hide();
  $('#bannerBox').html('');
  $('#stateBox').html('<div class="state"><div class="spinner"></div>'
    + esc(TLi18n.t('rbb.loading')) + '</div>');
}

function toast(msg, isErr) {
  var $t = $('#toast');
  $t.text(msg).toggleClass('err', !!isErr).fadeIn(120);
  window.clearTimeout(toast._t);
  toast._t = window.setTimeout(function () { $t.fadeOut(160); }, 2600);
}

function rateCls(pct) {
  var n = Number(pct);
  if (n >= 80) { return 'good'; }
  if (n >= 50) { return 'warn'; }
  return 'bad';
}

function verdictCls(v) {
  if (v === 'ready') { return 'good'; }
  if (v === 'at_risk') { return 'bad'; }
  if (v === 'empty') { return 'info'; }
  return 'warn';
}

function query() {
  var p = new URLSearchParams();
  p.set('action', 'report');
  var tplan = q('tplan_id') || '';
  if (tplan) { p.set('tplan_id', tplan); }
  var tp = q('tproject_id') || '';
  if (tp) { p.set('tproject_id', tp); }
  var pl = $('#selPlatform').val() || '0';
  if (Number(pl) > 0) { p.set('platform_id', pl); }
  return p.toString();
}

function fail(res) {
  var code = (res && res.code) || '';
  if (isAuthError(code)) {
    showState('<div class="state deny"><h4>' + esc(TLi18n.t('rbb.deniedTitle')) + '</h4>'
      + '<div>' + esc(TLi18n.t('rbb.expiredBody')) + '</div>'
      + '<div class="code">' + esc(code) + '</div></div>');
    window.setTimeout(redirectToLogin, 1600);
    return;
  }
  showState(stateFor(code, (res && res.httpStatus) || 400, (res && res.message) || ''));
}

function loadInit() {
  showLoading();
  fetch(API + '?action=init&tplan_id=' + encodeURIComponent(q('tplan_id') || '')
    + (q('tproject_id') ? '&tproject_id=' + encodeURIComponent(q('tproject_id')) : '')
    + (q('platform_id') ? '&platform_id=' + encodeURIComponent(q('platform_id')) : ''),
    { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
    .then(function (r) { return r.json().then(function (j) { j.httpStatus = r.status; return j; }); })
    .then(function (res) {
      if (!res || res.status !== 'ok') { fail(res); return; }
      var f = res.filters || { platforms: [] };
      var plat = '<option value="0">' + esc(TLi18n.t('rbb.allPlatforms')) + '</option>';
      (f.platforms || []).forEach(function (p) {
        plat += '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>';
      });
      $('#selPlatform').html(plat);
      if (res.filter && res.filter.platform_id) { $('#selPlatform').val(String(res.filter.platform_id)); }
      load();
    })
    .catch(function () {
      showState(stateFor('server_error', 500, TLi18n.t('rbb.networkError')));
    });
}

function kpi(label, value, unit, cls) {
  return '<div class="card ' + (cls || 'info') + '"><div class="k">' + esc(label) + '</div>'
    + '<div class="v">' + esc(value) + (unit ? '<span class="u">' + esc(unit) + '</span>' : '')
    + '</div></div>';
}

function bar(pct, cls) {
  return '<div class="bar"><span class="' + cls + '" style="width:'
    + Math.max(0, Math.min(100, Number(pct))) + '%"></span></div>';
}

function render(data) {
  currentData = data;
  $('#stateBox').html('');
  $('#report').show();
  var c = data.context || {};
  var pl = data.filter && data.filter.platform_id;
  $('#ctxGrid').html(
    '<div class="ctx-item"><span class="k">' + esc(TLi18n.t('rbb.project')) + '</span>'
      + '<span class="v">' + esc(c.tproject_name) + '</span></div>'
    + '<div class="ctx-item"><span class="k">' + esc(TLi18n.t('rbb.plan')) + '</span>'
      + '<span class="v">' + esc(c.tplan_name) + '</span></div>'
    + '<div class="ctx-item"><span class="k">' + esc(TLi18n.t('rbb.platform')) + '</span>'
      + '<span class="v">' + esc(platformLabel(pl)) + '</span></div>'
  );

  var s = data.summary || {};
  var v = s.verdict || 'watch';
  var banner = '<div class="banner ' + verdictCls(v) + '"><i class="fa fa-layer-group"></i><span>';
  if (v === 'empty') {
    banner += esc(TLi18n.t('rbb.bannerEmpty'));
  } else {
    banner += esc(TLi18n.t('rbb.banner' + (v === 'ready' ? 'Ready'
      : (v === 'at_risk' ? 'AtRisk' : 'Watch')), {
      coverage: s.coverage_pct, pass: s.pass_rate_pct
    }));
  }
  banner += '</span></div>';
  $('#bannerBox').html(banner);

  $('#kpis').html(
    kpi(TLi18n.t('rbb.kpiBuilds'), s.total_builds, '', 'info')
    + kpi(TLi18n.t('rbb.kpiActiveBuilds'), s.builds_with_activity, '', 'info')
    + kpi(TLi18n.t('rbb.kpiAssigned'), s.assigned_versions, '', 'info')
    + kpi(TLi18n.t('rbb.kpiExecuted'), s.executed_versions, '(' + s.coverage_pct + '%)', 'info')
    + kpi(TLi18n.t('rbb.kpiPassed'), s.passed, '', 'good')
    + kpi(TLi18n.t('rbb.kpiFailed'), s.failed, '', 'bad')
    + kpi(TLi18n.t('rbb.kpiBlocked'), s.blocked, '', 'warn')
    + kpi(TLi18n.t('rbb.kpiNotRun'), s.not_run, '', 'warn')
    + kpi(TLi18n.t('rbb.kpiPassRate'), s.pass_rate_pct, '%', rateCls(s.pass_rate_pct))
  );

  var rows = data.rows || [];
  if (dt) {
    dt.clear();
  } else {
    dt = $('#grid').DataTable({
      order: [],
      pageLength: 25,
      language: {
        search: TLi18n.t('common.filter', 'Filter') + ':',
        lengthMenu: TLi18n.t('common.showEntries', 'Show') + ' _MENU_ '
          + TLi18n.t('common.entries', 'entries'),
        info: TLi18n.t('common.pageInfo', 'Showing _START_ to _END_ of _TOTAL_ entries'),
        paginate: { previous: TLi18n.t('common.prev', 'Previous'),
          next: TLi18n.t('common.next', 'Next') },
        emptyTable: TLi18n.t('rbb.noRows'),
        zeroRecords: TLi18n.t('rbb.noMatch')
      }
    });
    $('#grid_wrapper .dataTables_length select')
      .attr({ id: 'rbbLength', name: 'rbbLength',
        'aria-label': TLi18n.t('common.showEntries', 'Show entries') });
    $('#grid_wrapper .dataTables_filter input')
      .attr({ id: 'rbbSearch', name: 'rbbSearch',
        'aria-label': TLi18n.t('common.filter', 'Filter') });
  }
  rows.forEach(function (r) {
    var cls = r.is_open ? 'open-build' : '';
    var prCls = rateCls(r.pass_rate_pct);
    var covCls = rateCls(r.coverage_pct);
    var line =
      '<tr class="' + cls + '">'
      + '<td><strong>' + esc(r.build_name) + '</strong></td>'
      + '<td><span class="pill ' + (r.is_open ? 'info' : '') + '">'
        + esc(TLi18n.t(r.is_open ? 'rbb.stateOpen' : 'rbb.stateClosed')) + '</span></td>'
      + '<td class="num">' + esc(r.assigned) + '</td>'
      + '<td class="num">' + esc(r.executed) + '</td>'
      + '<td class="num"><span class="pill good">' + esc(r.passed) + '</span></td>'
      + '<td class="num"><span class="pill ' + (r.failed > 0 ? 'bad' : '') + '">'
        + esc(r.failed) + '</span></td>'
      + '<td class="num"><span class="pill ' + (r.blocked > 0 ? 'warn' : '') + '">'
        + esc(r.blocked) + '</span></td>'
      + '<td class="num">' + esc(r.not_run) + '</td>'
      + '<td class="num">' + esc(r.pass_rate_pct) + '%' + bar(r.pass_rate_pct, prCls) + '</td>'
      + '<td class="num">' + esc(r.coverage_pct) + '%' + bar(r.coverage_pct, covCls) + '</td>'
      + '<td class="num">' + esc(r.executions) + '</td>'
      + '<td>' + esc(r.last_ts || '\u2014') + '</td>'
      + '</tr>';
    dt.row.add($(line));
  });
  dt.draw();
  $('#btnCsv').prop('disabled', rows.length === 0);
}

function platformLabel(id) {
  if (!id) { return TLi18n.t('rbb.allPlatforms'); }
  var t = $('#selPlatform option[value="' + id + '"]').text();
  return t || ('#' + id);
}

function load() {
  showLoading();
  fetch(API + '?' + query(), { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
    .then(function (r) { return r.json().then(function (j) { j.httpStatus = r.status; return j; }); })
    .then(function (res) {
      if (!res || res.status !== 'ok') { fail(res); return; }
      render(res);
    })
    .catch(function () {
      showState(stateFor('server_error', 500, TLi18n.t('rbb.networkError')));
    });
}

function csvCell(v) {
  var s = String(v === null || v === undefined ? '' : v);
  if (/^[=+\-@]/.test(s)) { s = "'" + s; }
  return '"' + s.replace(/"/g, '""') + '"';
}

function exportCsv() {
  if (!currentData || !currentData.rows || !currentData.rows.length) { return; }
  var lines = [];
  var head = ['rbb.colBuild', 'rbb.colState', 'rbb.colAssigned', 'rbb.colExecuted',
    'rbb.colPassed', 'rbb.colFailed', 'rbb.colBlocked', 'rbb.colNotRun',
    'rbb.colPassRate', 'rbb.colCoverage', 'rbb.colExecutions', 'rbb.colLast'];
  lines.push(head.map(function (k) { return csvCell(TLi18n.t(k)); }).join(';'));
  currentData.rows.forEach(function (r) {
    lines.push([r.build_name, TLi18n.t(r.is_open ? 'rbb.stateOpen' : 'rbb.stateClosed'),
      r.assigned, r.executed, r.passed, r.failed, r.blocked, r.not_run,
      r.pass_rate_pct + '%', r.coverage_pct + '%', r.executions, r.last_ts
    ].map(csvCell).join(';'));
  });
  var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'results-by-build-' + (q('tplan_id') || 'plan') + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  window.setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  toast(TLi18n.t('rbb.csvDone'));
}

$(function () {
  $('#btnRefresh').on('click', load);
  $('#btnApply').on('click', load);
  $('#btnCsv').on('click', exportCsv);
  $('#btnClose').on('click', function () {
    if (window.opener && !window.opener.closed) { window.close(); }
    else { window.location.href = '/index.php'; }
  });
  TLi18n.load(function () {
    TLi18n.apply();
    document.title = TLi18n.t('rbb.title') + ' - TestLink 2.0.1';
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    loadInit();
  });
});
</script>
</body>
</html>
