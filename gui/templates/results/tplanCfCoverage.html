<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Plan Custom Fields Coverage</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; color: #0d3f3c; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.toolbar label { color: #aaa; font-size: 12px; margin: 0; }
.toolbar select { background: #2e3138; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 5px 8px; font-size: 12px; }
.btn-ghost { background: transparent; color: #ccc; border: 1px solid #555; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.btn-ghost:hover { border-color: #4ECDC4; color: #4ECDC4; }
.btn-ghost[disabled] { opacity: .5; cursor: not-allowed; }
.kpis { display: flex; gap: 14px; flex-wrap: wrap; margin: 16px 24px 0; }
.kpi { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 12px 18px; min-width: 145px; flex: 1; }
.kpi .v { font-size: 24px; font-weight: 700; color: #22242a; line-height: 1.1; }
.kpi .l { font-size: 11.5px; color: #667; margin-top: 3px; text-transform: uppercase; letter-spacing: .4px; }
.kpi.teal .v { color: #259b93; }
.warnbox { margin: 12px 24px 0; background: #fff8e1; border: 1px solid #ffe08a; color: #7a5b00; border-radius: 6px; padding: 10px 14px; font-size: 13px; display: none; }
.section { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.section-head { padding: 13px 20px; border-bottom: 1px solid #eee; font-size: 15px; font-weight: 700; color: #22242a; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.section-head i { color: #4ECDC4; }
.section-head .bmeta { font-size: 12px; font-weight: 400; color: #667; margin-left: auto; }
.section-body { padding: 10px 20px 14px; overflow-x: auto; }
table.flat { width: 100%; border-collapse: collapse; font-size: 12px; }
table.flat th { background: #22242a; color: #fff; padding: 8px 10px; text-align: left; white-space: nowrap; font-size: 11.5px; }
table.flat td { padding: 6px 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
table.flat tr:hover td { background: #f4fbfa; }
td.planlink a { color: #259b93; font-weight: 600; text-decoration: none; }
td.planlink a:hover { text-decoration: underline; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.st-complete { background: #d4edda; color: #155724; }
.st-partial { background: #ffecb5; color: #856404; }
.st-not_filled { background: #f5c6cb; color: #b94a48; }
.st-empty { background: #e9ecef; color: #555; }
.badge-inactive { background: #e9ecef; color: #666; }
.badge-open { background: #d1ecf1; color: #0c5460; }
.badge-closed { background: #f8d7da; color: #721c24; }
.covwrap { display: flex; align-items: center; gap: 8px; min-width: 130px; }
.covbar { flex: 1; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; min-width: 70px; }
.covbar span { display: block; height: 100%; background: #4ECDC4; }
.covbar.low span { background: #e6605e; }
.covbar.mid span { background: #f0ad4e; }
.empty { background: #fff; border-radius: 8px; padding: 30px; text-align: center; color: #888; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px; }
.empty i { font-size: 34px; color: #4ECDC4; display: block; margin-bottom: 10px; }
.state { background: #fff; border-radius: 8px; padding: 30px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px; }
.state i { font-size: 36px; color: #e6605e; display: block; margin-bottom: 10px; }
.state h4 { margin: 0 0 6px; color: #22242a; }
.state p { color: #667; margin: 0 0 6px; }
.state code { color: #b94a48; background: #fdecea; padding: 2px 6px; border-radius: 3px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.toast.err { background: #e6605e; }
.spin { text-align: center; color: #888; font-size: 13px; padding: 40px 24px; }
.spin i { font-size: 22px; color: #4ECDC4; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 8px; }
@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
.dataTables_wrapper .dataTables_filter input { border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px; font-size: 12px; }
.dataTables_wrapper .dataTables_length select { border: 1px solid #ccc; border-radius: 4px; padding: 4px; font-size: 12px; }
</style>
</head>
<body>

<div class="header">
  <i class="fa fa-table-cells" style="margin-right:8px;"></i>
  <span data-i18n="tpcc.header">Test Plan Custom Fields Coverage</span>
  <span class="sub"><span data-i18n="tpcc.subtitle">plan-design custom fields across every test plan</span></span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <span class="ctx"><span data-i18n="tpcc.testProject">Test Project</span>: <b id="tprojectName">-</b></span>
  <label for="statusFilter" data-i18n="tpcc.statusFilter">Status</label>
  <select id="statusFilter">
    <option value="all" data-i18n="tpcc.statusAll">All plans</option>
    <option value="incomplete" data-i18n="tpcc.statusIncomplete">Incomplete only</option>
    <option value="complete" data-i18n="tpcc.statusComplete">Complete only</option>
    <option value="not_filled" data-i18n="tpcc.statusNotFilled">Not filled only</option>
  </select>
  <span style="flex:1"></span>
  <button class="btn-ghost" id="btnRefresh"><i class="fa fa-rotate"></i> <span data-i18n="tpcc.refresh">Refresh</span></button>
  <button class="btn-ghost" id="btnExport" disabled><i class="fa fa-file-csv"></i> <span data-i18n="tpcc.exportCsv">Export CSV</span></button>
  <button class="btn-ghost" id="btnClose"><i class="fa fa-xmark"></i> <span data-i18n="tpcc.close">Close</span></button>
</div>

<div class="kpis" id="kpis" style="display:none;">
  <div class="kpi"><div class="v" id="kpiPlans">0</div><div class="l" data-i18n="tpcc.kpiPlans">Test plans</div></div>
  <div class="kpi"><div class="v" id="kpiAssigned">0</div><div class="l" data-i18n="tpcc.kpiAssigned">Assigned test cases</div></div>
  <div class="kpi teal"><div class="v" id="kpiWithValues">0</div><div class="l" data-i18n="tpcc.kpiWithValues">Rows with values</div></div>
  <div class="kpi teal"><div class="v" id="kpiCoverage">0%</div><div class="l" data-i18n="tpcc.kpiCoverage">Coverage</div></div>
  <div class="kpi"><div class="v" id="kpiCfields">0</div><div class="l" data-i18n="tpcc.kpiCfields">Custom fields</div></div>
  <div class="kpi"><div class="v" id="kpiFilled">0</div><div class="l" data-i18n="tpcc.kpiFilled">Filled values</div></div>
</div>

<div class="warnbox" id="warnBox"></div>
<div id="loadingBox" class="spin"><i class="fa fa-circle-notch"></i><br><span data-i18n="common.loading">Loading...</span></div>
<div id="stateBox"></div>
<div id="reportArea"></div>
<div class="empty" id="emptyBox" style="display:none;"></div>

<div class="footer" id="footerInfo"></div>
<div class="footer"><span data-i18n="footers.tplanCfCoverage">TestLink 2.0.1 - Test Plan Custom Fields Coverage</span></div>
<div class="toast" id="toast"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script>
var params = new URLSearchParams(window.location.search);
var tproject_id = parseInt(params.get('tproject_id')) || 0;
var STATE = { rows: [], summary: {}, context: {}, columns: [], dt: null };

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function t(key, fallback) {
  var v = TLi18n.t(key);
  return (v && v !== key) ? v : (fallback || key);
}
function toast(msg, isErr) {
  var $t = $('#toast').text(msg).show();
  if (isErr) { $t.addClass('err'); } else { $t.removeClass('err'); }
  setTimeout(function(){ $t.fadeOut(300); }, 3000);
}
function showState(code, titleKey, hintKey, defTitle, defHint) {
  $('#stateBox').html(
    '<div class="state"><i class="fa fa-triangle-exclamation"></i>' +
    '<h4>' + esc(t(titleKey, defTitle)) + '</h4>' +
    '<p>' + esc(t(hintKey, defHint)) + '</p>' +
    '<p><span data-i18n="tpcc.stateCode">Code</span>: <code>' + esc(code) + '</code></p></div>'
  ).show();
  TLi18n.apply($('#stateBox')[0]);
}
function handleError(d) {
  d = d || {};
  var code = d.code || 'error';
  if (code === 'no_right') {
    showState(code, 'tpcc.errNoRight', 'tpcc.errNoRightHint', 'No permission', 'You need the testplan_metrics right on this test project.');
  } else if (code === 'project_not_found') {
    showState(code, 'tpcc.errNotFound', 'tpcc.errNotFoundHint', 'Not found', 'The requested test project does not exist.');
  } else if (code === 'not_authenticated' || code === 'session_expired') {
    showState(code, 'tpcc.errSession', 'tpcc.errSessionHint', 'Session expired', 'Please sign in again.');
  } else {
    showState(code, 'tpcc.errGeneric', 'tpcc.errGenericHint', 'Could not load the report', 'Unexpected server error.');
  }
}
function resetView() {
  $('#stateBox').empty().hide();
  $('#reportArea').empty();
  $('#emptyBox').hide().empty();
  $('#warnBox').hide().empty();
  $('#kpis').hide();
  $('#footerInfo').empty();
  $('#btnExport').prop('disabled', true);
  if (STATE.dt) { try { STATE.dt.destroy(); } catch (e) {} STATE.dt = null; }
}

function loadReport() {
  $('#loadingBox').show();
  resetView();
  $.ajax({
    url: '/api/tplancfcoverage/index.php',
    data: { action: 'report', tproject_id: tproject_id },
    dataType: 'json',
    success: function(d) {
      $('#loadingBox').hide();
      if (d.status === 'error') { handleError(d); return; }
      STATE.context = d.context || {};
      STATE.summary = d.summary || {};
      STATE.rows = d.rows || [];
      STATE.columns = d.columns || [];
      tproject_id = STATE.context.tproject_id || tproject_id;
      $('#tprojectName').text(STATE.context.tproject_name || '-');

      var s = STATE.summary;
      $('#kpiPlans').text(s.plans_total || 0);
      $('#kpiAssigned').text(s.assigned || 0);
      $('#kpiWithValues').text(s.with_values || 0);
      $('#kpiCoverage').text((s.coverage_pct || 0) + '%');
      $('#kpiCfields').text(s.cfields || 0);
      $('#kpiFilled').text(s.filled_values || 0);
      $('#kpis').show();

      var notes = [];
      (d.warnings || []).forEach(function(w) {
        if (w === 'no_linked_cfields') notes.push(t('tpcc.noLinked', 'No custom fields are enabled on test plan design for this project.'));
        else if (w === 'no_plans') notes.push(t('tpcc.noPlans', 'This test project has no test plans.'));
      });
      if (notes.length) $('#warnBox').html('<i class="fa fa-circle-info"></i> ' + notes.map(esc).join('<br>')).show();

      if (!STATE.rows.length) {
        $('#emptyBox').html('<i class="fa fa-info-circle"></i>' + esc(t('tpcc.empty', 'No test plan to report on.'))).show();
        return;
      }
      renderTable();
      $('#btnExport').prop('disabled', false);
      $('#footerInfo').text(t('tpcc.generatedOn', 'Generated on') + ': ' + new Date().toLocaleString());
    },
    error: function(xhr) {
      $('#loadingBox').hide();
      handleError(xhr.responseJSON || {});
      toast(t('common.errorLoading', 'Error loading data'), true);
    }
  });
}

function covClass(pct) {
  if (pct >= 100) return '';
  if (pct >= 50) return 'mid';
  return 'low';
}
function coverageCell(pct) {
  pct = Number(pct) || 0;
  return '<div class="covwrap"><div class="covbar ' + covClass(pct) + '"><span style="width:' + Math.min(100, pct) + '%"></span></div><b>' + pct + '%</b></div>';
}
function statusMap(st) {
  var map = {
    complete: ['st-complete', 'tpcc.stComplete', 'Complete'],
    partial: ['st-partial', 'tpcc.stPartial', 'Partial'],
    not_filled: ['st-not_filled', 'tpcc.stNotFilled', 'Not filled'],
    empty: ['st-empty', 'tpcc.stEmpty', 'No assignments']
  };
  return map[st] || map.empty;
}
function statusText(st) {
  var m = statusMap(st);
  return t(m[1], m[2]);
}
function statusBadge(st) {
  var m = statusMap(st);
  return '<span class="badge ' + m[0] + '">' + esc(t(m[1], m[2])) + '</span>';
}

function renderTable() {
  var html = '<div class="section"><div class="section-head">' +
    '<i class="fa fa-table"></i> ' + esc(t('tpcc.header', 'Test Plan Custom Fields Coverage')) +
    '<span class="bmeta">' + esc(t('tpcc.rowCount', 'Plans')) + ': ' + STATE.rows.length +
    ' &middot; ' + esc(t('tpcc.cfHelper', 'cf')) + ': ' + STATE.columns.map(function(c){return esc(c.label);}).join(', ') +
    '</span></div><div class="section-body"><table id="dtResults" class="flat" style="width:100%"></table></div></div>';
  $('#reportArea').html(html);

  var cols = [
    { title: t('tpcc.colPlan', 'Test Plan'), data: null, className: 'planlink',
      render: function(data, type, row) {
        if (type === 'sort' || type === 'filter') { return row.tplan_name; }
        var url = '/gui/templates/results/tplanWithCF.html?tproject_id=' + encodeURIComponent(tproject_id) +
                  '&tplan_id=' + encodeURIComponent(row.tplan_id);
        return '<a href="' + url + '" target="_blank" rel="noopener">' + esc(row.tplan_name) + '</a>' +
          ' <span class="badge ' + (row.active ? 'badge-open' : 'badge-inactive') + '">' +
          esc(row.active ? t('tpcc.active', 'Active') : t('tpcc.inactive', 'Inactive')) + '</span>' +
          ' <span class="badge ' + (row.is_open ? 'badge-open' : 'badge-closed') + '">' +
          esc(row.is_open ? t('tpcc.open', 'Open') : t('tpcc.closed', 'Closed')) + '</span>';
      } },
    { title: t('tpcc.colAssigned', 'Assigned'), data: 'assigned' },
    { title: t('tpcc.colWithValues', 'With values'), data: 'rows_with_values' },
    { title: t('tpcc.colCoverage', 'Coverage'), data: 'coverage_pct',
      render: function(data) { return coverageCell(data); } },
    { title: t('tpcc.colStatus', 'Status'), data: 'status',
      render: function(data, type) {
        if (type === 'sort' || type === 'filter') { return data; }
        return statusBadge(data);
      } },
    { title: t('tpcc.colFilled', 'Filled values'), data: 'filled_values' },
    { title: t('tpcc.colSuites', 'Suites'), data: 'suites' },
    { title: t('tpwg.title', 'Test Plan Custom Field Value Gaps'), data: null, className: 'planlink',
      render: function(data, type, row) {
        if (type === 'sort' || type === 'filter') { return ''; }
        var url = '/gui/templates/results/tpwcGaps.html?tproject_id=' + encodeURIComponent(tproject_id) +
                  '&tplan_id=' + encodeURIComponent(row.tplan_id);
        return '<a href="' + url + '" target="_blank" rel="noopener">' +
               '<i class="fa fa-circle-exclamation"></i> ' +
               esc(t('tpwg.title', 'Test Plan Custom Field Value Gaps')) + '</a>';
      } }
  ];

  STATE.dt = $('#dtResults').DataTable({
    data: STATE.rows,
    columns: cols,
    order: [[3, 'asc'], [0, 'asc']],
    pageLength: 25,
    language: {
      search: t('common.filter', 'Filter') + ':',
      lengthMenu: t('common.showEntries', 'Show') + ' _MENU_ ' + t('common.entries', 'entries'),
      info: t('common.pageInfo', 'Showing _START_ to _END_ of _TOTAL_ entries'),
      infoEmpty: t('tpcc.infoEmpty', 'No entries'),
      zeroRecords: t('tpcc.zeroRecords', 'No matching plans'),
      paginate: { previous: t('common.prev', 'Previous'), next: t('common.next', 'Next') },
      emptyTable: t('tpcc.empty', 'No test plan to report on.')
    }
  });
  applyFilter();
}

function applyFilter() {
  if (!STATE.dt) return;
  var f = $('#statusFilter').val();
  STATE.dt.column(4).search('', true, false);
  if (f === 'incomplete') {
    STATE.dt.column(4).search('^(partial|not_filled|empty)$', true, false, true);
  } else if (f === 'complete') {
    STATE.dt.column(4).search('^complete$', true, false, true);
  } else if (f === 'not_filled') {
    STATE.dt.column(4).search('^not_filled$', true, false, true);
  }
  STATE.dt.draw();
}

function csvGuard(v) {
  var s = (v === null || v === undefined) ? '' : String(v);
  if (/^[\s\u0009\u000D\u000A]*[=+\-@]/.test(s)) { s = "'" + s; }
  return '"' + s.replace(/"/g, '""') + '"';
}

function exportCsv() {
  var rows = STATE.dt ? STATE.dt.rows({ search: 'applied' }).data().toArray() : STATE.rows;
  if (!rows.length) return;
  var header = [
    t('tpcc.colPlan', 'Test Plan'), t('tpcc.colActive', 'Active'), t('tpcc.colOpen', 'Open'),
    t('tpcc.colAssigned', 'Assigned'), t('tpcc.colWithValues', 'With values'),
    t('tpcc.colCoveragePct', 'Coverage %'), t('tpcc.colStatus', 'Status'),
    t('tpcc.colFilled', 'Filled values'), t('tpcc.colSuites', 'Suites')
  ];
  var lines = [header.map(csvGuard).join(';')];
  rows.forEach(function(r) {
    lines.push([
      r.tplan_name,
      r.active ? t('tpcc.active', 'Active') : t('tpcc.inactive', 'Inactive'),
      r.is_open ? t('tpcc.open', 'Open') : t('tpcc.closed', 'Closed'),
      r.assigned, r.rows_with_values, r.coverage_pct, statusText(r.status), r.filled_values, r.suites
    ].map(csvGuard).join(';'));
  });
  var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tplan-cf-coverage-' + (tproject_id || 0) + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast(t('tpcc.toastExported', 'CSV exported'));
}

$(function() {
  $('#btnRefresh').on('click', loadReport);
  $('#btnExport').on('click', exportCsv);
  $('#statusFilter').on('change', applyFilter);
  $('#btnClose').on('click', function() {
    if (window.parent && window.parent !== window) { window.parent.postMessage({ action: 'close' }, '*'); }
    window.close();
  });

  TLi18n.load(function() {
    TLi18n.apply();
    document.title = 'TestLink 2.0.1 - ' + t('tpcc.header', 'Test Plan Custom Fields Coverage');
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    loadReport();
  });
});
</script>
</body>
</html>
