<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Cases Not Run on Any Platform</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; color: #0d3f3c; opacity: 1; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.warnbox { margin: 12px 24px 0; background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; border-radius: 6px; padding: 10px 14px; font-size: 13px; display: none; }
.statusmsg { margin: 14px 24px 0; background: #fff; border-left: 4px solid #4ECDC4; border-radius: 4px; padding: 10px 14px; font-size: 13px; color: #33363f; box-shadow: 0 1px 4px rgba(0,0,0,.08); display: none; }
.statusmsg b { color: #0d3f3c; }
.section { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.section-head { padding: 13px 20px; border-bottom: 1px solid #eee; font-size: 15px; font-weight: 700; color: #22242a; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.section-head i { color: #4ECDC4; }
.section-head .bmeta { font-size: 12px; font-weight: 400; color: #667; margin-left: auto; }
.section-body { padding: 10px 20px 14px; overflow-x: auto; }
table.flat { width: 100%; border-collapse: collapse; font-size: 12px; }
table.flat th { background: #22242a; color: #fff; padding: 7px 10px; text-align: left; white-space: nowrap; font-size: 11.5px; }
table.flat td { padding: 5px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
table.flat tr:hover td { background: #f4fbfa; }
td.suitecell { color: #667; font-size: 11px; max-width: 200px; word-break: break-word; }
td.tccell { white-space: nowrap; }
.tcid { font-weight: 600; color: #33363f; }
.empty { background: #fff; border-radius: 8px; padding: 30px; text-align: center; color: #888; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px; }
.empty i { font-size: 34px; color: #4ECDC4; display: block; margin-bottom: 10px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.footer p.info { margin: 6px 0 0; font-style: italic; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.toast.err { background: #e6605e; }
.spin { text-align: center; color: #888; font-size: 13px; padding: 40px 24px; }
.spin i { font-size: 22px; color: #4ECDC4; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 8px; }
@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
.dataTables_wrapper .dataTables_filter input { border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px; font-size: 12px; }
.dataTables_wrapper .dataTables_length select { border: 1px solid #ccc; border-radius: 4px; padding: 4px; font-size: 12px; }
.priority-badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
.priority-high { background: #f5c6cb; color: #b94a48; }
.priority-medium { background: #ffecb5; color: #856404; }
.priority-low { background: #d4edda; color: #155724; }
.st { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.st-not_run { background: #e2e3e5; color: #555; }
.st-passed { background: #d4edda; color: #155724; }
.st-failed { background: #f5c6cb; color: #b94a48; }
.st-blocked { background: #ffecb5; color: #856404; }
a.tclink { color: #0d3f3c; text-decoration: none; }
a.tclink:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="header">
  <i class="fa fa-ban" style="margin-right:8px;"></i>
  <span data-i18n="tnrap.header">Test Cases Not Run on Any Platform</span>
  <span class="sub"><span data-i18n="tnrap.forPlan">for test plan</span> <b id="tplanName">-</b></span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <span class="ctx"><span data-i18n="ftc.testProject">Test Project</span>: <b id="tprojectNameBar">-</b></span>
  <span class="ctx"><span data-i18n="tnrap.testPlan">Test Plan</span>: <b id="tplanNameBar">-</b></span>
  <span style="flex:1"></span>
  <span id="countBadge" style="color:#aaa;font-size:12px;"></span>
</div>

<div class="warnbox" id="warnBox"></div>

<div class="statusmsg" id="statusMsg"></div>

<div id="loadingBox" class="spin"><i class="fa fa-circle-notch"></i><br><span data-i18n="common.loading">Loading...</span></div>

<div id="reportArea"></div>

<div class="empty" id="emptyBox" style="display:none;"></div>

<div class="footer" id="footerInfo"></div>
<div class="footer"><span data-i18n="footers.tcNotRunAnyPlatform">TestLink 2.0.1 - Test Cases Not Run on Any Platform</span></div>
<div class="toast" id="toast"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="/gui/javascript/testlink_library.js"></script>
<script>
var tproject_id = parseInt(new URLSearchParams(window.location.search).get('tproject_id')) || 0;
var tplan_id = parseInt(new URLSearchParams(window.location.search).get('tplan_id')) || 0;
var tprojPrefix = '';

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function toast(msg, isErr) {
  var $t = $('#toast').text(msg).show();
  if (isErr) $t.addClass('err'); else $t.removeClass('err');
  setTimeout(function(){ $t.fadeOut(300); }, 3000);
}
function t(key, fallback) {
  var v = TLi18n.t(key);
  return (v && v !== key) ? v : (fallback || key);
}
// The priority LEVEL (1..4) and its localized LABEL are both built
// server-side - the level by priority_to_level() (so the project's own
// config_get('urgencyImportance')->threshold[] is honoured, legacy parity
// with lib/results/tcNotRunAnyPlatform.php) and the label from
// config_get('priority')->code_label, the same source the sibling report
// actions use. No raw urgency*importance product is ever shown.
function priorityBadge(row) {
  if (row.priority_level === null || row.priority_level === undefined) return '';
  var lvl = parseInt(row.priority_level, 10);
  if (isNaN(lvl)) return '';
  var cls = lvl >= 4 ? 'priority-high' : (lvl >= 2 ? 'priority-medium' : 'priority-low');
  return '<span class="priority-badge ' + cls + '">' +
    esc(row.priority_label || lvl) + '</span>';
}
function statusBadge(st) {
  var label = t('tnrap.status.' + st, st);
  return '<span class="st st-' + esc(st) + '">' + esc(label) + '</span>';
}
// Legacy parity: the report deep-linked through linkto.php with the PROJECT
// prefix (not the id) and the full external id, exactly as
// lib/results/tcNotRunAnyPlatform.php did:
//   linkto.php?tprojectPrefix=<prefix>&item=testcase&id=<external_id>
function tcLink(row) {
  var url = '/linkto.php?tprojectPrefix=' + encodeURIComponent(tprojPrefix) +
            '&item=testcase&id=' + encodeURIComponent(row.external_id);
  return '<a class="tclink" href="' + esc(url) + '">' + esc(row.external_id) + '</a>';
}
// Design + Execution History popups, the two icon links the legacy tlExtTable
// cell carried (openTCEditWindow / openExecHistoryWindow). The legacy library
// helpers are NOT used: openExecHistoryWindow() concatenates
// `&tproject_id=` + an undeclared variable, so it produced
// `...&tproject_id=undefined`. The modern screens are addressed directly
// (same URLs as resultsMatrix.html), with tproject_id always present.
function rowActions(row) {
  var histUrl = '/gui/templates/execute/execHistory.html?tcase_id=' +
    encodeURIComponent(row.tcase_id) + '&tproject_id=' + encodeURIComponent(tproject_id);
  var editUrl = '/gui/templates/testcases/tcView.html?tcase_id=' +
    encodeURIComponent(row.tcase_id) + '&tproject_id=' + encodeURIComponent(tproject_id);
  return ' <a class="tclink" href="' + esc(editUrl) + '" target="_blank" title="' +
         esc(t('ntcv.design', 'Test case design')) + '">' +
         '<i class="fa fa-pencil"></i></a>' +
         ' <a class="tclink" href="' + esc(histUrl) + '" title="' +
         esc(t('ntcv.executionHistory', 'Execution history')) +
         '" onclick="window.open(this.href,\'history_popup\',\'width=900,height=650,left=100,top=100,resizable=yes,scrollbars=yes\');return false;">' +
         '<i class="fa fa-history"></i></a>';
}

function loadData() {
  $('#loadingBox').show();
  $.ajax({
    url: '/api/reports/index.php',
    data: { action: 'not_run_any_platform', tproject_id: tproject_id, tplan_id: tplan_id },
    dataType: 'json',
    success: function(d) {
      $('#loadingBox').hide();
      if (d.status === 'error') {
        $('#warnBox').text(d.message).show();
        return;
      }
      $('#tprojectNameBar').text(d.tproject_name || '-');
      $('#tplanName').text(d.tplan_name || '-');
      $('#tplanNameBar').text(d.tplan_name || '-');

      // No platforms linked to the plan: the legacy report refused to
      // produce anything (warning_msg) because "not run on ANY platform"
      // is undefined without at least one platform.
      if (!d.platforms_active) {
        $('#emptyBox').html('<i class="fa fa-exclamation-triangle"></i>' +
          esc(t('tnrap.noPlatforms', 'No Platform defined for this Test Plan.'))).show();
        $('#footerInfo').html(t('tnrap.elapsedSeconds', 'Elapsed seconds') + ': ' + d.elapsed_time).show();
        return;
      }

      $('#statusMsg').html(
        esc(t('tnrap.notRunOf', 'Found')) + ' <b>' + esc(d.number_of_not_run) + '</b> ' +
        esc(t('tnrap.ofTotal', 'of')) + ' <b>' + esc(d.number_of_testcases) + '</b> ' +
        esc(t('tnrap.testCasesInPlan', 'test cases in this test plan'))
      ).show();

      // getNeverRunByPlatform() returns NULL - not an empty set - when the
      // plan has no active+open build, i.e. when nothing can be proven
      // never-run. Saying "all executed" there would be false.
      if (!d.builds_available) {
        $('#emptyBox').html('<i class="fa fa-exclamation-triangle"></i>' +
          esc(t('tnrap.noActiveBuilds', 'No active and open build was found for this Test Plan.'))).show();
        $('#footerInfo').html(t('tnrap.elapsedSeconds', 'Elapsed seconds') + ': ' + d.elapsed_time).show();
        return;
      }

      if (!d.has_data) {
        $('#emptyBox').html('<i class="fa fa-check-circle"></i>' +
          esc(t('tnrap.allExecuted', 'All test cases have been executed on at least one platform.'))).show();
        $('#footerInfo').html(t('tnrap.elapsedSeconds', 'Elapsed seconds') + ': ' + d.elapsed_time).show();
        return;
      }

      tprojPrefix = d.tproject_prefix || '';

      var cols = [
        { title: t('testsuite', 'Test Suite'), data: 'suite_path', className: 'suitecell' },
        { title: t('testcase', 'Test Case'), data: null, className: 'tccell',
          render: function(data, type, row) {
            return '<span class="tcid">' + tcLink(row) + '</span>: ' + esc(row.name) + rowActions(row);
          }
        }
      ];
      // One column per platform, in the order the BFF sorted them. The title
      // is a DB string (testplan_platform_management.name is free text) and
      // DataTables injects it with .html(), so it MUST be escaped here.
      for (var p = 0; p < d.platforms.length; p++) {
        (function(pid, pname) {
          cols.push({
            title: esc(pname),
            data: null,
            orderable: false,
            render: function(data, type, row) {
              for (var k = 0; k < row.cells.length; k++) {
                if (row.cells[k].platform_id === pid) {
                  return statusBadge(row.cells[k].status);
                }
              }
              return '';
            }
          });
        })(d.platforms[p].id, d.platforms[p].name);
      }
      if (d.priority_enabled) {
        cols.push({ title: t('tnrap.priority', 'Priority'), data: null,
                    orderable: false,
                    render: function(data, type, row) { return priorityBadge(row); } });
      }

      var html = '<div class="section"><div class="section-head">' +
        '<i class="fa fa-table"></i> ' + esc(t('tnrap.header', 'Test Cases Not Run on Any Platform')) +
        '<span class="bmeta">' + esc(t('tnrap.matchCount', 'Match count')) + ': ' + d.rows.length + '</span>' +
        '</div><div class="section-body"><table id="dtResults" class="flat"></table></div></div>' +
        '<div class="section"><div class="section-head"><i class="fa fa-info-circle"></i> ' +
        esc(t('tnrap.about', 'About this report')) + '</div><div class="section-body" style="font-size:12.5px;color:#556;">' +
        esc(t('tnrap.info', 'This report shows test cases that have been linked to the current test plan but have not been executed on any platform at all. As soon as a test case has been executed on at least one platform, it will not appear anymore in this report.')) +
        '</div></div>';
      $('#reportArea').html(html);
      $('#countBadge').text(d.rows.length + ' ' + t('tnrap.testCases', 'test cases'));

      $('#dtResults').DataTable({
        data: d.rows,
        columns: cols,
        order: [[0, 'asc'], [1, 'asc']],
        pageLength: 25,
        language: {
          search: t('common.filter', 'Filter') + ':',
          lengthMenu: t('common.showEntries', 'Show') + ' _MENU_ ' + t('common.entries', 'entries'),
          info: t('common.pageInfo', 'Showing _START_ to _END_ of _TOTAL_ entries'),
          paginate: { previous: t('common.prev', 'Previous'), next: t('common.next', 'Next') },
          emptyTable: t('tnrap.allExecuted', 'All test cases have been executed on at least one platform.')
        }
      });

      $('#footerInfo').html(t('tnrap.elapsedSeconds', 'Elapsed seconds') + ': ' + d.elapsed_time).show();
      toast(t('common.loaded', 'Loaded'));
    },
    error: function(xhr) {
      $('#loadingBox').hide();
      if (xhr.status === 401) {
        window.location.href = '/gui/templates/auth/login.html?note=expired';
        return;
      }
      var msg = t('common.errorLoading', 'Error loading data');
      if (xhr.status === 403) { msg = t('tnrap.noPermission', 'No permission'); }
      if (xhr.status === 400) {
        try { msg = JSON.parse(xhr.responseText).message; } catch (e) {}
      }
      $('#warnBox').text(msg).show();
      toast(msg, true);
    }
  });
}

$(function() {
  TLi18n.load(function() {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    loadData();
  });
});
</script>
</body>
</html>
