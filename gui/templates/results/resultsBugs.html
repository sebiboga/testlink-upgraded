<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results by Issues</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; color: #0d3f3c; opacity: 1; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.btn-ghost { background: transparent; color: #ccc; border: 1px solid #555; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.btn-ghost:hover { border-color: #4ECDC4; color: #4ECDC4; }
.warnbox { margin: 12px 24px 0; background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; border-radius: 6px; padding: 10px 14px; font-size: 13px; display: none; }
.summary-cards { display: flex; gap: 16px; padding: 16px 24px 0; flex-wrap: wrap; }
.summary-card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 14px 20px; min-width: 140px; flex: 1; text-align: center; }
.summary-card .num { font-size: 28px; font-weight: 700; color: #22242a; }
.summary-card .lbl { font-size: 12px; color: #888; margin-top: 4px; }
.summary-card.open .num { color: #e6605e; }
.summary-card.resolved .num { color: #28a745; }
.summary-card.total .num { color: #4ECDC4; }
.summary-card.cases .num { color: #007bff; }
.section { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.section-head { padding: 13px 20px; border-bottom: 1px solid #eee; font-size: 15px; font-weight: 700; color: #22242a; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.section-head i { color: #4ECDC4; }
.section-head .bmeta { font-size: 12px; font-weight: 400; color: #667; margin-left: auto; }
.section-body { padding: 10px 20px 14px; overflow-x: auto; }
table.flat { width: 100%; border-collapse: collapse; font-size: 12px; }
table.flat th { background: #22242a; color: #fff; padding: 7px 10px; text-align: left; white-space: nowrap; font-size: 11.5px; position: sticky; top: 0; z-index: 1; }
table.flat td { padding: 5px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
table.flat tr:hover td { background: #f4fbfa; }
td.suitecell { color: #667; font-size: 11px; max-width: 200px; word-break: break-word; }
td.tccell { white-space: nowrap; }
td.tccell .tcicons { display: inline-flex; gap: 5px; margin-right: 4px; vertical-align: middle; }
td.tccell .tcico { color: #4ECDC4; text-decoration: none; font-size: 12px; }
td.tccell .tcico:hover { color: #2d8e88; }
td.bugcell { max-width: 400px; word-break: break-word; white-space: normal; }
div.bug-box { display: inline-block; margin: 1px 0; padding: 0 3px; border-radius: 3px; line-height: 1.5; }
div.bug-box.resolved { background: #d4edda; }
div.bug-box .bug-status { font-weight: 600; }
div.bug-box .bug-summary { font-weight: 400; }
.bug-link { display: inline-block; color: #22242a; text-decoration: none; font-size: 11px; }
.bug-link:hover { text-decoration: underline; color: #007bff; }
.bug-link.resolved { color: #1a7f37; }
.bug-link.resolved:hover { color: #218838; }
.empty { background: #fff; border-radius: 8px; padding: 30px; text-align: center; color: #888; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px; }
.empty i { font-size: 34px; color: #4ECDC4; display: block; margin-bottom: 10px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.footer p.info { margin: 6px 0 0; font-style: italic; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.toast.err { background: #e6605e; }
.spin { text-align: center; color: #888; font-size: 13px; padding: 40px 24px; }
.spin i { font-size: 22px; color: #4ECDC4; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 8px; }
@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
.dataTables_wrapper .dataTables_filter input { border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px; font-size: 12px; }
.dataTables_wrapper .dataTables_length select { border: 1px solid #ccc; border-radius: 4px; padding: 4px; font-size: 12px; }
.tbtn { background: #2c2f36; color: #ddd; border: 1px solid #3c404a; border-radius: 4px; padding: 5px 12px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tbtn:hover { background: #383c45; color: #fff; }
.col-filter { width: 100%; min-width: 60px; font-size: 12px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 3px; }
tr.dtrg-group td { background: #e9f5f3; font-weight: 700; color: #2b6f69; padding: 8px 12px; }
tr.dtrg-group td i { margin-right: 8px; color: #2d8e88; }
tr.dtrg-group td:hover { background: #dcefec; }
tr.dtrg-group .gcount { font-weight: 400; color: #6aa; font-size: 11px; margin-left: 5px; }
#gridToolbar { padding: 10px 20px; background: #fff; border-bottom: 1px solid #eee; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#gridToolbar .spacer { flex: 1; }
table.flat tfoot td { padding: 5px 8px; background: #f7f7f7; }
</style>
</head>
<body>

<div class="header">
  <i class="fa fa-bug" style="margin-right:8px;"></i>
  <span data-i18n="rb.header">Results by Issues</span>
  <span class="sub"><span data-i18n="rb.forPlan">for test plan</span> <b id="tplanName">-</b></span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <span class="ctx"><span data-i18n="rb.testProject">Test Project</span>: <b id="tprojectName">-</b></span>
  <span style="flex:1"></span>
  <select id="reportType" style="background:#333;color:#fff;border:1px solid #555;border-radius:4px;padding:4px 8px;font-size:12px;">
    <option value="0" data-i18n="rb.typeLatest">Latest Generation</option>
    <option value="1" data-i18n="rb.typeAllExec">All Executions</option>
  </select>
</div>

<div class="warnbox" id="warnBox"></div>

<div id="loadingBox" class="spin"><i class="fa fa-circle-notch"></i><br><span data-i18n="common.loading">Loading...</span></div>

<div id="summaryCards" style="display:none;"></div>

<div id="reportArea"></div>

<div class="empty" id="emptyBox" style="display:none;"></div>

<div class="footer" id="footerInfo"></div>
<div class="footer"><span data-i18n="footers.resultsBugs">TestLink 2.0.1 - Results by Issues</span></div>
<div class="toast" id="toast"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/rowgroup/1.4.1/js/dataTables.rowGroup.min.js"></script>
<script>
var tproject_id = parseInt(new URLSearchParams(window.location.search).get('tproject_id')) || 0;
var tplan_id = parseInt(new URLSearchParams(window.location.search).get('tplan_id')) || 0;
var collapsedGroups = Object.create(null);
var defaultOrder;
var tableRef=null;

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// Only absolute http(s) and site-relative URLs may become an href - guards
// against HTML/markup ever being pasted into an attribute (Refs #1837).
function safeHttpUrl(u) {
  if (typeof u !== 'string') return '';
  var s = u.trim();
  if (s === '') return '';
  if (/^https?:\/\//i.test(s)) return s;
  if (/^\/\//.test(s)) return s;
  if (/^\//.test(s)) return s;
  return '';
}
function toast(msg, isErr) {
  var $t = $('#toast').text(msg).show();
  if (isErr) $t.addClass('err'); else $t.removeClass('err');
  setTimeout(function(){ $t.fadeOut(300); }, 3000);
}
function t(key, fallback) {
  var v = TLi18n.t(key);
  return (v && v !== key) ? v : (fallback || key);
}

// Rebuilds the legacy decoration of a linked bug, i.e. exactly what
// issueTrackerInterface::buildViewBugLink() (lib/issuetrackerintegration/
// issueTrackerInterface.class.php:352-443) assembles server-side and legacy
// printed verbatim (lib/results/resultsBugs.php:204, resultsBugs.tpl:111):
//   <div title="Access issue tracking system" style="display:inline;background:COLOR">
//     <a href='URL' target='_blank'><b>{id} : </b>[{statusVerbose}] : {summary}</a>
//   </div>
// The pieces arrive as PLAIN TEXT from the BFF (bugs[].url / status_verbose /
// summary / status_color - see api/reports/index.php), so the box, the status
// label and the summary are escaped here and the status label is translated:
// bug_id + status + summary are all escaped before they reach the DOM.
function renderBugLinks(bugs) {
  if (!bugs || bugs.length === 0) return '<em>' + esc(t('rb.noBugs', 'No bugs')) + '</em>';
  var html = '';
  bugs.forEach(function(b) {
    var cls = b.is_resolved ? 'bug-link resolved' : 'bug-link';
    var href = safeHttpUrl(b.url);
    var status = String(b.status_verbose || '').trim();
    var summary = String(b.summary || '').trim();

    var inner = '<b>' + esc(b.bug_id) + ' : </b>'
              + (status ? '<span class="bug-status">[' + esc(t('rb.status_' + status, status)) + ']</span>' : '')
              + (summary ? ' : <span class="bug-summary">' + esc(summary) + '</span>' : '');

    var labelled = href
      ? '<a href="' + esc(href) + '" target="_blank" rel="noopener" class="' + cls + '">' + inner + '</a>'
      : '<span class="' + cls + '">' + inner + '</span>';

    // Status-coloured box around the link, like the legacy <div>. The colour is
    // allow-listed server-side (bugStatusColor()); anything unexpected falls
    // back to the resolved/unresolved tint classes.
    var bg = /^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(String(b.status_color || '').trim())
      ? String(b.status_color).trim().toLowerCase()
      : '';
    var boxCls = 'bug-box' + (b.is_resolved ? ' resolved' : '');
    var style = bg ? ' style="display:inline;background:' + esc(bg) + ';"' : '';
    html += '<div class="' + boxCls + '"' + style
         + ' title="' + esc(t('rb.accessToBts', 'Access issue tracking system')) + '">'
         + labelled + '</div>';
  });
  return html;
}

function loadData() {
  $('#loadingBox').show();
  $('#summaryCards').hide();
  $('#reportArea').empty();
  $('#emptyBox').hide();
  $('#footerInfo').empty();

  if ($.fn.DataTable.isDataTable('#dtResults')) {
    $('#dtResults').DataTable().destroy();
  }

  var type = parseInt($('#reportType').val()) || 0;

  $.ajax({
    url: '/api/reports/index.php',
    data: { action: 'results_bugs', tproject_id: tproject_id, tplan_id: tplan_id, type: type },
    dataType: 'json',
    success: function(d) {
      $('#loadingBox').hide();
      if (d.status === 'error') {
        $('#warnBox').text(d.message).show();
        return;
      }
      $('#tplanName').text(d.tplan_name || '-');
      $('#tprojectName').text(d.tproject_name || '-');

      // Summary cards
      var cardsHtml = '<div class="summary-cards">' +
        '<div class="summary-card open"><div class="num">' + d.total_open_bugs + '</div><div class="lbl">' + t('rb.bugsOpen', 'Open Bugs') + '</div></div>' +
        '<div class="summary-card resolved"><div class="num">' + d.total_resolved_bugs + '</div><div class="lbl">' + t('rb.bugsResolved', 'Resolved Bugs') + '</div></div>' +
        '<div class="summary-card total"><div class="num">' + d.total_bugs + '</div><div class="lbl">' + t('rb.bugsTotal', 'Total Bugs') + '</div></div>' +
        '<div class="summary-card cases"><div class="num">' + d.total_cases_with_bugs + '</div><div class="lbl">' + t('rb.tcsWithBugs', 'TCs with Bugs') + '</div></div>' +
        '</div>';
      $('#summaryCards').html(cardsHtml).show();

      if (!d.has_data) {
        $('#emptyBox').html('<i class="fa fa-check-circle"></i>' + t('rb.noLinkedBugs', 'No linked bugs found for this report.')).show();
        return;
      }

      // Hint for type=1
      var hint = '';
      if (d.verbose_type === 'all') {
        hint = '<div style="padding:10px 20px;background:#fff3cd;border-bottom:1px solid #ffc107;color:#856404;font-size:12px;">' +
               '<i class="fa fa-info-circle" style="margin-right:5px;"></i>' + t('rb.hintAllExec', 'Showing all executions with bugs. Some test cases may appear multiple times.') + '</div>';
      }

      // Test Case cell — port of the legacy icon pair built by
// lib/results/resultsBugs.php:89-96 (openExecHistoryWindow + openTCEditWindow,
// titles $l18n['execution_history'] / $l18n['design']).
//
// The legacy window helpers (gui/javascript/testlink_library.js:1726 / :913)
// do NOT exist in the modern shell, and openExecHistoryWindow() concatenates
// `&tproject_id=` + an undeclared variable, i.e. `undefined` (same finding
// documented at gui/templates/results/tcNotRunAnyPlatform.html:139-144), so
// both popups are addressed directly here — same URLs and same window contract
// as the already-modernized sibling report resultsMatrix.html:346-360 and
// tplanWithCF.html:128.
//
// The legacy "<!-- 0000000001 -->" external_id comment is dead markup for the
// browser and is NOT ported; the id itself is still in the row (row.external_id).
function tcCell(row) {
  var tcId = row.tc_id;
  var name = row.tc_name || row.name || '';
  var prefix = '<span class="tcicons">';
  var out = prefix;
  if (tcId !== undefined && tcId !== null && tcId !== '') {
    var histUrl = '/gui/templates/execute/execHistory.html?tcase_id=' +
      encodeURIComponent(tcId) + '&tproject_id=' + encodeURIComponent(tproject_id);
    var editUrl = '/gui/templates/testcases/tcEdit.html?tcase_id=' +
      encodeURIComponent(tcId) + '&tproject_id=' + encodeURIComponent(tproject_id);
    out += '<a class="tcico" href="' + esc(histUrl) + '" title="' +
      esc(t('rb.executionHistory', 'Execution history')) +
      '" onclick="window.open(this.href,\'history_popup\',\'width=900,height=650,left=100,top=100,resizable=yes,scrollbars=yes\');return false;">' +
      '<i class="fas fa-clock-rotate-left"></i></a>';
    out += '<a class="tcico" href="' + esc(editUrl) + '" title="' +
      esc(t('rb.testCaseDesign', 'Test case design')) +
      '" onclick="window.open(this.href,\'tcEdit_' + esc(String(tcId)) +
      '\',\'width=900,height=700\');return false;">' +
      '<i class="fas fa-pen-to-square"></i></a>';
  }
  out += '</span><span style="font-weight:600;color:#33363f;">' + esc(row.full_external_id) + ':</span> ' + esc(name);
  return out;
}

var cols = [
        { title: t('title_test_suite_name', 'Test Suite'), data: 'tsuite_name', className: 'suitecell', orderable: true },
        { title: t('title_test_case_title', 'Test Case'), data: null, className: 'tccell', orderable: true,
          render: function(data, type, row) {
            if (type !== 'display') return esc(row.full_external_id) + ': ' + (row.tc_name || '');
            return tcCell(row);
          },
          createdCell: function(td, cellData, rowData, row, col) {},
        },
        { title: t('title_test_case_bugs', 'Bugs'), data: 'bugs', className: 'bugcell', orderable: false,
          render: function(data) { return renderBugLinks(data); }
        }
      ];

      var tableHtml = '<div class="section">' +
        (hint ? hint : '') +
        '<div class="section-head">' +
        '<i class="fa fa-table"></i> ' + t('rb.header', 'Results by Issues') +
        '<span class="bmeta">' + t('rb.tcCount', 'Test cases') + ': ' + d.total_cases_with_bugs + '</span>' +
        '</div><div class="section-body">' +
        '<div id="gridToolbar">' +
        '<button class="tbtn" id="btnExpandAll"><i class="fa fa-plus-square"></i> ' + t('rb.expandAllGroups','Expand all groups') + '</button>' +
        '<button class="tbtn" id="btnCollapseAll"><i class="fa fa-minus-square"></i> ' + t('rb.collapseAllGroups','Collapse all groups') + '</button>' +
        '<button class="tbtn" id="btnShowCols"><i class="fa fa-columns"></i> ' + t('rb.showAllColumns','Show all columns') + '</button>' +
        '<button class="tbtn" id="btnResetFilters"><i class="fa fa-filter-circle-xmark"></i> ' + t('rb.resetFilters','Reset Filters') + '</button>' +
        '<button class="tbtn" id="btnResetState"><i class="fa fa-rotate-left"></i> ' + t('rb.resetState','Reset to default state') + '</button>' +
        '<button class="tbtn" id="btnRefresh"><i class="fa fa-rotate"></i> ' + t('rb.refresh','Refresh') + '</button>' +
        '<span class="spacer"></span>' +
        '</div>' +
        '<table id="dtResults" class="flat" style="width:100%"><tfoot><tr><td></td><td></td><td></td></tr></tfoot></table></div></div>';
      $('#reportArea').html(tableHtml);

      collapsedGroups = Object.create(null);
      var grouped = true;
      var tableOpt = {
        data: d.rows,
        columns: cols,
        order: [[0, 'asc'], [1, 'asc']],
        pageLength: 25,
        language: {
          search: t('common.filter', 'Filter') + ':',
          lengthMenu: t('common.showEntries', 'Show') + ' _MENU_ ' + t('common.entries', 'entries'),
          info: t('common.pageInfo', 'Showing _START_ to _END_ of _TOTAL_ entries'),
          paginate: { previous: t('common.prev', 'Previous'), next: t('common.next', 'Next') },
          emptyTable: t('rb.noLinkedBugs', 'No linked bugs found for this report.')
        }
      };
      if (grouped) {
        tableOpt.rowGroup = {
          dataSrc: 'tsuite_name',
          startRender: function (rowsInGroup, group) {
            var isCollapsed = !!collapsedGroups[group];
            rowsInGroup.nodes().each(function (n) { n.style.display = isCollapsed ? 'none' : ''; });
            var n = rowsInGroup.count();
            var cnt = (n > 1 ? t('rb.groupItems', '({count} items)') : t('rb.groupItem', '({count} item)')).replace('{count}', n);
            return $('<tr/>').attr('data-key', encodeURIComponent(group))
              .append($('<td/>').attr('colspan', 3).append(
                $('<i/>').addClass('fa ' + (isCollapsed ? 'fa-chevron-right' : 'fa-chevron-down')),
                ' ' + esc(group) + '<span class="gcount">' + esc(cnt) + '</span>'
              ));
          }
        };
        tableOpt.order = [[0, 'asc'], [1, 'asc']];
      }
      defaultOrder = tableOpt.order.slice();
      tableRef = $('#dtResults').DataTable(tableOpt);

      // column filters
      var $tfrow = $('#dtResults tfoot tr');
      tableRef.columns().every(function (idx) {
        var $th = $('#dtResults thead th').eq(idx);
        var label = (($th.text() || '').trim() || (idx+1));
        if (idx === 2) {
          $('<td/>').appendTo($tfrow);
          return;
        }
        var $input = $('<input type="text" class="col-filter" data-col="' + idx + '" placeholder="' + esc(label) + '" />');
        var $td = $('<td/>').append($input).appendTo($tfrow);
        $input.on('keyup change', function () {
          tableRef.column(idx).search(this.value).draw();
          updateReset();
        });
      });
      function anyFilterActive() {
        var any = false;
        tableRef.columns().every(function () { if (this.search() !== '') { any = true; } });
        return any;
      }
      function updateReset() { $('#btnResetFilters').toggle(anyFilterActive()); }
      function clearAllFilters() {
        tableRef.columns().every(function () { this.search(''); });
        $('#dtResults tfoot .col-filter').val('');
        tableRef.draw();
        updateReset();
      }
      $(tableRef.table().container()).off('click.rbgrp').on('click.rbgrp', 'tr.dtrg-group', function () {
        var key = decodeURIComponent($(this).attr('data-key') || '');
        if (key === '') return;
        collapsedGroups[key] = !collapsedGroups[key];
        tableRef.draw(false);
      });
      $('#btnExpandAll').off('click').on('click', function () {
        collapsedGroups = Object.create(null);
        tableRef.draw(false);
      });
      $('#btnCollapseAll').off('click').on('click', function () {
        tableRef.rows({page:'all'}).data().each(function (r) {
          var k = r.tsuite_name;
          if (k !== undefined && k !== null) collapsedGroups[k] = true;
        });
        tableRef.draw(false);
      });
      $('#btnResetFilters').off('click').on('click', clearAllFilters);
      $('#btnResetState').off('click').on('click', function () {
        clearAllFilters();
        collapsedGroups = Object.create(null);
        tableRef.order(defaultOrder).draw();
        toast(t('md.defaultStateRestored','Default state restored'));
      });
      $('#btnRefresh').off('click').on('click', loadData);
      $('#btnShowCols').off('click').on('click', function () { /* fixed cols */ });
      updateReset();

      toast(t('common.loaded', 'Loaded'));

      $('#footerInfo').html(
        t('common.generatedOn', 'Generated on') + ': ' +
        new Date().toLocaleString() +
        (d.elapsed_time !== undefined ? ' | ' + t('cwt.elapsedSeconds', 'Elapsed seconds') + ': ' + d.elapsed_time : '') +
        '<p class="info">' + esc(t('rb.infoReport', 'This report shows all bugs linked to test cases during execution.')) + '</p>'
      ).show();
    },
    error: function(xhr) {
      $('#loadingBox').hide();
      toast(t('common.errorLoading', 'Error loading data'), true);
    }
  });
}

$(function() {
  TLi18n.load(function() {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    loadData();
    $('#reportType').on('change', function() { loadData(); });
  });
});
</script>
</body>
</html>
