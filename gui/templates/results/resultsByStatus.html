<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results by Status</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.btn-teal:hover { background: #3dbdb5; }
.btn-ghost { background: transparent; color: #ccc; border: 1px solid #555; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.btn-ghost:hover { border-color: #4ECDC4; color: #4ECDC4; }
.warnbox { margin: 12px 24px 0; background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; border-radius: 6px; padding: 10px 14px; font-size: 13px; display: none; }
.section { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.section-head { padding: 13px 20px; border-bottom: 1px solid #eee; font-size: 15px; font-weight: 700; color: #22242a; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.section-head i { color: #4ECDC4; }
.section-head .bmeta { font-size: 12px; font-weight: 400; color: #667; margin-left: auto; }
.section-body { padding: 10px 20px 14px; overflow-x: auto; }
table.flat { width: 100%; border-collapse: collapse; font-size: 12px; }
table.flat th { background: #22242a; color: #fff; padding: 7px 10px; text-align: left; white-space: nowrap; font-size: 11.5px; position: sticky; top: 0; z-index: 1; }
table.flat td { padding: 5px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
table.flat tr:hover td { background: #f4fbfa; }
td.suitecell { color: #667; font-size: 11px; max-width: 200px; word-break: break-word; }
td.tccell { white-space: nowrap; }
.tcid { font-weight: 600; color: #33363f; }
.ver { color: #99a; font-size: 11px; }
.notecell { max-width: 220px; word-break: break-word; color: #556; font-size: 11.5px; }
.empty { background: #fff; border-radius: 8px; padding: 30px; text-align: center; color: #888; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px; }
.empty i { font-size: 34px; color: #4ECDC4; display: block; margin-bottom: 10px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.footer p.info { margin: 6px 0 0; font-style: italic; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.toast.err { background: #e6605e; }
.spin { text-align: center; color: #888; font-size: 13px; padding: 40px 24px; }
.spin i { font-size: 22px; color: #4ECDC4; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 8px; }
@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
.dataTables_wrapper .dataTables_filter input { border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px; font-size: 12px; }
.dataTables_wrapper .dataTables_length select { border: 1px solid #ccc; border-radius: 4px; padding: 4px; font-size: 12px; }
.bug-link { color: #3498db; text-decoration: none; }
.bug-link:hover { text-decoration: underline; }
.bugs-counter { margin: 8px 0; padding: 8px 14px; background: #fff4dd; border-radius: 4px; font-size: 13px; font-weight: 600; color: #b9770e; display: none; }
.info-note { font-style: italic; color: #667; font-size: 12px; margin: 8px 0; }
</style>
</head>
<body>

<div class="header">
  <i class="fa fa-list-alt" style="margin-right:8px;"></i><span data-i18n="rbs.header">Results by Status</span>
  <span class="sub"><span data-i18n="rbs.forPlan">for test plan</span> <b id="tplanName">-</b></span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <span class="ctx"><span data-i18n="rbs.testProject">Test Project</span>: <b id="tprojectName">-</b></span>
  <span style="flex:1"></span>
  <a class="btn-ghost" id="btnXls" href="#" target="_blank" style="display:none;">
    <i class="fa fa-file-excel"></i> <span data-i18n="rbs.btnExportXls">Export as spreadsheet</span>
  </a>
  <a class="btn-ghost" id="btnMailXls" href="#" target="avoidMailFrame" style="display:none;">
    <i class="fa fa-envelope"></i> <span data-i18n="rbs.btnSendEmail">Send spreadsheet by email</span>
  </a>
  <button class="btn-teal" id="btnRefresh"><i class="fa fa-sync-alt"></i> <span data-i18n="common.refresh">Refresh</span></button>
</div>

<div class="warnbox" id="warnBox"></div>

<div id="loadingBox" class="spin"><i class="fa fa-circle-notch"></i><br><span data-i18n="common.loading">Loading...</span></div>

<div id="reportArea"></div>

<div class="empty" id="emptyBox" style="display:none;"></div>

<div class="footer" id="footerInfo"></div>
<div class="toast" id="toast"></div>
<iframe name="avoidMailFrame" style="display:none;"></iframe>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var tproject_id = parseInt(params.get('tproject_id')) || 0;
  var tplan_id = parseInt(params.get('tplan_id')) || 0;
  var statusType = (params.get('status') || 'failed').toLowerCase();

  var validTypes = ['failed', 'blocked', 'not_run'];
  if (validTypes.indexOf(statusType) === -1) statusType = 'failed';

  var $loading = $('#loadingBox');
  var $warn = $('#warnBox');
  var $empty = $('#emptyBox');
  var $report = $('#reportArea');
  var $footer = $('#footerInfo');

  function toast(msg, isErr) {
    var $t = $('#toast').text(msg).show();
    if (isErr) $t.addClass('err'); else $t.removeClass('err');
    setTimeout(function(){ $t.fadeOut(300); }, 3000);
  }

  function loadData() {
    $loading.show();
    $warn.hide();
    $empty.hide();
    $report.empty();
    $footer.empty();

    $.ajax({
      url: '/api/reports/index.php',
      data: {
        action: 'by_status',
        status: statusType,
        tproject_id: tproject_id,
        tplan_id: tplan_id
      },
      dataType: 'json',
      success: function(d) {
        $loading.hide();
        if (d.status === 'error') {
          $warn.text(d.message).show();
          return;
        }
        $('#tplanName').text(d.tplan_name || '-');
        $('#tprojectName').text(d.tproject_name || '-');

        if (d.title) {
          document.title = d.title + ' - TestLink';
        }

        if (d.warning_msg) {
          $warn.text(d.warning_msg).show();
          return;
        }

        if (d.export_xls_url) {
          $('#btnXls').attr('href', d.export_xls_url).show();
        }
        if (d.send_mail_url) {
          $('#btnMailXls').attr('href', d.send_mail_url).show();
        }

        if (!d.hasData || !d.rows || d.rows.length === 0) {
          $empty.html('<i class="fa fa-info-circle"></i>' + (d.info_msg || TL.i18n.common.noData || 'No data available'));
          $empty.show();
          return;
        }

        // Bugs counter
        if (d.bug_interface_on && !d.show_platforms && d.without_bugs_counter > 0 && statusType !== 'not_run') {
          var bugsLabel = d.bugs_msg || '';
          $report.append('<div class="bugs-counter"><i class="fa fa-bug" style="margin-right:6px;"></i>' + bugsLabel + ' <b>' + d.without_bugs_counter + '</b></div>');
        }

        // Build columns
        var cols = [
          { title: TL.i18n.title_test_suite_name || 'Test Suite' },
          { title: TL.i18n.title_test_case_title || 'Test Case' },
          { title: TL.i18n.version || 'Version' }
        ];

        if (d.show_platforms) {
          cols.push({ title: TL.i18n.platform || 'Platform' });
        }

        cols.push({ title: TL.i18n.th_build || 'Build' });

        if (statusType === 'not_run') {
          cols.push({ title: TL.i18n.assigned_to || 'Assigned To' });
          cols.push({ title: TL.i18n.summary || 'Summary' });
        } else {
          cols.push({ title: TL.i18n.th_run_by || 'Run By' });
          cols.push({ title: TL.i18n.th_date || 'Date' });
          cols.push({ title: TL.i18n.title_execution_notes || 'Notes' });
          if (d.bug_interface_on) {
            cols.push({ title: TL.i18n.th_bugs_id_summary || 'Bugs' });
          }
        }

        // Build rows
        var rows = [];
        for (var i = 0; i < d.rows.length; i++) {
          var r = d.rows[i];
          var row = [];

          row.push('<td class="suitecell">' + esc(r.suite_name) + '</td>');
          row.push('<td class="tccell"><span class="tcid">' + esc(r.test_title) + '</span></td>');
          row.push('<td class="ver">' + esc(r.version) + '</td>');

          if (d.show_platforms) {
            row.push('<td>' + esc(r.platform || '') + '</td>');
          }

          row.push('<td>' + esc(r.build) + '</td>');

          if (statusType === 'not_run') {
            row.push('<td>' + esc(r.tester) + '</td>');
            row.push('<td class="notecell">' + esc(r.notes) + '</td>');
          } else {
            row.push('<td>' + esc(r.tester) + '</td>');
            row.push('<td>' + esc(r.execution_ts || '') + '</td>');
            row.push('<td class="notecell">' + esc(r.notes) + '</td>');
            if (d.bug_interface_on) {
              var bugHtml = '';
              if (r.bugs && r.bugs.length > 0) {
                for (var b = 0; b < r.bugs.length; b++) {
                  if (r.bugs[b].link) {
                    bugHtml += r.bugs[b].link + '<br/>';
                  } else {
                    bugHtml += '<a class="bug-link" href="#" onclick="return false;">#' + r.bugs[b].id + '</a><br/>';
                  }
                }
              }
              row.push('<td>' + bugHtml + '</td>');
            }
          }

          rows.push(row);
        }

        // Render table
        var $section = $('<div class="section"></div>');
        $section.append('<div class="section-head"><i class="fa fa-list-alt"></i> ' + esc(d.title) +
          '<span class="bmeta">' + d.rows.length + ' ' + (TL.i18n.common.records || 'records') + '</span></div>');

        var $tbl = $('<table class="flat" id="dtResults"></table>');
        var $thead = $('<thead></thead>');
        var $tr = $('<tr></tr>');
        for (var c = 0; c < cols.length; c++) {
          $tr.append('<th>' + cols[c].title + '</th>');
        }
        $thead.append($tr);
        $tbl.append($thead);

        var $tbody = $('<tbody></tbody>');
        for (var r2 = 0; r2 < rows.length; r2++) {
          var $row = $('<tr></tr>');
          for (var c2 = 0; c2 < rows[r2].length; c2++) {
            $row.append(rows[r2][c2]);
          }
          $tbody.append($row);
        }
        $tbl.append($tbody);

        var $sbody = $('<div class="section-body"></div>');
        $sbody.append($tbl);
        $section.append($sbody);
        $report.append($section);

        // Init DataTable
        $('#dtResults').DataTable({
          pageLength: 25,
          order: [],
          language: { search: TL.i18n.common.search || 'Search:' }
        });

        // Footer info
        var ctxParts = [];
        ctxParts.push((TL.i18n.rbs.testProject || 'Test Project') + ': ' + esc(d.tproject_name));
        ctxParts.push((TL.i18n.rbs.forPlan || 'Test Plan') + ': ' + esc(d.tplan_name));
        var reportCtx = d.report_context || '';
        if (reportCtx) {
          $footer.append('<p class="info">' + esc(reportCtx) + '</p>');
        }
        if (d.info_msg) {
          $footer.append('<p class="info">' + esc(d.info_msg) + '</p>');
        }
        var now = new Date().toLocaleString();
        $footer.append('<p>' + (TL.i18n.common.generatedBy || 'Generated by TestLink on') + ' ' + now + '</p>');

        toast(TL.i18n.common.loaded || 'Loaded');
      },
      error: function(xhr) {
        $loading.hide();
        $warn.text('Error loading data: ' + xhr.statusText).show();
        toast('Error', true);
      }
    });
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  $('#btnRefresh').on('click', loadData);
  loadData();
})();
</script>
</body>
</html>
