<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absolute Latest Execution Results</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.btn-teal:hover { background: #3dbdb5; }
.btn-ghost { background: transparent; color: #ccc; border: 1px solid #555; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.btn-ghost:hover { border-color: #4ECDC4; color: #4ECDC4; }
.warnbox { margin: 12px 24px 0; background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; border-radius: 6px; padding: 10px 14px; font-size: 13px; display: none; }
.section { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.section-head { padding: 13px 20px; border-bottom: 1px solid #eee; font-size: 15px; font-weight: 700; color: #22242a; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.section-head i { color: #4ECDC4; }
.section-head .bmeta { font-size: 12px; font-weight: 400; color: #667; margin-left: auto; }
.section-body { padding: 10px 20px 14px; overflow-x: auto; }
table.flat { width: 100%; border-collapse: collapse; font-size: 12px; }
table.flat th { background: #22242a; color: #fff; padding: 7px 10px; text-align: left; white-space: nowrap; font-size: 11.5px; position: sticky; top: 0; z-index: 1; }
table.flat td { padding: 5px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
table.flat tr:hover td { background: #f4fbfa; }
td.suitecell { color: #667; font-size: 11px; max-width: 200px; word-break: break-word; }
td.tccell { white-space: nowrap; }
.tcid { font-weight: 600; color: #33363f; }
.badge-st { display: inline-block; min-width: 62px; text-align: center; font-size: 11px; font-weight: 600; border-radius: 9px; padding: 2px 8px; white-space: nowrap; }
.st-passed   { background: #e5f7e3; color: #2e7d32; }
.st-failed   { background: #fdecea; color: #c0392b; }
.st-blocked  { background: #fff4dd; color: #b9770e; }
.st-not_run  { background: #eceff1; color: #607d8b; }
.prio-highest { color: #c0392b; font-weight: 700; }
.prio-high    { color: #e67e22; font-weight: 700; }
.prio-medium  { color: #b9770e; }
.prio-low     { color: #607d8b; }
.empty { background: #fff; border-radius: 8px; padding: 30px; text-align: center; color: #888; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px; }
.empty i { font-size: 34px; color: #4ECDC4; display: block; margin-bottom: 10px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.footer p.info { margin: 6px 0 0; font-style: italic; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.toast.err { background: #e6605e; }
.spin { text-align: center; color: #888; font-size: 13px; padding: 40px 24px; }
.spin i { font-size: 22px; color: #4ECDC4; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 8px; }
@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }

.launcher-box { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px; padding: 24px; }
.launcher-box h3 { font-size: 15px; font-weight: 700; color: #22242a; margin: 0 0 12px; }
.launcher-box label { font-size: 13px; font-weight: 600; color: #445; display: block; margin-bottom: 6px; }
.launcher-box select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
.launcher-box .hint { font-size: 12px; color: #888; margin-top: 6px; }

.dataTables_wrapper .dataTables_filter input { border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px; font-size: 12px; }
.dataTables_wrapper .dataTables_length select { border: 1px solid #ccc; border-radius: 4px; padding: 4px; font-size: 12px; }
.notecell { max-width: 220px; word-break: break-word; color: #556; font-size: 11.5px; }
</style>
</head>
<body>

<div class="header">
  <i class="fa fa-bolt" style="margin-right:8px;"></i><span data-i18n="alx.header">Absolute Latest Execution Results</span>
  <span class="sub"><span data-i18n="alx.forPlan">for test plan</span> <b id="tplanName">-</b></span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <span class="ctx"><span data-i18n="alx.testProject">Test Project</span>: <b id="tprojectName">-</b></span>
  <span style="flex:1"></span>
  <a class="btn-ghost" id="btnXls" href="#" target="_blank" style="display:none;">
    <i class="fa fa-file-excel"></i> <span data-i18n="alx.btnExportXls">Export as spreadsheet</span>
  </a>
  <button class="btn-teal" id="btnRefresh"><i class="fa fa-sync-alt"></i> <span data-i18n="common.refresh">Refresh</span></button>
</div>

<div class="warnbox" id="warnBox"></div>

<div id="loadingBox" class="spin"><i class="fa fa-circle-notch"></i><br><span data-i18n="common.loading">Loading...</span></div>

<div id="launcherBox" class="launcher-box" style="display:none;"></div>

<div id="reportArea"></div>

<div class="empty" id="emptyBox" style="display:none;"></div>

<div class="footer" id="footerInfo"></div>
<div class="footer"><span data-i18n="footers.absoluteLatest">TestLink 2.0.1 - Absolute Latest Execution Results</span></div>
<div class="toast" id="toast"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script>
var API = '/api/reports/index.php';
var tprojectId = 0;
var tplanId = 0;
var dtInstance = null;

$(function () {
  var p = new URLSearchParams(window.location.search);
  tprojectId = parseInt(p.get('tproject_id') || '0', 10);
  tplanId = parseInt(p.get('tplan_id') || '0', 10);
  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    $('#btnRefresh').on('click', function() { loadInit(); });
    loadInit();
  });
});

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg, isErr) {
  var $t = $('#toast').text(msg).toggleClass('err', !!isErr).show();
  clearTimeout($t.data('tm'));
  $t.data('tm', setTimeout(function(){ $t.hide(); }, 4000));
}

function warn(msg) {
  if (msg) { $('#warnBox').html('<i class="fa fa-exclamation-triangle"></i> ' + msg).show(); }
  else { $('#warnBox').hide(); }
}

function statusBadge(code, label) {
  var cls = 'st-' + (code || 'not_run');
  return '<span class="badge-st ' + esc(cls) + '">' + esc(label || code) + '</span>';
}

function prioClass(level) {
  if (level >= 5) return 'prio-highest';
  if (level >= 3) return 'prio-high';
  if (level >= 2) return 'prio-medium';
  return 'prio-low';
}

function loadInit() {
  $('#emptyBox').hide();
  $('#reportArea').empty();
  $('#launcherBox').hide();
  if (dtInstance) { dtInstance.destroy(); dtInstance = null; }
  $('#loadingBox').show();
  $('#btnXls').hide();

  var url = API + '?action=absolute_latest_init&tproject_id=' + tprojectId + '&tplan_id=' + tplanId;

  $.getJSON(url, function (r) {
    $('#loadingBox').hide();
    if (r.status !== 'ok') { toast(r.message || TLi18n.t('common.error'), true); return; }
    tprojectId = r.tproject_id;
    tplanId = r.tplan_id;
    $('#tprojectName').text(r.tproject_name);
    $('#tplanName').text(r.tplan_name);
    document.title = TLi18n.t('alx.header') + ' - ' + r.tplan_name;

    if (r.platforms && r.platforms.length === 0) {
      warn(TLi18n.t('alx.noPlatforms'));
      return;
    }

    showLauncher(r);
  }).fail(function (xhr) {
    $('#loadingBox').hide();
    var msg = TLi18n.t('alx.errLoad');
    if (xhr.status === 403) { msg = TLi18n.t('common.forbidden'); }
    warn(msg);
    toast(msg, true);
  });
}

function showLauncher(r) {
  var $box = $('#launcherBox').empty();
  var html = '<h3><i class="fa fa-filter" style="color:#4ECDC4;margin-right:8px;"></i>' +
    esc(TLi18n.t('alx.selectPlatform')) + '</h3>';

  html += '<label>' + esc(TLi18n.t('alx.platform')) + ' *</label>';
  html += '<select id="platformSelect">';
  html += '<option value="">' + esc(TLi18n.t('alx.choosePlatform')) + '</option>';
  r.platforms.forEach(function (p) {
    html += '<option value="' + p.id + '">' + esc(p.name) + '</option>';
  });
  html += '</select>';
  html += '<p class="hint">' + esc(TLi18n.t('alx.platformHint')) + '</p>';
  html += '<button class="btn-teal" id="btnApply"><i class="fa fa-play"></i> ' +
    esc(TLi18n.t('alx.generateReport')) + '</button>';

  $box.html(html).show();

  $('#btnApply').on('click', function () {
    var platId = $('#platformSelect').val();
    if (!platId) {
      toast(TLi18n.t('alx.selectPlatformRequired'), true);
      return;
    }
    loadResult(parseInt(platId, 10), r);
  });
}

function loadResult(platformId, initCtx) {
  $('#emptyBox').hide();
  $('#reportArea').empty();
  $('#launcherBox').hide();
  if (dtInstance) { dtInstance.destroy(); dtInstance = null; }
  $('#loadingBox').show();

  var url = API + '?action=absolute_latest_result&tproject_id=' + tprojectId +
    '&tplan_id=' + tplanId + '&platform_id=' + platformId;

  $.getJSON(url, function (r) {
    $('#loadingBox').hide();
    if (r.status !== 'ok') { toast(r.message || TLi18n.t('common.error'), true); return; }
    $('#tprojectName').text(r.tproject_name);
    $('#tplanName').text(r.tplan_name);

    if (r.export_xls_url) {
      $('#btnXls').attr('href', r.export_xls_url).show();
    }

    if (!r.hasData) {
      $('#emptyBox').html('<i class="fa fa-inbox"></i> ' + esc(TLi18n.t('alx.noData'))).show();
      return;
    }

    renderTable(r);
    $('#footerInfo').html(
      esc(TLi18n.t('alx.infoReport')) + ' &middot; ' +
      esc(TLi18n.t('common.generatedOn')) + ' ' + new Date().toLocaleString() +
      ' &middot; ' + esc(TLi18n.t('alx.elapsedSeconds')) + ' ' + esc(r.elapsed_time));
  }).fail(function (xhr) {
    $('#loadingBox').hide();
    var msg = TLi18n.t('alx.errLoad');
    if (xhr.status === 403) { msg = TLi18n.t('common.forbidden'); }
    warn(msg);
    toast(msg, true);
  });
}

function renderTable(r) {
  var $area = $('#reportArea');
  var h = '<div class="section"><div class="section-head"><i class="fa fa-bolt"></i>' +
    '<span>' + esc(TLi18n.t('alx.resultsTitle')) + ' &mdash; ' + esc(r.platform_name) + '</span>' +
    '<span class="bmeta">' + esc(TLi18n.t('alx.rowCount', [r.rows.length])) + '</span>' +
    '</div><div class="section-body"><table id="resultTable" class="flat display" style="width:100%">';
  h += '<thead><tr>';
  h += '<th>' + esc(TLi18n.t('alx.thTestSuite')) + '</th>';
  h += '<th>' + esc(TLi18n.t('alx.thTestCase')) + '</th>';
  if (r.priority_enabled) { h += '<th>' + esc(TLi18n.t('alx.thPriority')) + '</th>'; }
  h += '<th>' + esc(TLi18n.t('alx.thLatestExecution')) + '</th>';
  h += '<th>' + esc(TLi18n.t('alx.thLatestExecNotes')) + '</th>';
  h += '</tr></thead><tbody>';

  r.rows.forEach(function (row) {
    h += '<tr>';
    h += '<td class="suitecell">' + esc(row.tsuite_name || '') + '</td>';
    h += '<td class="tccell"><span class="tcid">' + esc(row.external_id) + '</span>: ' + esc(row.tc_name) + esc(row.version_tag) + '</td>';
    if (r.priority_enabled) {
      var pc = prioClass(row.priority_level);
      h += '<td class="' + esc(pc) + '">' + esc(row.priority_label) + '</td>';
    }
    h += '<td>' + statusBadge(row.status_code, row.status_label) + '</td>';
    h += '<td class="notecell">' + esc(row.exec_notes || '') + '</td>';
    h += '</tr>';
  });

  h += '</tbody></table></div></div>';
  $area.html(h);

  dtInstance = $('#resultTable').DataTable({
    pageLength: 50,
    order: [],
    language: { search: TLi18n.t('common.search') + ':' }
  });
}
</script>
</body>
</html>
