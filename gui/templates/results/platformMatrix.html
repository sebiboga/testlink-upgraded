<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Test Plan Platform Coverage Matrix report of TestLink 2.0.1 (Refs #1992)">
<title>Test Plan Platform Coverage Matrix</title>
<!--
  Test Plan Platform Coverage Matrix report (Refs #1992).

  Net-new modern Reports-menu screen. 1.9.20 could diff exactly two platforms
  (platformComparison) or show a per-build snapshot (resultsByBuild), but it
  never answered "which assigned test cases pass on EVERY platform of this
  plan?". Platforms are columns, assigned test-case versions are rows, and each
  cell holds the latest execution result per (version, platform) on the
  selected build (or across all builds). Data comes from
  api/platformmatrix/index.php (actions init / report).
-->
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #0d3f3c; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toolbar label { color: #cfd3da; font-size: 12px; margin-right: 4px; }
.toolbar select { background: #2f323a; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 6px 10px; font-size: 13px; max-width: 240px; }
.toolbar .spacer { flex: 1 1 auto; }
.btn-teal { background: #4ECDC4; color: #0d3f3c; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-dark { background: #2f323a; color: #eee; border: 1px solid #444; padding: 7px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.btn-dark:hover { background: #3a3e48; }
.btn-teal:disabled, .btn-dark:disabled { opacity: .45; cursor: not-allowed; }
.panel { margin: 20px 24px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 18px 20px; }
.panel h3 { font-size: 15px; font-weight: 700; color: #22242a; margin: 0 0 14px 0; }
.panel h3 i { color: #4ECDC4; margin-right: 8px; }
.ctx-grid { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.ctx-item { min-width: 150px; }
.ctx-item .k { font-size: 11px; color: #5c6470; text-transform: uppercase; letter-spacing: .5px; display: block; }
.ctx-item .v { font-size: 14px; color: #22242a; font-weight: 600; }
.cards { display: flex; flex-wrap: wrap; gap: 14px; }
.card { flex: 1 1 120px; background: #f8f9fb; border: 1px solid #eceef2; border-radius: 6px; padding: 12px 14px; }
.card .k { font-size: 11px; color: #5c6470; text-transform: uppercase; letter-spacing: .5px; }
.card .v { font-size: 22px; font-weight: 700; color: #22242a; margin-top: 4px; }
.card .u { font-size: 11px; color: #5c6470; font-weight: 400; margin-left: 3px; }
.card.good { border-left: 4px solid #2f9e44; }
.card.bad { border-left: 4px solid #e05c5c; }
.card.warn { border-left: 4px solid #e6b34d; }
.card.info { border-left: 4px solid #4ECDC4; }
.banner { margin: 20px 24px 0 24px; border-radius: 8px; padding: 14px 18px; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.banner .bline { display: flex; align-items: center; gap: 12px; }
.banner .bline i { font-size: 18px; }
.banner .bmeta { margin-top: 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.banner.bad { background: #fdecea; color: #8a2b28; border-left: 5px solid #e05c5c; }
.banner.good { background: #eaf7ee; color: #23633a; border-left: 5px solid #2f9e44; }
.banner.warn { background: #fff6e5; color: #8a6216; border-left: 5px solid #e6b34d; }
.banner.info { background: #eef7f7; color: #17756e; border-left: 5px solid #4ECDC4; }
.state { margin: 20px 24px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 34px 20px; text-align: center; color: #777; font-size: 14px; }
.state h4 { font-size: 16px; color: #22242a; margin: 0 0 8px 0; }
.state.warn { border-left: 5px solid #e6b34d; }
.state.deny { border-left: 5px solid #e05c5c; color: #7a2b2b; }
.state .code { font-size: 11px; color: #6b7280; margin-top: 10px; font-family: monospace; }
.state .spinner { display: inline-block; width: 18px; height: 18px; margin-right: 8px; vertical-align: -3px; border: 3px solid #4ECDC4; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.table-wrap { margin: 0 24px 24px 24px; }
table.dataTable thead th { background: #22242a; color: #fff; font-size: 12px; padding: 10px 12px; }
table.dataTable tbody td { padding: 9px 12px; font-size: 13px; vertical-align: middle; }
table.dataTable tbody td.cellcol { text-align: center; }
.bar { height: 6px; background: #eceef2; border-radius: 4px; overflow: hidden; margin-top: 4px; min-width: 80px; }
.bar > span { display: block; height: 100%; background: #4ECDC4; }
.bar > span.bad { background: #e05c5c; }
.bar > span.warn { background: #e6b34d; }
.bar > span.good { background: #2f9e44; }
.pill { display: inline-block; min-width: 22px; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; text-align: center; background: #eceef2; color: #33363f; }
.pill.bad { background: #f5c6cb; color: #8a2b28; }
.pill.warn { background: #ffe8ad; color: #7a5611; }
.pill.good { background: #d4edda; color: #1e5d34; }
.pill.info { background: #d5f4f2; color: #0d3f3c; }
.cellbadge { display: inline-block; width: 24px; height: 24px; line-height: 22px; border-radius: 50%; border: 1px solid #c8ccd4; background: #f3f4f7; color: #5c6470; font-size: 12px; text-align: center; }
.cellbadge.p { background: #d4edda; border-color: #2f9e44; color: #1e5d34; }
.cellbadge.f { background: #f5c6cb; border-color: #e05c5c; color: #8a2b28; }
.cellbadge.b { background: #ffe8ad; border-color: #e6b34d; color: #7a5611; }
.cellbadge.na { background: #fff; border-style: dashed; color: #a0a4ad; }
.legend { margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: #5c6470; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.dataTables_wrapper .dataTables_paginate .paginate_button.current { background: #4ECDC4 !important; color: #0d3f3c !important; border: none !important; }
.dataTables_wrapper .dataTables_filter input { border: 1px solid #ddd; border-radius: 4px; padding: 4px 8px; }
.footer { padding: 12px 24px; color: #5c6470; font-size: 12px; border-top: 1px solid #ddd; background: #fff; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; z-index: 2000; display: none; }
.toast.err { background: #e05c5c; }
</style>
</head>
<body>

<main id="mainContent">
<div class="header">
  <i class="fa fa-table-cells-large" style="margin-right:8px;"></i>
  <span data-i18n="pmx.title">Test Plan Platform Coverage Matrix</span>
  <span class="sub" data-i18n="pmx.subtitle">which assigned test cases pass on every platform?</span>
</div>

<div class="toolbar">
  <button class="btn-teal" id="btnRefresh"><i class="fa fa-refresh"></i> <span data-i18n="pmx.refresh">Refresh</span></button>
  <button class="btn-dark" id="btnCsv" disabled><i class="fa fa-download"></i> <span data-i18n="pmx.exportCsv">Export CSV</span></button>
  <span class="spacer"></span>
  <label for="selBuild" data-i18n="pmx.build">Build</label>
  <select id="selBuild"></select>
  <label for="selPlatform" data-i18n="pmx.platform">Platform</label>
  <select id="selPlatform"></select>
  <button class="btn-dark" id="btnApply"><i class="fa fa-filter"></i> <span data-i18n="pmx.apply">Apply</span></button>
  <button class="btn-dark" id="btnClose"><i class="fa fa-times"></i> <span data-i18n="pmx.close">Close</span></button>
</div>

<div id="stateBox" role="status" aria-live="polite"></div>
<div id="bannerBox" role="status" aria-live="polite"></div>

<div id="report" style="display:none;">
  <div class="panel">
    <h3><i class="fa fa-info-circle"></i> <span data-i18n="pmx.context">Report context</span></h3>
    <div class="ctx-grid" id="ctxGrid"></div>
  </div>

  <div class="panel">
    <h3><i class="fa fa-gauge-high"></i> <span data-i18n="pmx.kpis">Key indicators</span></h3>
    <div class="cards" id="kpis"></div>
  </div>

  <div class="panel">
    <h3><i class="fa fa-layer-group"></i> <span data-i18n="pmx.perPlatform">Platform totals</span></h3>
    <div class="table-responsive">
      <table class="table table-striped table-bordered" style="width:100%" aria-label="Platform totals">
        <thead>
          <tr>
            <th scope="col" data-i18n="pmx.colPlatform">Platform</th>
            <th scope="col" data-i18n="pmx.colAssigned">Assigned</th>
            <th scope="col" data-i18n="pmx.colExecuted">Executed</th>
            <th scope="col" data-i18n="pmx.colPassed">Passed</th>
            <th scope="col" data-i18n="pmx.colFailed">Failed</th>
            <th scope="col" data-i18n="pmx.colBlocked">Blocked</th>
            <th scope="col" data-i18n="pmx.colNotRun">Not run</th>
            <th scope="col" data-i18n="pmx.colCoverage">Coverage</th>
            <th scope="col" data-i18n="pmx.colPassRate">Pass rate</th>
          </tr>
        </thead>
        <tbody id="platBody"></tbody>
      </table>
    </div>
  </div>

  <div class="table-wrap">
    <table id="grid" class="table table-striped table-bordered" style="width:100%" aria-label="Test Plan Platform Coverage Matrix">
      <caption class="sr-only" data-i18n="pmx.title">Test Plan Platform Coverage Matrix</caption>
      <thead></thead>
      <tbody></tbody>
    </table>
    <div class="legend">
      <span><span class="cellbadge p"><i class="fa fa-check"></i></span> <span data-i18n="pmx.stPass">Passed</span></span>
      <span><span class="cellbadge f"><i class="fa fa-xmark"></i></span> <span data-i18n="pmx.stFail">Failed</span></span>
      <span><span class="cellbadge b"><i class="fa fa-pause"></i></span> <span data-i18n="pmx.stBlocked">Blocked</span></span>
      <span><span class="cellbadge n"><i class="fa fa-minus"></i></span> <span data-i18n="pmx.stNotRun">Not run</span></span>
      <span><span class="cellbadge na"><i class="fa fa-ban"></i></span> <span data-i18n="pmx.stNa">Not assigned</span></span>
    </div>
  </div>
</div>

<div class="footer"><span data-i18n="footers.platformMatrix"></span><span id="localeSwitcher"></span></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/platformmatrix/index.php';
var currentData = null;
var dt = null;

function esc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function q(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function stateFor(code, httpStatus, rawMessage) {
  var map = {
    not_authenticated: { cls: 'deny', title: 'pmx.deniedTitle',  body: 'pmx.deniedBody' },
    session_expired:   { cls: 'deny', title: 'pmx.deniedTitle',  body: 'pmx.expiredBody' },
    no_right:          { cls: 'deny', title: 'pmx.deniedTitle',  body: 'pmx.noRightBody' },
    tplan_not_found:   { cls: 'warn', title: 'pmx.notFoundTitle', body: 'pmx.notFoundBody' },
    project_mismatch:  { cls: 'warn', title: 'pmx.notFoundTitle', body: 'pmx.mismatchBody' },
    invalid_request:   { cls: 'warn', title: 'pmx.badRequestTitle', body: 'pmx.badRequestBody' },
    invalid_parameter: { cls: 'warn', title: 'pmx.badRequestTitle', body: 'pmx.badRequestBody' },
    method_not_allowed:{ cls: 'warn', title: 'pmx.badRequestTitle', body: 'pmx.badRequestBody' }
  };
  var m = map[code];
  var detail = '';
  if (!m) {
    m = { cls: 'warn', title: 'pmx.serverErrorTitle', body: 'pmx.serverErrorBody' };
    if (rawMessage) { detail = '<div class="code">' + esc(rawMessage) + '</div>'; }
  }
  return '<div class="state ' + m.cls + '"><h4>' + esc(TLi18n.t(m.title)) + '</h4><div>'
       + esc(TLi18n.t(m.body, { status: httpStatus })) + '</div>' + detail
       + '<div class="code">' + esc(code || ('http_' + httpStatus)) + '</div></div>';
}

function isAuthError(code) {
  return code === 'session_expired' || code === 'not_authenticated';
}

function redirectToLogin() {
  window.location.href = '/login.php?note=expired&destination='
    + encodeURIComponent(window.location.pathname + window.location.search);
}

function showState(html) {
  currentData = null;
  $('#btnCsv').prop('disabled', true);
  $('#report').hide();
  $('#bannerBox').html('');
  $('#stateBox').html(html);
}

function showLoading() {
  currentData = null;
  $('#btnCsv').prop('disabled', true);
  $('#report').hide();
  $('#bannerBox').html('');
  $('#stateBox').html('<div class="state"><div class="spinner"></div>'
    + esc(TLi18n.t('pmx.loading')) + '</div>');
}

function toast(msg, isErr) {
  var $t = $('#toast');
  $t.text(msg).toggleClass('err', !!isErr).fadeIn(120);
  window.clearTimeout(toast._t);
  toast._t = window.setTimeout(function () { $t.fadeOut(160); }, 2600);
}

function rateCls(pct) {
  var n = Number(pct);
  if (n >= 80) { return 'good'; }
  if (n >= 50) { return 'warn'; }
  return 'bad';
}

function verdictCls(v) {
  if (v === 'ready') { return 'good'; }
  if (v === 'at_risk') { return 'bad'; }
  if (v === 'no_data') { return 'info'; }
  return 'warn';
}

function verdictKey(v) {
  if (v === 'ready') { return 'pmx.verdictReady'; }
  if (v === 'at_risk') { return 'pmx.verdictAtRisk'; }
  if (v === 'watch') { return 'pmx.verdictWatch'; }
  return 'pmx.verdictNoData';
}

function rowVerdictKey(v) {
  if (v === 'all_pass') { return 'pmx.rowAllPass'; }
  if (v === 'failed') { return 'pmx.rowFailed'; }
  if (v === 'blocked') { return 'pmx.rowBlocked'; }
  if (v === 'partial') { return 'pmx.rowPartial'; }
  if (v === 'not_run') { return 'pmx.rowNotRun'; }
  return 'pmx.rowNa';
}

function rowVerdictCls(v) {
  if (v === 'all_pass') { return 'good'; }
  if (v === 'failed') { return 'bad'; }
  if (v === 'blocked') { return 'warn'; }
  if (v === 'partial') { return 'info'; }
  return '';
}

function cellKey(st) {
  if (st === 'p') { return 'pmx.stPass'; }
  if (st === 'f') { return 'pmx.stFail'; }
  if (st === 'b') { return 'pmx.stBlocked'; }
  if (st === 'na') { return 'pmx.stNa'; }
  return 'pmx.stNotRun';
}

function cellIcon(st) {
  if (st === 'p') { return 'fa-check'; }
  if (st === 'f') { return 'fa-xmark'; }
  if (st === 'b') { return 'fa-pause'; }
  if (st === 'na') { return 'fa-ban'; }
  return 'fa-minus';
}

function cellHtml(st) {
  return '<span class="cellbadge ' + esc(st) + '" title="'
    + esc(TLi18n.t(cellKey(st))) + '" aria-label="' + esc(TLi18n.t(cellKey(st))) + '">'
    + '<i class="fa ' + cellIcon(st) + '"></i></span>';
}

function query() {
  var p = new URLSearchParams();
  p.set('action', 'report');
  var tplan = q('tplan_id') || '';
  if (tplan) { p.set('tplan_id', tplan); }
  var tp = q('tproject_id') || '';
  if (tp) { p.set('tproject_id', tp); }
  var b = $('#selBuild').val();
  if (b === null || b === undefined) { b = '0'; }
  p.set('build_id', b);
  var pl = $('#selPlatform').val() || '0';
  if (Number(pl) > 0) { p.set('platform_id', pl); }
  return p.toString();
}

function fail(res) {
  var code = (res && res.code) || '';
  if (isAuthError(code)) {
    showState('<div class="state deny"><h4>' + esc(TLi18n.t('pmx.deniedTitle')) + '</h4>'
      + '<div>' + esc(TLi18n.t('pmx.expiredBody')) + '</div>'
      + '<div class="code">' + esc(code) + '</div></div>');
    window.setTimeout(redirectToLogin, 1600);
    return;
  }
  showState(stateFor(code, (res && res.httpStatus) || 400, (res && res.message) || ''));
}

function loadInit() {
  showLoading();
  fetch(API + '?action=init&tplan_id=' + encodeURIComponent(q('tplan_id') || '')
    + (q('tproject_id') ? '&tproject_id=' + encodeURIComponent(q('tproject_id')) : '')
    + (q('build_id') ? '&build_id=' + encodeURIComponent(q('build_id')) : '')
    + (q('platform_id') ? '&platform_id=' + encodeURIComponent(q('platform_id')) : ''),
    { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
    .then(function (r) { return r.json().then(function (j) { j.httpStatus = r.status; return j; }); })
    .then(function (res) {
      if (!res || res.status !== 'ok') { fail(res); return; }
      var f = res.filters || { builds: [], platforms: [] };
      var bopts = '<option value="0">' + esc(TLi18n.t('pmx.allBuilds')) + '</option>';
      (f.builds || []).forEach(function (b) {
        bopts += '<option value="' + esc(b.id) + '">' + esc(b.name)
          + (b.is_open ? ' \u2022 ' + esc(TLi18n.t('pmx.buildOpen')) : '') + '</option>';
      });
      $('#selBuild').html(bopts);
      var popts = '<option value="0">' + esc(TLi18n.t('pmx.allPlatforms')) + '</option>';
      (f.platforms || []).forEach(function (p) {
        popts += '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>';
      });
      $('#selPlatform').html(popts);
      var bf = (res.filter && res.filter.build_id) || 0;
      var pf = (res.filter && res.filter.platform_id) || 0;
      if (bf) { $('#selBuild').val(String(bf)); }
      if (pf) { $('#selPlatform').val(String(pf)); }
      load();
    })
    .catch(function () {
      showState(stateFor('server_error', 500, TLi18n.t('pmx.networkError')));
    });
}

function kpi(label, value, unit, cls) {
  return '<div class="card ' + (cls || 'info') + '"><div class="k">' + esc(label) + '</div>'
    + '<div class="v">' + esc(value) + (unit ? '<span class="u">' + esc(unit) + '</span>' : '')
    + '</div></div>';
}

function bar(pct, cls) {
  return '<div class="bar"><span class="' + cls + '" style="width:'
    + Math.max(0, Math.min(100, Number(pct))) + '%"></span></div>';
}

function buildLabel(id) {
  if (!id) { return TLi18n.t('pmx.allBuilds'); }
  var t = $('#selBuild option[value="' + id + '"]').text();
  return t || ('#' + id);
}

function platformLabel(id) {
  if (!id) { return TLi18n.t('pmx.allPlatforms'); }
  var t = $('#selPlatform option[value="' + id + '"]').text();
  return t || ('#' + id);
}

function render(data) {
  currentData = data;
  $('#stateBox').html('');
  $('#report').show();
  var c = data.context || {};
  var f = data.filter || {};
  $('#ctxGrid').html(
    '<div class="ctx-item"><span class="k">' + esc(TLi18n.t('pmx.project')) + '</span>'
      + '<span class="v">' + esc(c.tproject_name) + '</span></div>'
    + '<div class="ctx-item"><span class="k">' + esc(TLi18n.t('pmx.plan')) + '</span>'
      + '<span class="v">' + esc(c.tplan_name) + '</span></div>'
    + '<div class="ctx-item"><span class="k">' + esc(TLi18n.t('pmx.build')) + '</span>'
      + '<span class="v">' + esc(buildLabel(f.build_id)) + '</span></div>'
    + '<div class="ctx-item"><span class="k">' + esc(TLi18n.t('pmx.platform')) + '</span>'
      + '<span class="v">' + esc(platformLabel(f.platform_id)) + '</span></div>'
  );

  var s = data.summary || {};
  var v = s.verdict || 'no_data';
  var banner = '<div class="banner ' + verdictCls(v) + '"><div class="bline">'
    + '<i class="fa fa-table-cells-large"></i><span>';
  if (v === 'no_data') {
    banner += esc(TLi18n.t(s.platform_count === 0 ? 'pmx.noPlatforms' : 'pmx.bannerNoData'));
  } else {
    banner += esc(TLi18n.t(v === 'ready' ? 'pmx.bannerReady'
      : (v === 'at_risk' ? 'pmx.bannerAtRisk' : 'pmx.bannerWatch'), {
        coverage: s.coverage_pct, pass: s.pass_rate_pct
      }));
  }
  banner += '</span></div><div class="bmeta">'
    + '<span class="pill ' + verdictCls(v) + '">' + esc(TLi18n.t(verdictKey(v))) + '</span>'
    + '<span class="pill good">' + esc(TLi18n.t('pmx.fullyGreen', { count: s.fully_green_cases })) + '</span>'
    + '<span class="pill ' + (s.rows_with_failures > 0 ? 'bad' : '') + '">'
      + esc(TLi18n.t('pmx.rowsFailed', { count: s.rows_with_failures })) + '</span>'
    + (s.worst_platform_id > 0
       ? '<span class="pill warn">' + esc(TLi18n.t('pmx.worstPlatform', {
            name: s.worst_platform_name, rate: s.worst_platform_pass_rate_pct })) + '</span>'
       : '')
    + '</div></div>';
  $('#bannerBox').html(banner);

  $('#kpis').html(
    kpi(TLi18n.t('pmx.kpiPlatforms'), s.platform_count, '', 'info')
    + kpi(TLi18n.t('pmx.kpiAssigned'), s.assigned_cases, '', 'info')
    + kpi(TLi18n.t('pmx.kpiCells'), s.assigned_cells, '', 'info')
    + kpi(TLi18n.t('pmx.kpiExecuted'), s.executed_cells, '(' + s.coverage_pct + '%)', 'info')
    + kpi(TLi18n.t('pmx.kpiPassed'), s.passed_cells, '', 'good')
    + kpi(TLi18n.t('pmx.kpiFailed'), s.failed_cells, '', 'bad')
    + kpi(TLi18n.t('pmx.kpiBlocked'), s.blocked_cells, '', 'warn')
    + kpi(TLi18n.t('pmx.kpiNotRun'), s.not_run_cells, '', 'warn')
    + kpi(TLi18n.t('pmx.kpiCoverage'), s.coverage_pct, '%', rateCls(s.coverage_pct))
    + kpi(TLi18n.t('pmx.kpiPassRate'), s.pass_rate_pct, '%', rateCls(s.pass_rate_pct))
    + kpi(TLi18n.t('pmx.kpiGreen'), s.fully_green_cases, '', 'good')
  );

  var platBody = '';
  (data.platforms || []).forEach(function (p) {
    platBody += '<tr>'
      + '<td><strong>' + esc(p.platform_name) + '</strong></td>'
      + '<td class="num">' + esc(p.assigned) + '</td>'
      + '<td class="num">' + esc(p.executed) + '</td>'
      + '<td class="num"><span class="pill good">' + esc(p.passed) + '</span></td>'
      + '<td class="num"><span class="pill ' + (p.failed > 0 ? 'bad' : '') + '">' + esc(p.failed) + '</span></td>'
      + '<td class="num"><span class="pill ' + (p.blocked > 0 ? 'warn' : '') + '">' + esc(p.blocked) + '</span></td>'
      + '<td class="num">' + esc(p.not_run) + '</td>'
      + '<td class="num">' + esc(p.coverage_pct) + '%' + bar(p.coverage_pct, rateCls(p.coverage_pct)) + '</td>'
      + '<td class="num">' + esc(p.pass_rate_pct) + '%' + bar(p.pass_rate_pct, rateCls(p.pass_rate_pct)) + '</td>'
      + '</tr>';
  });
  $('#platBody').html(platBody || '<tr><td colspan="9">'
    + esc(TLi18n.t('pmx.noPlatforms')) + '</td></tr>');

  var platforms = data.platforms || [];
  var rows = data.rows || [];
  if (dt) { dt.destroy(); dt = null; }
  $('#grid tbody').empty();
  var th = '<tr>'
    + '<th scope="col">' + esc(TLi18n.t('pmx.colTestcase')) + '</th>'
    + '<th scope="col">' + esc(TLi18n.t('pmx.colVersion')) + '</th>'
    + '<th scope="col">' + esc(TLi18n.t('pmx.colImportance')) + '</th>';
  platforms.forEach(function (p) {
    th += '<th scope="col" class="cellcol">' + esc(p.platform_name) + '</th>';
  });
  th += '<th scope="col">' + esc(TLi18n.t('pmx.colExecuted')) + '</th>'
    + '<th scope="col">' + esc(TLi18n.t('pmx.colCoverage')) + '</th>'
    + '<th scope="col">' + esc(TLi18n.t('pmx.colVerdict')) + '</th></tr>';
  $('#grid thead').html(th);

  dt = $('#grid').DataTable({
    order: [],
    pageLength: 25,
    language: {
      search: TLi18n.t('common.filter', 'Filter') + ':',
      lengthMenu: TLi18n.t('common.showEntries', 'Show') + ' _MENU_ '
        + TLi18n.t('common.entries', 'entries'),
      info: TLi18n.t('common.pageInfo', 'Showing _START_ to _END_ of _TOTAL_ entries'),
      paginate: { previous: TLi18n.t('common.prev', 'Previous'),
        next: TLi18n.t('common.next', 'Next') },
      emptyTable: TLi18n.t('pmx.noRows'),
      zeroRecords: TLi18n.t('pmx.noMatch')
    }
  });
  $('#grid_wrapper .dataTables_length select')
    .attr({ id: 'pmxLength', name: 'pmxLength',
      'aria-label': TLi18n.t('common.showEntries', 'Show entries') });
  $('#grid_wrapper .dataTables_filter input')
    .attr({ id: 'pmxSearch', name: 'pmxSearch',
      'aria-label': TLi18n.t('common.filter', 'Filter') });

  rows.forEach(function (r) {
    var line = '<tr>'
      + '<td><strong>' + esc(r.testcase_name) + '</strong>'
        + (r.external_id ? ' <span class="pill info">' + esc(r.external_id) + '</span>' : '') + '</td>'
      + '<td class="num">v' + esc(r.version) + '</td>'
      + '<td class="num">' + esc(r.importance) + '</td>';
    platforms.forEach(function (p) {
      var st = (r.cells && r.cells[String(p.id)]) || 'na';
      line += '<td class="cellcol">' + cellHtml(st) + '</td>';
    });
    line += '<td class="num">' + esc(r.executed) + ' / ' + esc(r.assigned) + '</td>'
      + '<td class="num">' + esc(r.coverage_pct) + '%' + bar(r.coverage_pct, rateCls(r.coverage_pct)) + '</td>'
      + '<td><span class="pill ' + rowVerdictCls(r.verdict) + '">'
        + esc(TLi18n.t(rowVerdictKey(r.verdict))) + '</span></td>'
      + '</tr>';
    dt.row.add($(line));
  });
  dt.draw();
  $('#btnCsv').prop('disabled', rows.length === 0);
}

function load() {
  showLoading();
  fetch(API + '?' + query(), { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
    .then(function (r) { return r.json().then(function (j) { j.httpStatus = r.status; return j; }); })
    .then(function (res) {
      if (!res || res.status !== 'ok') { fail(res); return; }
      render(res);
    })
    .catch(function () {
      showState(stateFor('server_error', 500, TLi18n.t('pmx.networkError')));
    });
}

function csvCell(v) {
  var s = String(v === null || v === undefined ? '' : v);
  if (/^[\s]*[=+\-@]/.test(s)) { s = "'" + s; }
  return '"' + s.replace(/"/g, '""') + '"';
}

function exportCsv() {
  if (!currentData || !currentData.rows || !currentData.rows.length) { return; }
  var platforms = currentData.platforms || [];
  var lines = [];
  var head = ['pmx.colTestcase', 'pmx.colVersion', 'pmx.colImportance'];
  var headerLabels = [TLi18n.t('pmx.colTestcase'), TLi18n.t('pmx.colVersion'),
    TLi18n.t('pmx.colImportance')];
  platforms.forEach(function (p) {
    head.push('platform');
    headerLabels.push(p.platform_name);
  });
  head.push('pmx.colExecuted');
  headerLabels.push(TLi18n.t('pmx.colExecuted'));
  head.push('pmx.colCoverage');
  headerLabels.push(TLi18n.t('pmx.colCoverage'));
  head.push('pmx.colVerdict');
  headerLabels.push(TLi18n.t('pmx.colVerdict'));
  lines.push(headerLabels.map(csvCell).join(';'));
  currentData.rows.forEach(function (r) {
    var cells = [];
    platforms.forEach(function (p) {
      var st = (r.cells && r.cells[String(p.id)]) || 'na';
      cells.push(TLi18n.t(cellKey(st)));
    });
    lines.push([r.testcase_name, 'v' + r.version, r.importance].concat(cells).concat([
      r.executed + ' / ' + r.assigned,
      r.coverage_pct + '%',
      TLi18n.t(rowVerdictKey(r.verdict))
    ]).map(csvCell).join(';'));
  });
  var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'platform-coverage-matrix-' + (q('tplan_id') || 'plan') + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  window.setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  toast(TLi18n.t('pmx.csvDone'));
}

$(function () {
  $('#btnRefresh').on('click', load);
  $('#btnApply').on('click', load);
  $('#btnCsv').on('click', exportCsv);
  $('#btnClose').on('click', function () {
    if (window.opener && !window.opener.closed) { window.close(); }
    else { window.location.href = '/index.php'; }
  });
  TLi18n.load(function () {
    TLi18n.apply();
    document.title = TLi18n.t('pmx.title') + ' - TestLink 2.0.1';
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    loadInit();
  });
});
</script>
