<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Plan Linked Defects</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; color: #0d3f3c; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.toolbar label { color: #aaa; font-size: 12px; margin: 0; }
.toolbar select { background: #2e3138; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 5px 8px; font-size: 12px; max-width: 190px; }
.btn-ghost { background: transparent; color: #ccc; border: 1px solid #555; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.btn-ghost:hover { border-color: #4ECDC4; color: #4ECDC4; }
.btn-ghost[disabled] { opacity: .5; cursor: not-allowed; }
.kpis { display: flex; gap: 14px; flex-wrap: wrap; margin: 16px 24px 0; }
.kpi { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 12px 18px; min-width: 135px; flex: 1; }
.kpi .v { font-size: 24px; font-weight: 700; color: #22242a; line-height: 1.1; }
.kpi .l { font-size: 11.5px; color: #667; margin-top: 3px; text-transform: uppercase; letter-spacing: .4px; }
.kpi.alert .v { color: #e6605e; }
.kpi.teal .v { color: #259b93; }
.verdict { margin: 12px 24px 0; border-radius: 6px; padding: 10px 14px; font-size: 13px; display: none; border: 1px solid transparent; }
.verdict.clear { background: #d4edda; color: #155724; border-color: #b7dfc0; }
.verdict.watch { background: #fff8e1; color: #7a5b00; border-color: #ffe08a; }
.verdict.at_risk { background: #fdecea; color: #b94a48; border-color: #f5c6cb; }
.section { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.section-head { padding: 13px 20px; border-bottom: 1px solid #eee; font-size: 15px; font-weight: 700; color: #22242a; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.section-head i { color: #4ECDC4; }
.section-head .bmeta { font-size: 12px; font-weight: 400; color: #667; margin-left: auto; }
.section-body { padding: 10px 20px 14px; overflow-x: auto; }
table.flat { width: 100%; border-collapse: collapse; font-size: 12px; }
table.flat th { background: #22242a; color: #fff; padding: 8px 10px; text-align: left; white-space: nowrap; font-size: 11.5px; }
table.flat td { padding: 6px 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
table.flat tr:hover td { background: #f4fbfa; }
td.bug a, td.bug span.link { color: #259b93; font-weight: 700; text-decoration: none; cursor: pointer; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge-passed, .badge-clear { background: #d4edda; color: #155724; }
.badge-failed, .badge-at_risk { background: #f5c6cb; color: #b94a48; }
.badge-blocked, .badge-watch { background: #ffecb5; color: #856404; }
.badge-not_run, .badge-unresolved { background: #e9ecef; color: #555; }
.empty { background: #fff; border-radius: 8px; padding: 30px; text-align: center; color: #888; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px; }
.empty i { font-size: 34px; color: #4ECDC4; display: block; margin-bottom: 10px; }
.state { background: #fff; border-radius: 8px; padding: 30px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px; }
.state i { font-size: 36px; color: #e6605e; display: block; margin-bottom: 10px; }
.state h4 { margin: 0 0 6px; color: #22242a; }
.state p { color: #667; margin: 0 0 6px; }
.state code { color: #b94a48; background: #fdecea; padding: 2px 6px; border-radius: 3px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.toast.err { background: #e6605e; }
.spin { text-align: center; color: #888; font-size: 13px; padding: 40px 24px; }
.spin i { font-size: 22px; color: #4ECDC4; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 8px; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.modal-header { background: #22242a; color: #fff; border-bottom: none; }
.modal-header .close { color: #fff; opacity: .8; }
.modal-title { font-size: 16px; }
.modal-body { padding: 16px 20px; }
.detail-meta { font-size: 12px; color: #667; margin-bottom: 10px; }
.dataTables_wrapper .dataTables_filter input { border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px; font-size: 12px; }
.dataTables_wrapper .dataTables_length select { border: 1px solid #ccc; border-radius: 4px; padding: 4px; font-size: 12px; }
</style>
</head>
<body>

<div class="header">
  <i class="fa fa-bug" style="margin-right:8px;"></i>
  <span data-i18n="ldf.header">Test Plan Linked Defects</span>
  <span class="sub" data-i18n="ldf.subtitle">defects linked to this plan's executions</span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <span class="ctx" data-i18n="ldf.testPlan">Test Plan</span>: <b id="tplanName">-</b>
  <span class="ctx" data-i18n="ldf.testProject">Project</span>: <b id="tprojectName">-</b>
  <label for="buildFilter" data-i18n="ldf.build">Build</label>
  <select id="buildFilter"><option value="0" data-i18n="ldf.allBuilds">All builds</option></select>
  <label for="platformFilter" data-i18n="ldf.platform">Platform</label>
  <select id="platformFilter"><option value="0" data-i18n="ldf.allPlatforms">All platforms</option></select>
  <label for="statusFilter" data-i18n="ldf.status">Result</label>
  <select id="statusFilter">
    <option value="all" data-i18n="ldf.statusAll">All</option>
    <option value="p" data-i18n="ldf.statusPassed">Passed</option>
    <option value="f" data-i18n="ldf.statusFailed">Failed</option>
    <option value="b" data-i18n="ldf.statusBlocked">Blocked</option>
  </select>
  <span style="flex:1"></span>
  <button class="btn-ghost" id="btnRefresh"><i class="fa fa-rotate"></i> <span data-i18n="ldf.refresh">Refresh</span></button>
  <button class="btn-ghost" id="btnExport" disabled><i class="fa fa-file-csv"></i> <span data-i18n="ldf.exportCsv">Export CSV</span></button>
  <button class="btn-ghost" id="btnClose"><i class="fa fa-xmark"></i> <span data-i18n="ldf.close">Close</span></button>
</div>

<div class="kpis" id="kpis" style="display:none;">
  <div class="kpi teal"><div class="v" id="kpiDefects">0</div><div class="l" data-i18n="ldf.kpiDefects">Defects</div></div>
  <div class="kpi"><div class="v" id="kpiLinks">0</div><div class="l" data-i18n="ldf.kpiLinks">Bug links</div></div>
  <div class="kpi"><div class="v" id="kpiExecutions">0</div><div class="l" data-i18n="ldf.kpiExecutions">Executions</div></div>
  <div class="kpi"><div class="v" id="kpiCases">0</div><div class="l" data-i18n="ldf.kpiCases">Test cases</div></div>
  <div class="kpi"><div class="v" id="kpiBuilds">0</div><div class="l" data-i18n="ldf.kpiBuilds">Builds</div></div>
  <div class="kpi alert"><div class="v" id="kpiFailed">0</div><div class="l" data-i18n="ldf.kpiFailed">Failed defects</div></div>
  <div class="kpi alert"><div class="v" id="kpiBlocked">0</div><div class="l" data-i18n="ldf.kpiBlocked">Blocked links</div></div>
  <div class="kpi teal"><div class="v" id="kpiPassRate">0%</div><div class="l" data-i18n="ldf.kpiPassRate">Pass rate</div></div>
</div>

<div class="verdict" id="verdictBox"></div>
<div id="loadingBox" class="spin"><i class="fa fa-circle-notch"></i><br><span data-i18n="common.loading">Loading...</span></div>
<div id="stateBox"></div>
<div id="reportArea"></div>
<div class="empty" id="emptyBox" style="display:none;"></div>

<div class="footer" id="footerInfo"></div>
<div class="footer"><span data-i18n="footers.linkedDefects">TestLink 2.0.1 - Test Plan Linked Defects</span></div>
<div class="toast" id="toast"></div>

<div class="modal fade" id="detailModal" tabindex="-1" role="dialog" aria-labelledby="detailTitle">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" id="detailTitle"><span data-i18n="ldf.detailTitle">Linked executions</span></h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
      </div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>
</div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script>
var params = new URLSearchParams(window.location.search);
var tplan_id = parseInt(params.get('tplan_id')) || 0;
var tproject_id = parseInt(params.get('tproject_id')) || 0;
var STATE = { rows: [], summary: {}, context: {}, filter: {}, dt: null };

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function t(key, fallback) {
  var v = TLi18n.t(key);
  return (v && v !== key) ? v : (fallback || key);
}
function toast(msg, isErr) {
  var $el = $('#toast').text(msg).show();
  if (isErr) { $el.addClass('err'); } else { $el.removeClass('err'); }
  setTimeout(function(){ $el.fadeOut(300); }, 3000);
}
function showState(code) {
  var map = {
    invalid_request: ['ldf.errBadRequest', 'Invalid request', 'ldf.errBadRequestBody', 'The report parameters are not valid.'],
    not_authenticated: ['ldf.errSession', 'Session expired', 'ldf.errSessionBody', 'Please sign in again.'],
    no_right: ['ldf.errNoRight', 'No permission', 'ldf.errNoRightBody', 'You need the testplan_metrics right on this test project.'],
    tplan_not_found: ['ldf.errNotFound', 'Test plan not found', 'ldf.errNotFoundBody', 'The requested test plan does not exist.'],
    project_not_found: ['ldf.errNotFound', 'Test plan not found', 'ldf.errNotFoundBody', 'The requested test plan does not exist.'],
    project_mismatch: ['ldf.errMismatch', 'Wrong test project', 'ldf.errMismatchBody', 'This test plan belongs to another test project.'],
    method_not_allowed: ['ldf.errMethod', 'Method not allowed', 'ldf.errMethodBody', 'This report is read-only.']
  };
  var m = map[code] || ['ldf.errGeneric', 'Could not load the report', 'ldf.errGenericBody', 'Unexpected server error.'];
  $('#stateBox').html('<div class="state"><i class="fa fa-triangle-exclamation"></i>' +
    '<h4>' + esc(t(m[0], m[1])) + '</h4><p>' + esc(t(m[2], m[3])) + '</p>' +
    '<p>' + esc(t('ldf.code', 'Code')) + ': <code>' + esc(code) + '</code></p></div>').show();
  TLi18n.apply($('#stateBox')[0]);
}
function resetView() {
  $('#stateBox').empty().hide();
  $('#reportArea').empty();
  $('#emptyBox').hide().empty();
  $('#verdictBox').hide().empty().removeClass('clear watch at_risk');
  $('#kpis').hide();
  $('#footerInfo').empty();
  $('#btnExport').prop('disabled', true);
  if (STATE.dt) { try { STATE.dt.destroy(); } catch (e) {} STATE.dt = null; }
}
function filterParams(action) {
  var p = {
    action: action || 'report',
    tplan_id: tplan_id,
    tproject_id: tproject_id,
    build_id: parseInt($('#buildFilter').val(), 10) || 0,
    platform_id: parseInt($('#platformFilter').val(), 10) || 0,
    status: $('#statusFilter').val() || 'all'
  };
  return p;
}
function fillSelect($sel, items, allKey, allFallback) {
  var current = $sel.val() || '0';
  $sel.empty().append($('<option>').val('0').text(t(allKey, allFallback)));
  (items || []).forEach(function(item) {
    $sel.append($('<option>').val(item.id).text(item.name));
  });
  $sel.val(current);
  if (!$sel.val()) { $sel.val('0'); }
}
function loadInit() {
  $.ajax({
    url: '/api/linkeddefects/index.php',
    data: { action: 'init', tplan_id: tplan_id, tproject_id: tproject_id },
    dataType: 'json',
    success: function(d) {
      if (d.status === 'error') { $('#loadingBox').hide(); showState(d.code); return; }
      STATE.context = d.context || {};
      tplan_id = STATE.context.tplan_id || tplan_id;
      tproject_id = STATE.context.tproject_id || tproject_id;
      fillSelect($('#buildFilter'), (d.filters || {}).builds, 'ldf.allBuilds', 'All builds');
      fillSelect($('#platformFilter'), (d.filters || {}).platforms, 'ldf.allPlatforms', 'All platforms');
      $('#tplanName').text(STATE.context.tplan_name || '-');
      $('#tprojectName').text(STATE.context.tproject_name || '-');
      loadReport();
    },
    error: function(xhr) {
      $('#loadingBox').hide();
      showState((xhr.responseJSON || {}).code || 'error');
    }
  });
}
function loadReport() {
  $('#loadingBox').show();
  resetView();
  $.ajax({
    url: '/api/linkeddefects/index.php',
    data: filterParams('report'),
    dataType: 'json',
    success: function(d) {
      $('#loadingBox').hide();
      if (d.status === 'error') { showState(d.code); return; }
      STATE.rows = d.rows || [];
      STATE.summary = d.summary || {};
      STATE.filter = d.filter || {};
      STATE.context = d.context || {};
      $('#tplanName').text(STATE.context.tplan_name || '-');
      $('#tprojectName').text(STATE.context.tproject_name || '-');

      var s = STATE.summary;
      $('#kpiDefects').text(s.defects || 0);
      $('#kpiLinks').text(s.links || 0);
      $('#kpiExecutions').text(s.executions || 0);
      $('#kpiCases').text(s.cases || 0);
      $('#kpiBuilds').text(s.builds || 0);
      $('#kpiFailed').text(s.failed_defects || 0);
      $('#kpiBlocked').text(s.blocked_links || 0);
      $('#kpiPassRate').text((s.pass_rate || 0) + '%');
      $('#kpis').show();

      var vmap = {
        no_data: ['ldf.verdictNoData', 'No defect links match this filter.', ''],
        clear: ['ldf.verdictClear', 'No failed or blocked defect links in this scope.', 'clear'],
        watch: ['ldf.verdictWatch', 'Blocked executions still carry defect links - review them.', 'watch'],
        at_risk: ['ldf.verdictRisk', 'Defects are linked to failed executions - take action.', 'at_risk']
      };
      var v = vmap[d.verdict] || vmap.no_data;
      $('#verdictBox').addClass(v[2] || '').html(
        '<i class="fa fa-circle-info"></i> ' + esc(t(v[0], v[1]))).show();

      if (!STATE.rows.length) {
        $('#emptyBox').html('<i class="fa fa-info-circle"></i>' +
          esc(t('ldf.empty', 'No defect links match this filter.'))).show();
        return;
      }
      renderTable();
      $('#btnExport').prop('disabled', false);
      $('#footerInfo').text(t('ldf.generatedOn', 'Generated on') + ': ' + new Date().toLocaleString());
    },
    error: function(xhr) {
      $('#loadingBox').hide();
      showState((xhr.responseJSON || {}).code || 'error');
      toast(t('ldf.toastError', 'Error loading data'), true);
    }
  });
}
function statusBadge(st) {
  return '<span class="badge badge-' + esc(st) + '">' +
    esc(t('ldf.status_' + st, st)) + '</span>';
}
function renderTable() {
  $('#reportArea').html('<div class="section"><div class="section-head">' +
    '<i class="fa fa-bug"></i> ' + esc(t('ldf.tableTitle', 'Defects linked to executions')) +
    '<span class="bmeta">' + esc(t('ldf.rowCount', 'Defects')) + ': ' + STATE.rows.length +
    '</span></div><div class="section-body"><table id="dtResults" class="flat" style="width:100%"></table></div></div>');
  STATE.dt = $('#dtResults').DataTable({
    data: STATE.rows,
    columns: [
      { title: t('ldf.colBug', 'Defect ID'), data: 'bug_id', className: 'bug',
        render: function(data, type) {
          if (type !== 'display') { return data; }
          return '<span class="link" data-bug="' + esc(data) + '">' + esc(data) + '</span>';
        } },
      { title: t('ldf.colLinks', 'Links'), data: 'links' },
      { title: t('ldf.colExecutions', 'Executions'), data: 'executions' },
      { title: t('ldf.colCases', 'Cases'), data: 'cases' },
      { title: t('ldf.colBuilds', 'Builds'), data: 'builds' },
      { title: t('ldf.colPlatforms', 'Platforms'), data: 'platforms' },
      { title: t('ldf.colStatuses', 'Execution results'), data: 'statuses',
        render: function(data, type) {
          if (type !== 'display') { return (data || []).join('|'); }
          return (data || []).map(function(st) { return statusBadge(st); }).join(' ');
        } },
      { title: t('ldf.colVerdict', 'Verdict'), data: 'verdict',
        render: function(data, type) {
          if (type !== 'display') { return data; }
          return '<span class="badge badge-' + esc(data) + '">' +
            esc(t('ldf.verdict_' + data, data)) + '</span>';
        } },
      { title: t('ldf.colLastRun', 'Last linked run'), data: 'last_ts' },
      { title: t('ldf.colSampleCase', 'Example test case'), data: 'sample_case' }
    ],
    order: [[1, 'desc'], [8, 'desc']],
    pageLength: 25,
    language: {
      search: t('common.filter', 'Filter') + ':',
      lengthMenu: t('common.showEntries', 'Show') + ' _MENU_ ' + t('common.entries', 'entries'),
      info: t('common.pageInfo', 'Showing _START_ to _END_ of _TOTAL_ entries'),
      infoEmpty: t('ldf.infoEmpty', 'No entries'),
      zeroRecords: t('ldf.zeroRecords', 'No matching defects'),
      paginate: { previous: t('common.prev', 'Previous'), next: t('common.next', 'Next') },
      emptyTable: t('ldf.empty', 'No defect links match this filter.')
    }
  });
  $('#dtResults').on('click', '.link', function() { showDetails($(this).attr('data-bug')); });
}
function showDetails(bugId) {
  var p = filterParams('detail');
  p.bug_id = bugId;
  $('#detailBody').html('<i class="fa fa-circle-notch"></i> ' +
    esc(t('common.loading', 'Loading...')));
  $('#detailModal').modal('show');
  $.ajax({
    url: '/api/linkeddefects/index.php',
    data: p,
    dataType: 'json',
    success: function(d) {
      if (d.status === 'error') { showState(d.code); $('#detailModal').modal('hide'); return; }
      var links = d.links || [];
      var html = '<div class="detail-meta">' + esc(t('ldf.detailSubtitle', 'Defect')) +
        ': <b>' + esc(bugId) + '</b> &mdash; ' + links.length + ' ' +
        esc(t('ldf.kpiLinks', 'Bug links')).toLowerCase() + '</div>';
      if (!links.length) {
        html += '<div class="empty">' + esc(t('ldf.empty', 'No defect links match this filter.')) + '</div>';
      } else {
        html += '<table class="flat"><thead><tr>' +
          '<th>' + esc(t('ldf.colSampleCase', 'Example test case')) + '</th>' +
          '<th>' + esc(t('ldf.colBuild', 'Build')) + '</th>' +
          '<th>' + esc(t('ldf.platform', 'Platform')) + '</th>' +
          '<th>' + esc(t('ldf.status', 'Result')) + '</th>' +
          '<th>' + esc(t('ldf.colRun', 'Run at')) + '</th>' +
          '<th>' + esc(t('ldf.colStep', 'Step')) + '</th>' +
          '</tr></thead><tbody>';
        links.forEach(function(l) {
          html += '<tr><td>' + esc(l.tcase_name) + ' v' + esc(l.version) + '</td>' +
            '<td>' + esc(l.build_name || '-') + '</td>' +
            '<td>' + esc(l.platform_name || '-') + '</td>' +
            '<td>' + statusBadge(l.status) + '</td>' +
            '<td>' + esc(l.execution_ts || '-') + '</td>' +
            '<td>' + esc(l.tcstep_id || '-') + '</td></tr>';
        });
        html += '</tbody></table>';
      }
      $('#detailBody').html(html);
      TLi18n.apply($('#detailBody')[0]);
    },
    error: function(xhr) {
      $('#detailBody').html('<div class="state">' +
        esc((xhr.responseJSON || {}).code || 'error') + '</div>');
    }
  });
}
function csvGuard(v) {
  var s = (v === null || v === undefined) ? '' : String(v);
  if (/^[\s\u0009\u000D\u000A]*[=+\-@]/.test(s)) { s = "'" + s; }
  return '"' + s.replace(/"/g, '""') + '"';
}
function exportCsv() {
  var rows = STATE.dt ? STATE.dt.rows({ search: 'applied' }).data().toArray() : STATE.rows;
  if (!rows.length) { return; }
  var header = [
    t('ldf.colBug', 'Defect ID'), t('ldf.colLinks', 'Links'),
    t('ldf.colExecutions', 'Executions'), t('ldf.colCases', 'Cases'),
    t('ldf.colBuilds', 'Builds'), t('ldf.colPlatforms', 'Platforms'),
    t('ldf.colStatuses', 'Execution results'), t('ldf.colVerdict', 'Verdict'),
    t('ldf.colLastRun', 'Last linked run'), t('ldf.colSampleCase', 'Example test case')
  ];
  var lines = [header.map(csvGuard).join(';')];
  rows.forEach(function(r) {
    lines.push([
      r.bug_id, r.links, r.executions, r.cases, r.builds, r.platforms,
      (r.statuses || []).join('|'), t('ldf.verdict_' + r.verdict, r.verdict),
      r.last_ts, r.sample_case
    ].map(csvGuard).join(';'));
  });
  var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'linked-defects-' + (tplan_id || 0) + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast(t('ldf.toastExported', 'CSV exported'));
}
$(function() {
  $('#btnRefresh').on('click', function() { loadInit(); });
  $('#btnExport').on('click', exportCsv);
  $('#buildFilter, #platformFilter, #statusFilter').on('change', loadReport);
  $('#btnClose').on('click', function() {
    if (window.parent && window.parent !== window) { window.parent.postMessage({ action: 'close' }, '*'); }
    window.close();
  });
  TLi18n.load(function() {
    TLi18n.apply();
    document.title = 'TestLink 2.0.1 - ' + t('ldf.header', 'Test Plan Linked Defects');
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    loadInit();
  });
});
</script>
</body>
</html>
