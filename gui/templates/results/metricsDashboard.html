<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metrics Dashboard</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/rowgroup/1.4.1/css/rowGroup.dataTables.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }

.header {
  background: #4ECDC4; color: #fff; padding: 14px 24px;
  font-size: 20px; font-weight: 700; letter-spacing: 1px;
}
.header span { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }

.toolbar {
  background: #22242a; padding: 14px 24px; display: flex; gap: 20px;
  align-items: center; flex-wrap: wrap;
}
.toolbar label.chk { color: #ccc; font-size: 13px; cursor: pointer; margin: 0; }
.toolbar label.chk input { margin-right: 6px; vertical-align: middle; cursor: pointer; }
.tbtn { background: #2c2f36; color: #ddd; border: 1px solid #3c404a; border-radius: 4px;
  font-size: 12px; padding: 5px 11px; cursor: pointer; display: inline-flex;
  align-items: center; gap: 6px; }
.tbtn:hover { background: #383c45; color: #fff; }
.tbtn.on { background: #4ECDC4; border-color: #4ECDC4; color: #10312f; font-weight: 600; }
.gridbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.gridbar .spacer { flex: 1; }
.filterlabel { color: #666; font-size: 12px; }
.filterlabel select { font-size: 12px; padding: 4px 6px; border: 1px solid #ccc;
  border-radius: 3px; background: #fff; }
.col-filter { width: 100%; min-width: 60px; font-size: 12px; padding: 4px 6px;
  border: 1px solid #ccc; border-radius: 3px; }
table.dataTable tfoot td { background: #f7f9f9; padding: 6px 8px; }
tr.dtrg-group td { background: #e9f5f3; font-weight: 700; color: #2b6f69;
  cursor: pointer; padding: 8px 12px; border-bottom: 1px solid #d2e6e3; font-size: 13px; }
tr.dtrg-group td i { margin-right: 8px; color: #2d8e88; }
tr.dtrg-group td:hover { background: #dcefec; }
tr.dtrg-group .gcount { font-weight: 400; color: #6aa; font-size: 11px; margin-left: 5px; }
.btn-linkish { background: transparent; border: none; color: #4ECDC4; cursor: pointer;
  font-size: 13px; padding: 0; }
.btn-linkish:hover { color: #3dbdb5; text-decoration: underline; }
.direct_link { color: #ccc; font-size: 12px; word-break: break-all; }
.direct_link a { color: #4ECDC4; }

.section { background: #fff; border-radius: 8px; padding: 20px 24px; margin: 20px 24px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.section h2 { margin: 0 0 18px; font-size: 16px; color: #22242a;
  border-bottom: 2px solid #4ECDC4; padding-bottom: 8px; display: inline-block; }

.progress-row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; max-width: 760px; }
.progress-row .lbl { width: 170px; font-size: 13px; color: #333; text-align: right; flex-shrink: 0; }
.progress-track { flex: 1; height: 22px; background: #eee; border-radius: 11px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 11px; min-width: 2px;
  transition: width .4s ease; position: relative; }
.progress-fill span {
  position: absolute; left: 10px; top: 0; line-height: 22px;
  font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap;
}
.progress-count { font-size: 12px; color: #777; flex-shrink: 0; min-width: 90px; }

.table-wrap { padding: 0; }
table.dataTable thead th { background: #22242a !important; color: #fff; font-size: 13px; padding: 10px 14px; }
table.dataTable tbody td { padding: 10px 14px; font-size: 13px; vertical-align: middle; }
.dataTables_wrapper .dataTables_paginate .paginate_button.current {
  background: #4ECDC4 !important; color: #fff !important; border: none !important;
}

.tplan-cell b { color: #22242a; }
.tplan-subline { font-size: 11px; color: #888; margin-top: 4px; line-height: 1.6; }

.minibar { height: 16px; background: #eee; border-radius: 8px; overflow: hidden;
  position: relative; min-width: 80px; }
.minibar .fill { height: 100%; background: #4ECDC4; border-radius: 8px; min-width: 2px; }
.minibar span { position: absolute; left: 8px; top: 0; line-height: 16px;
  font-size: 10px; font-weight: 700; color: #333; }

.user_feedback {
  margin: 30px 24px; background: #fcf8e3; color: #8a6d3b; border: 1px solid #faebcc;
  border-radius: 6px; padding: 18px 24px; font-size: 14px;
}
.error_feedback {
  margin: 30px 24px; background: #f2dede; color: #a94442; border: 1px solid #ebccd1;
  border-radius: 6px; padding: 18px 24px; font-size: 14px;
}
.note { color: #888; font-style: italic; font-size: 12px; margin-top: 12px; }
.footer {
  padding: 12px 24px; color: #888; font-size: 12px;
  border-top: 1px solid #ddd; background: #fff; margin-top: 20px;
}
</style>
</head>
<body>

<div class="header"><span data-i18n="header.metricsDashboard">Metrics Dashboard</span> <span data-i18n="header.metricsDashboardSub">execution progress overview</span><div id="localeSwitcher" style="float:right;"></div></div>

<div class="toolbar">
  <label class="chk">
    <input type="checkbox" id="showOnlyActive" checked>
    <span data-i18n="md.showOnlyActive">Show only active test plans</span>
  </label>
  <button class="btn-linkish" id="btnDirectLink"><i class="fa fa-link"></i> <span data-i18n="md.directLink">Public link</span></button>
  <div class="direct_link" id="directLinkBox" style="display:none"></div>
</div>

<div id="warningBox" class="user_feedback" style="display:none"></div>
<div id="errorBox" class="error_feedback" style="display:none"></div>
<div id="content" style="display:none">

  <div class="section">
    <h2 data-i18n="md.projectProgress">Test Project Progress</h2>
    <div id="projectMetrics"></div>
    <p class="note" data-i18n="md.infoProgress">Progress is relative to the number of active test cases linked to the test plans.</p>
  </div>

  <div class="section">
    <h2 data-i18n="md.testPlanProgress">Test Plan Progress</h2>
    <div class="gridbar" id="gridBar" style="display:none">
      <button class="tbtn" id="btnExpandAll" type="button"><i class="fa fa-plus-square"></i> <span data-i18n="md.btnExpandAll">Expand all groups</span></button>
      <button class="tbtn" id="btnCollapseAll" type="button"><i class="fa fa-minus-square"></i> <span data-i18n="md.btnCollapseAll">Collapse all groups</span></button>
      <button class="tbtn" id="btnShowCols" type="button"><i class="fa fa-columns"></i> <span data-i18n="md.btnShowAllColumns">Show all columns</span></button>
      <button class="tbtn" id="btnResetFilters" type="button"><i class="fa fa-filter-circle-xmark"></i> <span data-i18n="md.btnResetFilters">Reset Filters</span></button>
      <button class="tbtn" id="btnDefaultState" type="button"><i class="fa fa-rotate-left"></i> <span data-i18n="md.btnDefaultState">Reset to default state</span></button>
      <button class="tbtn" id="btnRefreshGrid" type="button"><i class="fa fa-rotate"></i> <span data-i18n="md.btnRefresh">Refresh</span></button>
      <span class="spacer"></span>
      <span class="filterlabel"><label for="platformFilter" data-i18n="md.filterPlatform">Platform</label>
        <select id="platformFilter"></select></span>
    </div>
    <div class="table-wrap">
      <table id="plansTable" class="display" style="width:100%">
        <thead></thead>
        <tfoot id="plansFoot"></tfoot>
        <tbody></tbody>
      </table>
    </div>
    <p class="note" data-i18n="md.infoTable">Only active builds are taken into account.</p>
  </div>

</div>

<div class="footer" id="footerText"></div>
<div class="footer"><span data-i18n="footers.metricsDashboard">TestLink 2.0.1 - Metrics Dashboard</span></div>
<div class="toast" id="toast" style="position:fixed;right:20px;bottom:20px;background:#22242a;color:#fff;padding:10px 16px;border-radius:5px;font-size:13px;display:none;z-index:9999;"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap.min.js"></script>
<script src="https://cdn.datatables.net/rowgroup/1.4.1/js/dataTables.rowGroup.min.js"></script>
<script>
var API = '/api/metrics/index.php';
var qs = new URLSearchParams(window.location.search);
var tproject_id = qs.get('tproject_id') || '';
var PUBKEY = qs.get('apikey') || ''; // public share-link apikey (Refs #1541)
var table = null;
var STATUS_COLORS = {
  not_run: '#8f8f8f', passed: '#5cb85c',
  failed: '#e6605e', blocked: '#f0ad4e'
};
var STATUS_KEYS = {
  not_run: 'md.statusNotRun', passed: 'md.statusPassed',
  failed: 'md.statusFailed', blocked: 'md.statusBlocked'
};
var dashboard = null;
var collapsedGroups = {};   // Refs #1018: group name -> true when collapsed
var grouped = false;        // legacy: grouping only when platforms are shown
var platColIdx = -1;        // column index of the Platform column (list filter)
var defaultOrder = null;    // remembered so "Reset to default state" can restore it
var qtyColumnIdx = [];      // indices of the qty columns (hidden by default)
var colSearchableIdx = [];  // per column: does it take a filter input?

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg, isErr) {
  var $t = $('#toast').text(msg).toggleClass('err', !!isErr).show();
  clearTimeout($t.data('mdtm'));
  $t.data('mdtm', setTimeout(function () { $t.hide(); }, 3500));
}

$(function() {
  TLi18n.load(function() {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    $('#showOnlyActive').on('change', function() {
      loadDashboard($('#showOnlyActive').is(':checked') ? 1 : 0);
    });
    $('#btnDirectLink').on('click', function() {
      $('#directLinkBox').toggle();
    });
    loadRightsAndDashboard();
  });
});

function statusLabel(key) {
  if (STATUS_KEYS[key]) return TLi18n.t(STATUS_KEYS[key]);
  return key.charAt(0).toUpperCase() + key.slice(1);
}
function statusColor(key) { return STATUS_COLORS[key] || '#ccc'; }

// legacy lib/results/metricsDashboard.php:50-72 — when the config flag
// $tlCfg->metrics_dashboard->show_test_plan_status is on, the test-plan cell
// lists every exec status of the status set as "Label: qty [pct%]" and then
// appends the overall progress, all joined by ", ". Quantities and percentages
// come from the PLAN-level `overall` block (the BFF repeats it on every
// platform row of the same plan, legacy metricsDashboard.php:58-60) and the
// denominator is overall.active, rounded with config dashboard_precision
// (legacy getPercentage(), metricsDashboard.php:302-306). The status set is
// taken from the BFF `status_set` so it stays config driven, like the legacy
// $statusSetForDisplay loop.
// legacy getPercentage() (metricsDashboard.php:302-306): round($qty/$active*100, $precision),
// PHP rounds half AWAY FROM ZERO. Doing that with a JS float is not always possible:
// 23/160*100 is 14.374999999999998 in IEEE-754, so both Math.round(x*100)/100 and
// toFixed(2) report 14.37 where PHP reports 14.38 (10 of 80600 reachable
// qty/active pairs, exact ties only). The value is a rational, so round it as one.
function roundPct(qty, active, precision) {
  if (active <= 0) { return 0; }
  if (typeof BigInt === 'function') {
    var den = BigInt(active);
    var scale = 10n ** BigInt(precision);
    var num = BigInt(qty) * 100n * scale;             // value = num/den units of 1/scale %
    return Number((2n * num + den) / (2n * den)) / Number(scale);  // ties away from zero
  }
  return Math.round(((qty / active) * 100) * Math.pow(10, precision)) / Math.pow(10, precision);
}

function planStatusBreakdown(r, overall) {
  var precision = (typeof r.precision === 'number') ? r.precision : 2;
  var active = (typeof overall.active === 'number') ? overall.active : 0;
  var progress = (typeof overall.progress !== 'undefined') ? overall.progress : 0;
  var st = overall.statuses || {};
  var parts = [];
  $.each(r.status_set || [], function (i, k) {
    var qty = Number(st[k]) || 0;
    parts.push(TLi18n.t('md.statusBreakdownItem',
      { label: statusLabel(k), qty: qty, pct: roundPct(qty, active, precision) }));
  });
  parts.push(TLi18n.t('md.overallProgressItem', { label: TLi18n.t('md.overallProgress'), pct: progress }));
  return parts.join(', ');
}

function showMsg(sel, key) {
  $(sel).text(TLi18n.t(key)).show();
  $('#content').hide();
}

function loadRightsAndDashboard() {
  var u = API + '/meta/rights' + (PUBKEY ? '?apikey=' + encodeURIComponent(PUBKEY) : '');
  $.getJSON(u, function(r) {
    if (!r.canView) {
      showMsg('#errorBox', 'md.msg.noRights');
      return;
    }
    loadDashboard(null);
  }).fail(function() {
    showMsg('#errorBox', 'common.error');
  });
}

function loadDashboard(showOnlyActive) {
  var p = [];
  if (tproject_id) p.push('tproject_id=' + tproject_id);
  if (PUBKEY) p.push('apikey=' + encodeURIComponent(PUBKEY));
  if (showOnlyActive !== null) p.push('show_only_active=' + showOnlyActive);
  $.getJSON(API + '/dashboard' + (p.length ? '?' + p.join('&') : ''), function(r) {
    if (r.status !== 'ok') {
      showMsg('#errorBox', 'common.error');
      return;
    }
    dashboard = r;
    $('#showOnlyActive').prop('checked', !!r.show_only_active);
    $('#directLinkBox').html('<a href="' + r.direct_link + '" target="_blank">' + r.direct_link + '</a>');
    if (r.warning) {
      showMsg('#warningBox', 'md.noTestPlans');
      $('#footerText').text('');
      return;
    }
    $('#warningBox').hide();
    $('#errorBox').hide();
    $('#content').show();
    renderProjectMetrics(r);
    renderTable(r);
    $('#footerText').text(TLi18n.t('common.generatedOn') + ' ' + r.generated_on);
  }).fail(function(xhr) {
    var key = 'common.error';
    if (xhr.status === 403) { key = 'md.msg.noRights'; }
    else if (xhr.status === 400) { key = 'md.msg.noProject'; }
    showMsg('#errorBox', key);
  });
}

function renderProjectMetrics(r) {
  var total = computeTotals(r);
  var active = total.active;
  var html = '';
  $.each(r.project_metrics, function(i, m) {
    var isExecuted = m.key === 'executed';
    var lbl = isExecuted ? TLi18n.t('md.overallProgress')
                         : statusLabel(m.key) ;
    if (isExecuted) lbl += ' (' + TLi18n.t('md.progressAbsolute') + ')';
    var qty = isExecuted ? total.executed : (total[m.key] || 0);
    var color = isExecuted ? '#4ECDC4' : statusColor(m.key);
    html += '<div class="progress-row">'
         +   '<div class="lbl">' + lbl + '</div>'
         +   '<div class="progress-track"><div class="progress-fill" style="width:' + m.value + '%;background:' + color + ';">'
         +     '<span>' + m.value + '%</span></div></div>'
         +   '<div class="progress-count">[' + qty + '/' + active + ']</div>'
         + '</div>';
  });
  $('#projectMetrics').html(html);
}

function computeTotals(r) {
  var t = { active: 0, executed: 0 };
  $.each(r.status_set, function(i, k) { t[k] = 0; });
  $.each(r.testplans, function(i, row) {
    t.active += row.active;
    t.executed += row.executed;
    $.each(row.statuses || {}, function(k, s) { t[k] = (t[k] || 0) + s.qty; });
    if (row.overall && row.platform_name === null) {
      // no-platform rows already carry statuses in overall
      $.each(row.overall.statuses || {}, function(k, q) { t[k] = (t[k] || 0) + q; });
    }
  });
  return t;
}

// Refs #1018 - legacy Ext.Table parity for the Test Plan Progress grid:
//   * grouped by test plan with a "Test Plan: <name> - Overall Progress: X% (N Items)"
//     group header (lib/results/metricsDashboard.php:50-70 + exttable.class.php:585-592
//     groupTextTpl '<text> ({n} Item[s])'),
//   * the grouped column hidden in the child rows (exttable.class.php:55
//     hideGroupedColumn = true),
//   * the qty column of every status hidden by default
//     (lib/results/metricsDashboard.php:333 `'hidden' => true`) and revealed by
//     "Show all columns" (exttable.class.php:109),
//   * sorted by progress DESC (metricsDashboard.php:110-111), group asc first so
//     groups stay contiguous,
//   * per-column filters in a tfoot row + a platform *list* filter
//     (metricsDashboard.php:320-321 `'filter' => 'list', 'filterOptions' => $platforms`),
//   * expand/collapse groups, reset filters, reset to default state
//     (exttable.class.php:104,109,114,124).
// The RowGroup plugin is loaded from the same CDN as the already modernized
// sibling screen gui/templates/results/tplanWithCF.html:107.
function renderTable(r) {
  if (table) { table.destroy(); $('#plansTable tbody').empty(); $('#plansFoot').empty(); }
  $('#platformFilter').empty();

  grouped = !!r.show_platforms;
  platColIdx = -1;
  collapsedGroups = {};

  // Plan-level overall block: api/metrics/index.php repeats it on every platform
  // row of the same plan, so the group header needs no extra endpoint.
  var planOverall = {};
  $.each(r.testplans || [], function (i, row) {
    if (row.overall && typeof row.overall.progress !== 'undefined' && !planOverall[row.tplan_name]) {
      planOverall[row.tplan_name] = row.overall;
    }
  });

  var rows = (r.testplans || []).map(function (row) {
    var planHtml = '<div class="tplan-cell"><b>' + $('<div>').text(row.tplan_name).html() + '</b>';
    if (r.show_test_plan_status && row.overall) {
      planHtml += '<div class="tplan-subline">' +
        esc(planStatusBreakdown(r, row.overall)) + '</div>';
    }
    planHtml += '</div>';

    var st = {};
    $.each(r.status_set, function (i, k) {
      st[k] = (row.statuses && row.statuses[k]) ? row.statuses[k] :
              ((row.overall && row.overall.statuses && typeof row.overall.statuses[k] !== 'undefined') ?
                { qty: row.overall.statuses[k],
                  pct: row.active > 0 ? Math.round(row.overall.statuses[k] / row.active * 100 * 100) / 100 : 0 } :
                { qty: 0, pct: 0 });
    });
    var pct = (typeof row.progress !== 'undefined') ? row.progress : (row.overall ? row.overall.progress : 0);

    return {
      group: row.tplan_name,
      plan: planHtml,
      plat: row.platform_name === null ? '' : String(row.platform_name),
      active: row.active,
      st: st,
      progress: pct
    };
  });

  // Column titles are computed here so the tfoot filter row and the
  // reset-to-default button can identify the qty columns by title.
  var titlePlan = TLi18n.t('md.testPlan');
  var titlePlat = TLi18n.t('md.platform');
  var titleActive = TLi18n.t('md.activeTCs');
  var titleProgress = TLi18n.t('md.progress');
  var qtyCols = [];   // indices of the (default hidden) qty columns
  var colSearchable = [];  // mirrors columns[].searchable (Progress % is false)

  var cols = [];
  // Grouped column: legacy hides it in the child rows (hideGroupedColumn = true)
  // and shows the plan name in the group header instead.
  cols.push({ title: titlePlan, data: 'plan', type: 'html', visible: !grouped });
  if (r.show_platforms) {
    platColIdx = cols.length;
    cols.push({
      title: titlePlat, data: 'plat', type: 'string',
      render: function (d, type) {
        if (!d) { return type === 'display' ? TLi18n.t('md.notApplicable') : ''; }
        return type === 'display' ? $('<div>').text(d).html() : d;
      }
    });
  }
  cols.push({ title: titleActive, data: 'active', type: 'num' });
  $.each(r.status_set, function (i, k) {
    var key = k;
    // qty column: hidden by default, as in legacy 'hidden' => true
    qtyCols.push(cols.length);
    cols.push({ title: statusLabel(k), data: null, type: 'num', visible: false,
      render: function (d, type, row) { return row.st[key] ? row.st[key].qty : 0; } });
    cols.push({ title: statusLabel(k) + ' %', data: null, type: 'num',
      render: function (d, type, row) { return row.st[key] ? row.st[key].pct : 0; } });
  });
  var progressCol = cols.length;
  cols.push({ title: titleProgress, data: null, orderable: false, searchable: false,
    render: function (d, type, row) {
      if (type !== 'display') { return row.progress; }
      return '<div class="minibar"><div class="fill" style="width:' + row.progress + '%"></div>' +
             '<span>' + row.progress + '%</span></div>';
    } });

  colSearchable = cols.map(function (c) { return c.searchable !== false; });

  var opt = {
    data: rows,
    columns: cols,
    pageLength: 25,
    language: { search: TLi18n.t('common.search'), searchPlaceholder: TLi18n.t('common.search') }
  };

  if (grouped) {
    opt.rowGroup = {
      dataSrc: 'group',
      startRender: function (rowsInGroup, group) {
        var isCollapsed = !!collapsedGroups[group];
        rowsInGroup.nodes().each(function (n) { n.style.display = isCollapsed ? 'none' : ''; });
        var n = rowsInGroup.count();
        // exttable.class.php:589 - groupTextTpl:
        // '{text} ({[values.rs.length]} {[values.rs.length > 1 ? "Items" : "Item"]})'
        var cnt = (n > 1 ? TLi18n.t('md.groupItems') : TLi18n.t('md.groupItem')).replace('{count}', n);
        var ov = planOverall[group];
        var head = TLi18n.t('md.groupPrefix') + group + ' - ' + TLi18n.t('md.overallProgress') + ': ' +
                   ((ov && typeof ov.progress !== 'undefined') ? ov.progress : 0) + '% ';
        return $('<tr/>').attr('data-key', encodeURIComponent(group))
          .append($('<td/>').append(
            $('<i/>').addClass('fa ' + (isCollapsed ? 'fa-chevron-right' : 'fa-chevron-down')),
            esc(head) + '<span class="gcount">' + esc(cnt) + '</span>'
          ));
      }
    };
    // group asc keeps the groups contiguous; legacy sorts by progress DESC
    opt.order = [[0, 'asc'], [progressCol, 'desc']];
  } else {
    opt.order = [[progressCol, 'desc']];
  }
  defaultOrder = opt.order.slice();
  qtyColumnIdx = qtyCols;
  colSearchableIdx = colSearchable;

  table = $('#plansTable').DataTable(opt);
  buildColumnFilters();
  buildPlatformFilter();
  bindGridToolbar();
  $('#gridBar').show();
  $('#btnExpandAll, #btnCollapseAll').toggle(grouped);
}

// Per-column filters (legacy Ext.grid.GridFilters parity): one input under each
// column header, wired to column(i).search() - lib/results/metricsDashboard.php
// :313-341 declares 'filter' => 'string' / 'numeric' per column.
function buildColumnFilters() {
  var $tfrow = $('<tr/>').appendTo('#plansFoot');
  table.columns().every(function (idx) {
    var $th = $('#plansTable thead th').eq(idx);
    var label = (($th.text() || '').trim() || (idx + 1));
    // no filter input for the non-searchable columns (Progress %)
    if (colSearchableIdx[idx] === false) {
      $('<td/>').appendTo($tfrow);
      return;
    }
    var $input = $('<input type="text" class="col-filter" data-col="' + idx + '" ' +
      'placeholder="' + esc(label) + '" />');
    var $td = $('<td/>').append($input).appendTo($tfrow);
    if (!table.column(idx).visible()) { $td.hide(); }
    $input.on('keyup change', function () {
      table.column(idx).search(this.value).draw();
      updateResetFiltersBtn();
    });
  });
  updateResetFiltersBtn();
}

function anyFilterActive() {
  var any = ($('#platformFilter').val() || '') !== '';
  if (!any) {
    table.columns().every(function () { if (this.search() !== '') { any = true; } });
  }
  return any;
}

function updateResetFiltersBtn() {
  $('#btnResetFilters').toggle(anyFilterActive());
}

function clearAllFilters() {
  table.columns().every(function () { this.search(''); });
  $('#plansFoot .col-filter').val('');
  $('#platformFilter').val('');
  table.draw();
  updateResetFiltersBtn();
}

// Platform list filter (lib/results/metricsDashboard.php:320-321 'filter' => 'list',
// 'filterOptions' => $platforms): a dropdown built from the platform values
// present in the response, plus the "all" entry.
function buildPlatformFilter() {
  var $sel = $('#platformFilter');
  $sel.closest('.filterlabel').toggle(platColIdx >= 0);
  if (platColIdx < 0) { return; }
  var seen = {};
  var values = [];
  table.rows().data().each(function (row) {
    if (row.plat && !seen[row.plat]) { seen[row.plat] = true; values.push(row.plat); }
  });
  values.sort();
  $sel.append($('<option>').val('').text(TLi18n.t('md.filterAllPlatforms')));
  values.forEach(function (v) { $sel.append($('<option>').val(v).text(v)); });
  $sel.off('change.mdpf').on('change.mdpf', function () {
    table.column(platColIdx).search(this.value).draw();
    updateResetFiltersBtn();
  });
}

function bindGridToolbar() {
  $(table.table().container()).off('click.mdgrp').on('click.mdgrp', 'tr.dtrg-group', function () {
    var key = decodeURIComponent($(this).attr('data-key') || '');
    collapsedGroups[key] = !collapsedGroups[key];
    table.draw(false);
  });

  $('#btnExpandAll').off('click').on('click', function () {
    collapsedGroups = {};
    table.draw(false);
  });
  $('#btnCollapseAll').off('click').on('click', function () {
    table.rows().data().each(function (row) { collapsedGroups[row.group] = true; });
    table.draw(false);
  });
  // "Show all columns" (exttable.class.php:109): reveals the qty columns that
  // getColumnsDefinition() marks 'hidden' => true. The grouped column stays
  // hidden - exttable.class.php:55 hideGroupedColumn = true is independent of it.
  $('#btnShowCols').off('click').on('click', function () {
    table.columns().visible(true);
    if (grouped) { table.column(0).visible(false); }
    $('#plansFoot td').show();
    if (grouped) { $(table.column(0).footer()).hide(); }
    table.draw(false);
    $(this).addClass('on');
  });
  $('#btnResetFilters').off('click').on('click', function () {
    clearAllFilters();
    toast(TLi18n.t('md.filtersCleared'), false);
  });
  // "Reset to default settings" (exttable.class.php:114).
  $('#btnDefaultState').off('click').on('click', function () {
    table.columns().visible(true);
    qtyColumnIdx.forEach(function (idx) {
      table.column(idx).visible(false);
      if (table.column(idx).footer()) { $(table.column(idx).footer()).hide(); }
    });
    if (grouped) { table.column(0).visible(false); }
    $('#btnShowCols').removeClass('on');
    clearAllFilters();
    table.order(defaultOrder).draw(false);
    collapsedGroups = {};
    table.draw(false);
    toast(TLi18n.t('md.defaultStateRestored'), false);
  });
  $('#btnRefreshGrid').off('click').on('click', function () {
    loadDashboard($('#showOnlyActive').is(':checked') ? 1 : 0);
  });
}
</script>
</body>
