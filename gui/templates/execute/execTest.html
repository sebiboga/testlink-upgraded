<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span.sub { font-size: 13px; font-weight: 400; opacity: .85; margin-left: 12px; }
.header .ctxbadge { background: rgba(255,255,255,.2); border-radius: 4px; padding: 2px 10px; font-size: 14px; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.toolbar label { color:#aaa; font-size: 12px; margin-right: 5px; }
.toolbar select, .toolbar input { height: 32px; font-size: 13px; border-radius: 4px; border: 1px solid #555; background: #31343c; color: #eee; padding: 0 8px; }
.toolbar input::placeholder { color: #888; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }

.btn-dark:hover { background: #4a4e59; }
.layout { display: flex; gap: 16px; align-items: flex-start; margin: 16px 24px; }
.left-pane { flex: 1 1 46%; min-width: 380px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
.right-pane { flex: 1 1 54%; min-width: 420px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.pane-head { padding: 12px 18px; border-bottom: 1px solid #eee; font-size: 15px; font-weight: 700; color: #22242a; display:flex; align-items:center; }
.pane-head .count { font-weight: 400; color: #888; font-size: 13px; margin-left: 6px; }
table.tc-list { width: 100%; border-collapse: collapse; }
table.tc-list thead th { background: #22242a; color: #fff; font-size: 12.5px; padding: 9px 12px; text-align: left; position: sticky; top: 0; }
table.tc-list tbody td { padding: 7px 12px; font-size: 13px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
table.tc-list tbody tr { cursor: pointer; }

table.tc-list tbody tr.selected { background: #d9f3f1; box-shadow: inset 3px 0 0 #4ECDC4; }
.ext-id { font-weight: 700; color: #22242a; white-space: nowrap; }
.suite-path { display:block; color: #999; font-size: 11px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge-status { display: inline-block; border-radius: 10px; padding: 3px 10px; font-size: 11.5px; font-weight: 600; color: #fff; text-transform: uppercase; white-space: nowrap; }

.st-blocked { background: #e67e22; } .st-notrun { background: #95a5a6; } .st-other { background: #7f8c8d; }

.form-body { padding: 16px 20px 20px; }
.form-title { font-size: 17px; font-weight: 700; color: #22242a; margin-bottom: 2px; }
.form-meta { color: #888; font-size: 12.5px; margin-bottom: 12px; }
.form-meta i { color: #4ECDC4; margin-right: 4px; }
.desc-block { margin-bottom: 12px; }
.desc-label { font-size: 11px; font-weight: 700; color: #22242a; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
.desc-box { border: 1px solid #eee; border-radius: 6px; background: #fafafa; padding: 8px 12px; font-size: 13px; color: #333; white-space: pre-wrap; }
.exec-cf-block .cf-inputs { border: 1px solid #eee; border-radius: 6px; background: #fafafa; padding: 8px 12px; font-size: 13px; color: #333; }
.exec-cf-block table { border-collapse: collapse; margin: 0; }
.exec-cf-block table tr td { padding: 4px 8px 4px 0; vertical-align: middle; }
.exec-cf-block td.labelHolder { font-weight: 600; color: #22242a; font-size: 12.5px; white-space: nowrap; }
.exec-cf-block input[type=text], .exec-cf-block input[type=checkbox], .exec-cf-block select, .exec-cf-block textarea { font-size: 13px; }
.status-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 14px; }
.st-btn { border: 2px solid transparent; border-radius: 5px; color: #fff; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; opacity: .55; }
.st-btn.active { opacity: 1; border-color: #22242a; box-shadow: 0 0 0 2px rgba(78,205,196,.45); }
.st-btn.n { background: #95a5a6; } .st-btn.p { background: #2ecc71; }
.st-btn.f { background: #e6605e; } .st-btn.b { background: #e67e22; }
.st-btn.x { background: #7f8c8d; } .st-btn.u { background: #34495e; }
textarea.form-control { min-height: 74px; font-size: 13px; }
label.flbl { font-size: 12px; font-weight: 600; color: #444; display: block; margin-bottom: 4px; }
.steps-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
.steps-table th { background: #f5f5f5; color: #444; font-size: 11.5px; text-transform: uppercase; letter-spacing:.4px; padding: 7px 8px; text-align:left; border-bottom: 2px solid #eee; }
.steps-table td { padding: 7px 8px; border-bottom: 1px solid #f0f0f0; font-size: 12.5px; vertical-align: top; }
.steps-table .step-actions, .steps-table .step-expected { white-space: pre-wrap; }
.steps-table select, .steps-table input[type=text] { width: 100%; font-size: 12.5px; height: 30px; border: 1px solid #ddd; border-radius: 4px; padding: 2px 6px; }

.hist-head .count { font-weight: 400; color: #888; font-size: 12px; margin-left: 6px; }
.hist-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
.hist-table thead th { background: #f0f0f0; color: #444; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; padding: 7px 8px; text-align: left; border-bottom: 2px solid #ddd; }
.hist-table tbody td { padding: 7px 8px; border-bottom: 1px solid #f0f0f0; font-size: 12.5px; vertical-align: middle; }
.hist-table .icon-cell { white-space: nowrap; text-align: center; }
.icon-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 6px; color: #4ECDC4; }

.icon-btn.dark { color: #888; } .icon-btn.dark:hover { color: #444; }

.linked-bugs-card .card-ttl { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid #eceef2; font-size: 14px; font-weight: 700; color: #22242a; }

.linked-bugs-card table.bugs-table { margin: 0; width: 100%; }
.linked-bugs-card table.bugs-table thead th { background: #22242a; color: #fff; font-size: 12px; padding: 8px 12px; text-align: left; }
.linked-bugs-card table.bugs-table tbody td { font-size: 13px; padding: 8px 12px; vertical-align: middle; border-top: 1px solid #f0f1f5; }

.bugs-table .bug-id-link { font-weight: 700; color: #25b6d2; text-decoration: none; white-space: nowrap; }
.bugs-table .bug-id-link:hover { text-decoration: underline; }
.bugs-table .bug-title { color: #333; }
.bugs-table .badge { display: inline-block; padding: 3px 9px; border-radius: 3px; font-size: 11px; font-weight: 700; color: #fff; margin: 1px 3px 1px 0; }
.bugs-table .status-badge { color: #fff; white-space: nowrap; }
.bugs-table .label-badge { background: #6c757d; }
.bugs-table .bug-steps { color: #555; }
.bugs-table .none-text { color: #999; font-style: italic; }
.dataTables_wrapper .dataTables_paginate .paginate_button.current { background: #4ECDC4 !important; color: #fff !important; border: none !important; }
.linkbug-target { font-size: 13px; color: #555; margin-top: 4px; }
.linkbug-target b { color: #22242a; }
.bug-mode-toggle { display: flex; gap: 6px; margin: 8px 0 14px; }
.bug-mode-btn { flex: 1; padding: 8px 10px; font-size: 13px; border: 1px solid #d8dce3; border-radius: 5px; background: #f4f6f9; color: #555; cursor: pointer; text-align: center; }
.bug-mode-btn.active { background: #25b6d2; border-color: #1fa0b9; color: #fff; }
#bugModeCreate label, #bugModeLink label { display: block; font-size: 12.5px; font-weight: 600; color: #444; margin: 10px 0 4px; }
.ro-banner { margin: 12px 24px 0; background: #fff8e1; border: 1px solid #ffe08a; color: #8a6d1a; border-radius: 6px; padding: 10px 14px; font-size: 13px; display: none; }
.warnbox { margin: 12px 24px 0; background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; border-radius: 6px; padding: 10px 14px; font-size: 13px; display: none; }
.errorbox { margin: 24px; background: #fff; border-left: 5px solid #e6605e; border-radius: 8px; padding: 26px; text-align: center; color: #888; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); display: none; }
.loading { margin: 40px auto; text-align: center; color: #888; font-size: 14px; }
.none-text { color: #999; font-style: italic; font-size: 13px; }
.empty-form { padding: 40px; text-align: center; color: #aaa; font-size: 14px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 4px; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.toast.err { background: #e6605e; }
@media (max-width: 1100px) { .layout { flex-direction: column; } .left-pane, .right-pane { width: 100%; min-width: 0; } }
</style>

<body>

</div>

<div class="toolbar" id="toolbar" style="display:none;">
  <span><label for="selBuild" data-i18n="exe.build">Build</label></span>

  <span><label for="selStatusFilter" data-i18n="exe.statusFilter">Result</label></span>

  <button class="btn-teal" id="btnExport" onclick="openExport()"><i class="fa fa-download"></i> <span data-i18n="exe.export">Export</span></button>
</div>

<div class="ro-banner" id="roBanner"></div>
<div class="warnbox" id="warnBox"></div>
<div class="errorbox" id="errorBox"></div>
<div class="loading" id="loadingBox"><i class="fa fa-spinner fa-spin"></i> <span data-i18n="exe.loading">Loading execution context...</span></div>

<div class="layout" id="layout" style="display:none;">
  <div class="left-pane">
    <div class="pane-head"><i class="fas fa-list-check" style="color:#4ECDC4;margin-right:8px;"></i>
      <span data-i18n="exe.testCases">Test Cases</span><span class="count" id="caseCount"></span></div>
    <div style="max-height: 70vh; overflow-y:auto;">
      <table class="tc-list">
        <thead>
          <tr>
            <th data-i18n="exe.colTestCase">Test Case</th>

            <th style="width:110px;" data-i18n="exe.colStatus">Status</th>

        <tbody id="tcRows"></tbody>
      </table>
    </div>
    <div style="padding:10px 16px;border-top:1px solid #f0f0f0;">

     binds the bug to a step when tcstep_id > 0, case-level otherwise -->

  <div class="modal-dialog" role="document">

        <h5 class="modal-title"><i class="fas fa-bug" style="color:#e6605e;margin-right:6px;"></i>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.10.25/js/jquery.dataTables.min.js"></script>

<script>
var API = '/api/execute/index.php';
var ctx = {
  tprojectId: parseInt(new URLSearchParams(window.location.search).get('tproject_id') || '0', 10),
  tplanId: parseInt(new URLSearchParams(window.location.search).get('tplan_id') || '0', 10)
};
var initData = null;
var listItems = [];
var current = null; // selected case details
var roMode = false;

$(function () {
  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    boot();
  });
});

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg, isErr) {
  var $t = $('#toast').text(msg).toggleClass('err', !!isErr).show();
  clearTimeout($t.data('tm'));
  $t.data('tm', setTimeout(function(){ $t.hide(); }, 3500));
}

function showError(msg) {
  $('#loadingBox').hide();
  $('#layout').hide();
  $('#errorBox').html('<i class="fa fa-triangle-exclamation" style="color:#e6605e;font-size:22px;"></i><br>' + esc(msg)).show();
}

function apiErr(xhr, fallbackKey) {
  var msg = TLi18n.t(fallbackKey);
  try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
  return msg;
}

function boot() {
  if (!(ctx.tplanId > 0)) {
    showError(TLi18n.t('exe.selectPlanHint'));
    return;
  }
  $.get(API + '?action=init&tplan_id=' + ctx.tplanId + '&tproject_id=' + ctx.tprojectId)
    .done(function (r) {
      if (r.status !== 'ok') { showError(r.message || TLi18n.t('exe.errInit')); return; }
      initData = r;
      roMode = !r.grants.can_execute;
      document.title = r.tplan.name + ' - ' + TLi18n.t('exe.header');
      $('#planBadge').text(r.tplan.name);
      $('#projName').text(r.tproject.name);
      fillToolbar();
      $('#toolbar').show();
      $('#layout').show();
      $('#loadingBox').hide();
      if (!r.grants.can_execute && r.grants.ro_access) {
        $('#roBanner').html('<i class="fa fa-eye"></i> ' + esc(TLi18n.t('exe.readOnly'))).show();
      }
      loadList();
    })
    .fail(function (xhr) { showError(apiErr(xhr, 'exe.errInit')); });
}

function fillToolbar() {
  var $b = $('#selBuild').empty();
  (initData.builds || []).forEach(function (b) {
    var lbl = b.name + (b.executable ? '' : (' (' + TLi18n.t('exe.closedBuild') + ')'));
    $b.append('<option value="' + b.id + '"' + (b.id === initData.default_build_id ? ' selected' : '')
      + '>' + esc(lbl) + '</option>');
  });

  var plats = initData.platforms || [];
  if (plats.length > 0) {
    var $p = $('#selPlatform').empty();
    plats.forEach(function (pl) {
      $p.append('<option value="' + pl.id + '">' + esc(pl.name) + '</option>');
    });
    $('#platWrap').add('#selPlatform').show();
  }

  var $sf = $('#selStatusFilter');
  $sf.append('<option value=""></option>');
  $sf.append('<option value="__none">' + esc(TLi18n.t('exe.neverExecuted')) + '</option>');
  (initData.statuses || []).forEach(function (st) {
    if (st.suffix === 'all' || st.code === 'n') return;
    $sf.append('<option value="' + esc(st.code) + '">' + esc(st.label) + '</option>');
  });

  $('#selBuild').on('change', function () { resetSelection(); loadList(); });
  $('#selPlatform').on('change', function () { resetSelection(); loadList(); });
  $('#selStatusFilter').on('change', function () { renderList(); });
  $('#txtSearch').on('input', debounce(renderList, 250));
}

function debounce(fn, ms) {
  var tm;
  return function () { clearTimeout(tm); tm = setTimeout(fn, ms); };
}

function curBuildId() { return parseInt($('#selBuild').val() || '0', 10); }
function curPlatformId() {
  var v = $('#selPlatform').val();
  return v ? parseInt(v, 10) : -1; // -1 => plan without platforms (stored as 0)
}

// BUGID 3421 - Export all test cases in the current set (modernized
// execExport.php popup, Refs #1024): exports the currently visible set.
function openExport() {
  var ids = (visibleItems() || []).map(function (it) { return it.tcversion_id; });
  if (ids.length === 0) { toast(TLi18n.t('exe.errExportNoData'), true); return; }
  var url = '/gui/templates/execute/execExport.html?tproject_id=' + ctx.tprojectId
    + '&tplan_id=' + ctx.tplanId
    + '&build_id=' + curBuildId()
    + '&platform_id=' + Math.max(0, curPlatformId())
    + '&tsuite_id=0'
    + '&tcversionSet=' + encodeURIComponent(ids.join(','));
  window.open(url, '_blank', 'width=860,height=680');
}

function resetSelection() {
  current = null;
  $('#formBody').hide().empty();
  $('#formEmpty').show();
}

function loadList() {
  $('#warnBox').hide();
  var url = API + '?action=tcList&tplan_id=' + ctx.tplanId
    + '&build_id=' + curBuildId()
    + '&platform_id=' + curPlatformId()
    + '&q=' + encodeURIComponent($('#txtSearch').val() || '');
  $.get(url)
    .done(function (r) {
      if (r.status !== 'ok') { toast(r.message || TLi18n.t('exe.errList'), true); return; }
      listItems = r.items || [];
      renderList();
    })
    .fail(function (xhr) { toast(apiErr(xhr, 'exe.errList'), true); });
}

function statusBadgeClass(code, suffix) {
  switch (suffix || '') {
    case 'passed': return 'st-passed';
    case 'failed': return 'st-failed';
    case 'blocked': return 'st-blocked';
    case 'not_run': return 'st-notrun';
  }
  return 'st-other';
}

function itemStatus(it) {
  return it.last_execution ? it.last_execution.status : null;
}

function statusLabelFor(code) {
  var sts = (initData && initData.statuses) || [];
  for (var i = 0; i < sts.length; i++) {
    if (sts[i].code === code) return sts[i];
  }
  return null;
}

function renderBadge(code) {
  if (!code) {
    return '<span class="badge-status st-notrun">' + esc(TLi18n.t('exe.neverExecutedShort')) + '</span>';
  }
  var st = statusLabelFor(code);
  var suffix = st ? st.suffix : '';
  return '<span class="badge-status ' + statusBadgeClass(code, suffix) + '">'
    + esc(st ? st.label : code) + '</span>';
}

function renderList() {
  var visible = visibleItems();

  var h = '';
  visible.forEach(function (it) {
    var sel = current && current.version && current.tcase.id === it.tcase_id ? ' class="selected"' : '';
    h += '<tr data-tcid="' + it.tcase_id + '" data-tcvid="' + it.tcversion_id + '"' + sel + '>';
    h += '<td><span class="ext-id">' + esc(it.full_external_id) + '</span>'
      + ' <span style="font-weight:600;">' + esc(it.tcase_name) + '</span> '
      + '<span style="color:#bbb;font-size:11px;">v' + it.version + '</span>';
    if (it.tsuite_path) h += '<span class="suite-path" title="' + esc(it.tsuite_path) + '">' + esc(it.tsuite_path) + '</span>';
    h += '</td>';
    h += '<td><span class="last-exec">'
      + (it.last_execution ? esc(fmtTs(it.last_execution.execution_ts)) : '-')
      + '</span></td>';
    h += '<td>' + renderBadge(itemStatus(it)) + '</td>';
    h += '</tr>';
  });

  $('#tcRows').html(h);
  $('#caseCount').text('(' + visible.length + ')');
  $('#listEmpty').toggle(visible.length === 0);

  $('#tcRows tr').off('click').on('click', function () {
    openCase(parseInt($(this).data('tcid'), 10), parseInt($(this).data('tcvid'), 10));
  });
}

// items of listItems matching the current search text + result filter
// (same predicate renderList() uses, so navigation follows what the user sees)
function visibleItems() {
  var q = ($('#txtSearch').val() || '').toLowerCase();
  var sf = $('#selStatusFilter').val();

  return listItems.filter(function (it) {
    if (q !== ''
      && (it.tcase_name + ' ' + it.full_external_id + ' ' + (it.tsuite_path || ''))
          .toLowerCase().indexOf(q) === -1) return false;
    if (sf) {
      var code = itemStatus(it);
      if (sf === '__none') { if (code) return false; }
      else if (code !== sf) return false;
    }
    return true;
  });
}

// save-and-move navigation mode surfaced by the BFF init payload
// ('unlimited' default, 'limited' => only within the current suite)
function saveAndMoveMode() {
  return (initData && initData.save_and_move) || 'unlimited';
}

// successor of the currently open case inside the visible (filtered) list.
// 'unlimited' (: whole visible list) wraps cyclically; 'limited' wraps
// only among the members of the SAME test suite (the modern flat-list
// equivalent of legacy execSetResults getTestCaseNextSibling). Grouping
// uses the displayed suite path (each direct suite owns a distinct path).
function execNextTarget() {
  if (!current || !current.tcase) return null;
  var vis = visibleItems();
  if (vis.length === 0) return null;
  var idx = -1;
  for (var i = 0; i < vis.length; i++) {
    if (vis[i].tcase_id === current.tcase.id) { idx = i; break; }
  }
  if (idx === -1) return vis[0]; // current is filtered out -> head of list
  if (saveAndMoveMode() === 'limited') {
    var suite = vis[idx].tsuite_path;
    var members = [];
    for (var j = 0; j < vis.length; j++) {
      if (vis[j].tsuite_path === suite) members.push(vis[j]);
    }
    var mi = members.indexOf(vis[idx]);
    return members[(mi + 1) % members.length];
  }
  return vis[(idx + 1) % vis.length];
}

// legacy "move2next" (execSetResults.php:617): navigate WITHOUT saving
function moveToNext() {
  if (roMode) return;
  var target = execNextTarget();
  if (!target) { toast(TLi18n.t('exe.noNextCase'), true); return; }
  openCase(target.tcase_id, target.tcversion_id);
}

function fmtTs(ts) {
  return String(ts == null ? '' : ts).substring(0, 16);
}

function importanceLabel(imp) {
  if (imp >= 3) return 'exe.importanceHigh';
  if (imp <= 1) return 'exe.importanceLow';
  return 'exe.importanceMedium';
}

function listItemByCaseId(tcaseId) {
  for (var i = 0; i < listItems.length; i++) {
    if (listItems[i].tcase_id === tcaseId) return listItems[i];
  }
  return null;
}

function openCase(tcaseId, tcversionId) {
  $('#tcRows tr').removeClass('selected');
  $.get(API + '?action=tcDetails&tplan_id=' + ctx.tplanId
      + '&tproject_id=' + ctx.tprojectId
      + '&tcase_id=' + tcaseId + '&tcversion_id=' + tcversionId
      + '&build_id=' + curBuildId() + '&platform_id=' + curPlatformId())
    .done(function (r) {
      if (r.status !== 'ok') { toast(r.message || TLi18n.t('exe.errDetails'), true); return; }
      current = r;
      ctx.plan_apikey = r.plan_apikey || '';
      // the Linked Bugs card is filled from the SLOW live-ITS enrichment
      // (?action=tcLinkedBugs, async) so the form paints immediately
      var it = listItemByCaseId(tcaseId);
      current.versions = (it && it.versions) || [];
      renderForm();
      $('#tcRows tr[data-tcid="' + tcaseId + '"]').addClass('selected');
      if ((r.linked_bug_ids || []).length > 0) {
        loadLinkedBugs(tcaseId);
      }
    })
    .fail(function (xhr) { toast(apiErr(xhr, 'exe.errDetails'), true); });
}

function switchVersion() {
  if (roMode) return;
  var target = parseInt($('#selVersion').val(), 10);
  if (!target || target === current.version.id) return;
  if (!window.confirm(TLi18n.t('exe.confirmSwitchVersion'))) return;
  openCase(current.tcase.id, target);
}

// status buttons follow the configured vocabulary (like legacy), with
// Not Run first, then the usual order; 'all' is a filter pseudo-code only
function statusCodesForForm() {
  var codes = [];
  ((initData && initData.statuses) || []).forEach(function (st) {
    if (st.suffix !== 'all') codes.push(st.code);
  });
  var pref = ['n', 'p', 'f', 'b'];
  codes.sort(function (a, b) {
    var ia = pref.indexOf(a), ib = pref.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
  return codes;
}

// Attachments management block for the Execute Tests form (Refs #792):
//  - upload file input (multiple) -> stored on the new execution at save time
// ---- linked-bug display helpers -----------------------------------------
// The latest execution's linked bugs (each with its tcstep_id / step_number,
// fed by the BFF details + history payloads). Steps shown on the form are the
// version's tcsteps, so matching by tcstep_id tells us which step owns a bug.

function latestExec() {
  var eh = current.exec_history || [];
  return eh.length ? eh[0] : null;
}

function bugsForLatest() {
  var le = latestExec();
  return (le && le.bugs) ? le.bugs : [];
}

function bugBadgeHtml(bug) {
  var label = '#' + bug.id;
  var step = (bug.step_number > 0)
    ? '<span class="bug-step">' + esc(TLi18n.t('exe.bugOnStepShort', { n: bug.step_number })) + '</span>'
    : '';
  var icon = '<i class="fas fa-bug" style="margin-right:3px;"></i>';
  var title = (bug.step_number > 0)
    ? esc(TLi18n.t('exe.bugLinkedToStep', { id: bug.id, n: bug.step_number }))
    : esc(TLi18n.t('exe.bugLinkedTo', { id: bug.id }));
  if (bug.bug_url) {
    return '<a class="bug-badge" target="_blank" rel="noopener" href="' + esc(bug.bug_url)
      + '" title="' + title + '">' + icon + esc(label) + step + '</a>';
  }
  return '<span class="bug-badge" title="' + title + '">' + icon + esc(label) + step + '</span>';
}

// bugs attached to a given tcstep (by id) on the latest execution
function bugsForStep(tcstepId) {
  var b = bugsForLatest();
  return b.filter(function (bug) { return bug.tcstep_id === tcstepId; });
}

// Linked-bugs table (Dashboard-style): every unique bug linked across this
// test case's executions, enriched live with title / labels / status / url
// from the linked issue tracker (BFF tcLinkedBugs, loaded async).
function renderLinkedBugsTable() {
  var bugs = current.linked_bugs || [];
  // tcDetails arrives with placeholder rows (id/url only, no live tracker
  // title/status). While those placeholders are pending their async
  // tcLinkedBugs fill, show the loading skeleton instead of an empty card.
  var pending = (bugs.length && !bugs.some(function (b) { return !!b.title || b.unavailable; }));
  if (pending) {
    return '<div class="linked-bugs-card">'
      + '<div class="card-ttl"><i class="fas fa-bug" style="color:#e6605e;"></i>'
      + esc(TLi18n.t('exe.linkedBugsTable'))
      + '<span class="count">(' + bugs.length + ')</span></div>'
      + '<div class="loading-bugs"><i class="fas fa-spinner fa-spin"></i> '
      + esc(TLi18n.t('exe.loadingBugs')) + '</div></div>';
  }
  if (!bugs.length) return '';
  var rows = '';
  bugs.forEach(function (b) {
    var id = b.url
      ? '<a class="bug-id-link" href="' + esc(b.url) + '" target="_blank" rel="noopener"><i class="fas fa-bug" style="margin-right:3px;"></i>#' + esc(b.id) + '</a>'
      : '<span class="bug-id-link"><i class="fas fa-bug" style="margin-right:3px;"></i>#' + esc(b.id) + '</span>';
    var title = b.title ? '<span class="bug-title">' + esc(b.title) + '</span>'
                         : (b.unavailable
                             ? '<span class="none-text">' + esc(TLi18n.t('exe.bugUnavailable')) + '</span>'
                             : '<span class="none-text">&ndash;</span>');
    var labels = (b.labels && b.labels.length)
      ? b.labels.map(function (l) {
          var c = b.label_colors && b.label_colors[l]
            ? '#' + b.label_colors[l]
            : '#6c757d';
          return '<span class="badge label-badge" style="background:' + esc(c) + ';">' + esc(l) + '</span>';
        }).join('')
      : '<span class="none-text">&ndash;</span>';
    var status;
    if (b.unavailable) {
      status = '<span class="badge status-badge" style="background:#8f8f8f;">' + esc(TLi18n.t('exe.bugDeleted')) + '</span>';
    } else if (b.status) {
      status = '<span class="badge status-badge" style="background:' + esc(b.color || '#8f8f8f') + ';">' + esc(b.status) + '</span>';
    } else {
      status = '<span class="none-text">&ndash;</span>';
    }
    var steps = (b.steps && b.steps.length)
      ? b.steps.map(function (n) { return '# ' + n; }).join(', ')
      : '<span class="none-text">&ndash;</span>';
    rows += '<tr><td>' + id + '</td><td>' + title + '</td><td>' + labels
      + '</td><td>' + status + '</td><td class="bug-steps">' + steps + '</td></tr>';
  });
  return '<div class="linked-bugs-card">'
    + '<div class="card-ttl"><i class="fas fa-bug" style="color:#e6605e;"></i>'
    + esc(TLi18n.t('exe.linkedBugsTable'))
    + '<span class="count">(' + bugs.length + ')</span></div>'
    + '<table class="bugs-table display" id="linkedBugsTable"><thead><tr>'
    + '<th>' + esc(TLi18n.t('exe.linkedBugsId')) + '</th>'
    + '<th>' + esc(TLi18n.t('exe.linkedBugsTitle')) + '</th>'
    + '<th>' + esc(TLi18n.t('exe.linkedBugsLabels')) + '</th>'
    + '<th>' + esc(TLi18n.t('exe.linkedBugsStatus')) + '</th>'
    + '<th>' + esc(TLi18n.t('exe.linkedBugsStep')) + '</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

// initialise the DataTable once the form HTML (with the table) is in the DOM
function initLinkedBugsTable() {
  var tNode = $('#linkedBugsTable'); // eslint-disable-line no-undef
  if (!window.jQuery || !$.fn.DataTable || !tNode.length) return;
  if (tNode[0].tagName !== 'TABLE') return; // skeleton/other state: nothing to init
  if ($.fn.DataTable.isDataTable('#linkedBugsTable')) {
    $('#linkedBugsTable').DataTable().destroy();
  }
  $('#linkedBugsTable').DataTable({
    pageLength: 10,
    order: [[0, 'asc']],
    columns: [null, null, null, null, null]
  });
}

// Async fill of the Linked Bugs card: tcDetails arrives WITHOUT the live
// issue-tracker enrichment (one getIssue() round-trip per bug is slow), so
// the form paints instantly and this request completes the card in place.
function loadLinkedBugs(tcaseId) {
  function replaceCard() {
    var card = $('.linked-bugs-card');
    if (card.length) {
      try {
        if ($.fn.DataTable && $.fn.DataTable.isDataTable('#linkedBugsTable')) {
          $('#linkedBugsTable').DataTable().destroy();
        }
      } catch (e) { /* not a DataTable yet */ }
      card.replaceWith(renderLinkedBugsTable());
      initLinkedBugsTable();
    }
  }

  $.get(API + '?action=tcLinkedBugs&tplan_id=' + ctx.tplanId
      + '&tproject_id=' + ctx.tprojectId
      + '&tcase_id=' + tcaseId
      + '&tcversion_id=' + (current.version ? current.version.id : 0)
      + '&build_id=' + curBuildId() + '&platform_id=' + curPlatformId())
    .timeout(30000)
    .done(function (r) {
      if (r.status !== 'ok' || !current.tcase || current.tcase.id !== tcaseId) {
        return;
      }
      current.linked_bugs = r.linked_bugs || [];
      current.linked_bug_ids = current.linked_bugs.map(function (b) { return b.id; });
      // If the tracker was unavailable server-side the bugs arrive with
      // empty titles and unavailable=false which leaves the client in the
      // permanent "Loading…" skeleton (pending === true). Mark them so
      // renderLinkedBugsTable renders a proper table with "Unavailable" labels.
      current.linked_bugs.forEach(function (b) {
        if (!b.title && !b.unavailable) { b.unavailable = true; }
      });
      replaceCard();
    })
    .fail(function () {
      // Transient tracker failure — mark all as unavailable and re-render
      // so the user sees proper "Unavailable" badges instead of a spinner
      // stuck at "Loading linked bugs…" forever.
      if (current.linked_bugs && current.linked_bugs.length) {
        current.linked_bugs.forEach(function (b) { b.unavailable = true; });
        replaceCard();
      }
    });
}

 //  - list of the latest execution's attachments (download links) so the
 //    tester can see what exists on the context before copying it
 //  - "Copy attachments from latest execution" checkbox, shown only when the
 //    configured exec_mode->new_exec == 'latest' (legacy inc_exec_img_controls.tpl:68-73)
 function renderAttachmentsBlock() {
  var h = '';

  // latest execution attachments (read context)
  var atts = (current.prior_execution && current.prior_execution.attachments) || [];
  h += '<div style="margin-top:14px;border:1px solid #eee;border-radius:6px;padding:10px 12px;">';
  h += '<div style="font-size:12px;font-weight:700;color:#22242a;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">'
    + '<i class="fas fa-paperclip" style="color:#4ECDC4;margin-right:6px;"></i>'
    + esc(TLi18n.t('exe.attachments')) + '</div>';

  // copy-from-latest checkbox (legacy copies execution + step attachments)
  if (!roMode && newExecLatestFlag() && current.prior_execution) {
    h += '<label style="font-size:12.5px;font-weight:600;color:#444;display:flex;align-items:center;gap:6px;margin-bottom:8px;cursor:pointer;">'
      + '<input type="checkbox" id="copyAttFromLEXEC">'
      + ' ' + esc(TLi18n.t('exe.copyAttFromLatest')) + '</label>';
  }

  // prior-run attachment list (informational; what a copy would bring over)
  h += '<div style="font-size:11.5px;font-weight:600;color:#888;margin-bottom:4px;">'
    + esc(TLi18n.t('exe.attachments')) + ' (' + esc(TLi18n.t('exe.priorExecution')) + ')</div>';
  if (atts.length === 0) {
    h += '<div class="none-text" style="margin-bottom:8px;">' + esc(TLi18n.t('exe.noAttachments')) + '</div>';
  } else {
    h += '<ul style="list-style:none;margin:0 0 8px;padding:0;">';
    atts.forEach(function (a) {
      var title = a.title || a.file_name;
      h += '<li style="font-size:12.5px;padding:2px 0;">'
        + '<a href="' + esc(a.download_url) + '" target="_blank" title="' + esc(TLi18n.t('exe.download')) + '">'
        + '<i class="fa fa-file" style="color:#4ECDC4;margin-right:6px;"></i>'
        + esc(title) + ' <span style="color:#aaa;font-size:11px;">('
        + (a.file_size ? fmtBytes(a.file_size) : '') + ')</span></a></li>';
    });
    h += '</ul>';
  }

  // upload control for the NEW execution
  if (!roMode) {
    h += '<label class="flbl" style="margin:6px 0 4px;">' + esc(TLi18n.t('exe.attachmentsUpload')) + ':</label>';
    h += '<input type="file" id="uploadedFile" name="uploadedFile" multiple style="font-size:12.5px;">';
    h += '<div class="none-text" style="font-size:11px;font-style:normal;margin-top:3px;">'
      + esc(TLi18n.t('exe.attachmentsTitle')) + '</div>';
  }

  h += '</div>';
  return h;
}

function newExecLatestFlag() {
  return !!(initData && initData.new_exec_latest);
}

function execDurationEnabled() {
  return !!(initData && initData.exec_duration_enabled);
}

function fmtBytes(b) {
  if (!b) return '0 B';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

function renderForm() {
  var v = current.version, tc = current.tcase;
  var prior = current.prior_execution;

  var meta = '<i class="fas fa-hashtag"></i>' + esc(v.full_external_id)
    + ' &nbsp;<i class="fas fa-code-branch"></i>v' + v.number
    + ' &nbsp;<i class="fas fa-signal"></i>' + esc(TLi18n.t(importanceLabel(v.importance)));
  if (v.execution_type === 2) {
    meta += ' &nbsp;<i class="fas fa-robot"></i>' + esc(TLi18n.t('exe.runAuto'));
  }

  var h = '<div class="form-title">' + esc(tc.name) + '</div>';
  h += '<div class="form-meta">' + meta + '</div>';

  // tester assignment of this version (legacy execTCaseHeader.inc.tpl:58-66):
  // no assignee -> warn and (when writable) offer to claim the execution task
  if (!(current.assigned_user || '')) {
    h += '<div class="prior-box" style="border-color:#e5b567;background:#fff8e6;">'
      + '<i class="fas fa-exclamation-triangle" style="color:#d9a514;"></i> '
      + esc(TLi18n.t('exe.noTesterAssigned'))
      + (roMode ? '' :
        ' <label style="font-size:12.5px;font-weight:600;color:#444;display:inline-flex;'
        + 'align-items:center;gap:6px;margin-left:10px;cursor:pointer;">'
        + '<input type="checkbox" id="assignTask"> '
        + esc(TLi18n.t('exe.assignTaskToMe')) + '</label>')
      + '</div>';
  } else {
    h += '<div class="prior-box">'
      + '<i class="fas fa-user" style="color:#4ECDC4;"></i> '
      + esc(TLi18n.t('exe.assignedTo')) + ': <b>' + esc(current.assigned_user) + '</b>'
      + '</div>';
  }

  // version switcher for test cases with more than one linked version
  // (older linked versions stay selectable/executable, #794)
  if (current.versions && current.versions.length > 1) {
    h += '<div style="margin:0 0 12px;">'
      + '<label class="flbl" for="selVersion" style="display:inline-block;margin-right:8px;">'
      + esc(TLi18n.t('exe.version')) + '</label>'
      + '<select id="selVersion"'
      + (roMode ? ' disabled' : '')
      + ' style="height:30px;font-size:12.5px;border:1px solid #ddd;border-radius:4px;padding:2px 6px;width:auto;">';
    current.versions.forEach(function (ver) {
      var vlab = 'v' + ver.version
        + (ver.active ? '' : ' (' + esc(TLi18n.t('exe.inactiveVersion')) + ')');
      h += '<option value="' + ver.tcversion_id + '"'
        + (ver.tcversion_id === v.id ? ' selected' : '') + '>'
        + vlab + '</option>';
    });
    h += '</select>';
    if (!roMode) {
      h += ' <button type="button" class="btn-dark" style="padding:4px 12px;font-size:12px;"'
        + ' onclick="switchVersion()"><i class="fa fa-arrows-rotate"></i> '
        + esc(TLi18n.t('exe.switchVersion')) + '</button>';
    }
    h += '</div>';
  }

  if (prior) {
    var pst = statusLabelFor(prior.status);
    h += '<div class="prior-box"><i class="fas fa-clock-rotate-left"></i> '
      + esc(TLi18n.t('exe.priorExecution')) + ': <b>' + esc(pst ? pst.label : prior.status) + '</b>'
      + ' @ ' + esc(fmtTs(prior.execution_ts))
      + (prior.tester_login ? ' &middot; ' + esc(prior.tester_login) : '')
      + (prior.notes ? '<br>' + esc(prior.notes) : '')
      + '</div>';
  }

  h += renderLinkedBugsTable();

  if (current.exec_history && current.exec_history.length > 0) {
    h += renderHistoryHtml();
  }

  if (v.summary) {
    h += '<div class="desc-block"><div class="desc-label">' + esc(TLi18n.t('exe.summary'))
      + '</div><div class="desc-box">' + esc(v.summary) + '</div></div>';
  }
  if (v.preconditions) {
    h += '<div class="desc-block"><div class="desc-label">' + esc(TLi18n.t('exe.preconditions'))
      + '</div><div class="desc-box">' + esc(v.preconditions) + '</div></div>';
  }

  // execution-time custom fields (Refs #791): the BFF returns the legacy-rendered
  // input HTML (names are 'custom_field_<type>_<id>_<tcaseId>'), matching the
  // contract write_execution() uses to persist the values on save.
  if (current.exec_cfields_html) {
    h += '<div class="desc-block exec-cf-block"><div class="desc-label">'
      + esc(TLi18n.t('exe.customFields')) + '</div>'
      + '<div class="cf-inputs" id="execCFields">' + current.exec_cfields_html + '</div></div>';

// Derive the OVERALL result (Passed/Failed/Blocked) from the per-step statuses:
//  - any step Failed  -> overall Failed
//  - else any step Blocked -> overall Blocked
//  - else every step Passed (or no steps) -> overall Passed
//  - otherwise (some steps Not Run) -> leave overall unspecified (tester decides)
function deriveOverallStatus() {
  if (roMode) return;
  var steps = $('.step-status').map(function () { return this.value; }).get();
  if (steps.length === 0) return;
  var setOverall = function (code) {
    $('.st-btn').removeClass('active');
    $('.st-btn[data-code="' + code + '"]').addClass('active');
  };
  if (steps.indexOf('f') !== -1) { setOverall('f'); return; }
  if (steps.indexOf('b') !== -1) { setOverall('b'); return; }
  if (steps.every(function (v) { return v === 'p'; })) { setOverall('p'); return; }
  $('.st-btn').removeClass('active');
}
// keepPast: true on first render (restore the recorded prior step results,
// like the legacy form), false when the user presses Reset
function resetFormInputs(keepPast) {
  if (roMode) return;
  $('.st-btn').removeClass('active');
  var defCode = current && current.prior_execution
    ? current.prior_execution.status : 'n';
  if (!statusLabelFor(defCode)) defCode = 'n';
  $('.st-btn[data-code="' + defCode + '"]').addClass('active');

  $('#execNotes').val((keepPast && current.prior_execution)
    ? current.prior_execution.notes : '');

  if (execDurationEnabled()) {
    $('#execDuration').val((keepPast && current.prior_execution
      && current.prior_execution.execution_duration)
      ? current.prior_execution.execution_duration : '');
  }

  (current.steps || []).forEach(function (st) {
    var row = $('tr[data-stepid="' + st.id + '"]');
    if (keepPast) {
      var pr = (current.prior_step_results || {})[st.id] || {};
      row.find('.step-status').val(pr.status || 'n');
      row.find('.step-notes').val(pr.notes || '');
    } else {
      row.find('.step-status').val('n');
      row.find('.step-notes').val('');
    }
  });
}

// Validate the execution-time custom fields on the current form before save.
// Mirrors legacy javascript/cfield_validation.js validateCustomFields() plus the
// 'required' flag (cfield_testprojects.required) the BFF returns per field.
// Input names follow 'custom_field_<type>_<id>_<tcaseId>'.
// Returns {ok:true} or {ok:false, message} where message uses the CF label.
function validateExecCustomFields() {
  var cfMeta = {};
  ((current.exec_cfields) || []).forEach(function (cf) { cfMeta[cf.id + ''] = cf; });
  var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var bad = null;
  // checkbox groups: a required checkbox custom field means "at least one box
  // in the group is checked" (HTML5 native `required` behaviour), so we collect
  // groups by input name and validate them once after the loop (Refs #791).
  var cbGroups = {};
  $('#execCFields input, #execCFields select, #execCFields textarea').each(function () {
    var $el = $(this);
    var name = $el.attr('name') || '';
    if (name.indexOf('custom_field_') !== 0) return;
    // name 'custom_field_<type>_<id>_<tcaseId>' splits on '_' into 5 parts
    // ('custom_field' itself contains an underscore): 0=custom 1=field 2=type 3=id 4=tcaseId
    var parts = name.split('_');
    var cfType = parseInt(parts[2], 10);
    var cf = cfMeta[parts[3]];
    var label = cf ? (cf.label || name) : name;
    if ($el.attr('type') === 'checkbox') {
      // multi-checkbox groups share a name ending in '[]'; group by the base
      // name and remember whether any box in the required group is checked
      var baseName = name.replace(/\[\]$/, '');
      if (!cbGroups[baseName]) { cbGroups[baseName] = { required: !!(cf && cf.required), label: label, anyChecked: false }; }
      if ($el.is(':checked')) { cbGroups[baseName].anyChecked = true; }
      return; // checkbox values are free-form; no per-type format check
    }
    var val = $el.is('select')
      ? (($el.attr('multiple') ? ($el.val() || []) : [$el.val() || '']).join('|'))
      : ($el.val() == null ? '' : $el.val());
    var isEmpty = (val === '' || val == null);
    if (cf && cf.required && isEmpty) { bad = { label: label, type: 'req' }; return; }
    if (isEmpty) return;
    if (cfType === 1 && /[^\d]/.test(String(val))) { bad = { label: label, type: 'numeric' }; return; }
    if (cfType === 2 && (isNaN(Number(val)) || /^\s+$/.test(String(val)))) { bad = { label: label, type: 'float' }; return; }
    if (cfType === 4 && !emailRe.test(String(val))) { bad = { label: label, type: 'email' }; return; }
  });
  if (!bad) {
    $.each(cbGroups, function (k, g) {
      if (g.required && !g.anyChecked) { bad = { label: g.label, type: 'req' }; return false; }
    });
  }
  if (bad) {
    if (bad.type === 'req') {
      return { ok: false, message: TLi18n.t('exe.cfRequired', { field: bad.label }) };
    }
    return { ok: false, message: TLi18n.t('exe.cfInvalid', { field: bad.label }) };
  }
  return { ok: true };
}

function renderHistoryHtml() {
  var hist = current.exec_history || [];

    + esc(TLi18n.t('exe.executionHistory'))

    + '<th>' + esc(TLi18n.t('exechist.colDateTimeRun')) + '</th>'

        var attUrl = a.download_url || ('/lib/attachments/attachmentdownload.php?id=' + a.id);
        actions += '<a class="icon-btn" href="' + esc(attUrl) + '" target="_blank" rel="noopener"'
          + ' title="' + esc((a.title || a.file_name)) + '">'
          + '<i class="fas fa-paperclip"></i></a>';

    // direct public link (lnl.php?type=exec&id=N&apikey=) for sharing/email
    if (ctx.plan_apikey) {

    // delete execution (BFF action)
    if (e.can_delete) {
      actions += '<button class="icon-btn danger" title="' + esc(TLi18n.t('exe.deleteExecution'))
        + '" onclick="deleteExecution(' + e.execution_id + ')"><i class="fas fa-trash-can"></i></button>';

      + '<td>' + esc(e.build_name) + (e.build_is_open ? '' : ' <i class="fas fa-lock" title="' + esc(TLi18n.t('exechist.closedBuild')) + '"></i>') + '</td>'
      + '<td>' + esc(e.tester_name || e.tester_login || TLi18n.t('exechist.deletedUser')) + '</td>'
      + '<td><span class="badge-status ' + statusCls + '">' + esc(st ? st.label : e.status_code) + '</span></td>'

// navTo: undefined => stay on the current case after saving (plain Save);
// 'next'  => also move to the next case in the visible list (legacy
// "Save and move to next", execSetResults.php save_and_next flow)
function saveExecution(navTo) {
  if (roMode || !(curBuildId() > 0)) {
    toast(TLi18n.t('exe.errNoBuild'), true);
    return;
  }
  var activeBtn = $('.st-btn.active');
  if (activeBtn.length === 0) {
    toast(TLi18n.t('exe.pickStatusFirst'), true);
    return;
  }
  // execution-time custom fields: validate content + required before saving
  // (mirrors legacy checkCustomFields / validateCustomFields on submit)
  var cfCheck = validateExecCustomFields();
  if (!cfCheck.ok) {
    toast(cfCheck.message, true);
    return;
  }
  var nextTarget = (navTo === 'next') ? execNextTarget() : null;

  // Use FormData (multipart/form-data) so attachment uploads can ride along.
  // Steps are serialized to a JSON string field that the BFF decodes.
  var fd = new FormData();
  fd.append('tplan_id', ctx.tplanId);
  fd.append('tproject_id', ctx.tprojectId);
  fd.append('tcase_id', current.tcase.id);
  fd.append('tcversion_id', current.version.id);
  fd.append('version_number', current.version.number);
  fd.append('build_id', curBuildId());
  fd.append('platform_id', curPlatformId());
  fd.append('status', activeBtn.data('code'));
  fd.append('notes', $('#execNotes').val() || '');
  fd.append('execution_duration',
    (execDurationEnabled() && $('#execDuration').length)
      ? ($('#execDuration').val() || '') : '');
  // execution-time custom field values (Refs #791): read every rendered input
  // (text/numeric/select/textarea/checkbox/date...) under its legacy name.
  $('#execCFields input, #execCFields select, #execCFields textarea').each(function () {
    var $el = $(this);
    var name = $el.attr('name');
    if (!name) return;
    if ($el.attr('type') === 'checkbox') {
      // only checked boxes ride along; PHP folds the '[]' names into an array
      if ($el.is(':checked')) { fd.append(name, $el.val() || 'on'); }
      return;
    }
    if ($el.is('select') && $el.attr('multiple')) {
      ($el.val() || []).forEach(function (v) { fd.append(name, v); });
      return;
    }
    fd.append(name, $el.val() == null ? '' : $el.val());
  });
  var steps = {};
  $('tr[data-stepid]').each(function () {
    var $row = $(this);
    steps[String($row.data('stepid'))] = {
      status: $row.find('.step-status').val(),
      notes: $row.find('.step-notes').val()
    };
  });
  fd.append('steps_json', JSON.stringify(steps));

  // copy attachments from the latest execution (legacy copyAttFromLEXEC)
  var $copy = $('#copyAttFromLEXEC');
  if ($copy.length && $copy.is(':checked')) {
    fd.append('copy_att_from_lexec', '1');
  }

  // claim the execution task for the current user (legacy execSetResults
  // assignTask checkbox, only offered while the version has no tester)
  var $asg = $('#assignTask');
  if ($asg.length && $asg.is(':checked')) {
    fd.append('assign_task', '1');
  }

  // attachment file upload(s) for the new execution. The field is named
  // 'exec_attachments[]' (NOT 'uploadedFile') on purpose: the legacy
  // write_execution() treats 'uploadedFile' as its own nested upload
  // (exec.inc.php:206-216) and would var_dump-pollute the JSON response;
  // the BFF save handles this dedicated field itself. The '[]' suffix makes
  // PHP build an array ($_FILES) when multiple files are appended.
  var $file = $('#uploadedFile');
  if ($file.length && $file[0].files && $file[0].files.length > 0) {
    for (var f = 0; f < $file[0].files.length; f++) {
      fd.append('exec_attachments[]', $file[0].files[f]);
    }
  }

  var $btn = $('.save-row .btn-teal').prop('disabled', true);
  $.ajax({
    url: API + '?action=save',
    method: 'POST',
    processData: false,
    contentType: false,
    headers: { 'X-Requested-With': 'XMLHttpRequest' },
    data: fd
  })
  .done(function (r) {
    if (r.status === 'ok' && r.saved) {
      toast(TLi18n.t('exe.savedOk'));
      // the execution WAS saved, but file(s) picked for upload were all
      // rejected by the attachments whitelist (ext/name) - must NOT look
      // like a silent success, see execTestIssueViewUrl()/attachments
      if (r.attachments_rejected) {
        toast(TLi18n.t('exe.attachmentsRejected'), true);
      }
      loadList();
      // save-and-move: land on the successor (wrap-around) like legacy
      if (nextTarget) {
        openCase(nextTarget.tcase_id, nextTarget.tcversion_id);
      }
    } else if (r.status === 'ok' && r.reason === 'not_run') {
      toast(TLi18n.t('exe.notRunInfo'), true);
      // legacy execSetResults.php:241 navigates on save_and_next even
      // when nothing was persisted (not_run selected); mirror that
      if (nextTarget) openCase(nextTarget.tcase_id, nextTarget.tcversion_id);
    } else {
      toast(r.message || TLi18n.t('exe.errSave'), true);
    }
  })
  .fail(function (xhr) { toast(apiErr(xhr, 'exe.errSave'), true); })
  .always(function () { $btn.prop('disabled', false); });
}

// legacy "Save steps partial execution": persists the current step results
// into execution_tcsteps_wip WITHOUT writing an executions row, so the run
// can be resumed later from where it was left (saveStepsPartialExec, #795).
function savePartialSteps() {
  if (roMode || !(curBuildId() > 0)) {
    toast(TLi18n.t('exe.errNoBuild'), true);
    return;
  }
  // the legacy flow blocks a partial save with nothing recorded
  // (checkStepsHaveContent + partialExecNothingToSave)
  var anyContent = false;
  $('tr[data-stepid]').each(function () {
    var $row = $(this);
    if ($row.find('.step-notes').val()
      || ($row.find('.step-status').val()
          && $row.find('.step-status').val() !== 'n')) {
      anyContent = true;
    }
  });
  if (!anyContent) {
    toast(TLi18n.t('exe.partialExecNothingToSave'), true);
    return;
  }

  var payload = {
    tplan_id: ctx.tplanId,
    tcversion_id: current.version.id,
    build_id: curBuildId(),
    platform_id: curPlatformId(),
    steps: {}
  };
  $('tr[data-stepid]').each(function () {
    var $row = $(this);
    payload.steps[String($row.data('stepid'))] = {
      status: $row.find('.step-status').val(),
      notes: $row.find('.step-notes').val()
    };
  });

  var $btn = $('#savePartialBtn').prop('disabled', true);
  $.ajax({
    url: API + '?action=savePartialSteps',
    method: 'POST',
    contentType: 'application/json',
    headers: { 'X-Requested-With': 'XMLHttpRequest' },
    data: JSON.stringify(payload)
  })
  .done(function (r) {
    if (r.status === 'ok' && r.saved) {
      toast(TLi18n.t('exe.partialExecSaved'));
      // reload the form so the saved WIP rows pre-fill the step selects
      // (resume later), same as legacy getStepsPartialExec on open
      openCase(current.tcase.id, current.version.id);
    } else {
      toast(r.message || TLi18n.t('exe.errSave'), true);
    }
  })
  .fail(function (xhr) { toast(apiErr(xhr, 'exe.errSave'), true); })
  .always(function () { $btn.prop('disabled', false); });
}

// Re-derive the overall PASS/FAIL/BLOCKED whenever a step status changes
$(document).on('change', '.step-status', deriveOverallStatus);

// Link Bug to Execution helpers (legacy bugAdd.php?user_action=link):
// openLinkBug(stepId, stepNumber) — stepId 0 => case-level, otherwise binds
// the bug to that tcsteps row. A saved execution is required (an execution_id
// exists in current.prior_execution); the BFF enforces plan membership,
// testplan_execute right and open build.
function openLinkBug(stepId, stepNumber) {
  var execId = current && current.prior_execution
    ? current.prior_execution.execution_id : 0;
  if (!execId) {
    toast(TLi18n.t('exe.linkBugSaveFirst'), true);
    return;
  }
  window._linkBug = { execId: execId, stepId: stepId, stepNumber: stepNumber };
  var target = '';
  if (stepId > 0) {
    target = ' ' + TLi18n.t('exe.linkBugOnStep', { n: stepNumber }) + ' (' + execId + ')';
  }
  $('#linkBugTarget').html('Execution <b>' + esc(execId) + '</b>' + target);
  setBugMode('link');
  $('#linkBugId').val('');
  $('#bugCreateSummary').val('');
  $('#bugCreateDescription').val('');
  $('#linkBugModal').modal('show');
  setTimeout(function () { $('#linkBugId').focus(); }, 250);
}

// Switch the link-bug modal between "link existing issue" and "create new issue"
// modes (legacy bugAdd.php supports both user_action=link and =create/doCreate).
function setBugMode(mode) {
  window._linkBugMode = (mode === 'create') ? 'create' : 'link';
  var isCreate = window._linkBugMode === 'create';
  $('#modeLinkBtn').toggleClass('active', !isCreate);
  $('#modeCreateBtn').toggleClass('active', isCreate);
  $('#bugModeLink').toggle(!isCreate);
  $('#bugModeCreate').toggle(isCreate);
  $('#btnLinkBug').toggle(!isCreate);
  $('#btnCreateBug').toggle(isCreate);
}

function doLinkBug() {
  var tgt = window._linkBug;
  if (!tgt) { return; }
  var bugId = $.trim($('#linkBugId').val());
  if (bugId === '') { toast(TLi18n.t('exe.bugIdRequired'), true); return; }
  var $btn = $('#btnLinkBug').prop('disabled', true);
  $.ajax({
    url: API + '?action=linkBug',
    method: 'POST',
    contentType: 'application/json',
    headers: { 'X-Requested-With': 'XMLHttpRequest' },
    data: JSON.stringify({
      tplan_id: ctx.tplanId,
      execution_id: tgt.execId,
      bug_id: bugId,
      tcstep_id: tgt.stepId
    })
  })
  .done(function (r) {
    if (r.status === 'ok' && r.linked) {
      $('#linkBugModal').modal('hide');
      toast(TLi18n.t('exe.linkBugDone', { id: bugId }));
      // refresh so the newly linked bug shows in the execution history
      openCase(current.tcase.id, current.version.id);
    } else {
      toast(r.message || TLi18n.t('exe.errLinkBug'), true);
    }
  })
  .fail(function (xhr) { toast(apiErr(xhr, 'exe.errLinkBug'), true); })
  .always(function () { $btn.prop('disabled', false); });
}

// Create a brand-new issue on the configured tracker (GitHub) from TestLink and
// link it to the execution — legacy bugAdd.php?user_action=doCreate. The BFF
// calls its->addIssue() (creating the issue) and then write_execution_bug().
function doCreateBug() {
  var tgt = window._linkBug;
  if (!tgt) { return; }
  var summary = $.trim($('#bugCreateSummary').val());
  if (summary === '') { toast(TLi18n.t('exe.bugSummaryRequired'), true); return; }
  var description = $.trim($('#bugCreateDescription').val());
  var $btn = $('#btnCreateBug').prop('disabled', true);
  $.ajax({
    url: API + '?action=createBug',
    method: 'POST',
    contentType: 'application/json',
    headers: { 'X-Requested-With': 'XMLHttpRequest' },
    data: JSON.stringify({
      tplan_id: ctx.tplanId,
      execution_id: tgt.execId,
      tcstep_id: tgt.stepId,
      bug_summary: summary,
      bug_description: description
    })
  })
  .done(function (r) {
    if (r.status === 'ok' && r.created) {
      $('#linkBugModal').modal('hide');
      toast(TLi18n.t('exe.createBugDone', { id: r.bug_id }));
      // refresh so the newly created bug shows in the execution history
      openCase(current.tcase.id, current.version.id);
    } else {
      toast(r.message || TLi18n.t('exe.errCreateBug'), true);
    }
  })
  .fail(function (xhr) { toast(apiErr(xhr, 'exe.errCreateBug'), true); })
  .always(function () { $btn.prop('disabled', false); });
}
</script>
