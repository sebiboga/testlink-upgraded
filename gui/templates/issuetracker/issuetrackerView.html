<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Trackers</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/third_party/chosen/chosen.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 12px; align-items: center; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-red { background: #e6605e; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-red:hover { background: #d04e4c; }
.table-wrap { padding: 20px 24px; }
.table-wrap table { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); width: 100%; }
table.dataTable thead th { background: #22242a; color: #fff; font-size: 13px; padding: 10px 14px; }
table.dataTable tbody td { padding: 10px 14px; font-size: 13px; }
.badge-active { background: #4ECDC4; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.badge-inactive { background: #e6605e; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; }
.badge-env-ok { background: #3a9c5c; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; cursor: default; }
.badge-env-ko { background: #e6605e; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; cursor: default; }
.action-btn { cursor: pointer; color: #4ECDC4; margin-right: 8px; font-size: 14px; }
.action-btn:hover { color: #2d8e88; }
.action-btn.danger { color: #e6605e; }
.action-btn.danger:hover { color: #d04e4c; }
.action-btn.disabled { color: #ccc; cursor: not-allowed; }
.dataTables_wrapper .dataTables_paginate .paginate_button.current { background: #4ECDC4 !important; color: #fff !important; border: none !important; }
.modal-content { border-radius: 8px; }
.modal-header { background: #22242a; color: #fff; border-radius: 8px 8px 0 0; }
.modal-header .close { color: #fff; opacity: .8; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; }
</style>
</head>
<body>

<div class="header"><span data-i18n="header.issueTrackers">Issue Trackers</span> <span data-i18n="header.issueTrackersSub" style="font-size:13px;font-weight:400;opacity:.8;margin-left:12px;">manage issue tracker integrations</span><span id="localeSwitcher" style="float:right;"></span></div>

<div class="toolbar">
  <button class="btn-teal" id="btnCreate" onclick="showCreateModal()"><i class="fa fa-plus"></i> <span data-i18n="it.createTracker">Create Issue Tracker</span></button>
  <button class="btn-teal" id="btnGithub" onclick="githubOAuthStart()" style="display:inline-flex;align-items:center;gap:6px;"><i class="fa-brands fa-github"></i> <span data-i18n="it.github">GitHub</span></button>
  <span style="flex:1"></span>
  <span id="footerInfo" style="color:#aaa;font-size:12px;"></span>
</div>

<div class="table-wrap">
  <table id="trackersTable" class="display" style="width:100%">
    <thead>
      <tr>
        <th data-i18n="it.name">Name</th>
        <th data-i18n="it.type">Type</th>
        <th data-i18n="it.serverUrl">Server URL</th>
        <th data-i18n="it.environment">Environment</th>
        <th data-i18n="it.active">Active</th>
        <th id="thActions" style="width:100px" data-i18n="common.actions">Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div class="footer" id="footerText"></div>
<div class="footer"><span data-i18n="footers.issuetrackerView">TestLink 2.0.1 - Issue Trackers</span></div>

<div class="modal fade" id="trackerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Create Issue Tracker</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editTrackerId">
        <div class="form-group" style="margin-bottom:12px;">
          <label style="font-size:12px;font-weight:600;" data-i18n="it.name">Name *</label>
          <a href="javascript:void(0)" id="btnUsedBy" onclick="toggleUsedBy()" style="margin-left:6px;color:#4ECDC4;" title="" data-i18n-title="it.showHideLinkedToProjects"><i class="fas fa-info-circle"></i></a>
          <input type="text" id="editName" class="form-control" maxlength="100" style="font-size:13px;">
        </div>
        <div class="form-group" id="usedByOuter" style="display:none;margin-bottom:12px;">
          <div id="usedByEnvelope" style="font-size:12px;padding:8px 12px;background:#f6f6f6;border-radius:4px;"></div>
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label style="font-size:12px;font-weight:600;" data-i18n="it.type">Type *</label>
          <select id="editType" class="form-control" style="font-size:13px;"></select>
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label style="font-size:12px;font-weight:600;" data-i18n="it.cfg">Configuration (XML)</label>
          <textarea id="editCfg" class="form-control" rows="6" style="font-size:13px;font-family:monospace;" placeholder="<issuetracker>&#10;  &lt;uribase&gt;...&lt;/uribase&gt;&#10;  &lt;apikey&gt;...&lt;/apikey&gt;&#10;&lt;/issuetracker&gt;"></textarea>
        </div>
        <div id="modalError" style="color:#e6605e;font-size:12px;margin-top:8px;display:none;"></div>
        <div id="connAlert" style="display:none;margin-top:8px;font-size:13px;padding:8px 12px;border-radius:4px;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" style="font-size:13px;" data-i18n="common.cancel">Cancel</button>
        <button type="button" id="btnCheckConn" onclick="checkConnectionModal()" style="font-size:13px;background:#fff;color:#4ECDC4;border:1px solid #4ECDC4;padding:7px 14px;border-radius:4px;cursor:pointer;font-weight:600;" data-i18n="it.checkConnection">Check Connection</button>
        <button type="button" class="btn-teal" onclick="saveTracker()" style="font-size:13px;" data-i18n="common.save">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="repoModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="it.chooseRepo">Select GitHub Repository</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size:12px;color:#888;margin-top:0;" data-i18n="it.chooseRepoHelp">Choose the GitHub repository to link as an Issue Tracker. This is only asked the first time.</p>
        <select id="repoSelect" class="chosen-select" data-placeholder="" style="width:100%;font-size:13px;"></select>
        <div id="repoError" style="color:#e6605e;font-size:12px;margin-top:8px;display:none;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" style="font-size:13px;" data-i18n="common.cancel">Cancel</button>
        <button type="button" class="btn-teal" onclick="createGithubTracker()" style="font-size:13px;" data-i18n="common.save">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script src="/third_party/chosen/chosen.jquery.js"></script>
<script>
var API = '/api/issuetracker/index.php';
var table = null;
var typeMap = {};
var allItems = [];
var canManage = false;
// Linked test projects for the currently open modal (issue #964). Populated by
// editTracker(), reset to [] by showCreateModal() (mirrors the legacy
// $gui->testProjectSet being null on create -> 'not used/linked' state).
var usedByProjects = [];

// Legacy issueTrackerView.tpl escaped every displayed value (|escape). Cells
// here go through innerHTML, so HTML-escape cfg-derived and DB-derived text
// (cfg URL, env msg, name, type) before pushing into the DataTables rows, and
// project names before injecting them into the usedBy block.
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

$(function() {
  var p = new URLSearchParams(window.location.search);
  var ctx = 'tproject_id=' + (p.get('tproject_id') || 0) + '&tplan_id=' + (p.get('tplan_id') || 0);
  TLi18n.load(function() {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    loadMeta();
    loadTrackers();
  });
  // Collapse the usedBy block whenever the modal is dismissed, so reopening
  // always starts from the collapsed state (legacy displayUsedBy parity).
  $('#trackerModal').on('hidden.bs.modal', function() {
    $('#usedByOuter').hide();
  });
});

function loadMeta() {
  $.getJSON(API + '/meta/types', function(r) {
    var sel = $('#editType');
    sel.empty();
    var enabled = [];
    $.each(r.items, function(i, t) {
      typeMap[t.code] = t;
      if (t.enabled) enabled.push(t);
    });
    enabled.sort(function(a, b) {
      var order = {'github':1,'gitlab':2,'jira':3,'redmine':4,'bugzilla':5,'mantis':6,'trac':7,'fogbugz':8,'kaiten':9,'gforge':10};
      return (order[a.type]||99) - (order[b.type]||99);
    });
    $.each(enabled, function(i, t) {
      sel.append('<option value="' + t.code + '">' + t.label + '</option>');
    });
  }).fail(function(xhr) {
    showDenied(xhr);
  });
}

// A 403 from the issuetracker BFF means the logged-in user holds neither
// issuetracker_view nor issuetracker_management (legacy checkRights). The
// screen must not render anything actionable: hide the toolbar (create /
// GitHub buttons) and the table, and surface a localized denial message.
function showDenied(xhr) {
  if (xhr.status === 403) {
    $('.toolbar, .table-wrap').hide();
    $('#footerText').text(TLi18n.t('it.msg.noPermission')).css('color', '#e6605e').css('fontWeight', '600');
  }
}

function loadTrackers() {
  $.getJSON(API, function(r) {
    allItems = r.items;
    // Legacy issueTrackerView.tpl gated the Create button, GitHub OAuth entry
    // and every edit/delete icon on `issuetracker_management` ($gui->canManage).
    // Mirror it: canManage comes from the BFF GET / payload.
    canManage = !!r.canManage;
    $('#btnCreate').toggle(canManage);
    $('#btnGithub').toggle(canManage);
    renderTable(allItems);
    $('#footerText').text(TLi18n.t('it.trackersCount', {n: r.total}) + ' | ' + TLi18n.t('common.generatedOn') + ' ' + new Date().toLocaleString());
    checkOAuthConnected();
  }).fail(function(xhr) {
    showDenied(xhr);
  });
}

function renderTable(items) {
  if (table) { table.destroy(); $('#trackersTable tbody').empty(); }
  var rows = [];
  $.each(items, function(i, t) {
    // Tracker cfg templates use different keys for the server URL: most write
    // <uribase> (bugzilla/jira/mantis/fogbugz/gitlab/trac/kaiten/trello/...),
    // while the GitHub template and the GitHub-OAuth flow write <url>. Match
    // BOTH so the cell is never blank (issue #961).
    var cfgUrl = '';
    if (t.cfg) {
      var m = t.cfg.match(/<uribase>(.*?)<\/uribase>/) || t.cfg.match(/<url>(.*?)<\/url>/);
      if (m) cfgUrl = esc(m[1]);
    }
    // Legacy Environment column (issueTrackerView.tpl:16,77) renders the
    // per-tracker $impl::checkEnv() result: OK (green) or the failure msg
    // (red), whatever the implementation returned server-side (env_check_msg).
    var envOk = t.env_check_ok !== false;
    var envMsg = t.env_check_msg ? esc(t.env_check_msg) : '';
    var envHtml = '<span class="' + (envOk ? 'badge-env-ok' : 'badge-env-ko') + '" title="';
    if (envOk) {
      envHtml += (envMsg ? envMsg : TLi18n.t('it.envOk')) + '">' + TLi18n.t('it.envOk') + '</span>';
    } else {
      envHtml += TLi18n.t('it.envKo') + '">' + (envMsg ? envMsg : TLi18n.t('it.envKo')) + '</span>';
    }
    var actions = '';
    if (canManage) {
      // Legacy list wrench (issueTrackerView.tpl:55-58) opens the connection
      // check for the STORED config; the heartbeat/skull result (bts_check_ok /
      // bts_check_ko) is rendered next to the name. Mirror it: a per-row wrench
      // that runs checkConnection(id) and paints the status icon into #conn-<id>.
      var nameCell = '<i class="fa fa-wrench action-btn" title="' + TLi18n.t('it.checkConnection') +
                     '" onclick="checkConnection(' + t.id + ')"></i>' +
                     '<span id="conn-' + t.id + '"></span> ';
      actions += '<i class="fa fa-edit action-btn" title="' + TLi18n.t('common.edit') + '" onclick="editTracker(' + t.id + ')"></i>';
      // Legacy issueTrackerView.tpl:78-83 renders the delete icon ONLY when
      // $item_def.link_count == 0: trackers linked to a test project cannot be
      // deleted (tlIssueTracker::delete() guard). Mirror it — a dead disabled
      // trash icon with the linking test project names as tooltip (the same
      // data the BFF computed via getLinkSet(), issue #963).
      if (t.link_count > 0) {
        var linksList = (t.links && t.links.length) ? t.links.join(', ') : '';
        actions += '<i class="fa fa-trash action-btn danger disabled" title="' +
                   TLi18n.t('it.msg.cannotDeleteLinked') + (linksList ? ': ' + esc(linksList) : '') + '"></i>';
      } else {
        actions += '<i class="fa fa-trash action-btn danger" title="' + TLi18n.t('common.delete') + '" onclick="deleteTracker(' + t.id + ', \'' + (t.name || '').replace(/'/g, "\\'") + '\')"></i>';
      }
    }
    rows.push([
      (canManage ? nameCell : '') + esc(t.name),
      esc(t.typeDescr || t.typeLabel),
      cfgUrl,
      envHtml,
      '<span class="badge-active">Active</span>',
      actions
    ]);
  });
  var cols = [null, null, null, null, null, { orderable: false, searchable: false }];
  if (!canManage) {
    $('#thActions').hide();
    $.each(rows, function(i, r) { r.pop(); });
    cols.pop();
  } else {
    $('#thActions').show();
  }
  table = $('#trackersTable').DataTable({
    data: rows,
    order: [[0, 'asc']],
    pageLength: 25,
    columns: cols
  });
}

function showCreateModal() {
  if (!canManage) return;
  $('#modalTitle').text(TLi18n.t('it.createTracker'));
  $('#editTrackerId').val('');
  $('#editName').val('');
  $('#editType').val($('#editType option:first').val());
  $('#editCfg').val('');
  $('#modalError').hide();
  $('#connAlert').hide().removeClass('alert alert-success alert-danger');
  // Create form has no linked projects yet (legacy: $gui->testProjectSet is
  // null on create) -> toggleUsedBy() renders the 'not used/linked' state.
  usedByProjects = [];
  $('#usedByOuter').hide();
  $('#trackerModal').modal('show');
}

function editTracker(id) {
  if (!canManage) return;
  $.getJSON(API + '/' + id, function(r) {
    var t = r.item;
    $('#modalTitle').text(TLi18n.t('it.editTracker') + ': ' + t.name);
    $('#editTrackerId').val(t.id);
    $('#editName').val(t.name);
    $('#editType').val(t.type);
    $('#editCfg').val(t.cfg || '');
    $('#modalError').hide();
    $('#connAlert').hide().removeClass('alert alert-success alert-danger');
    // Port of the legacy edit form usedBy block (issue #964): BFF GET /{id}
    // now returns the linked test project names (getLinks). Keep them so
    // toggleUsedBy() can render 'used on test project' / 'not used/linked'.
    usedByProjects = (t.links && t.links.length) ? t.links : [];
    $('#usedByOuter').hide();
    $('#trackerModal').modal('show');
  });
}

// Legacy displayUsedBy() (issueTrackerEdit.tpl:73-119): toggles the
// 'Used on Test Project' list next to the Name field; renders the italics
// 'not used/linked' state when the tracker is not linked to any project.
function toggleUsedBy() {
  if (!canManage) return;
  var outer = $('#usedByOuter');
  var envelope = $('#usedByEnvelope');
  if (outer.is(':visible')) {
    outer.hide();
    return;
  }
  var html = '';
  if (usedByProjects && usedByProjects.length) {
    html += '<b>' + TLi18n.t('it.usedOnTestproject') + '</b>';
    $.each(usedByProjects, function(i, name) {
      html += '<br>' + esc(name);
    });
  } else {
    html += '<b><i>' + TLi18n.t('it.notUsedLinked') + '</i></b>';
  }
  envelope.html(html);
  outer.show();
}

function saveTracker() {
  if (!canManage) return;
  var id = $('#editTrackerId').val();
  var data = {
    name: $('#editName').val().trim(),
    type: parseInt($('#editType').val()),
    cfg: $('#editCfg').val()
  };

  if (!data.name) {
    $('#modalError').text(TLi18n.t('it.validation.required')).show();
    return;
  }

  var url = id ? API + '/' + id : API;
  var type = id ? 'PUT' : 'POST';
  $.ajax({
    url: url, type: type,
    contentType: 'application/json', data: JSON.stringify(data),
    success: function() { $('#trackerModal').modal('hide'); loadTrackers(); },
    error: function(xhr) {
      var msg = TLi18n.t('it.msg.errorSave');
      try { msg = JSON.parse(xhr.responseText).message; } catch(e) {}
      $('#modalError').text(msg).show();
    }
  });
}

function deleteTracker(id, name) {
  if (!canManage) return;
  if (!confirm(TLi18n.t('it.msg.confirmDelete') + ' "' + name + '"?')) return;
  $.ajax({
    url: API + '/' + id, type: 'DELETE',
    success: function() { loadTrackers(); },
    error: function(xhr) {
      var msg = TLi18n.t('it.msg.errorDelete');
      try { msg = JSON.parse(xhr.responseText).message; } catch(e) {}
      alert(msg);
    }
  });
}

/* ---- Connection checks (legacy checkConnection / isConnected) ---- */

// Row-level check: runs the STORED tracker config through the BFF
// (mirrors issueTrackerView.php?id=N) and paints heartbeat (ok) / skull (ko).
function checkConnection(id) {
  var holder = $('#conn-' + id);
  holder.html('<i class="fa fa-spinner fa-spin" style="color:#888;margin-right:4px;"></i>');
  $.getJSON(API + '/' + id + '/check-connection', function(r) {
    var icon = r.connected
      ? '<i class="fas fa-heartbeat" style="color:#3a9c5c;margin-right:4px;" title="' + TLi18n.t('it.connOk') + '"></i>'
      : '<i class="fas fa-skull-crossbones" style="color:#e6605e;margin-right:4px;" title="' + TLi18n.t('it.connKo') + '"></i>';
    holder.html(icon);
  }).fail(function() {
    holder.html('<i class="fas fa-skull-crossbones" style="color:#e6605e;margin-right:4px;" title="' + TLi18n.t('it.connCheckFailed') + '"></i>');
  });
}

// Modal-level check: runs the CURRENT (unsaved) form fields through the BFF
// (mirrors the legacy "Check Connection" button, doAction=checkConnection) and
// shows the localized success/danger alert inside the modal.
function checkConnectionModal() {
  var alertEl = $('#connAlert');
  alertEl.hide().removeClass('alert alert-success alert-danger');
  var name = $('#editName').val().trim();
  if (!name) {
    alertEl.text(TLi18n.t('it.validation.required')).addClass('alert alert-danger').show();
    return;
  }
  var btn = $('#btnCheckConn');
  btn.prop('disabled', true);
  $.ajax({
    url: API + '/test-connection',
    type: 'POST',
    contentType: 'application/json',
    data: JSON.stringify({name: name, type: parseInt($('#editType').val()), cfg: $('#editCfg').val()}),
    success: function(r) {
      btn.prop('disabled', false);
      if (r.connected) {
        alertEl.text(TLi18n.t('it.connOk')).addClass('alert alert-success');
      } else {
        alertEl.text(TLi18n.t('it.connKo')).addClass('alert alert-danger');
      }
      alertEl.show();
    },
    error: function(xhr) {
      btn.prop('disabled', false);
      var msg = TLi18n.t('it.connCheckFailed');
      try { msg = JSON.parse(xhr.responseText).message; } catch(e) {}
      alertEl.text(msg).addClass('alert alert-danger').show();
    }
  });
}

/* ---- GitHub OAuth flow ---- */

function githubOAuthStart() {
  if (!canManage) return;
  var ret = window.location.href.split('#')[0];
  $.getJSON(API + '/oauth/start?return=' + encodeURIComponent(ret), function(r) {
    if (r.status === 'ok' && r.url) {
      var popup = window.open(r.url, 'githubOAuth', 'width=1024,height=728');
      if (popup) {
        pollOAuthConnected(popup);
      } else {
        window.location.assign(r.url);
      }
    } else {
      alert(r.message || 'GitHub OAuth not configured');
    }
  }).fail(function(xhr) {
    var msg = 'GitHub OAuth not configured';
    try { msg = JSON.parse(xhr.responseText).message; } catch(e) {}
    alert(msg);
  });
}

function pollOAuthConnected(popup) {
  var tries = 0;
  var timer = window.setInterval(function() {
    tries++;
    if (tries > 120) {
      window.clearInterval(timer);
      return;
    }
    $.getJSON(API + '/oauth/token-status', function(r) {
      if (r.status === 'ok' && r.connected && !r.expired) {
        window.clearInterval(timer);
        try { popup.close(); } catch(e) {}
        checkOAuthConnected();
        showRepoPicker();
      }
    });
  }, 1500);
}

function showRepoPicker() {
  var sel = $('#repoSelect');
  sel.empty();
  $('#repoError').hide();
  $('#repoModal').modal('show');
  if (!sel.data('chosen')) {
    sel.chosen({ width: '100%', disable_search_threshold: 10,
      placeholder_text_single: TLi18n.t('it.searchRepos') });
  }
  sel.append('<option value="">' + TLi18n.t('it.loading') + '</option>');
  sel.trigger('chosen:updated');
  $.getJSON(API + '/oauth/repos', function(r) {
    sel.empty();
    if (!r.repos || !r.repos.length) {
      $('#repoError').text(TLi18n.t('it.noRepos')).show();
      sel.trigger('chosen:updated');
      return;
    }
    $.each(r.repos, function(i, repo) {
      if (!repo.push) return;
      var label = repo.full_name + (repo.private ? ' (' + TLi18n.t('it.private') + ')' : '');
      sel.append('<option value="' + repo.full_name + '">' + label + '</option>');
    });
    sel.trigger('chosen:updated');
    sel.val('').trigger('chosen:updated');
  }).fail(function(xhr) {
    var msg = 'Failed to list repositories';
    try { msg = JSON.parse(xhr.responseText).message; } catch(e) {}
    $('#repoError').text(msg).show();
  });
}

function createGithubTracker(repo) {
  if (!canManage) return;
  var r = repo || $('#repoSelect').val();
  if (!r) {
    $('#repoError').text(TLi18n.t('it.validation.required')).show();
    return;
  }
  var p = new URLSearchParams(window.location.search);
  $.ajax({
    url: API + '/oauth/create',
    type: 'POST',
    contentType: 'application/json',
    data: JSON.stringify({ repo: r, tproject_id: parseInt(p.get('tproject_id') || 0) }),
    success: function() {
      $('#repoModal').modal('hide');
      loadTrackers();
    },
    error: function(xhr) {
      var msg = TLi18n.t('it.msg.errorSave');
      try { msg = JSON.parse(xhr.responseText).message; } catch(e) {}
      $('#repoError').text(msg).show();
    }
  });
}

function checkOAuthConnected() {
  $.getJSON(API + '/oauth/token-status', function(r) {
    if (r.status !== 'ok') return;
    if (!canManage) {
      // View-only users hold no issuetracker_management: never auto-start the
      // GitHub OAuth flow nor open the repo picker for them.
      return;
    }
    if (r.connected && r.expired) {
      githubOAuthStart();
      return;
    }
    var p = new URLSearchParams(window.location.search);
    if (p.get('oauth') === 'connected') {
      // Back from a GitHub login. This is the GLOBAL page where several
      // GitHub trackers may coexist, so always offer the repo picker (even
      // when a repo is already stored in session) and clean the flag so a
      // reload does not re-POST a silent create.
      var u = new URL(window.location.href);
      u.searchParams.delete('oauth');
      try { history.replaceState({}, document.title, u.pathname + u.search); } catch(e) {}
      showRepoPicker();
      return;
    }
    if (r.connected && r.repo) {
      var days = Math.ceil((r.expires_in || 0) / 86400);
      $('#footerInfo').text(TLi18n.t('it.ghConnected', {user: r.user, repo: r.repo, days: days}));
      return;
    }
    if (r.connected) {
      showRepoPicker();
      return;
    }
    $('#footerInfo').text(TLi18n.t('it.ghNotConnected'));
  });
}
</script>
