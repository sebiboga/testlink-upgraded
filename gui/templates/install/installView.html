<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="install.header">Install / Upgrade</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header span { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 12px; align-items: center; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.section-title { padding: 20px 24px 8px 24px; font-size: 16px; font-weight: 700; color: #22242a; }
.cards { padding: 0 24px 10px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 18px 20px; }
.card .icon { font-size: 28px; color: #4ECDC4; margin-bottom: 10px; }
.card .label { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: .5px; }
.card .value { font-size: 20px; font-weight: 700; color: #22242a; margin-top: 2px; word-break: break-all; }
.card .value.small { font-size: 15px; line-height: 1.45; }
.badge { display: inline-block; padding: 3px 12px; border-radius: 20px; color: #fff; font-size: 12px; font-weight: 700; margin-top: 6px; }
.badge.ok { background: #27ae60; }
.badge.upgrade, .badge.manual, .badge.unknown, .badge.undetermined { background: #e74c3c; }
.badge.warn { background: #f39c12; }
.panel { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 0 24px 12px 24px; padding: 16px 20px; }
.panel h4 { margin: 0 0 8px 0; font-size: 14px; font-weight: 700; color: #22242a; }
.panel .msg { font-size: 13px; color: #555; line-height: 1.5; }
.panel ul { margin: 6px 0 0 18px; padding: 0; }
.panel ul li { font-size: 13px; color: #c0392b; margin-bottom: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 14px 24px; }
.action-btn { border: none; padding: 7px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; color: #fff; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.action-btn.teal { background: #4ECDC4; }
.action-btn.teal:hover { background: #3dbdb5; }
.action-btn.blue { background: #3498db; }
.action-btn.blue:hover { background: #2980b9; }
.action-btn.dark { background: #22242a; }
.action-btn.dark:hover { background: #33363f; }
.videos { padding: 0 24px 6px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.video-card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 16px 18px; display: flex; gap: 12px; align-items: flex-start; color: inherit; text-decoration: none; border-left: 4px solid #e74c3c; }
.video-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.14); border-left-color: #4ECDC4; }
.video-card .thumb { width: 74px; height: 44px; flex: 0 0 74px; border-radius: 5px; background: #22242a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 19px; }
.video-card .cap { font-size: 13px; font-weight: 600; color: #22242a; line-height: 1.45; }
.video-card .src { font-size: 11px; color: #999; margin-top: 3px; text-transform: uppercase; letter-spacing: .5px; }
.video-hint { font-size: 12px; color: #888; padding: 0 24px 4px 24px; }
#feedbackMsg { display: none; margin: 14px 24px 0 24px; padding: 10px 16px; border-radius: 6px; font-size: 13px; }
#feedbackMsg.err { display: block; background: #fdeceb; color: #c0392b; border: 1px solid #f5c6c2; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
</style>
</head>
<body>

<div class="header">
  <span data-i18n="install.header">Install / Upgrade</span>
  <span data-i18n="install.headerSub">installation and schema status</span>
  <span id="localeSwitcher" style="float:right;"></span>
</div>

<div class="toolbar">
  <button class="btn-teal" id="refreshBtn"><i class="fa fa-refresh"></i> <span data-i18n="common.refresh">Refresh</span></button>
  <span style="flex:1"></span>
  <span id="footerInfo" style="color:#aaa;font-size:12px;"></span>
</div>

<div id="feedbackMsg"></div>

<div class="section-title"><i class="fa fa-cogs" style="color:#4ECDC4;margin-right:6px;"></i><span data-i18n="install.status">Installation Status</span></div>
<div class="cards" id="statusCards"></div>

<div id="upgradePanel" class="panel" style="display:none;">
  <h4><i class="fa fa-exclamation-triangle" style="color:#e74c3c;margin-right:6px;"></i><span data-i18n="install.upgradeNeeded">Upgrade Required</span></h4>
  <div class="msg" id="upgradeMsg"></div>
  <div class="msg" id="upgradeForum" style="margin-top:8px;"></div>
</div>

<div id="securityPanel" class="panel" style="display:none;">
  <h4><i class="fa fa-shield-alt" style="color:#f39c12;margin-right:6px;"></i><span data-i18n="install.securityNotes">Security Notes</span></h4>
  <ul id="securityList"></ul>
</div>

<div class="section-title"><i class="fa fa-rocket" style="color:#3498db;margin-right:6px;"></i><span data-i18n="install.actions">Actions</span></div>
<div class="actions" id="actions"></div>

<div id="videosSection" class="section-title" style="display:none;"><i class="fa fa-youtube" style="color:#e74c3c;margin-right:6px;"></i><span data-i18n="install.videosTitle">Community Videos</span></div>
<div class="video-hint" id="videosHint" style="display:none;" data-i18n="install.videosHint">Walkthroughs contributed by TestLink users, opened on YouTube.</div>
<div class="videos" id="videos"></div>

<div class="footer" id="footerText"></div>
<div class="footer"><span data-i18n="footers.installView">TestLink 2.0.1 - Installation</span></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/install/index.php';

$(function() {
  TLi18n.load(function() {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    loadStatus();
  });
});

function showFeedback(kind, msg) {
  var el = $('#feedbackMsg');
  el.attr('class', kind).text(msg);
}

$(document).on('click', '#refreshBtn', function() { loadStatus(true); });

function esc(s) {
  return $('<div>').text(s == null ? '' : String(s)).html();
}

// Legacy install/index.php:45 carried the forum reference inside the migration
// notice itself ("... read README file or go to <forum> (Forum: TestLink 1.9.4 and
// greater News, changes, etc)"). The modern upgrade panel owns that notice, so the
// forum sentence is rendered here as a real link, next to the notice message.
function renderForumNotice(r) {
  var forumUrl = r && r.links ? r.links.forum : null;
  var box = $('#upgradeForum').empty();
  if (!forumUrl) { return; }
  forumUrl = String(forumUrl);
  if (!/^https?:\/\//i.test(forumUrl)) { return; }
  box.append(
    $('<a>').attr('href', forumUrl).attr('target', '_blank')
      .attr('rel', 'noopener noreferrer').attr('title', forumUrl)
      .text(TLi18n.t('install.forum'))
  );
  box.append(' ' + esc(TLi18n.t('install.forumHint')));
}

function card(label, value, small) {
  return $('<div class="card">')
    .append('<div class="icon"><i class="fa fa-info-circle"></i></div>')
    .append('<div class="label">' + esc(label) + '</div>')
    .append('<div class="value' + (small ? ' small' : '') + '">' + esc(value) + '</div>');
}

// Attachments repository cards (legacy getSecurityNotes() -> checkForRepositoryDir,
// lib/functions/configCheck.php:275-282 + :368-390). Legacy only evaluated the
// directory for the filesystem repository type, so the dir-state card is replaced
// by an explicit "not checked" note for the DB type instead of inventing a state.
function renderRepositoryCards(grid, r) {
  var repo = (r && r.repository) ? r.repository : null;
  if (!repo) { return; }

  var typeLabel = TLi18n.t(repo.typeCode === 'db' ? 'install.repoTypeDb' : 'install.repoTypeFs');
  grid.append(card(TLi18n.t('install.repository'), typeLabel));

  // Path may be empty (hand-edited config): show a placeholder instead of a
  // sentence with a hole in it.
  var path = repo.path == null || repo.path === '' ? '/' : String(repo.path);
  var badgeCls = 'unknown', badgeKey = 'install.repoDirNotChecked', params = {};
  if (repo.checked) {
    params = { path: path };
    if (repo.status_ok) {
      badgeCls = 'ok';
      badgeKey = 'install.repoDirOk';
    } else if (repo.exists) {
      badgeCls = 'warn';
      badgeKey = 'install.repoDirNotWritable';
    } else {
      badgeCls = 'upgrade';
      badgeKey = 'install.repoDirMissing';
    }
  }
  // TLi18n.t() returns the raw key when a bundle lacks it, so probe has() first.
  var badgeText = TLi18n.has(badgeKey) ? TLi18n.t(badgeKey, params) : path;
  grid.append(
    $('<div class="card">')
      .append('<div class="icon"><i class="fa fa-folder-open"></i></div>')
      .append('<div class="label">' + esc(TLi18n.t('install.repositoryDir')) + '</div>')
      .append('<div class="value small"><span class="badge ' + badgeCls + '">' +
              esc(badgeText) + '</span></div>')
  );
}

function loadStatus(clearFeedback) {
  $.getJSON(API, function(r) {
    if (clearFeedback) showFeedback('', '');
    renderStatus(r);
    $('#footerText').text(TLi18n.t('common.generatedOn') + ' ' + new Date().toLocaleString());
    $('#footerInfo').text('');
  }).fail(function(xhr) {
    var msg = TLi18n.t('common.errorLoading');
    try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e) {}
    showFeedback('err', msg);
  });
}

function renderStatus(r) {
  var grid = $('#statusCards').empty();

  grid.append(card(TLi18n.t('install.appVersion'), r.appVersion || '-'));
  grid.append(card(TLi18n.t('install.latestDbVersion'), r.latestDbVersion || '-'));
  grid.append(card(TLi18n.t('install.dbSchemaVersion'), r.dbSchemaVersion || '-', true));

  var st = r.schemaStatus || 'unknown';
  var stKey = st === 'ok' ? 'install.stateOk' :
              (st === 'upgrade' ? 'install.stateUpgrade' :
              (st === 'manual' ? 'install.stateManual' :
              (st === 'unknown' ? 'install.stateUnknown' : 'install.stateUndetermined')));
  var stCard = $('<div class="card">')
    .append('<div class="icon"><i class="fa fa-database"></i></div>')
    .append('<div class="label">' + TLi18n.t('install.schemaState') + '</div>')
    .append('<div class="value"><span class="badge ' + (st === 'ok' ? 'ok' : st) + '">' + TLi18n.t(stKey) + '</span></div>');
  grid.append(stCard);

  var cfgCard = card(TLi18n.t('install.configPresent'), r.configPresent ? TLi18n.t('install.yes') : TLi18n.t('install.no'));
  grid.append(cfgCard);
  var dbCard = card(TLi18n.t('install.dbReachable'), r.dbReachable ? TLi18n.t('install.yes') : TLi18n.t('install.no'));
  grid.append(dbCard);
  var gdCard = card(TLi18n.t('install.gdOk'), r.gdOk ? TLi18n.t('install.yes') : TLi18n.t('install.no'));
  grid.append(gdCard);

  renderRepositoryCards(grid, r);

  if (r.schemaStatus && r.schemaStatus !== 'ok') {
    var msgKey = 'install.msgUndetermined';
    if (r.schemaMsg === 'upgrade') msgKey = 'install.msgUpgrade';
    else if (r.schemaMsg === 'manual') msgKey = 'install.msgManual';
    else if (r.schemaMsg === 'partial_migration') msgKey = 'install.msgPartialMigration';
    else if (r.schemaMsg === 'unknown') msgKey = 'install.msgUnknown';
    var msg = TLi18n.t(msgKey);
    if (r.schemaMsg === 'unknown' && r.schemaVersion) {
      msg = TLi18n.t('install.msgUnknown', {v: r.schemaVersion, l: r.latestDbVersion});
    }
    $('#upgradeMsg').text(msg);
    renderForumNotice(r);
    $('#upgradePanel').show();
  } else {
    $('#upgradeForum').empty();
    $('#upgradePanel').hide();
  }

  if (r.securityNotes && r.securityNotes.length > 0) {
    $('#securityPanel').show();
    var ul = $('#securityList').empty();
    // Notes that legacy produced as a localized message composed of a prefix +
    // the configured path (the attachments repository note) or of a prefix +
    // the failing tracker names (the BTS connection note, configCheck.php:273-275)
    // are re-composed here through their i18n key, so they follow the active UI
    // language; every other note falls back to the server-rendered string.
    var items = Array.isArray(r.securityNoteItems) ? r.securityNoteItems : [];
    $.each(r.securityNotes, function(i, n) {
      var it = items[i];
      // TLi18n.t() returns the raw key for an unknown key, so has() guards the
      // localized branch and the server string is used when a bundle is behind.
      var text = (it && it.key && TLi18n.has(it.key)) ? TLi18n.t(it.key, it.params || {}) : n;
      if (text == null || text === '') { text = n; }
      // Server-side strings are legacy multi-line messages built with literal
      // <br /> tags (locale/*/strings.txt). The <li> is filled with .text() to
      // stay XSS-safe, so the tags have to be turned into real line breaks
      // instead of being shown verbatim.
      var li = $('<li>');
      if (String(text).indexOf('<br') !== -1) {
        li.css('white-space', 'pre-line');
        text = String(text).replace(/<br\s*\/?>/gi, '\n');
      }
      li.text(text);
      ul.append(li);
    });
  } else {
    $('#securityPanel').hide();
  }

  renderActions(r);
  renderVideos(r);
}

// Curated contributor walkthroughs served by the BFF (legacy install/index.php:52-58).
// Defensive: the caption is looked up by key, but falls back to the raw key so a
// missing translation degrades to a visible key instead of an empty card.
function renderVideos(r) {
  var box = $('#videos').empty();
  var list = (r && Array.isArray(r.videos)) ? r.videos : [];
  if (!list.length) {
    $('#videosSection, #videosHint, #videos').hide();
    return;
  }
  list.forEach(function(v) {
    if (!v || !v.url) { return; }
    var href = String(v.url);
    if (href.indexOf('https://') !== 0) { return; }
    box.append(
      $('<a class="video-card">').attr('href', href).attr('target', '_blank')
        .attr('rel', 'noopener noreferrer').attr('title', href)
        .append('<div class="thumb"><i class="fa fa-youtube-play"></i></div>')
        .append($('<div>')
          .append('<div class="cap">' + esc(TLi18n.t(v.key) || v.key || v.id) + '</div>')
          .append('<div class="src">' + esc(TLi18n.t('install.videoSource')) + '</div>'))
    );
  });
  if (box.children().length === 0) {
    $('#videosSection, #videosHint, #videos').hide();
    return;
  }
  $('#videosSection, #videosHint, #videos').show();
}

function renderActions(r) {
  var box = $('#actions').empty();
  box.append('<a class="action-btn teal" href="' + esc(r.links.installer) + '" target="_top"><i class="fa fa-wrench"></i> ' + TLi18n.t('install.openWizard') + '</a>');
  box.append('<a class="action-btn blue" href="' + esc(r.links.manual) + '" target="_blank" rel="noopener"><i class="fa fa-book"></i> ' + TLi18n.t('install.manual') + '</a>');
  box.append('<a class="action-btn dark" href="' + esc(r.links.readme) + '" target="_blank" rel="noopener"><i class="fa fa-file-text"></i> ' + TLi18n.t('install.readme') + '</a>');
  box.append('<a class="action-btn dark" href="' + esc(r.links.changelog) + '" target="_blank" rel="noopener"><i class="fa fa-history"></i> ' + TLi18n.t('install.changelog') + '</a>');
  // Legacy install/index.php:49-50: "You are welcome to visit our forum to browse
  // or discuss", offered next to the manual / README / CHANGELOG links.
  // Built with .attr() (not concatenated HTML) and restricted to http(s), so a
  // hostile or malformed links.forum can never inject an attribute nor a
  // javascript: URL - same defensive pattern as renderVideos() above.
  var forumUrl = r.links && r.links.forum ? String(r.links.forum) : '';
  if (/^https?:\/\//i.test(forumUrl)) {
    box.append(
      $('<a class="action-btn blue">').attr('href', forumUrl).attr('target', '_blank')
        .attr('rel', 'noopener noreferrer').attr('title', forumUrl)
        .append('<i class="fa fa-comments"></i> ' + esc(TLi18n.t('install.forum')))
    );
  }
}
</script>
</body>
</html>
