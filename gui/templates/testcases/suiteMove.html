<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Move / Reorder Test Suites</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; color: #22242a; }

.header {
  background: #4ECDC4; color: #fff; padding: 14px 24px;
  font-size: 20px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center;
}
.header .sub { font-size: 13px; font-weight: 400; opacity: .85; margin-left: 12px; }
.header .spacer { flex: 1; }
.header button {
  background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.5);
  padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px;
}
.header button:hover { background: rgba(255,255,255,.32); }

.wrap { padding: 22px 24px; max-width: 1080px; margin: 0 auto; }

.meta, .card {
  background: #fff; border-radius: 8px; padding: 18px 20px; margin-bottom: 18px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.meta .row { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.meta .field { font-size: 13px; color: #555; }
.meta .field b { color: #22242a; margin-right: 5px; }

.card h3 { margin: 0 0 14px; font-size: 15px; color: #22242a; }
.card h3 .hint { font-weight: 400; font-size: 12px; color: #888; margin-left: 10px; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.toolbar label { font-size: 13px; color: #555; }
select, input[type=radio] { font-size: 13px; }
select {
  border: 1px solid #ccc; border-radius: 4px; padding: 7px 10px;
  background: #fff; min-width: 240px;
}
select:disabled { background: #f3f3f3; color: #aaa; }

.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 8px 18px;
  border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-teal:disabled { background: #b9e7e3; cursor: not-allowed; }
.btn-outline { background: #fff; color: #555; border: 1px solid #ccc; padding: 8px 18px;
  border-radius: 4px; cursor: pointer; font-size: 13px; }
.btn-outline:hover { background: #f0f0f0; }
.btn-outline:disabled { color: #bbb; cursor: not-allowed; }

table.reorder { width: 100%; border-collapse: collapse; }
table.reorder th {
  text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
  color: #6b7280; border-bottom: 2px solid #e5e7eb; padding: 8px 10px;
}
table.reorder td { padding: 9px 10px; border-bottom: 1px solid #f0f0f0; font-size: 13px; vertical-align: middle; }
table.reorder tr:hover td { background: #f7fdfd; }
td.pos { width: 52px; color: #888; font-variant-numeric: tabular-nums; text-align: right; }
td.cnt { width: 110px; color: #555; font-size: 12px; }
td.ops { width: 220px; text-align: right; white-space: nowrap; }
td.ops button {
  background: #fff; border: 1px solid #d5d5d5; color: #555; border-radius: 3px;
  height: 28px; min-width: 28px; padding: 0 6px; margin-left: 4px; cursor: pointer; font-size: 12px;
}
td.ops button:hover:not(:disabled) { background: #4ECDC4; color: #fff; border-color: #4ECDC4; }
td.ops button:disabled { color: #ccc; cursor: not-allowed; border-color: #eee; }
td.ops button.wide { font-size: 11px; }
.chip { display: inline-block; background: #eefaf9; color: #2a8f88; border-radius: 10px;
  padding: 2px 10px; font-size: 11px; font-weight: 600; }

.empty { color: #999; font-style: italic; padding: 18px 4px; }

.notice { border-radius: 6px; padding: 11px 14px; font-size: 13px; margin-bottom: 14px; display: none; }
.notice.ok { display: block; background: #e8f8f6; border: 1px solid #b8e6e2; color: #1f7a73; }
.notice.err { display: block; background: #fdecea; border: 1px solid #f5c6c3; color: #a32b28; }

.toast {
  position: fixed; top: 16px; right: 16px; background: #2c3e50; color: #fff;
  padding: 12px 18px; border-radius: 6px; font-size: 13px; opacity: 0;
  transition: opacity .25s; z-index: 999; pointer-events: none; max-width: 60%;
}
.toast.show { opacity: 1; }
.toast.ok { background: #4ECDC4; }
.toast.err { background: #e6605e; }

.state {
  background: #fff; border: 1px solid #f0d0d0; border-left: 4px solid #e6605e;
  border-radius: 8px; margin: 24px; padding: 28px 32px; text-align: center; display: none;
}
.state i { font-size: 34px; color: #e6605e; margin-bottom: 10px; }
.state h3 { margin: 0 0 8px; font-size: 18px; color: #22242a; }
.state p { margin: 0 0 6px; color: #666; font-size: 13px; }

.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
  align-items: center; justify-content: center; z-index: 1000;
}
.modal-mask.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 8px; width: 520px; max-width: 92vw;
  box-shadow: 0 10px 40px rgba(0,0,0,.3); overflow: hidden;
}
.modal-box .m-head { background: #4ECDC4; color: #fff; padding: 12px 18px; font-weight: 700; font-size: 15px; }
.modal-box .m-body { padding: 18px; font-size: 13px; color: #444; }
.modal-box .m-body label { display: block; margin: 12px 0 5px; font-size: 12px; color: #555; }
.modal-box .m-body select { width: 100%; }
.modal-box .m-foot { padding: 12px 18px; background: #fafafa; border-top: 1px solid #eee; text-align: right; }
.modal-box .m-foot button { margin-left: 8px; }
.btn-red { background: #e6605e; color: #fff; border: none; padding: 8px 18px;
  border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-red:hover { background: #d24f4d; }

.footer { text-align: center; color: #8a8a8a; font-size: 12px; padding: 6px 0 22px; }

#loading { text-align: center; padding: 30px; color: #888; font-size: 13px; }
#content { display: none; }
</style>
</head>
<body>

<div class="header">
  <span data-i18n="smv.title">Move / Reorder Test Suites</span>
  <span class="sub" data-i18n="smv.subtitle">Test specification</span>
  <span class="spacer"></span>
  <span id="localeSwitcher"></span>
  <button onclick="closeWindow()" data-i18n="common.close">Close</button>
</div>

<div id="stateBox" class="state">
  <i class="fa fa-exclamation-triangle"></i>
  <h3 id="stateTitle">-</h3>
  <p id="stateMsg"></p>
  <p><button class="btn-outline" onclick="reload()" data-i18n="common.refresh">Refresh</button></p>
</div>

<div class="wrap" id="wrap">
  <div id="loading"><i class="fa fa-spinner fa-spin"></i> <span data-i18n="smv.loading">Loading...</span></div>

  <div id="content">
    <div class="meta">
      <div class="row">
        <span class="field"><b data-i18n="smv.testProject">Test project</b><span id="mbProject">-</span></span>
        <span class="field"><b data-i18n="smv.container">Container</b><span id="mbContainer">-</span></span>
        <span class="field"><b data-i18n="smv.subSuites">Sub-suites</b><span id="mbCount">-</span></span>
      </div>
    </div>

    <div class="notice ok" id="noticeOk"></div>
    <div class="notice err" id="noticeErr"></div>

    <div class="card">
      <h3><i class="fa fa-sitemap"></i>
        <span data-i18n="smv.orderHeading">Test suite order</span>
        <span class="hint" data-i18n="smv.orderHint">The order below is the stored node order used by the test specification tree.</span>
      </h3>

      <div class="toolbar">
        <label for="selSuite" data-i18n="smv.containerLabel">Container</label>
        <select id="selSuite"></select>
        <button class="btn-outline" onclick="load()" data-i18n="common.refresh">Refresh</button>
        <button class="btn-outline" onclick="goTestSpec()" data-i18n="smv.backToSpec">Back to Test Specification</button>
        <span class="chip" id="countChip"></span>
      </div>

      <div id="rowsWrap">
        <table class="reorder" id="tbl">
          <thead>
            <tr>
              <th class="pos" data-i18n="smv.thPos">#</th>
              <th data-i18n="smv.thSuite">Test suite</th>
              <th class="cnt" data-i18n="smv.thTestCases">Test cases</th>
              <th class="cnt" data-i18n="smv.thSubSuites">Sub-suites</th>
              <th style="text-align:right" data-i18n="smv.thMove">Move</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="emptyMsg" style="display:none" data-i18n="smv.empty">This container has no test suites.</div>
      </div>
    </div>
  </div>
</div>

<div class="modal-mask" id="mask">
  <div class="modal-box">
    <div class="m-head" id="mTitle">-</div>
    <div class="m-body">
      <div id="mText"></div>
      <label for="mDest" data-i18n="smv.destination">Destination test suite</label>
      <select id="mDest"></select>
      <label data-i18n="smv.position">Position</label>
      <div>
        <label style="display:inline-block;margin-right:16px">
          <input type="radio" name="mPos" value="top" checked> <span data-i18n="smv.posFirst">First</span>
        </label>
        <label style="display:inline-block">
          <input type="radio" name="mPos" value="bottom"> <span data-i18n="smv.posLast">Last</span>
        </label>
      </div>
    </div>
    <div class="m-foot">
      <button class="btn-outline" id="mCancel" data-i18n="smv.cancel">Cancel</button>
      <button class="btn-red" id="mOk" data-i18n="smv.confirm">Move</button>
    </div>
  </div>
</div>

<div class="footer" id="footerInfo"></div>
<div class="toast" id="toast"></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
var API = '/api/suitemove/index.php';
var TPROJECT_ID = 0;
var CONTAINER_ID = 0;
var ROWS = [];
var ALL_SUITES = [];
var BUSY = false;
var PENDING_NODE = 0;

function qs(k, d) {
  var p = new URLSearchParams(window.location.search);
  return p.get(k) === null ? d : p.get(k);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* Safe interpolation: $& / $` / $' in a name must not rewrite the sentence. */
function fill(tpl, params) {
  params = params || {};
  return TLi18n.t(tpl, params).replace(/[$&`']/g, function (c) {
    return ({ '$': '$$$$', '&': '$$&', '`': '$$`', "'": "$$'" })[c];
  });
}

function toast(msg, kind) {
  var t = $('#toast');
  t.removeClass('ok err').addClass('show ' + (kind || 'ok')).text(msg);
  clearTimeout(t.data('to'));
  t.data('to', setTimeout(function () { t.removeClass('show'); }, 2800));
}

function setNotice(kind, msg) {
  $('#noticeOk, #noticeErr').hide();
  if (kind === 'ok' && msg) { $('#noticeOk').text(msg).show(); }
  if (kind === 'err' && msg) { $('#noticeErr').text(msg).show(); }
}

function showState(title, msg) {
  $('#wrap').hide();
  $('#stateTitle').text(title);
  $('#stateMsg').text(msg);
  $('#stateBox').show();
}

function isSessionGone(xhr) {
  var r = (xhr && xhr.responseJSON) ? xhr.responseJSON : {};
  return !!xhr && (xhr.status === 401 || r.code === 'session_expired');
}

function stateForResponse(xhr) {
  var r = (xhr && xhr.responseJSON) ? xhr.responseJSON : {};
  var code = r.code || '';
  var s = xhr ? xhr.status : 0;
  if (s === 403) {
    return [TLi18n.t('smv.stNotAllowed'), TLi18n.t('smv.stNotAllowedMsg')];
  }
  if (s === 404) {
    return [TLi18n.t('smv.stNotFound'), TLi18n.t('smv.stNotFoundMsg')];
  }
  if (s === 409) {
    return [TLi18n.t('smv.stCycle'), TLi18n.t('smv.stCycleMsg')];
  }
  if (s === 400 || code === 'no_context') {
    return [TLi18n.t('smv.stNoContext'), TLi18n.t('smv.stNoContextMsg')];
  }
  return [TLi18n.t('smv.stError'), esc(r.message || TLi18n.t('smv.stErrorMsg'))];
}

function closeWindow() {
  try { window.close(); } catch (e) {}
  setTimeout(function () {
    if (!window.closed) { window.opener && window.opener.location.reload(); }
  }, 150);
}

function goTestSpec() {
  window.location.href = '/gui/templates/testcases/testSpec.html?tproject_id=' + TPROJECT_ID;
}

function reload() {
  $('#stateBox').hide();
  $('#wrap').show();
  load();
}

/**
 * Destination options: the project root plus every suite of the project, with
 * the picked suite AND its whole subtree removed - moving a suite inside one of
 * its own descendants would detach that subtree from the project root (the BFF
 * rejects it with 409 too, this simply never offers it).
 */
function descendantIds(nodeId) {
  var hide = {};
  var idx = -1;
  for (var i = 0; i < ALL_SUITES.length; i++) {
    if (parseInt(ALL_SUITES[i].id, 10) === nodeId) { idx = i; break; }
  }
  if (idx < 0) { return hide; }
  hide[nodeId] = true;
  var baseDepth = parseInt(ALL_SUITES[idx].depth, 10) || 0;
  for (var j = idx + 1; j < ALL_SUITES.length; j++) {
    if ((parseInt(ALL_SUITES[j].depth, 10) || 0) <= baseDepth) { break; }
    hide[ALL_SUITES[j].id] = true;
  }
  return hide;
}

function renderContainers() {
  var h = '<option value="' + TPROJECT_ID + '">' + esc(TLi18n.t('smv.projectRoot')) + '</option>';
  ALL_SUITES.forEach(function (s) {
    if (parseInt(s.id, 10) === CONTAINER_ID) { return; }
    h += '<option value="' + esc(s.id) + '"' +
         (parseInt(s.id, 10) === CONTAINER_ID ? ' selected' : '') + '>' + esc(s.name) + '</option>';
  });
  if (CONTAINER_ID !== TPROJECT_ID && parseInt(CONTAINER_ID, 10) !== TPROJECT_ID &&
      !ALL_SUITES.some(function (s) { return parseInt(s.id, 10) === parseInt(CONTAINER_ID, 10); })) {
    h += '<option value="' + esc(CONTAINER_ID) + '" selected>#' + esc(CONTAINER_ID) + '</option>';
  }
  $('#selSuite').html(h);
}

function renderRows() {
  var h = '';
  ROWS.forEach(function (r, i) {
    var first = (i === 0);
    var last = (i === ROWS.length - 1);
    h += '<tr data-id="' + esc(r.id) + '">';
    h += '<td class="pos">' + (i + 1) + '</td>';
    h += '<td>' + esc(r.name) + '</td>';
    h += '<td class="cnt">' + esc(r.testcases) + '</td>';
    h += '<td class="cnt">' + esc(r.sub_suites) + '</td>';
    h += '<td class="ops">';
    h += '<button title="' + esc(TLi18n.t('smv.moveUp')) + '" class="op" data-op="up" data-node="' + esc(r.id) + '"' + (first || BUSY ? ' disabled' : '') + '><i class="fa fa-angle-up"></i></button>';
    h += '<button title="' + esc(TLi18n.t('smv.moveDown')) + '" class="op" data-op="down" data-node="' + esc(r.id) + '"' + (last || BUSY ? ' disabled' : '') + '><i class="fa fa-angle-down"></i></button>';
    h += '<button title="' + esc(TLi18n.t('smv.moveTo')) + '" class="op wide" data-op="moveTo" data-node="' + esc(r.id) + '"' + (BUSY ? ' disabled' : '') + '>' + esc(TLi18n.t('smv.moveToShort')) + '</button>';
    h += '<button title="' + esc(TLi18n.t('smv.openContainer')) + '" class="op" data-op="open" data-node="' + esc(r.id) + '"' + (BUSY ? ' disabled' : '') + '><i class="fa fa-folder-open"></i></button>';
    h += '</td></tr>';
  });
  $('#rows').html(h);
  $('#emptyMsg').toggle(ROWS.length === 0);
  $('#countChip').text(fill('smv.subSuiteCount', { count: ROWS.length }));
}

function renderModalDest(nodeId) {
  var hide = descendantIds(nodeId);
  var h = '<option value="' + TPROJECT_ID + '">' + esc(TLi18n.t('smv.projectRoot')) + '</option>';
  ALL_SUITES.forEach(function (s) {
    if (hide[s.id]) { return; }
    h += '<option value="' + esc(s.id) + '"' +
         (parseInt(s.id, 10) === CONTAINER_ID ? ' selected' : '') + '>' + esc(s.name) + '</option>';
  });
  $('#mDest').html(h);
}

function setBusy(b) {
  BUSY = b;
  renderRows();
}

function postAction(action, payload, okMsg) {
  if (BUSY) { return; }
  setBusy(true);
  var data = $.extend({ action: action, tproject_id: TPROJECT_ID, container_id: CONTAINER_ID }, payload);
  $.ajax({
    url: API,
    method: 'POST',
    dataType: 'json',
    data: data
  }).done(function (r) {
    if (r && r.status === 'ok') {
      if (r.suites) { ROWS = r.suites; }
      setNotice('ok', okMsg || '');
      renderRows();
      /* The tree itself changed, so the destination picker has to be rebuilt. */
      load(true);
    } else {
      setNotice('err', esc((r && r.message) || TLi18n.t('smv.stErrorMsg')));
      setBusy(false);
    }
  }).fail(function (xhr) {
    var r = (xhr && xhr.responseJSON) ? xhr.responseJSON : {};
    if (xhr.status === 403 && r.code !== 'forbidden') {
      setNotice('err', TLi18n.t('smv.csrfBlocked'));
    } else {
      setNotice('err', esc(r.message || TLi18n.t('smv.stErrorMsg')));
    }
    setBusy(false);
  });
}

function doMove(nodeId, op) {
  var msgs = {
    up: TLi18n.t('smv.movedUp'),
    down: TLi18n.t('smv.movedDown')
  };
  postAction('move', { node_id: nodeId, position: op }, msgs[op] || '');
}

function openMoveModal(nodeId) {
  var row = null;
  ROWS.forEach(function (r) { if (parseInt(r.id, 10) === nodeId) { row = r; } });
  if (!row) { return; }
  PENDING_NODE = nodeId;
  $('#mTitle').text(TLi18n.t('smv.confirmTitle'));
  $('#mText').text(fill('smv.confirmText', { suite: row.name }));
  renderModalDest(nodeId);
  $('input[name=mPos][value=top]').prop('checked', true);
  $('#mask').addClass('show');
}

function closeModal() {
  $('#mask').removeClass('show');
  PENDING_NODE = 0;
}

function confirmModal() {
  var nodeId = PENDING_NODE;
  var dest = parseInt($('#mDest').val(), 10) || 0;
  var pos = $('input[name=mPos]:checked').val() || 'bottom';
  closeModal();
  postAction('move', { node_id: nodeId, new_parent_id: dest, position: pos },
    TLi18n.t('smv.movedSuite'));
}

function load(quiet) {
  if (!quiet) {
    $('#loading').show();
    $('#content').hide();
  }
  $.ajax({
    url: API,
    method: 'GET',
    dataType: 'json',
    data: { action: 'init', tproject_id: TPROJECT_ID, container_id: CONTAINER_ID }
  }).done(function (r) {
    $('#loading').hide();
    $('#content').show();
    if (!r || r.status !== 'ok') {
      showState(TLi18n.t('smv.stError'), esc((r && r.message) || TLi18n.t('smv.stErrorMsg')));
      return;
    }
    TPROJECT_ID = r.context.tproject_id;
    CONTAINER_ID = r.container ? r.container.id : TPROJECT_ID;
    ALL_SUITES = r.all_suites || [];
    ROWS = r.suites || [];
    $('#mbProject').text(r.context.tproject_name + ' (' + r.context.prefix + ')');
    $('#mbContainer').text((r.container && r.container.root)
      ? TLi18n.t('smv.projectRoot')
      : (r.container ? r.container.name : '-'));
    $('#mbCount').text(ROWS.length);
    renderContainers();
    renderRows();
    setBusy(false);
  }).fail(function (xhr) {
    $('#loading').hide();
    $('#content').hide();
    if (isSessionGone(xhr)) {
      window.location.href = '/login.php?note=expired';
      return;
    }
    var st = stateForResponse(xhr);
    showState(st[0], st[1]);
  });
}

$(function () {
  TPROJECT_ID = parseInt(qs('tproject_id', 0), 10) || 0;
  CONTAINER_ID = parseInt(qs('container_id', 0), 10) || 0;

  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    $('#footerInfo').text(TLi18n.t('footers.suiteMove'));

    $('#selSuite').on('change', function () {
      CONTAINER_ID = parseInt($(this).val(), 10) || 0;
      setNotice('', '');
      load();
    });
    $('#rows').on('click', 'button.op', function () {
      if (BUSY) { return; }
      var op = $(this).data('op');
      var node = parseInt($(this).data('node'), 10);
      if (op === 'up' || op === 'down') {
        doMove(node, op);
      } else if (op === 'moveTo') {
        openMoveModal(node);
      } else if (op === 'open') {
        CONTAINER_ID = node;
        setNotice('', '');
        load();
      }
    });
    $('#mCancel').on('click', closeModal);
    $('#mOk').on('click', confirmModal);
    $('#mask').on('click', function (e) { if (e.target === this) { closeModal(); } });

    load();
  });
});
</script>
</body>
</html>
