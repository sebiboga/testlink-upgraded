<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Import Test Cases</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { background: #f2f2f2; font-family: 'Ruda', sans-serif; margin: 0; padding: 0; }
.header { background: #4ECDC4; color: #fff; padding: 14px 24px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header .sub { font-size: 13px; font-weight: 400; opacity: .85; margin-left: 12px; }
.toolbar { background: #22242a; padding: 12px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.toolbar .ctx { color: #aaa; font-size: 12px; }
.toolbar .ctx b { color: #fff; }
.btn-teal { background: #4ECDC4; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-teal:hover { background: #3dbdb5; }
.btn-teal:disabled { background: #9adbd7; cursor: not-allowed; }
.btn-dark { background: #3a3d46; color: #eee; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-dark:hover { background: #4a4e59; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin: 16px 24px 0; overflow: hidden; }
.card-head { background: #22242a; color: #fff; padding: 11px 20px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.card-body { padding: 18px 22px; }
.warnbox { margin: 12px 24px 0; background: #fdecea; border: 1px solid #f5c6cb; color: #b94a48; border-radius: 6px; padding: 10px 14px; font-size: 13px; display: none; }
.infobox { margin: 12px 24px 0; background: #eefaf9; border: 1px solid #bfe5e2; color: #2d8e88; border-radius: 6px; padding: 10px 14px; font-size: 13px; display: none; }
.form-table { width: 100%; max-width: 760px; border-collapse: collapse; }
.form-table td { padding: 8px 12px 8px 0; vertical-align: middle; font-size: 13px; }
.form-table td.lbl { width: 230px; font-weight: 700; color: #22242a; }
select, input[type=text] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; min-width: 260px; background: #fff; }
.filepick { display: inline-flex; align-items: center; gap: 10px; }
.filepick .fake-btn { background: #3a3d46; color: #eee; border-radius: 4px; padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
.filepick .fname { color: #555; font-size: 13px; }
.hint { color: #888; font-size: 12px; margin-top: 3px; }
.note { background: #fafafa; border-left: 4px solid #4ECDC4; padding: 8px 14px; font-size: 12.5px; color: #555; margin: 10px 0 4px; max-width: 720px; display: none; }
.actions-bar { margin-top: 18px; display: flex; gap: 12px; align-items: center; }
.stat-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { background: #eefaf9; border: 1px solid #bfe5e2; color: #2d8e88; border-radius: 14px; padding: 4px 14px; font-size: 12.5px; font-weight: 700; }
.chip.bad { background: #fdecea; border-color: #f5c6cb; color: #b94a48; }
.chip.neutral { background: #f4f4f4; border-color: #ddd; color: #666; }
.rsec { margin-bottom: 16px; }
.rsec h3 { font-size: 13px; color: #22242a; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .5px; }
table.rep { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.rep thead th { background: #22242a; color: #fff; text-align: left; padding: 7px 10px; font-weight: 600; }
table.rep tbody td { padding: 6px 10px; border-bottom: 1px solid #eee; color: #333; vertical-align: top; }
table.rep tbody tr:nth-child(even) { background: #fafafa; }
.ref { font-family: monospace; color: #2d8e88; white-space: nowrap; }
.err-text { color: #b94a48; }
.badge-preview { background: #e67e22; color: #fff; font-size: 11px; border-radius: 10px; padding: 3px 10px; letter-spacing: .5px; }
.footer { padding: 12px 24px; color: #888; font-size: 12px; border-top: 1px solid #ddd; background: #fff; margin-top: 16px; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #22242a; color: #fff; padding: 10px 16px; border-radius: 5px; font-size: 13px; display: none; z-index: 9999; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.toast.err { background: #e6605e; }
.loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,.75); display: none; align-items: center; justify-content: center; font-size: 15px; color: #555; z-index: 9998; }
</style>
</head>
<body>

<div class="header">
  <span data-i18n="tci.header">Import Test Cases</span>
  <span class="sub" id="ctxTarget"></span>
</div>

<div class="toolbar">
  <span class="ctx"><span data-i18n="tci.testProject">Test Project</span>: <b id="ctxProject">-</b></span>
  <span style="flex:1"></span>
  <span id="localeSwitcher"></span>
</div>

<div class="warnbox" id="warnBox"></div>
<div class="infobox" id="infoBox"></div>

<div class="card" id="formCard">
  <div class="card-head"><i class="fa fa-file-import"></i> <span data-i18n="tci.header">Import Test Cases</span></div>
  <div class="card-body">
    <table class="form-table">
      <tr>
        <td class="lbl"><span data-i18n="tci.fileType">File type</span></td>
        <td>
          <select id="fileType">
            <option value="XML">XML</option>
            <option value="MD">Markdown (.md)</option>
          </select>
        </td>
      </tr>
      <tr>
        <td class="lbl"><span data-i18n="tci.file">File</span></td>
        <td>
          <div class="filepick">
            <label class="fake-btn" for="fileInput"><i class="fa fa-folder-open"></i> <span data-i18n="tci.chooseFile">Choose file</span></label>
            <input type="file" id="fileInput" style="display:none;">
            <span class="fname" id="fileName" data-i18n="tci.noFileChosen">No file chosen</span>
          </div>
        </td>
      </tr>
      <tr>
        <td class="lbl"><span data-i18n="tci.duplicateCriteria">Duplicate check criteria</span></td>
        <td>
          <select id="hitCriteria">
            <option value="name" selected data-i18n="tci.critName">Same title within target suite</option>
            <option value="internalID" data-md="off" data-i18n="tci.critInternalId">Same internal ID</option>
            <option value="externalID" data-md="off" data-i18n="tci.critExternalId">Same external ID</option>
          </select>
          <div class="hint" id="critHint" style="display:none;" data-i18n="tci.mdCritHint"></div>
        </td>
      </tr>
      <tr>
        <td class="lbl"><span data-i18n="tci.actionOnDuplicates">Action for duplicates</span></td>
        <td>
          <select id="actionOnHit">
            <option value="skip" selected data-i18n="tci.actSkip">Skip duplicates</option>
            <option value="update_last_version" data-md="off" data-i18n="tci.actUpdateLast">Update last version</option>
            <option value="generate_new" data-md="off" data-i18n="tci.actGenerateNew">Generate new test case</option>
            <option value="create_new_version" data-i18n="tci.actNewVersion">Create new version</option>
          </select>
          <div class="hint" id="actHint" style="display:none;" data-i18n="tci.mdActHint"></div>
        </td>
      </tr>
      <tr id="rowPreview">
        <td class="lbl"><span data-i18n="tci.previewOnly">Preview only</span></td>
        <td>
          <label style="font-size:13px;"><input type="checkbox" id="dryRun"> <span data-i18n="tci.previewHint">parse and report only, write nothing</span></label>
        </td>
      </tr>
    </table>

    <div class="note" id="mdNote" data-i18n="tci.mdNote"></div>
    <div class="hint" id="maxSizeLine" style="margin-top:8px;"></div>

    <div class="actions-bar">
      <button class="btn-teal" id="btnUpload"><i class="fa fa-upload"></i> <span data-i18n="tci.btnUpload">Upload file</span></button>
      <button class="btn-dark" id="btnCancel"><i class="fa fa-xmark"></i> <span data-i18n="common.cancel">Cancel</span></button>
    </div>
  </div>
</div>

<div class="card" id="reportCard" style="display:none;">
  <div class="card-head">
    <i class="fa fa-clipboard-check"></i> <span data-i18n="tci.reportTitle">Import report</span>
    <span class="badge-preview" id="previewBadge" style="display:none;" data-i18n="tci.dryRunBadge">PREVIEW</span>
  </div>
  <div class="card-body">
    <div class="stat-chips" id="statChips"></div>
    <div id="reportSections"></div>
  </div>
</div>

<div class="footer">
  <span data-i18n="tci.footer">TestLink 2.0.1 - Test Case Import</span>
</div>

<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loadingOverlay"><i class="fa fa-spinner fa-spin" style="margin-right:8px;"></i><span data-i18n="tci.uploading">Importing... please wait.</span></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var ctx = {
  tprojectId: parseInt(qs('tproject_id') || '0', 10),
  containerId: parseInt(qs('containerID') || '0', 10),
  intoProject: qs('intoProject') === '1',
  useRecursion: qs('useRecursion') === '1',
  bffUrl: '/api/testcasesimport/',
  info: null,
  maxBytes: 0,
  canModify: false
};

function qs(name) {
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : '';
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg, isErr) {
  var $t = $('#toast').text(msg).toggleClass('err', !!isErr).show();
  clearTimeout($t.data('tm'));
  $t.data('tm', setTimeout(function () { $t.hide(); }, 4000));
}

$(function () {
  TLi18n.load(function () {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    loadInfo();
  });

  $('#fileInput').on('change', function () {
    var f = this.files[0];
    $('#fileName').text(f ? f.name : TLi18n.t('tci.noFileChosen'));
  });

  $('#fileType').on('change', applyTypeVisibility);

  $('#btnUpload').on('click', doUpload);

  $('#btnCancel').on('click', function () {
    if (window.history.length > 1) window.history.back(); else window.close();
  });
});

function loadInfo() {
  $.get(ctx.bffUrl, { action: 'info', tproject_id: ctx.tprojectId, containerID: ctx.containerId })
    .done(function (r) {
      if (r.status !== 'ok') { showFatal(r.message || TLi18n.t('tci.errLoadInfo')); return; }
      ctx.info = r;
      ctx.tprojectId = r.tproject.id;
      ctx.containerId = r.container.id;
      ctx.maxBytes = parseInt(r.maxUploadBytes || '0', 10);
      ctx.canModify = !!parseInt(r.grants.mgt_modify_tc || '0', 10);
      renderContext();
    })
    .fail(function (xhr) {
      var msg = TLi18n.t('tci.errLoadInfo');
      try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
      showFatal(msg);
    });
}

function showFatal(msg) {
  $('#warnBox').html('<i class="fa fa-triangle-exclamation"></i> ' + esc(msg)).show();
  $('#btnUpload').prop('disabled', true);
}

function renderContext() {
  document.title = TLi18n.t('tci.header') + ' - ' + ctx.info.tproject.name;
  $('#ctxProject').text(ctx.info.tproject.name);
  $('#ctxTarget').html(esc(ctx.info.container.isProject ? TLi18n.t('tci.projectRoot') : '') 
    + '<span class="tcname">' + esc(ctx.info.container.name) + '</span>');

  if (!ctx.canModify) {
    $('#warnBox').html('<i class="fa fa-lock"></i> ' + esc(TLi18n.t('tci.errNoPermission'))).show();
    $('#btnUpload').prop('disabled', true);
  }

  if (ctx.maxBytes > 0) {
    $('#maxSizeLine').text(TLi18n.t('tci.maxFileSize', { n: Math.floor(ctx.maxBytes / 1024) }));
  }
  applyTypeVisibility();
}

function applyTypeVisibility() {
  var isMd = $('#fileType').val() === 'MD';
  // MD supports only hit_criteria=name and action in {skip, create_new_version}
  $('#hitCriteria option[data-md="off"]').each(function () {
    if (isMd && this.selected) { $('#hitCriteria').val('name'); }
  }).prop('disabled', isMd);
  $('#actionOnHit option[data-md="off"]').each(function () {
    if (isMd && this.selected) { $('#actionOnHit').val('skip'); }
  }).prop('disabled', isMd);
  $('#hitCriteria').prop('disabled', isMd);
  $('#critHint').toggle(isMd);
  $('#actHint').toggle(isMd);
  $('#rowPreview').toggle(isMd);
  $('#mdNote').toggle(isMd);
}

function doUpload() {
  if (!ctx.canModify) return;
  var btn = $('#btnUpload')[0];
  if (btn && btn.disabled) return;
  if (btn) btn.disabled = true;
  var f = $('#fileInput')[0].files[0];
  if (!f) { if (btn) btn.disabled = false; toast(TLi18n.t('tci.errNoFile'), true); return; }
  if (ctx.maxBytes > 0 && f.size > ctx.maxBytes) {
    if (btn) btn.disabled = false;
    toast(TLi18n.t('tci.maxFileSize', { n: Math.floor(ctx.maxBytes / 1024) }), true);
    return;
  }
  if ($('#fileType').val() === 'MD') {
    importMarkdown(f);
  } else {
    importXml(f);
  }
}

function importMarkdown(file) {
  var fd = new FormData();
  fd.append('uploadedFile', file);
  var params = {
    action: 'import_md',
    tproject_id: ctx.tprojectId,
    hit_criteria: 'name',
    action_on_hit: $('#actionOnHit').val()
  };
  if ($('#dryRun').is(':checked')) params.dry_run = 1;
  $('#loadingOverlay').show();
  $.ajax({
    url: ctx.bffUrl + '?' + $.param(params),
    method: 'POST',
    data: fd,
    processData: false,
    contentType: false,
    dataType: 'json'
  }).done(function (r) {
    $('#loadingOverlay').hide();
    $('#btnUpload').prop('disabled', false);
    if (r.status !== 'ok') { toast(r.message || TLi18n.t('tci.errLoadInfo'), true); return; }
    renderReport(r);
    if (r.dry_run) toast(TLi18n.t('tci.previewDone'));
    else toast(TLi18n.t('tci.importDone'));
  }).fail(function (xhr) {
    $('#loadingOverlay').hide();
    $('#btnUpload').prop('disabled', false);
    var msg = TLi18n.t('tci.errLoadInfo');
    try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
    toast(msg, true);
  });
}

function importXml(file) {
  var fd = new FormData();
  fd.append('uploadedFile', file);
  var params = {
    action: 'import_xml',
    tproject_id: ctx.tprojectId,
    containerID: ctx.containerId,
    hit_criteria: $('#hitCriteria').val(),
    action_on_hit: $('#actionOnHit').val()
  };
  if (ctx.intoProject) params.intoProject = 1;
  if (ctx.useRecursion) params.useRecursion = 1;
  $('#loadingOverlay').show();
  $.ajax({
    url: ctx.bffUrl + '?' + $.param(params),
    method: 'POST',
    data: fd,
    processData: false,
    contentType: false,
    dataType: 'json'
  }).done(function (r) {
    $('#loadingOverlay').hide();
    $('#btnUpload').prop('disabled', false);
    if (r.status !== 'ok') { toast(r.message || TLi18n.t('tci.errLoadInfo'), true); return; }
    renderXmlReport(r);
    toast(TLi18n.t('tci.importDone'));
  }).fail(function (xhr) {
    $('#loadingOverlay').hide();
    $('#btnUpload').prop('disabled', false);
    var msg = TLi18n.t('tci.errLoadInfo');
    try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
    toast(msg, true);
  });
}

function renderXmlReport(r) {
  $('#formCard').hide();
  $('#previewBadge').hide();
  $('#warnBox').hide();
  var rows = r.result || [];
  var chips = chip(TLi18n.t('tci.created'), rows.length);
  $('#statChips').html(chips);
  var h = '';
  if (rows.length) {
    h += '<div class="rsec"><h3>' + esc(TLi18n.t('tci.xmlResults')) + ' (' + rows.length + ')</h3>'
      + '<table class="rep"><thead><tr>'
      + '<th style="width:90px;">' + esc(TLi18n.t('tci.colRef')) + '</th>'
      + '<th>' + esc(TLi18n.t('tci.colTitle')) + '</th>'
      + '<th>' + esc(TLi18n.t('tci.colDetail')) + '</th>'
      + '</tr></thead><tbody>';
    rows.forEach(function (row) {
      h += '<tr><td class="ref">' + esc(row.id || '') + '</td><td>' + esc(row.name || row.title || '') + '</td><td>'
        + esc(row.message || row.error || '') + '</td></tr>';
    });
    h += '</tbody></table></div>';
  } else {
    h += '<div class="rsec"><h3>' + esc(TLi18n.t('tci.noRows')) + '</h3></div>';
  }
  $('#reportSections').html(h);
  $('#reportCard').show();
  window.scrollTo(0, 0);
}

function chip(label, count, cls) {
  return '<span class="chip ' + esc(cls || '') + '">' + esc(label) + ': ' + esc(count) + '</span>';
}

function section(title, rows) {
  if (!rows.length) return '';
  var h = '<div class="rsec"><h3>' + esc(title) + ' (' + rows.length + ')</h3>'
    + '<table class="rep"><thead><tr>'
    + '<th style="width:90px;">' + esc(TLi18n.t('tci.colRef')) + '</th>'
    + '<th>' + esc(TLi18n.t('tci.colTitle')) + '</th>'
    + '<th>' + esc(TLi18n.t('tci.colSuite')) + '</th>'
    + '<th>' + esc(TLi18n.t('tci.colDetail')) + '</th>'
    + '</tr></thead><tbody>';
  rows.forEach(function (r) {
    var detail = r.id ? ('#' + r.id)
      : (r.tcversion_id ? ('#' + r.tcase_id + ' / v' + r.tcversion_id)
      : (r.reason || r.error || ''));
    if (r.error) detail = '<span class="err-text">' + esc(detail) + '</span>';
    else detail = esc(detail);
    h += '<tr><td class="ref">' + esc(r.tcId) + '</td><td>' + esc(r.title) + '</td><td>'
      + esc(r.suite || '') + '</td><td>' + detail + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}

function renderReport(r) {
  $('#previewBadge').toggle(!!r.dry_run);
  $('#formCard').hide();

  if (r.projectMismatch) {
    $('#warnBox').show().html('<i class="fa fa-triangle-exclamation"></i> '
      + esc(TLi18n.t('tci.mismatchWarn', { file: r.projectMismatch.file, target: r.projectMismatch.target })));
  } else {
    $('#warnBox').hide();
  }

  var chips =
    chip(TLi18n.t('tci.suitesCreated'), r.suitesCreated.length) +
    chip(TLi18n.t('tci.suitesMatched'), r.suitesMatched.length) +
    chip(TLi18n.t('tci.created'), r.createdCount) +
    chip(TLi18n.t('tci.skipped'), r.skippedCount, 'neutral') +
    chip(TLi18n.t('tci.newVersions'), r.newVersionCount) +
    chip(TLi18n.t('tci.failed'), r.failedCount, r.failedCount ? 'bad' : 'neutral') +
    (r.parserErrors && r.parserErrors.length ? chip(TLi18n.t('tci.parserErrors'), r.parserErrors.length, 'bad') : '');
  $('#statChips').html(chips);

  var h = '';
  if (r.suitesCreated.length) {
    h += '<div class="rsec"><h3>' + esc(TLi18n.t('tci.suitesCreated')) + '</h3><div>' +
      r.suitesCreated.map(function (s) { return '<span class="chip neutral">' + esc(s) + '</span>'; }).join(' ') + '</div></div>';
  }
  h += section(TLi18n.t('tci.created'), r.created);
  h += section(TLi18n.t('tci.newVersions'), r.newVersions);
  h += section(TLi18n.t('tci.skipped'), r.skipped);
  h += section(TLi18n.t('tci.failed'), r.failed);
  if (r.parserErrors && r.parserErrors.length) {
    h += '<div class="rsec"><h3 class="err-text">' + esc(TLi18n.t('tci.parserErrors')) + '</h3><ul style="font-size:12.5px;color:#b94a48;">'
      + r.parserErrors.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></div>';
  }
  $('#reportSections').html(h);
  $('#reportCard').show();
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
