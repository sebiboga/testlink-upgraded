<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/gui/themes/default/images/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="notif.screenTitle">Notifications</title>
<link rel="stylesheet" href="/gui/templates/dashio/lib/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{background:#f2f2f2;font-family:'Ruda',sans-serif;margin:0;padding:0}
.header{background:#4ECDC4;color:#fff;padding:14px 24px;font-size:20px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:12px}
.header span{font-size:13px;font-weight:400;opacity:.8}
.header .bell-icon{font-size:24px}
.toolbar{background:#22242a;padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.toolbar .ctx{color:#aaa;font-size:12px}.toolbar .ctx b{color:#fff}
.content{padding:20px 24px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:18px 20px;margin-bottom:20px}
.card h3{margin:0 0 2px 0;font-size:16px;font-weight:700;color:#222}
.card h5{margin:0 0 12px 0;font-size:12px;font-weight:400;color:#7a7a7a;border-bottom:1px solid #c9cdd7;padding-bottom:8px}
.summary-cards{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.summary-badge{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 18px;flex:1;min-width:140px;display:flex;align-items:center;gap:12px;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.summary-badge:hover,.summary-badge.active{border-color:#4ECDC4}
.summary-badge .count{font-size:22px;font-weight:700;color:#222}
.summary-badge .label{font-size:12px;color:#777}
.summary-badge .icon{font-size:18px}
.empty{color:#7a7a7a;font-size:13px;padding:20px 0;text-align:center}
.toast{position:fixed;right:20px;bottom:20px;background:#22242a;color:#fff;padding:10px 16px;border-radius:5px;font-size:13px;display:none;z-index:9999;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.toast.ok{background:#4ECDC4}.toast.err{background:#e6605e}
table.dataTable thead th{background:#22242a;color:#fff;font-size:13px;padding:10px 14px}
table.dataTable tbody td{padding:8px 14px;font-size:13px;vertical-align:middle}
.dataTables_wrapper .dataTables_paginate .paginate_button.current{background:#4ECDC4!important;color:#fff!important;border:none!important}
.badge{display:inline-block;padding:3px 9px;border-radius:3px;font-size:11px;font-weight:700;color:#fff;margin-right:4px}
.notif-icon{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
.notif-row-unread td{background:#f7fbfb}
.notif-msg{font-size:13px;color:#222;line-height:1.45}
.notif-msg a{color:#2d8e88;text-decoration:none;border-bottom:1px dotted #2d8e88}
.notif-msg a:hover{text-decoration:underline}
.notif-time{font-size:11px;color:#888;white-space:nowrap}
.notif-actions{display:flex;gap:8px;align-items:center}
.btn-mark-read,.btn-refresh{border:none;background:none;cursor:pointer;color:#4ECDC4;font-size:13px;padding:4px 8px;border-radius:3px}
.btn-mark-read:hover,.btn-refresh:hover{background:#4ECDC4;color:#fff}
.btn-all-read{font-size:13px;padding:6px 14px;border-radius:4px;border:none;background:#4ECDC4;color:#fff;cursor:pointer;white-space:nowrap}
.btn-all-read:hover{background:#3dbcb4}
input[type="checkbox"].notif-cb{width:15px;height:15px;cursor:pointer}
.footer{padding:12px 24px;color:#888;font-size:12px;border-top:1px solid #ddd;background:#fff}
</style>
</head>
<body>

<div class="header">
  <i class="fas fa-bell bell-icon"></i>
  <span data-i18n="notif.screenTitle">Notifications</span>
  <span data-i18n="notif.screenSub" style="font-size:13px;font-weight:400;opacity:.8;margin-left:8px;">activity relevant to you</span>
  <span id="localeSwitcher" style="margin-left:auto;"></span>
</div>

<div class="toolbar">
  <span class="ctx" id="unreadBadge"></span>
  <span style="flex:1"></span>
  <button class="btn-refresh" id="btnRefresh" data-i18n-title="notif.refresh" title="Refresh"><i class="fas fa-sync-alt"></i></button>
</div>

<div class="content">
  <div id="loadingBox" class="card" style="text-align:center;color:#7a7a7a;">
    <i class="fas fa-spinner fa-spin"></i> <span data-i18n="notif.loading">Loading notifications…</span>
  </div>
  <div id="warnBox" class="card" style="display:none;"><span id="warnMsg" style="color:#e6605e;"></span></div>
  <div id="contentBox" style="display:none;">

    <div class="summary-cards" id="summaryCards"></div>

    <div class="card">
      <h3><i class="fas fa-bell" style="color:#4ECDC4;margin-right:6px;"></i>
          <span data-i18n="notif.recentTitle">Recent activity</span></h3>
      <h5 id="notifSub"></h5>

      <div id="notifEmpty" class="empty" style="display:none;">
        <i class="fas fa-bell-slash" style="font-size:32px;color:#c9cdd7;display:block;margin-bottom:8px;"></i>
        <span data-i18n="notif.noNotifications">No notifications at this time</span>
      </div>

      <div id="notifTableWrap">
        <div class="notif-actions" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;">
          <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:#666;cursor:pointer;">
            <input type="checkbox" class="notif-cb" id="selectAll">
            <span data-i18n="notif.selectAll">Select all</span>
          </label>
          <button class="btn-all-read" id="btnMarkRead"><i class="fas fa-check-double"></i> <span data-i18n="notif.markSelectedRead">Mark selected read</span></button>
          <button class="btn-all-read" id="btnMarkAllRead"><i class="fas fa-check-double"></i> <span data-i18n="notif.markAllRead">Mark all read</span></button>
        </div>
        <table id="notifTable" class="display" style="width:100%">
          <thead>
            <tr>
              <th style="width:36px;"><input type="checkbox" class="notif-cb" id="theadCb"></th>
              <th style="width:50px;" data-i18n="notif.colType">Type</th>
              <th data-i18n="notif.colMessage">Message</th>
              <th style="width:110px;" data-i18n="notif.colTime">Time</th>
              <th style="width:50px;" data-i18n="notif.colStatus">Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="toast" id="notifToast"></div>
    </div>
  </div>
</div>

<div class="footer" id="footerText"></div>
<div class="footer"><span data-i18n="footers.notifications">TestLink 2.0.1 — Notifications</span></div>

<script src="/gui/templates/i18n/i18n.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap.min.js"></script>
<script src="/gui/templates/dashio/lib/bootstrap/js/bootstrap.min.js"></script>
<script>
var API = '/api/notifications/';
var t = TLi18n.t;
var allNotifs = [];

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

$(function() {
  TLi18n.load(function() {
    TLi18n.apply();
    TLi18n.initLocaleSwitcher('#localeSwitcher');
    loadData();
  });
  $('#btnRefresh').on('click', loadData);
  $('#selectAll').on('change', function() {
    var checked = $(this).is(':checked');
    $('input.notif-cb[data-id]').prop('checked', checked);
    $('#theadCb').prop('checked', checked);
  });
  $('#theadCb').on('change', function() {
    var checked = $(this).is(':checked');
    $('input.notif-cb[data-id]').prop('checked', checked);
    $('#selectAll').prop('checked', checked);
  });
  $('#btnMarkRead').on('click', function() {
    var ids = [];
    $('input.notif-cb[data-id]:checked').each(function() { ids.push($(this).data('id')); });
    if (ids.length === 0) { notifToast(t('notif.noSelection'), 'err'); return; }
    markRead(ids);
  });
  $('#btnMarkAllRead').on('click', function() { markAllRead(); });
});

function loadData() {
  $.ajax({
    url: API,
    data: { locale: TLi18n.getLocale() },
    dataType: 'json',
    success: function(d) {
      $('#loadingBox').hide();
      if (d.status !== 'ok') { $('#warnBox').show(); $('#warnMsg').text(d.message); return; }
      render(d.notifications, d.totals);
    },
    error: function() {
      $('#loadingBox').hide();
      $('#warnBox').show();
      $('#warnMsg').text(t('notif.errLoad'));
    }
  });
}

function render(notifs, totals) {
  allNotifs = notifs || [];
  $('#contentBox').show();
  $('#footerText').text(new Date().toLocaleString());
  renderSummary(allNotifs, totals);

  if (allNotifs.length === 0) {
    $('#notifTableWrap').hide();
    $('#notifEmpty').show();
    return;
  }
  $('#notifEmpty').hide();
  $('#notifTableWrap').show();

  var rows = [];
  $.each(allNotifs, function(i, n) {
    rows.push([
      '<input type="checkbox" class="notif-cb" data-id="' + esc(n.id) + '">',
      '<div class="notif-icon" style="background:' + esc(n.color) + ';"><i class="fas ' + esc(n.icon) + '"></i></div>',
      '<div class="notif-msg">' + buildMessage(n) + '</div>',
      '<div class="notif-time">' + relativeTime(n.time_epoch) + '</div>',
      '<span class="badge" style="background:' + (n.read ? '#8f8f8f' : '#4ECDC4') + ';">' +
        (n.read ? t('notif.read') : t('notif.unread')) + '</span>',
      (n.time_epoch || 0)
    ]);
  });

  if ($.fn.DataTable.isDataTable('#notifTable')) $('#notifTable').DataTable().destroy();
  $('#notifTable tbody').empty();
  var dt = $('#notifTable').DataTable({
    data: rows,
    pageLength: 20,
    order: [[5, 'desc']],
    columns: [null, null, null, null, null, null],
    columnDefs: [
      { targets: 0, orderable: false, searchable: false, className: 'select-checkbox' },
      { targets: 1, orderable: false, searchable: false },
      { targets: 4, orderable: true, searchable: false, className: 'notif-status-cell' },
      { targets: 5, visible: false, searchable: false }
    ],
    rowCallback: function(row, data, dataIndex) {
      var n = allNotifs[dataIndex];
      if (n && !n.read) $(row).addClass('notif-row-unread');
    },
    createdRow: function(row) {
      $('input.notif-cb[data-id]', row).on('change', function() {
        var total = $('input.notif-cb[data-id]').length;
        var checked = $('input.notif-cb[data-id]:checked').length;
        $('#selectAll').prop('checked', total > 0 && checked === total);
        $('#theadCb').prop('checked', total > 0 && checked === total);
      });
    }
  });
  // Hide the raw select-all checkbox row checkbox (we have our own in the toolbar)
  $('#notifTableWrap .select-checkbox input').hide();

  var unread = totals ? totals.unread : 0;
  $('#unreadBadge').html(
    '<i class="fas fa-bell" style="color:#4ECDC4;"></i> ' +
    (unread > 0 ? '<span class="badge" style="background:#e6605e;">' + unread + '</span> ' +
    t('notif.unreadCount') : t('notif.allRead'))
  );
}

function buildMessage(n) {
  if (n.type === 'assignment') {
    var tc = esc(n.prefix) + '-' + esc(n.tc_external_id) + ': ' + esc(n.tc_name);
    return t('notif.msgAssignment', {tc: tc, plan: esc(n.tplan_name)}) +
      (n.deadline_epoch ? ' <span style="color:#888;">(' + t('notif.dueBy') + ' ' +
        new Date(n.deadline_epoch * 1000).toLocaleDateString() + ')</span>' : '') +
      (n.assigner ? ' <span style="color:#888;">' + t('notif.by') + ' ' + esc(n.assigner) + '</span>' : '') +
      (n.url ? ' <a href="' + esc(n.url) + '" target="_blank" title="' + esc(t('notif.openScreen')) + '">' +
        '<i class="fas fa-external-link-alt" style="color:#4ECDC4;"></i></a>' : '');
  }
  if (n.type === 'milestone') {
    var ms = esc(n.milestone_name);
    var detail = n.overdue
      ? t('notif.msgMilestoneOverdue', {ms: ms, plan: esc(n.tplan_name)})
      : t('notif.msgMilestoneApproaching', {ms: ms, plan: esc(n.tplan_name), days: Math.abs(n.days_left)});
    return detail +
      (n.url ? ' <a href="' + esc(n.url) + '" target="_blank" title="' + esc(t('notif.openScreen')) + '">' +
        '<i class="fas fa-external-link-alt" style="color:#4ECDC4;"></i></a>' : '');
  }
  if (n.type === 'plan_completed') {
    return t('notif.msgPlanCompleted', {
      plan: esc(n.tplan_name),
      n: n.executed,
      total: n.total
    }) +
    (n.url ? ' <a href="' + esc(n.url) + '" target="_blank" title="' + esc(t('notif.openScreen')) + '">' +
      '<i class="fas fa-external-link-alt" style="color:#4ECDC4;"></i></a>' : '');
  }
  if (n.type === 'bug') {
    var tc = esc(n.prefix) + '-' + esc(n.tc_external_id) + ': ' + esc(n.tc_name);
    return t('notif.msgBug', {bug: esc(n.bug_id), tc: tc, plan: esc(n.tplan_name)}) +
    (n.url ? ' <a href="' + esc(n.url) + '" target="_blank" title="' + esc(t('notif.openScreen')) + '">' +
      '<i class="fas fa-external-link-alt" style="color:#4ECDC4;"></i></a>' : '');
  }
  return '';
}

function relativeTime(epoch) {
  if (!epoch) return '';
  var now = Math.floor(Date.now() / 1000);
  var diff = now - epoch;
  if (diff < 0) return new Date(epoch * 1000).toLocaleDateString();
  if (diff < 60) return t('notif.justNow');
  if (diff < 3600) return Math.floor(diff / 60) + ' ' + t('notif.minutesAgo');
  if (diff < 86400) return Math.floor(diff / 3600) + ' ' + t('notif.hoursAgo');
  return Math.floor(diff / 86400) + ' ' + t('notif.daysAgo');
}

function markRead(ids) {
  $.ajax({
    url: API + 'read',
    method: 'POST',
    contentType: 'application/json',
    data: JSON.stringify({ ids: ids }),
    success: function(d) {
      if (d.status === 'ok') {
        render(d.notifications, d.totals);
        notifToast(t('notif.markedRead'), 'ok');
      } else {
        notifToast(d.message || t('notif.errLoad'), 'err');
      }
    },
    error: function() { notifToast(t('notif.errLoad'), 'err'); }
  });
}

function markAllRead() {
  $.ajax({
    url: API + 'read',
    method: 'POST',
    contentType: 'application/json',
    data: JSON.stringify({ all: true }),
    success: function(d) {
      if (d.status === 'ok') {
        render(d.notifications, d.totals);
        notifToast(t('notif.allMarkedRead'), 'ok');
      } else {
        notifToast(d.message || t('notif.errLoad'), 'err');
      }
    },
    error: function() { notifToast(t('notif.errLoad'), 'err'); }
  });
}

function notifToast(msg, type) {
  var $t = $('#notifToast').text(msg).attr('class', 'toast ' + (type || '')).show();
  clearTimeout($t.data('tm'));
  $t.data('tm', setTimeout(function() { $t.hide(); }, 3500));
}

function renderSummary(notifs, totals) {
  var byType = totals ? totals.by_type : {};
  var items = [
    { key: 'assignment',   icon: 'fa-user-check', color: '#4ECDC4', label: t('notif.catAssignment') },
    { key: 'milestone',    icon: 'fa-calendar-check', color: '#f0ad4e', label: t('notif.catMilestone') },
    { key: 'plan_completed', icon: 'fa-check-double', color: '#5cb85c', label: t('notif.catPlanCompleted') },
    { key: 'bug',          icon: 'fa-bug', color: '#e6605e', label: t('notif.catBug') }
  ];
  var html = '';
  $.each(items, function(i, it) {
    var count = byType[it.key] || 0;
    html += '<div class="summary-badge" data-type="' + it.key + '">' +
      '<div class="notif-icon" style="background:' + it.color + ';width:40px;height:40px;"><i class="fas ' + it.icon + '"></i></div>' +
      '<div><div class="count">' + count + '</div><div class="label">' + esc(it.label) + '</div></div></div>';
  });
  $('#summaryCards').html(html);
  // Filter table by type badge
  $('.summary-badge').on('click', function() {
    var type = $(this).data('type');
    if ($(this).hasClass('active')) {
      $('.summary-badge').removeClass('active');
      loadFiltered(null);
    } else {
      $('.summary-badge').removeClass('active');
      $(this).addClass('active');
      loadFiltered(type);
    }
  });
}

function loadFiltered(typeFilter) {
  if (!typeFilter) { render(allNotifs, computeTotals(allNotifs)); return; }
  var filtered = allNotifs.filter(function(n) { return n.type === typeFilter; });
  render(filtered, computeTotals(filtered));
}

function computeTotals(arr) {
  var totals = { total: arr.length, unread: 0, by_type: {} };
  $.each(arr, function(i, n) {
    if (!n.read) totals.unread++;
    totals.by_type[n.type] = (totals.by_type[n.type] || 0) + 1;
  });
  return totals;
}
</script>
</body>
</html>
